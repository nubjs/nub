# Real-kernel acceptance fixture for the Landlock ABI-3 write contract.  This is
# deliberately an independent workspace so a remote runner builds exactly the
# checked-out nub-sandbox library before executing it.
[workspace]

[package]
name = "build-jail-landlock-abi-floor"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
nub-sandbox = { path = "../../crates/nub-sandbox" }
