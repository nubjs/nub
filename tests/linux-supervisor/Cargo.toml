# Standalone verification harness for the zero-privilege transparent egress supervisor
# (crates/nub-sandbox/src/backend/linux_supervisor.rs). NOT a workspace member — the nub
# workspace lists its members explicitly (see the repo-root Cargo.toml), so this crate is
# invisible to `cargo build` at the root and is compiled only when run directly from this
# directory. It pulls the module under test in via `#[path]` so there is a single source of
# truth and the harness cannot drift from the real code. Linux-only; see README.md.

# Own workspace root, so cargo does not try to treat it as a member of the outer nub workspace
# (whose `members` list is explicit and does not include it).
[workspace]

[package]
name = "linux-supervisor-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
seccompiler = "0.5"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
