min_version = "2026.8.16"

[env]
_.path = ["./bin"]

[settings]
experimental = true
cargo.binstall_native = true

[tools]
actionlint = "latest"
mr-boxington = "1.5.0"
usage = "6.6.1"
communique = "latest"
"github:bnjbvr/cargo-machete" = "latest"
"github:foresterre/cargo-msrv" = "latest"
# Pinned rather than "latest" because tak is the measuring instrument: an
# upgrade that changes how it samples would land in the series as a step
# change in aube's numbers, indistinguishable from a real regression. Bump
# deliberately, on a commit that does nothing else.
# TODO: switch to plain `tak = "0.0.4"` once a mise release ships the registry
# entry from jdx/mise#11307 — the shorthand exists on main but the registry is
# compiled in, so it is not usable until then.
"github:jdx/tak" = "v0.0.9"
hk = "latest"
node = "24"
pitchfork = "latest"
pkl = "latest"
# Parallel-job driver for `mise run test:bats`. bats-core natively
# supports shenwei356/rush as a GNU-parallel alternative, and unlike GNU
# parallel (a Perl script with no clean mise backend) rush ships static
# linux+darwin binaries, so contributors get it with no manual install.
rush = "latest"
shellcheck = "latest"
shfmt = "latest"

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.lint]
run = "hk check --all --slow"

[tasks.lint-fix]
run = "hk fix --all --slow"

# Apply clippy's machine-applicable autofixes via cargo-fixit — a drop-in
# replacement for `cargo clippy --fix` that skips the full re-check compile
# between fix rounds, so repeated runs are faster. Pinned through mise's cargo
# backend (the repo's convention for compiled cargo tools, matching
# cargo-audit/cargo-deny in CI), so a contributor gets it with no manual
# install. No `cargo clippy --fix` fallback — cargo-fixit is the only path.
# Modeled on `cargo fix` 1.89: add `--all-targets` to also fix tests/benches,
# and `--allow-dirty`/`--allow-staged` to run on a dirty tree.
[tasks.fix]
run = "mise x cargo:cargo-fixit@0.1.15 -- cargo fixit --clippy --all-targets --allow-dirty --allow-staged"

[tasks.build]
run = "cargo build"

[tasks.test]
run = "cargo test"

[tasks."docs:dev"]
depends = ["build"]
dir = "docs"
run = "../target/debug/aube install && exec ../target/debug/aube run docs:dev"

[tasks."docs:build"]
depends = ["build"]
dir = "docs"
run = "../target/debug/aube install && exec ../target/debug/aube run docs:build"

# TODO: switch pnpm back to `aqua:pnpm/pnpm@latest` once aqua's pnpm
# registry entry stops looking for `pnpm-linux-x64.tar.gz` (pnpm
# publishes plain binaries, not tarballs). Tracked at
# https://github.com/aquaproj/aqua-registry/.
[tasks.bench]
dir = "{{config_root}}"
env = {
  BENCH_HERMETIC = "1",
  BENCH_BANDWIDTH = "500mbit",
  BENCH_LATENCY = "50ms",
  AUBE_FORCE_METADATA_PRIMER = "true",
}
run = [
  "cargo build --release",
  "mise x aqua:sharkdp/hyperfine@latest github:pnpm/pnpm@latest npm:@yarnpkg/cli-dist@latest bun@latest deno@latest npm:vlt@latest node@24 -- bash benchmarks/bench.sh",
]

[tasks."bench:pr"]
dir = "{{config_root}}"
env = {
  RUNS = "3",
  WARMUP = "1",
  BENCH_HERMETIC = "1",
  BENCH_BANDWIDTH = "500mbit",
  BENCH_LATENCY = "50ms",
  BENCH_TOOLS = "aube,bun,pnpm",
  BENCH_SCENARIOS = "gvs-warm,gvs-cold",
  BENCH_PHASES = "0",
  AUBE_FORCE_METADATA_PRIMER = "true",
}
run = [
  "cargo build --release",
  "mise x aqua:sharkdp/hyperfine@latest github:pnpm/pnpm@latest bun@latest node@24 -- bash benchmarks/bench.sh",
]

# Regenerate `benchmarks/results.json` (and the markdown summary) by
# re-running the full hyperfine scenario matrix with a release-mode binary
# and 10 runs × 3 warmups, then writing the structured output into
# the repo in-place. Commit the updated JSON and the chart on the
# VitePress benchmarks page picks it up automatically — the page's
# data loader at `docs/benchmarks.data.ts` reads it at build time.
# The final step rewrites the BENCH_RATIOS block in README.md so the
# landing-page ratios stay in sync with the JSON.
[tasks."bench:bump"]
dir = "{{config_root}}"
env = {
  RUNS = "10",
  WARMUP = "3",
  RESULTS_JSON = "{{config_root}}/benchmarks/results.json",
  BENCH_HERMETIC = "1",
  BENCH_BANDWIDTH = "500mbit",
  BENCH_LATENCY = "50ms",
  AUBE_FORCE_METADATA_PRIMER = "true",
}
run = [
  "if [ -z \"${AUBE_BIN:-}\" ]; then cargo build --release; fi",
  "mise x aqua:sharkdp/hyperfine@latest github:pnpm/pnpm@latest npm:@yarnpkg/cli-dist@latest bun@latest deno@latest npm:vlt@latest node@24 -- bash benchmarks/bench.sh",
  "node benchmarks/update-readme.mts",
]

# Instruction-counted benchmarks (see tak.toml). Needs valgrind for counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS.
#
# GVS is pinned for the same reason benchmarks/bench.sh pins it: aube's default
# flips based on the inherited CI=true, so without this a laptop and a CI runner
# would be measuring different code paths and the series would be meaningless.
#
# The store warm-up is the one networked step. It has to happen before tak runs
# because the install benchmark uses --offline, and it is outside the
# measurement on purpose — nothing tak times ever touches the registry.
[tasks."perf:build"]
run = "mbx build --release"

[tasks.perf]
dir = "{{config_root}}"
# Cachegrind aggregates instructions from every worker. Pin the pools so idle
# work-stealing races do not move the install count by 10%+ between runs.
env = { npm_config_enable_global_virtual_store = "true", TOKIO_WORKER_THREADS = "1", RAYON_NUM_THREADS = "1", AUBE_LINK_CONCURRENCY = "1" }
run = [
  "./target/release/aube -C fixtures/medium install --frozen-lockfile",
  "tak run",
]
depends = ["perf:build"]

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are what the history is.
# Safe to run locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
dir = "{{config_root}}"
env = { npm_config_enable_global_virtual_store = "true", TOKIO_WORKER_THREADS = "1", RAYON_NUM_THREADS = "1", AUBE_LINK_CONCURRENCY = "1" }
run = [
  "./target/release/aube -C fixtures/medium install --frozen-lockfile",
  "tak run --record",
]
depends = ["perf:build"]

[tasks."build:pgo"]
dir = "{{config_root}}"
run = "bash benchmarks/pgo.bash"

# Build a separately linked runner with command-only features. Release
# archives deliberately keep shipping `aubr` as a symlink to the PGO-trained
# `aube`: this artifact is useful for measuring the standalone design, but it
# adds a second ~40 MiB executable and has not beaten the multicall binary.
[tasks."build:aubr-lean"]
dir = "{{config_root}}"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/aubr-lean" }
run = "cargo build --release --locked -p aube --bin aubr --no-default-features --features mimalloc,rustls,hickory-dns"

[tasks.render]
depends = ["build"]
run = [
  "./target/debug/aube usage > aube.usage.kdl",
  "rm -rf docs/cli && mkdir -p docs/cli",
  "usage g markdown -mf aube.usage.kdl --out-dir docs/cli --url-prefix /cli",
  "usage g json -f aube.usage.kdl > docs/cli/commands.json",
  "node scripts/patch-generated-cli-docs.mjs",
  "cargo run -p aube-settings --bin generate-settings-docs",
  "cargo run -p aube-codes --bin generate-error-codes-docs",
]
