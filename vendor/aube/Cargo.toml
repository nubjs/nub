[workspace]
members = ["crates/*"]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.release-native]
inherits = "release"
lto = "fat"

[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1

# Node-API addons execute inside the host process, so panics must unwind to
# the napi-rs boundary instead of aborting the entire JavaScript runtime.
[profile.napi]
inherits = "release"
panic = "unwind"

# C ABI calls execute inside the host process and catch every panic at the
# extern boundary. The workspace release profile's panic=abort would bypass
# those guards and terminate the host.
[profile.ffi]
inherits = "release"
panic = "unwind"

[workspace.package]
version = "2.2.9"
edition = "2024"
# DELIBERATE NUB FORK DELTA — do not converge to upstream on a sync.
# Upstream holds this at 1.91 so mise (which embeds aube's library crates and
# is packaged by distros that pin an old toolchain) can build it. nub does not
# ship that way: it vendors aube and compiles every binary on current stable,
# and nub CI does not MSRV-check the vendored tree — so upstream's floor does
# not bind us. We raise it to 1.95 for core::hint::cold_path() on the rare arms
# of the hot install loops (linker, resolver cache, lockfile subset parser,
# tarball validation). Preserve this on every aube bump — see the aube-bump skill.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/aubepkg/aube"
homepage = "https://github.com/aubepkg/aube"
readme = "README.md"

[workspace.dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Node-API bindings
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "dyn-symbols"] }
napi-derive = "3"
napi-build = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
spdx = "0.13"
yaml_serde = "0.10"
# Comment- and format-preserving YAML edits. Used by aube-manifest /
# aube to surgically rewrite user-authored workspace YAML files
# (catalogs, allowBuilds, patchedDependencies) without stripping
# comments — yaml_serde's round-trip would otherwise destroy them.
yamlpatch = ">=1.25, <1.28"
# yamlpath 1.28 does not declare the Rust 1.97 requirement it inherits
# from tree-sitter-iter 1.28, so resolver 3 cannot avoid it.
yamlpath = ">=1.25, <1.28"
sonic-rs = "0.5"
serde_path_to_error = "0.1"
toml = "1.1"
toml_edit = "0.25"
rkyv = "0.8"

# CLI
usage-rs = { version = "6", features = ["diagnostics", "completions", "validation"] }

# Enum derives (Display/FromStr/etc.)
strum = { version = "0.28", features = ["derive"] }

# HTTP
# TLS backend and DNS resolver are deliberately NOT chosen here. Library
# crates must stay backend-agnostic so embedders (mise) don't get rustls or
# hickory-dns forced into their build via feature unification — reqwest's
# hickory-dns cargo feature flips the default resolver for every client in
# the final binary. The aube binary gets rustls + hickory-dns through
# aube-registry's default features.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "charset", "system-proxy", "gzip", "brotli", "zstd"] }
webpki-root-certs = "1"

# Hashing
sha1 = "0.11"
sha2 = "0.11"
blake3 = { version = "1", features = ["rayon", "mmap"] }
hex = "0.4"

# Filesystem
xx = { version = "2", features = ["fslock"] }
reflink-copy = "0.1"
# OS-level transparent per-file compression (APFS decmpfs / btrfs / NTFS)
# applied to native addons as they land in the CAS. The `addon` feature
# unwraps a napi `--compress` hybrid back to the raw `.node` before the
# kernel re-compresses it transparently.
# Pinned to 0.1.0: 0.1.2's FICLONE reflink path types the ioctl request as
# `libc::c_ulong`, which is `libc::Ioctl` on glibc but `c_int` on musl, so it
# fails to compile for *-unknown-linux-musl. Unpin once
# https://github.com/SocketDev/decmpfs releases a fix.
decmpfs = { version = "=0.1.0", features = ["addon"] }
glob = "0.3"
# BurntSushi's gitignore matcher (from ripgrep). Used by `aube pack` /
# `aube publish` to honor `.npmignore` / `.gitignore` with full
# semantics (negation, anchoring, globs, **). Already in the build via
# clx → tera → globwalk, so making it a direct dep is essentially free.
ignore = "0.4"
landlock = "0.4"
# NTFS junctions (Windows-only) — used for `node_modules` directory
# links so installs work without Developer Mode or admin rights.
# Matches what pnpm does via Node's `fs.symlink(..., 'junction')`.
junction = "2"

# Parallelism
rayon = "1"

# Non-cryptographic FxHash for internal maps keyed on already-signed
# data (package names, dep paths, lockfile keys). Faster than the std
# SipHash default; DoS resistance is unnecessary because the inputs
# come from locked/signed manifests.
rustc-hash = "2"
# Better avalanche than FxHash on dep_path keys with integer peer
# suffixes. Resolver hot maps only. Rest of workspace stays on FxHash.
foldhash = "0.2"

# Stack-allocated small vectors for lockfile fields that are empty
# or tiny in almost every package. os/cpu/libc arrays, bundled deps.
# Skips a heap alloc per field per package. Adds up fast across
# thousands of LockedPackage values.
smallvec = { version = "1", features = ["serde"] }

# Encoding
base64 = "0.23"

# Sigstore (provenance attestation on `publish`)
sigstore-sign = "0.11"
sigstore-oidc = "0.11"
sigstore-types = "0.11"
# Pinned to an exact `0.0.x` because the crate is pre-1.0 and the `0.0`
# series carries no SemVer compat guarantees — a silent break in OIDC
# detection would disable provenance on every supported CI.
ambient-id = "=0.0.11"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
libc = "0.2"
seccompiler = "0.5"

# Progress UI
clx = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

# Pattern matching. Used by aube-scripts/src/content_sniff.rs to detect
# dangerous shapes (curl|sh, eval+atob, secret-env exfil, webhook
# endpoints, …) in dependency lifecycle script bodies before the user
# is prompted to allow them. Already a transitive via pluralizer +
# yamlpatch, so adding as a direct dep here is free at compile time.
regex = "1"

# Archive extraction
# Pure-Rust backend here so library crates don't force libz-ng-sys (cmake +
# C toolchain) onto embedders' builds. The aube binary re-enables zlib-ng —
# feature unification makes it win over rust_backend for the whole workspace
# build, so standalone aube keeps the fast C backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zstd = { version = "0.13", default-features = false }
# Zip reader for the OSV advisory mirror — the bulk dump at
# `osv-vulnerabilities.storage.googleapis.com/<eco>/all.zip` is a
# zip-of-JSONs and the dependency-free std crate ecosystem has no
# alternative. `deflate` is the only OSV-used compression method, so
# defeature everything else to keep the build slim.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Semver
node-semver = "2"

# Diff/patch
diffy = "0.5"

# Internal crates — `version` is required so `cargo publish` can resolve
# transitive crate dependencies via crates.io. release-plz keeps these
# versions in sync with [workspace.package].version during release PRs.
aube = { path = "crates/aube", version = "2", default-features = false }
aube-codes = { path = "crates/aube-codes", version = "2" }
aube-settings = { path = "crates/aube-settings", version = "2" }
aube-resolver = { path = "crates/aube-resolver", version = "2" }
aube-registry = { path = "crates/aube-registry", version = "2" }
aube-store = { path = "crates/aube-store", version = "2" }
aube-linker = { path = "crates/aube-linker", version = "2" }
aube-lockfile = { path = "crates/aube-lockfile", version = "2" }
aube-manifest = { path = "crates/aube-manifest", version = "2", default-features = false }
aube-runtime = { path = "crates/aube-runtime", version = "2" }
aube-scripts = { path = "crates/aube-scripts", version = "2" }
aube-workspace = { path = "crates/aube-workspace", version = "2" }
aube-util = { path = "crates/aube-util", version = "2" }

[profile.dev]
debug = 1
