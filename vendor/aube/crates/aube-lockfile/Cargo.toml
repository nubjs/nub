[package]
name = "aube-lockfile"
description = "Multi-format lockfile reader/writer for Aube (aube-lock, pnpm-lock, package-lock, yarn.lock, bun.lock)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
include = ["src/**/*.rs"]

[package.metadata.cargo-semver-checks.lints]
# Lockfile errors are intended to grow as more invalid formats are diagnosed.
# Keep additions visible in semver-check output without forcing a workspace-wide
# major release for every new diagnostic variant.
enum_variant_added = "warn"

[dependencies]
aube-codes = { workspace = true }
aube-manifest = { workspace = true }
aube-settings = { workspace = true }
aube-util = { workspace = true }
# For `matches_member_patterns`: the npm reader has to tell a workspace
# member apart from a local directory dependency, and only the manifest's
# `workspaces` patterns can say which is which. Sharing the walk's own
# matcher keeps the two from drifting. aube-workspace does not depend on
# aube-lockfile, so this edge is acyclic.
aube-workspace = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
miette = { workspace = true }
node-semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
yaml_serde = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
smallvec = { workspace = true }
memchr = "2"

[features]
# Exposes the `__bench_parse_*` shims used by the `pnpm_lock_parse`
# bench. Off by default so the bench helpers stay out of the crate's
# public API surface.
bench = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "dep_path_filename"
harness = false

[[bench]]
name = "pnpm_lock_parse"
harness = false
required-features = ["bench"]

[[bench]]
name = "pnpm_lock_write"
harness = false
required-features = ["bench"]
