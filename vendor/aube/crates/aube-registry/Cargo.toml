[package]
name = "aube-registry"
description = "npm registry HTTP client for Aube"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
include = ["src/**/*.rs"]

[dependencies]
aube-codes = { workspace = true }
aube-manifest = { workspace = true }
aube-settings = { workspace = true }
aube-store = { workspace = true }
aube-util = { workspace = true }
node-semver = { workspace = true }
miette = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sonic-rs = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[features]
# rustls is the only supported TLS backend (no OpenSSL / native-tls — see
# CLAUDE.md) and is required; without it the crate fails to compile.
#
# There is no hickory-dns feature: the registry clients resolve through the
# OS with an in-process cache (`aube_util::http::dns`), because Hickory reads
# only the global nameserver list and loses VPN-scoped and split DNS
# (nubjs/nub#942). reqwest's own hickory-dns feature must stay out of the
# graph too — through feature unification it switches every reqwest client
# in the final binary to Hickory.
default = ["rustls"]
rustls = ["reqwest/rustls", "aube-util/rustls"]

[dev-dependencies]
tempfile = "3"
# `raw_value` is already on workspace-wide; naming it here keeps the cache
# writer's token test from depending on that unification holding.
serde_json = { workspace = true, features = ["raw_value"] }
flate2 = { workspace = true }
yaml_serde = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
tokio-rustls = "0.26"
