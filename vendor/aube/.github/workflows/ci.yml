name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-impl.yml

  final:
    name: final
    if: ${{ !cancelled() }}
    permissions: {}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check CI result
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$CI_RESULT" == success ]]; then
            exit 0
          fi
          echo "ci=$CI_RESULT"
          exit 1
