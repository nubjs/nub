name: ffi

on:
  pull_request:
    paths:
      - "crates/aube-ffi/**"
      - "crates/aube-codes/**"
      - "!crates/aube-codes/CHANGELOG.md"
      - "crates/aube/src/lib.rs"
      - "crates/aube/src/embed.rs"
      - "crates/aube/src/commands/add/mod.rs"
      - "crates/aube/src/commands/install/control.rs"
      - "crates/aube/src/commands/install/dep_selection.rs"
      - "crates/aube/src/commands/install/frozen.rs"
      - "crates/aube-util/src/identity.rs"
      - "crates/aube-util/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ffi.yml"
      - ".github/workflows/ffi-impl.yml"
  push:
    branches: [main]
    paths:
      - "crates/aube-ffi/**"
      - "crates/aube-codes/**"
      - "!crates/aube-codes/CHANGELOG.md"
      - "crates/aube/src/lib.rs"
      - "crates/aube/src/embed.rs"
      - "crates/aube/src/commands/add/mod.rs"
      - "crates/aube/src/commands/install/control.rs"
      - "crates/aube/src/commands/install/dep_selection.rs"
      - "crates/aube/src/commands/install/frozen.rs"
      - "crates/aube-util/src/identity.rs"
      - "crates/aube-util/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ffi.yml"
      - ".github/workflows/ffi-impl.yml"
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      draft_phase:
        required: false
        type: boolean
        default: true
    secrets:
      AUBE_GH_TOKEN:
        required: true
      CERTIFICATES_P12:
        required: true
      CERTIFICATES_P12_PASS:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v1.28.0) to build packages and recover draft assets for. Empty runs a smoke build."
        required: false
        default: ""
      publish_packages:
        description: "Publish the built npm packages (for an explicit npm backfill)."
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    if: ${{ github.event_name != 'release' && inputs.tag == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ffi-impl.yml
    with:
      tag: ""
      draft_phase: false
      publish_packages: false

  release:
    if: ${{ github.event_name == 'release' || inputs.tag != '' }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ffi-impl.yml
    with:
      tag: ${{ inputs.tag || '' }}
      draft_phase: ${{ inputs.draft_phase || false }}
      publish_packages: ${{ inputs.publish_packages || false }}
    secrets:
      AUBE_GH_TOKEN: ${{ secrets.AUBE_GH_TOKEN }}
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_P12_PASS: ${{ secrets.CERTIFICATES_P12_PASS }}

  packages:
    name: packages
    if: ${{ always() && !cancelled() && needs.build.result != 'cancelled' && needs.release.result != 'cancelled' }}
    permissions: {}
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [[ "$BUILD_RESULT" == success && "$RELEASE_RESULT" == skipped ]] ||
             [[ "$BUILD_RESULT" == skipped && "$RELEASE_RESULT" == success ]]; then
            exit 0
          fi
          echo "build=$BUILD_RESULT release=$RELEASE_RESULT"
          exit 1
