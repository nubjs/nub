name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "aube.usage.kdl"
      - "crates/**"
      - "Cargo.lock"
      - "mise.toml"
      - "mise.lock"
      - "benchmarks/results.json"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-impl.yml"
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/docs-impl.yml
