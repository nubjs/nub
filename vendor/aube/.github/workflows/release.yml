name: release

# Reusable workflow: builds + (on macOS) codesigns the `aube` binary
# for every target, then uploads a single archive per target onto the
# draft GitHub release that `release-plz` already created for the tag.
# `aubr`/`aubx` are multicall shims that share `src/main.rs` with
# `aube`; see `crates/aube-cli/Cargo.toml`. In tar.gz archives they
# ship as symlinks to `aube` (Linux + macOS); in Windows .zip
# archives, where zip can't reliably represent symlinks, they ship as
# full duplicate binaries.
# Driven by `.github/workflows/release-plz.yml` — not triggered
# directly on tag push, since release-plz owns the tag/release
# lifecycle and dispatching on both would race.

permissions: {}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      AUBE_GH_TOKEN:
        required: true
      CERTIFICATES_P12:
        required: true
      CERTIFICATES_P12_PASS:
        required: true
      APPLE_API_KEY_P8:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (or archive-name label, for dry runs) — e.g. v1.0.0 or dryrun"
        required: true
        type: string
      ref:
        description: "Branch or sha to build. Empty = use refs/tags/<tag>. Only honored in dry-run."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build everything but skip the GitHub release upload. Uses ref instead of refs/tags/<tag> when set."
        required: false
        type: boolean
        default: false

env:
  MBX_DISABLE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AUBE_PRIMER_TOP: "2000"
  # See `DEFAULT_VERSION_CAP` in crates/aube-resolver/build.rs for the
  # rationale — 100 covers ≥97% of resolved versions across the benchmark
  # fixtures while shrinking the embedded primer by ~54% (9.04 MB vs ~19.6 MB).
  AUBE_PRIMER_VERSION_CAP: "100"
  AUBE_REQUIRE_PRIMER: "1"

jobs:
  validate-inputs:
    # inputs.ref is dry-run-only by contract: it lets us rebuild a branch
    # without an associated release tag. Honoring it for real uploads
    # would let a dispatcher build arbitrary code under the release tag's
    # name with contents/id-token/attestations write — fail fast.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject ref override on real release
        env:
          REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$REF" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::inputs.ref override is only allowed when inputs.dry_run is true"
            exit 1
          fi

  generate-primer:
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate metadata primer
        id: primer
        shell: bash
        # File name has to include the `-sK` schema suffix so `build.rs`
        # picks the artifact up directly (`source.with_extension("json")`
        # branch); otherwise it falls back to spawning `node` to regenerate
        # in-tree, which fails inside `cross` Docker containers where node
        # isn't on PATH. Schema is parsed out of build.rs so a bump there
        # (and the matching `.gitignore` entry) propagates automatically.
        run: |
          schema=$(grep -E '^const PRIMER_DATA_SCHEMA: u32 = [0-9]+;' \
            crates/aube-resolver/build.rs | awk -F'= ' '{print $2}' | tr -d ';')
          if [ -z "$schema" ]; then
            echo "::error::failed to parse PRIMER_DATA_SCHEMA from crates/aube-resolver/build.rs"
            exit 1
          fi
          out="crates/aube-resolver/data/primer-top${AUBE_PRIMER_TOP}-v${AUBE_PRIMER_VERSION_CAP}-s${schema}.rkyv.json"
          popular_out="crates/aube-resolver/data/popular-top100000-v1.json"
          node scripts/generate-primer.mjs \
            --top "$AUBE_PRIMER_TOP" \
            --versions "$AUBE_PRIMER_VERSION_CAP" \
            --out "$out" \
            --popular-names-out "$popular_out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metadata-primer
          path: |
            ${{ steps.primer.outputs.path }}
            crates/aube-resolver/data/popular-top100000-v1.json

  # Non-PGO Windows targets (untested PGO toolchain). Built via taiki-e
  # straight from the release profile. `aarch64-unknown-linux-musl` lives
  # in its own job (`upload-assets-musl-arm64`) so it can ship
  # `aubr`/`aubx` as symlinks the same way the PGO tarballs do.
  upload-assets:
    needs: generate-primer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runner: windows-latest
            build-tool: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            runner: windows-latest
            build-tool: cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: metadata-primer
          path: crates/aube-resolver/data
      - name: Import codesign certs
        if: startsWith(matrix.os, 'macos')
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASS }}
      # taiki-e/upload-rust-binary-action builds via cargo/cross, packages
      # the named bins into a single `<archive>.{tar.gz,zip}`, and uploads
      # it onto the existing release for `tag`. Multi-bin mode requires an
      # explicit `archive` name (the `$bin` placeholder isn't usable), so
      # we keep the historical `aube-<tag>-<target>` pattern that installers
      # already expect. On macOS we ask it to codesign with the Developer
      # ID cert we just imported; the prefix applies to all three bins.
      - name: Upload binary (macOS signed)
        id: upload-macos
        if: startsWith(matrix.os, 'macos')
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: aube,aubr,aubx
          archive: aube-$tag-$target
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          token: ${{ secrets.AUBE_GH_TOKEN }}
          codesign: "Developer ID Application: Jeffrey Dickey (4993Y37DX6)"
          codesign_prefix: dev.jdx.
          dry-run: ${{ fromJSON(inputs.dry_run || 'false') }}
      - name: Upload binary (non-macOS)
        id: upload-non-macos
        if: ${{ !startsWith(matrix.os, 'macos') }}
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: aube,aubr,aubx
          archive: aube-$tag-$target
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          token: ${{ secrets.AUBE_GH_TOKEN }}
          dry-run: ${{ fromJSON(inputs.dry_run || 'false') }}
      - name: Resolve uploaded archive
        id: archive
        shell: bash
        env:
          MACOS_TAR: ${{ steps.upload-macos.outputs.tar }}
          UNIX_TAR: ${{ steps.upload-non-macos.outputs.tar }}
          WINDOWS_ZIP: ${{ steps.upload-non-macos.outputs.zip }}
        run: |
          archive="${MACOS_TAR}${UNIX_TAR}${WINDOWS_ZIP}"
          if [ -z "$archive" ]; then
            echo "::error::upload-rust-binary-action did not report an archive"
            exit 1
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload archive as workflow artifact (dry run)
        if: ${{ fromJSON(inputs.dry_run || 'false') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aube-${{ inputs.tag }}-${{ matrix.target }}
          path: ${{ steps.archive.outputs.path }}
      - name: Attest release archive
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

  # aarch64-unknown-linux-musl: split out from upload-assets so we can
  # ship `aubr`/`aubx` as symlinks to `aube` in the tarball, matching
  # the PGO targets. `taiki-e/upload-rust-binary-action` bundles
  # build + archive in one step with no hook to mutate the staged bins,
  # so we run cross + symlink + tar by hand here. No PGO/BOLT — same
  # musl-libc constraint as x86_64-unknown-linux-musl in
  # upload-assets-pgo (BOLT's instrumentation runtime SIGSEGVs against
  # musl).
  upload-assets-musl-arm64:
    needs: generate-primer
    # Release builds must never restore or save persistent caches.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: metadata-primer
          path: crates/aube-resolver/data
      - name: Install cross
        shell: bash
        run: cargo install cross --locked
      - name: Build aube (release)
        shell: bash
        # Only build `aube` — `aubr`/`aubx` become symlinks in the
        # archive step, so the multicall stub bins would just be thrown
        # away. Saves ~2 minutes of cross compile time.
        run: cross build --release --locked --target "$TARGET" --bin aube
      - name: Archive release binary
        id: archive
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          archive="aube-${TAG}-${TARGET}.tar.gz"
          # Replace aubr/aubx with symlinks to aube before tar-ing.
          # See the matching archive step in upload-assets-pgo for the
          # multicall / argv[0] rationale.
          BIN_DIR="target/${TARGET}/release"
          ln -sf aube "$BIN_DIR/aubr"
          ln -sf aube "$BIN_DIR/aubx"
          tar -czf "$archive" -C "$BIN_DIR" aube aubr aubx
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload archive to release
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUBE_GH_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
      - name: Upload archive as workflow artifact (dry run)
        if: ${{ fromJSON(inputs.dry_run || 'false') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aube-${{ inputs.tag }}-aarch64-unknown-linux-musl
          path: ${{ steps.archive.outputs.path }}
      - name: Attest release archive
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

  # Native aarch64 GNU release. Build inside a cached Ubuntu 20.04 image so
  # the linked artifact has a natural glibc 2.31 baseline while retaining
  # native ARM64 execution for both Rust PGO and BOLT instrumentation training.
  upload-assets-pgo-arm64-linux:
    needs: generate-primer
    # The instrumented fat-LTO link can exceed the 16 GB available on
    # standard GitHub-hosted runners, so this release-only job needs 32 GB.
    runs-on: namespace-profile-endev-linux-arm64-large;overrides.cache-tag=aube-rust-linux-arm64
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: aarch64-unknown-linux-gnu
      LLVM_VERSION: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: metadata-primer
          path: crates/aube-resolver/data
      # BuildKit reuses unchanged dependency/toolchain layers from the GHA
      # cache; changing the Containerfile or mise.toml invalidates only the
      # layers after that change.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build cached ARM64 PGO environment
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/containers/release-arm64
          file: .github/containers/release-arm64/Containerfile
          platforms: linux/arm64
          load: true
          tags: aube-release-arm64:local
          build-args: |
            LLVM_VERSION=${{ env.LLVM_VERSION }}
          cache-from: type=gha,scope=aube-release-arm64
          # Only trusted release refs may write the shared cache. Dry runs
          # can restore it but must not let an arbitrary ref poison it.
          cache-to: ${{ !fromJSON(inputs.dry_run || 'false') && inputs.ref == '' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=aube-release-arm64' || '' }}

      - name: Smoke-test ARM64 PGO environment
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env MISE_CACHE_DIR=/tmp/mise-cache \
            aube-release-arm64:local \
            mise -C /mise exec -- bash -euo pipefail -c '
              node --version
              rustc --version
              cargo --version
            '

      - name: PGO build (Focal + LLD + BOLT)
        shell: bash
        env:
          AUBE_PGO_NO_LOCK: "1"
          AUBE_PGO_BUILD_TOOL: cargo
          AUBE_PGO_BOLT: "1"
          AUBE_PGO_USE_LLD: "1"
          AUBE_PGO_LLVM_VERSION: ${{ env.LLVM_VERSION }}
        run: |
          container_home="$RUNNER_TEMP/aube-home"
          # Docker creates missing bind-mount sources as root. Create target as
          # the runner user so the non-root container can write PGO artifacts.
          mkdir -p "$GITHUB_WORKSPACE/target" "$container_home/.cargo" "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/target:/workspace/target" \
            --volume "$container_home:/tmp/aube-home" \
            --volume "$HOME/.cargo/registry:/tmp/aube-home/.cargo/registry" \
            --volume "$HOME/.cargo/git:/tmp/aube-home/.cargo/git" \
            --workdir /workspace \
            --env AUBE_PGO_NO_LOCK \
            --env AUBE_PGO_BUILD_TOOL \
            --env AUBE_PGO_BOLT \
            --env AUBE_PGO_USE_LLD \
            --env AUBE_PGO_LLVM_VERSION \
            --env HOME=/tmp/aube-home \
            --env CARGO_HOME=/tmp/aube-home/.cargo \
            --env MISE_CACHE_DIR=/tmp/mise-cache \
            aube-release-arm64:local \
            mise -C /mise exec -- bash -euo pipefail -c '
              cd /workspace
              test -w target
              # sed consumes the full stream; head can make ldd exit with
              # SIGPIPE (141), which pipefail incorrectly treats as a build failure.
              ldd --version | sed -n "1p"
              bash benchmarks/pgo.bash
            '

      - name: Validate glibc baseline
        shell: bash
        run: |
          bin=target/release-pgo/aube
          max_glibc=$(
            readelf --version-info "$bin" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
              | sort -Vu \
              | tail -1
          )
          echo "Maximum required glibc symbol version: ${max_glibc:-none}"
          if [ -n "$max_glibc" ] && \
             [ "$(printf '%s\n' GLIBC_2.31 "$max_glibc" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::ARM64 release requires $max_glibc, newer than GLIBC_2.31"
            exit 1
          fi
          "$bin" --version

      - name: Archive PGO binaries
        id: archive
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          archive="aube-${TAG}-${TARGET}.tar.gz"
          BIN_DIR="target/release-pgo"
          ln -sf aube "$BIN_DIR/aubr"
          ln -sf aube "$BIN_DIR/aubx"
          tar -czf "$archive" -C "$BIN_DIR" aube aubr aubx
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive to release
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUBE_GH_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

      - name: Upload archive as workflow artifact (dry run)
        if: ${{ fromJSON(inputs.dry_run || 'false') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aube-${{ inputs.tag }}-aarch64-unknown-linux-gnu
          path: ${{ steps.archive.outputs.path }}

      - name: Attest release archive
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

  # PGO-optimized targets: x86_64 Linux GNU/musl (cross-built on amd64)
  # plus native macOS arm64. The aarch64 GNU release is isolated above
  # so its entire build runs inside Focal. Each remaining target builds via
  # benchmarks/pgo.bash — instrument under release-pgo, train against the
  # committed offline registry, and rebuild with -Cprofile-use. The x86_64
  # Linux targets use build-tool=cross so the resulting binaries preserve
  # their current libc baselines. macOS arm64 remains native on its existing
  # hosted runner.
  upload-assets-pgo:
    needs: generate-primer
    runs-on: ${{ matrix.runner }}
    # 180 to cover macos-latest (3 vCPU) which needs ~80 min for two
    # fat-LTO compiles. The Linux rows use 32 GB release-only runners because
    # the instrumented link has exceeded standard-runner memory in the past.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # BOLT runs against the glibc Linux PGO targets. Local bench
          # on Zen 4 (x86_64) shows -2.7% wall / -18% L1-icache misses
          # / -4.4% branch misses on the user-mode "frozen lockfile"
          # fast path (z=-6.45 on wall, n=20). The canonical install
          # benchmarks don't move statistically because system-call
          # time dominates real installs — codegen wins exist but get
          # buried under syscall jitter.
          #
          # musl is skipped because BOLT's instrumentation runtime
          # (libbolt_rt_instr.a) assumes glibc semantics for _exit /
          # TLS and SIGSEGVs at startup against musl libc. Confirmed
          # empirically in dry-run 25688552218. macOS BOLT support is
          # not in tree.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            runner: namespace-profile-endev-linux-amd64-large
            build-tool: cross
            bolt: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            runner: namespace-profile-endev-linux-amd64-large
            build-tool: cross
            bolt: false
          - target: aarch64-apple-darwin
            os: macos-latest
            runner: macos-latest
            build-tool: cargo
            bolt: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && fromJSON(inputs.dry_run || 'false') && inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: metadata-primer
          path: crates/aube-resolver/data
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      # rustc 1.94.0 on aarch64-apple-darwin miscompiles the
      # PGO-instrumented binary — the resulting `aube install` SIGSEGVs
      # on its first invocation during phase 2 training. Verified
      # locally on rustc 1.95.0 against the same source tree: full PGO
      # pipeline completes clean. Bump to latest stable only when the
      # runner's default rustc is older than 1.95 so we don't pay the
      # toolchain download on runners that have already moved on.
      # TODO: drop this step once the GH macos-arm64 runner image
      # ships rustc 1.95+ as the default. Track via this PR.
      - name: Ensure rustc >= 1.95 on macOS arm64
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          current=$(rustc --version | awk '{print $2}')
          # Parse "1.94.0" into major / minor. `sort -V` would be the
          # obvious idiom but isn't portable: GH macOS runners ship
          # BSD `sort` (no `-V` flag), and under `set -eo pipefail`
          # the failing pipeline either aborts the step or returns
          # empty, both of which mis-trigger the upgrade path.
          IFS=. read -r maj min _ <<<"$current"
          if [ "$maj" -lt 1 ] || { [ "$maj" -eq 1 ] && [ "$min" -lt 95 ]; }; then
            echo "rustc $current is below 1.95.0; upgrading to latest stable"
            rustup update stable
            rustup default stable
            rustc --version
          else
            echo "rustc $current already >= 1.95.0; no upgrade needed"
          fi
          # GH macos-latest-large defaults to an x86_64-apple-darwin
          # host rustc (Rosetta) — `--target=aarch64-apple-darwin`
          # from pgo.bash then triggers a cross-compile that needs the
          # arm64 std lib explicitly installed. The command is idempotent when
          # the target is already present.
          rustup target add aarch64-apple-darwin
          rustup show
      - name: Install rustup llvm-tools-preview
        shell: bash
        run: rustup component add llvm-tools-preview
      - name: Install cross
        if: ${{ matrix.build-tool == 'cross' }}
        shell: bash
        run: cargo install cross --locked
      # BOLT (post-link layout optimizer) runs after PGO phase 3b on
      # the Linux PGO rows. We pull it from apt.llvm.org rather than
      # Ubuntu's archive because the noble `llvm-bolt`/`bolt-18`
      # packages are amd64-only; apt.llvm.org publishes the same
      # source for both amd64 and arm64. pgo.bash phase 4 uses BOLT's
      # instrumentation mode, so no `perf` install or
      # `kernel.perf_event_paranoid` tweaks are needed.
      - name: Install BOLT toolchain
        if: ${{ matrix.bolt }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-18.list
          sudo apt-get update
          sudo apt-get install -y bolt-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-18/bin/llvm-bolt --version | head -2
          /usr/lib/llvm-18/bin/merge-fdata --help | head -2 || true
      # PGO training is served from test/registry/storage by a dependency-free
      # local Node server. Release builds never contact npmjs.org.
      - name: Import codesign certs
        if: startsWith(matrix.os, 'macos')
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASS }}
      - name: PGO build (instrument + train + optimize)
        shell: bash
        env:
          AUBE_PGO_NO_LOCK: "1"
          AUBE_PGO_BUILD_TOOL: ${{ matrix.build-tool }}
          AUBE_PGO_TARGET: ${{ matrix.target }}
          AUBE_PGO_BOLT: ${{ matrix.bolt && '1' || '' }}
          AUBE_PGO_LLVM_VERSION: ${{ matrix.bolt && '18' || '' }}
        run: bash benchmarks/pgo.bash
      - name: Codesign macOS binaries
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          IDENTITY: "Developer ID Application: Jeffrey Dickey (4993Y37DX6)"
          BIN_DIR: target/${{ matrix.target }}/release-pgo
        run: |
          # Sign aube only — aubr/aubx become symlinks to aube in the
          # archive step below and share its signature. Gatekeeper
          # validates the underlying file's signature; the invocation
          # name only matters for argv[0] dispatch inside the binary.
          codesign --sign "$IDENTITY" --options runtime --timestamp \
            --prefix dev.jdx. "$BIN_DIR/aube"
      # Signing settles who built the binary; notarization is what Gatekeeper
      # demands once an archive carries the quarantine bit, which is to say
      # whenever someone downloads it in a browser rather than with curl.
      # Without a ticket it is blocked behind a "cannot be verified" dialog that
      # only a deliberate override gets past.
      #
      # The ticket lives on Apple's side and is keyed to the binary's cdhash, so
      # nothing here rewrites what was already built or uploaded -- stapling
      # would, but `stapler` only writes into bundles, disk images, and
      # installer packages, and this is a bare Mach-O in an archive. Gatekeeper
      # resolves the ticket online instead.
      - name: Notarize macOS binary
        if: startsWith(matrix.os, 'macos') && !fromJSON(inputs.dry_run || 'false')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BINARIES: target/${{ matrix.target }}/release-pgo/aube
        run: |
          set -euo pipefail

          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error title=Notarization credentials missing::App Store Connect credentials are required for macOS releases."
            exit 1
          fi

          # Outside the workspace, so no later step can sweep the key into an
          # artifact, and removed even when notarization fails.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$work/key.p8"

          # notarytool takes a container, never a bare executable. Copies are
          # fine: a Mach-O carries its signature inline, so the cdhash the
          # ticket is keyed to is the one already shipped.
          mkdir "$work/stage"
          for binary in $BINARIES; do
            cp "$binary" "$work/stage/"
          done
          # Apple rejects a binary without the hardened runtime or a secure
          # timestamp. Naming a missing one here turns an opaque Invalid verdict
          # into a diagnosis; Apple stays the authority on whether to accept.
          for binary in $BINARIES; do
            details="$(codesign --display --verbose=4 "$binary" 2>&1 || true)"
            case "$details" in
              *runtime*) ;;
              *) echo "::warning title=No hardened runtime::$binary is signed without --options runtime, which Apple requires; expect an Invalid verdict below." ;;
            esac
            case "$details" in
              *Timestamp=*) ;;
              *) echo "::warning title=No secure timestamp::$binary carries no secure timestamp, which Apple requires; expect an Invalid verdict below." ;;
            esac
          done

          ditto -c -k --norsrc --noextattr "$work/stage" "$work/submission.zip"

          # `--wait` is not a gate on its own: it can return zero on an Invalid
          # submission, so the reported status is what decides. plutil reads
          # JSON and ships with macOS, which keeps this off jq.
          result="$(xcrun notarytool submit "$work/submission.zip" \
            --key "$work/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json \
            --timeout 30m \
            --wait)"
          echo "$result"

          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          id="$(printf '%s' "$result" | plutil -extract id raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status for submission $id"
            xcrun notarytool log "$id" \
              --key "$work/key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            exit 1
          fi
          echo "notarized: submission $id"
      - name: Archive PGO binaries
        id: archive
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="aube-${TAG}-${TARGET}.tar.gz"
          # Replace aubr/aubx with symlinks to aube before tar-ing.
          # They're multicall shims (Cargo just had to compile them
          # separately because it doesn't natively support multicall);
          # at runtime `rewrite_multicall_argv` keys off argv[0], so a
          # symlink invoked as `aubr` runs `aube run` correctly. tar
          # stores symlinks as ~zero-byte entries pointing at "aube",
          # cutting the archive from three full binaries to one.
          # Symlinks match the existing convention in packaging/copr/
          # and .github/workflows/ppa-publish.yml.
          BIN_DIR="target/${TARGET}/release-pgo"
          ln -sf aube "$BIN_DIR/aubr"
          ln -sf aube "$BIN_DIR/aubx"
          tar -czf "$archive" -C "$BIN_DIR" aube aubr aubx
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload archive to release
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUBE_GH_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
      - name: Upload archive as workflow artifact (dry run)
        if: ${{ fromJSON(inputs.dry_run || 'false') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aube-${{ inputs.tag }}-${{ matrix.target }}
          path: ${{ steps.archive.outputs.path }}
      - name: Attest release archive
        if: ${{ !fromJSON(inputs.dry_run || 'false') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
