name: node-addon

on:
  pull_request:
    paths:
      - "crates/aube-node/**"
      - "crates/aube-codes/**"
      - "!crates/aube-codes/CHANGELOG.md"
      - "crates/aube-registry/src/config/**"
      - "crates/aube-registry/src/lib.rs"
      - "crates/aube/src/lib.rs"
      - "crates/aube/src/embed.rs"
      - "crates/aube/src/commands/add/mod.rs"
      - "crates/aube/src/commands/install/control.rs"
      - "crates/aube/src/commands/install/dep_selection.rs"
      - "crates/aube/src/commands/install/frozen.rs"
      - "crates/aube-util/src/identity.rs"
      - "crates/aube-util/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-addon.yml"
      - ".github/workflows/node-addon-impl.yml"
  push:
    branches: [main]
    paths:
      - "crates/aube-node/**"
      - "crates/aube-codes/**"
      - "!crates/aube-codes/CHANGELOG.md"
      - "crates/aube-registry/src/config/**"
      - "crates/aube-registry/src/lib.rs"
      - "crates/aube/src/lib.rs"
      - "crates/aube/src/embed.rs"
      - "crates/aube/src/commands/add/mod.rs"
      - "crates/aube/src/commands/install/control.rs"
      - "crates/aube/src/commands/install/dep_selection.rs"
      - "crates/aube/src/commands/install/frozen.rs"
      - "crates/aube-util/src/identity.rs"
      - "crates/aube-util/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-addon.yml"
      - ".github/workflows/node-addon-impl.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v1.28.0) to publish packages for. Empty runs a smoke build."
        required: false
        default: ""

permissions: {}

jobs:
  build:
    if: ${{ github.event_name != 'release' && inputs.tag == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/node-addon-impl.yml
    with:
      tag: ""

  release:
    if: ${{ github.event_name == 'release' || inputs.tag != '' }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/node-addon-impl.yml
    with:
      tag: ${{ inputs.tag || '' }}
    secrets:
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_P12_PASS: ${{ secrets.CERTIFICATES_P12_PASS }}

  packages:
    name: packages
    if: ${{ always() && !cancelled() && needs.build.result != 'cancelled' && needs.release.result != 'cancelled' }}
    permissions: {}
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [[ "$BUILD_RESULT" == success && "$RELEASE_RESULT" == skipped ]] ||
             [[ "$BUILD_RESULT" == skipped && "$RELEASE_RESULT" == success ]]; then
            exit 0
          fi
          echo "build=$BUILD_RESULT release=$RELEASE_RESULT"
          exit 1
