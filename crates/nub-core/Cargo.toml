# SELF-CONTAINED MANIFEST (no `*.workspace = true`): nub-core is a member of the
# ROOT workspace, but it is ALSO a cross-workspace path dependency of
# `crates/nub-launcher` (the `nub compile` runtime half, its own size-tuned
# workspace). The release `cross` build runs `cd crates/nub-launcher && cross
# build`, which mounts ONLY the nub-launcher workspace and its path deps into the
# container — the repo-root manifest is absent there, so any `.workspace = true`
# field here has no workspace root to inherit from and the manifest parse fails
# ("failed to find a workspace root"). That is the #132 failure exactly, one crate
# over: it broke the v0.2.0 cross matrix through crates/nub-cache-key, which
# carries the same note and the same inlining. Reproduced before inlining here —
# `cargo metadata` in a tree holding only nub-launcher + nub-core exits 101 with
# that error, and exits 0 with a root manifest present.
#
# Keep the shared literals below in lockstep with the root `Cargo.toml`'s
# `[workspace.package]`, `[workspace.dependencies]`, and `[workspace.lints]` —
# a drifted version here resolves as a SECOND copy of that crate rather than
# failing loudly. (`version` is cosmetic: nub-core is `publish`-less and
# `scripts/set-version.mjs` does not stamp it, same as nub-cache-key.)
[package]
name = "nub-core"
version = "0.7.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/nubjs/nub"

[features]
# Release-only single-binary mode: `build.rs` tars+zstd-compresses the staged
# `runtime/` tree into the binary (`include_bytes!`) and `runtime_cache` extracts
# it once, on first run, to a versioned cache dir. OFF by default so the dev loop
# (`--profile fast`, `make install-dev`) pays no blob re-tar and `find_preload`
# keeps walking to the in-repo `runtime/` (live-editable). CI release builds turn
# it on via `nub-cli/embed-runtime`. The optional deps are pulled in ONLY here:
# `ruzstd` (pure-Rust decode at runtime) ships in the binary; `zstd`/`tar`/`sha2`
# (encode + key-hash at build time) are build-deps that never reach the binary.
embed-runtime = ["dep:ruzstd", "dep:zstd", "dep:tar", "dep:sha2", "dep:blake3"]

[dependencies]
anyhow = "1"
camino = "1"
libc = "0.2"
dirs-next = "2"
dotenvy = "0.15"
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
glob-match = "0.2"
getrandom = "0.3"
liblzma = { version = "0.4", features = ["static"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "rustls-tls-native-roots",
    "socks",
    "gzip",
] }
# Regex-literal script selectors (`nub run "/^build:/"`) — pnpm's `run /regexp/`
# parity. Already in the dependency tree transitively; declared direct here for
# the one use site (`select_scripts`). `default-features` (unicode) keeps `\w`
# etc. matching pnpm's JS RegExp closely enough for script-name selection.
regex = "1"
rustc-hash = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes serde_json::Map keep INSERTION order (IndexMap-backed).
# Load-bearing for the pin writers in `pm::resolve`: a `package.json` round-trip
# must not alphabetize the user's keys (a pin write that reorders the manifest
# reads as vandalism in the diff). nub-native enables the same feature for its
# tsconfig hashing; declaring it here keeps nub-core's behavior identical with
# and without feature unification against nub-native.
serde_json = { version = "1", features = ["preserve_order"] }
# sha1 (ancient PM publishes carry only a sha1 dist.shasum) sits alongside sha2.
# Pinned 0.10 to share `digest` 0.10 with sha2 — a single Digest trait, no second
# major. sha512 is preferred; sha1 is the fail-closed fallback only.
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
thiserror = "2"
tracing = "0.1"
# Pure-Rust zstd DECODER for inflating the embedded runtime blob on first run
# (embed-runtime only). Pure-Rust on purpose: no libzstd/C toolchain in the
# shipped binary; the one-time ~tens-of-ms decode is irrelevant. Encode happens
# at build time with the `zstd` build-dep (libzstd) — decode never needs it.
ruzstd = { version = "0.8", optional = true }
# R2 verify-on-load digest (embed-runtime only). BLAKE3, not SHA-256: the verify
# re-hashes the ~9 MB addon on EVERY warm load, and software SHA-256 measured ~28 ms
# on aarch64 (Apple Silicon — no auto HW-SHA there; sha2's `asm` path won't build on
# win-arm64/musl), vs ~6 ms for BLAKE3's portable SIMD. BLAKE3 is collision/preimage
# resistant — fully adequate for integrity — and builds identically on every target.
# (`sha2` stays for the 32-bit cache KEY, which is not on the hot path.)
blake3 = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

# Build-time only (embed-runtime): tar + zstd-compress the staged runtime tree
# into `$OUT_DIR/runtime.tar.zst` and hash it for the cache key. Build-deps never
# reach the shipped binary, so libzstd's C build lives here, not in the product.
[build-dependencies]
tar = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }
sha2 = { version = "0.10", optional = true }
# Bakes the R2 per-entrypoint BLAKE3 digests (the runtime side decodes with the
# `blake3` dep above). build-deps never reach the shipped binary.
blake3 = { version = "1", optional = true }

# Unix-only: terminating-signal forwarding to the child (SIGINT/SIGTERM/SIGHUP).
# Gated so the Windows build (which uses a different ctrl_c path) doesn't pull it.
[target.'cfg(unix)'.dependencies]
same-file = "1"
signal-hook = "0.3"

[dev-dependencies]
criterion = "0.5"
blake3 = "1"
# Encoder for the runtime_cache unit tests (they build a tiny tar.zst to exercise
# the decode/unpack/rename/GC path). The PRODUCT decodes with pure-Rust `ruzstd`;
# only the test fixtures need the libzstd encoder, so it stays a dev-dep.
zstd = "0.13"

[[bench]]
name = "workspace_filter"
harness = false

[[bench]]
name = "cache_hash"
harness = false

[[bench]]
name = "cache_body_copy"
harness = false

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
