# nub's settings table: the name, type, default and sources of each setting.
# `crates/nub-settings/build.rs` reads this file and generates
# `nub_settings::meta::SETTINGS`, which `nub config` routes and reports by.
#
# Each table is keyed by pnpm's camelCase setting name; a dotted name such as
# `peerDependencyRules.ignoreMissing` uses the quoted-key form. The
# `# ===== Category =====` separators only group related settings.
#
# Schema for each entry:
#   type          = TOML-ish type spec ("bool", "string", "int", "path",
#                   "url", "list<string>", "object", enum unions)
#   default       = default value rendered as a string. `{cache_namespace}`
#                   and `{data_namespace}` resolve to nub's directory names
#                   when the default is displayed.
#   sources.cli   = CLI flags that set this setting (list, may be empty)
#   sources.env   = env vars that name this setting (list, may be empty).
#                   build.rs adds the pnpm_config_* / PNPM_CONFIG_* spelling
#                   after each declared npm_config_* / NPM_CONFIG_* alias.
#   sources.npmrc = .npmrc keys (list, may be empty). build.rs adds the
#                   kebab-case / camelCase sibling of each identifier-style
#                   key.
#   sources.workspaceYaml = pnpm-workspace.yaml keys (list, may be empty)
#   npmShared     = bool. Marks a key npm and Yarn also read from `.npmrc`
#                   (auth, proxy, registry, TLS, npm-standard scalars).
#                   Default `false`.
#   layout        = bool. Marks a setting that shapes how node_modules is
#                   physically ARRANGED (the linker strategy, hoisting, the
#                   modules/virtual-store directories) rather than which
#                   version resolves. Default `false`.
#
# build.rs reads only the keys above; any other key in an entry is ignored.

