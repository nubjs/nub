# nub-phantom — an INTERNAL/eval tool, not part of the shipped `nub` binary.
#
# It is its OWN single-member Cargo workspace (like crates/nub-native), and is
# `exclude`d from the main workspace, for ONE reason: it depends on the registry
# fetch stack (reqwest/tar/flate2) that the shipped `nub` CLI never needs, so
# isolating it keeps that compile out of the main workspace's build graph and
# every default `cargo build`/CI leg. The tool is built explicitly on demand:
# `cargo build --manifest-path crates/nub-phantom/Cargo.toml --release`.
#
# Its parser comes through nub-phantom-scan → nub-phantom-core, which pins the
# same oxc parser crates as the main workspace, so the parse semantics match
# nub's own transpile/detect pipeline exactly.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "nub-phantom"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/nubjs/nub"
publish = false

[lib]
name = "nub_phantom"
path = "src/lib.rs"

[[bin]]
name = "nub-phantom"
path = "src/main.rs"

[dependencies]
# The reachable-graph walk + classifier + manifest parser are shared with the
# shipped `nub` CLI via nub-phantom-scan (single source of truth — this eval tool
# must not re-diverge its own copies). It pulls the specifier/extraction
# primitives (nub-phantom-core) and the lean-oxc parser subset transitively, so
# this crate depends on neither `oxc` nor nub-phantom-core directly.
nub-phantom-scan = { path = "../nub-phantom-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP fetch of registry metadata + tarballs. Mirrors the main workspace's
# reqwest feature set (blocking, rustls). gzip decodes the tarball transport.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
# Matches nub-core's backend — see the note there. A C/CMake gzip backend cannot
# link against the static MSVC CRT the Windows builds require.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"

[profile.release]
opt-level = 3
