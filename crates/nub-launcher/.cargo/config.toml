# Link the MSVC C runtime STATICALLY into the launcher, on Windows targets only.
#
# The launcher IS the compiled artifact — `nub compile` appends the payload to this
# binary — so whatever it imports is what a user's shipped executable needs on the
# machine it lands on. Rust's MSVC targets link the CRT dynamically by default, which
# put `VCRUNTIME140.dll` in the import table. Measured on a clean Windows Server 2022:
# the artifact dies at `0xC0000135 STATUS_DLL_NOT_FOUND` before any nub code runs, and
# it dies SILENTLY — an exit code and nothing on stderr, because the loader fails the
# process before a runtime exists to report anything. Most Windows 10/11 desktops carry
# the redistributable incidentally; a clean Server or a fresh install does not, and
# "a single self-contained executable" is the whole premise of the feature.
#
# This file is the ONLY copy, and it lives here rather than at the repo root on purpose.
# A root config would reach `crates/nub-native`, a cdylib that Node loads into its own
# process: a static CRT would give it a private heap, so an allocation crossing the
# `node.exe` boundary becomes memory corruption rather than an honest link error. There
# would be no way to opt back out from down there, either — cargo CONCATENATES rustflags
# from every config file up the tree instead of letting the nearest one win, and
# `+crt-static` is sticky (a later `-crt-static` does not undo it, in either order, with
# no diagnostic). Both were measured before this file was written, and `nub-native`
# carries a `compile_error!` guard in case someone tries it anyway. This crate is its own
# Cargo workspace with no cdylib beneath it, so it can pin its own linkage safely; the
# other shipped Windows binaries get the flag from their own build steps.
#
# The cost is binary size, and the launcher is size-tuned (`opt-level = "z"`, fat LTO) for
# a reason: it is the whole of a `--smol` artifact. That trade is not close — a smaller
# binary that cannot start is not smaller, it is broken.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Drop the Apple frameworks the launcher links but never calls, on macOS targets.
#
# nub-core's `reqwest` brings `rustls-platform-verifier`, whose build scripts emit
# `link-lib=framework=Security` and `framework=CoreFoundation` unconditionally. Fat
# LTO removes every function that used them — `nm -u` on the shipped launcher shows
# zero `_Sec*`/`_CF*` imports — but a `LC_LOAD_DYLIB` is a link-time fact, not a
# symbol, so dyld still loads Security, Foundation, CoreFoundation and their
# private-framework tail on every exec and runs their initializers. Measured on
# darwin-arm64 in child CPU time against a C `int main(){return 0;}` linking only
# libSystem: the launcher template cost +3.0 ms per exec with the frameworks and
# the artifact's warm start paid all of it. `-dead_strip_dylibs` makes the linker
# keep only the dylibs an actual reference reaches, which leaves libSystem.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-dead_strip_dylibs"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-dead_strip_dylibs"]
