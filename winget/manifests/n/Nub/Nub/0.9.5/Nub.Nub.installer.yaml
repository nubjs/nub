# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: Nub.Nub
PackageVersion: 0.9.5
# nub ships as a portable single binary inside a per-architecture .zip. `nub` and
# `nubx` are that binary dispatched on argv[0]: winget makes one command alias per
# NestedInstallerFiles entry and refuses a repeated RelativeFilePath, comparing the
# literal string, so the community-maintained manifests have named `bin\nub.exe` in
# two spellings since 0.1.0 and komac carries those entries forward on every bump.
# From 0.9.5 the zip also carries `bin\nubx.exe` and `bin\nubr.exe`, small stubs
# (crates/nub-alias) that run the sibling nub.exe with their verb, so the `nubr`
# alias names its own file.
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: ./bin/nub.exe
    PortableCommandAlias: nubx
  - RelativeFilePath: bin/nub.exe
    PortableCommandAlias: nub
  - RelativeFilePath: bin\nubr.exe
    PortableCommandAlias: nubr
Commands:
  - nub
  - nubx
  - nubr
ReleaseDate: 2026-09-25
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/nubjs/nub/releases/download/v0.9.5/nub-win32-x64.zip
    InstallerSha256: 2686FADB14062BFEDDD9DB4BB9E778602CD21097FE3B7C1D61F9F36CDCBE5B53
  - Architecture: arm64
    InstallerUrl: https://github.com/nubjs/nub/releases/download/v0.9.5/nub-win32-arm64.zip
    InstallerSha256: B95DA9DDA6E4DCAEF03A17F3C90A518BE8DD16CF2FB551D78A95FF432287FD2B
ManifestType: installer
ManifestVersion: 1.12.0
