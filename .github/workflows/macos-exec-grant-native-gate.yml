name: macOS exec-grant native gate

on:
  push:
    branches: [macos-exec-grant-native-gate-ee54]
    paths: [crates/nub-sandbox/**, Cargo.toml, Cargo.lock, .github/workflows/macos-exec-grant-native-gate.yml]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SOURCE_COMMIT: ee54d1f4078c02debebb5d617522bb6457f7caf5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: macos-exec-grant-native
      - name: Binding immutable source and runner
        run: |
          set -euo pipefail
          mkdir -p reports/executables
          test "$(git rev-parse "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          git diff --exit-code "$SOURCE_COMMIT" -- crates/nub-sandbox Cargo.toml Cargo.lock
          { printf 'source_commit=%s\nprobe_head=%s\n' "$SOURCE_COMMIT" "$(git rev-parse HEAD)"; uname -a; rustc -Vv; cargo -V; } > reports/environment.txt
      - name: Running focused macOS aggregate
        run: |
          set -euo pipefail
          failures=0; : > reports/results.tsv
          run_case() { name="$1"; shift; set +e; "$@" > "reports/$name.log" 2>&1; rc=$?; set -e; printf '%s\t%s\n' "$name" "$rc" | tee -a reports/results.tsv; [ "$rc" -eq 0 ] || failures=1; }
          run_case lib-tests-compile cargo test --locked -p nub-sandbox --lib --no-run
          run_case examples-compile cargo build --locked -p nub-sandbox --examples
          run_case tmp-grant-composition cargo test --locked -p nub-sandbox --test tmp_grant_composition -- --nocapture --test-threads=1
          run_case relay-units cargo test --locked -p nub-sandbox --lib proxy::relay:: -- --nocapture --test-threads=1
          run_case live-tls-unit cargo test --locked -p nub-sandbox --lib proxy::tests::live_tls_broker_releases_marker_only_to_the_exact_verified_upstream -- --exact --nocapture --test-threads=1
          run_case broker-session-example cargo run --locked -p nub-sandbox --example broker_session_fixture
          run_case macos-backend-units cargo test --locked -p nub-sandbox --lib backend::macos::tests -- --nocapture --test-threads=1
          run_case macos-path-operations cargo test --locked -p nub-sandbox --test macos_path_operations -- --nocapture --test-threads=1
          run_case macos-positive-grammar cargo test --locked -p nub-sandbox --test macos_positive_grammar -- --nocapture --test-threads=1
          for binary in $(find "$CARGO_TARGET_DIR/debug" -type f \( -path '*/deps/nub_sandbox-*' -o -path '*/deps/tmp_grant_composition-*' -o -path '*/deps/macos_path_operations-*' -o -path '*/deps/macos_positive_grammar-*' -o -path '*/examples/broker_session_fixture' \) -perm -111 -print); do cp "$binary" "reports/executables/$(basename "$binary")"; done
          { shasum -a 256 reports/executables/*; grep -hE 'running [0-9]+ tests|test result:|BROKER_NATIVE_SESSION_OK' reports/*.log || true; } > reports/binaries-and-runtime.txt
          exit "$failures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-exec-grant-${{ matrix.os }}
          path: reports
          retention-days: 14
