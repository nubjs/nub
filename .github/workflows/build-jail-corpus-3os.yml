name: build-jail-corpus-3os

# BRANCH-SCOPED PROBE — no pull request required. The `push` trigger is what fires
# this; `workflow_dispatch` stays listed for the day it graduates to the default
# branch, but is inert until the file lands there.
#
# A GitHub-hosted runner is disposable by construction, which is the property this
# probe needs: arm A0 runs dependency lifecycle scripts UNCONFINED, which is not
# something to do on a development machine.
#
# THE SHAPE. One build per OS, uploaded once; every shard job downloads it. The
# alternative — build inside each shard job — pays a cold Rust build 7 times per
# platform and makes the shard matrix's wall clock a build measurement. Sharding at
# all is what keeps a job under the point where a cancellation would discard its
# logs entirely, which is the one failure that costs a whole platform's result.
on:
  push:
    branches: [probe/corpus-3os, probe/corpus-win]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # WINDOWS ONLY on this pass. macOS and Linux already have numbers on this
        # catalog; re-running them would spend three times the runner pool to
        # re-measure what is already measured, and Linux has a re-run in flight
        # whose result a duplicate here would only muddy.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Windows gives the main thread a 1 MB stack against Linux's 8 MB, and the
      # unoptimized `fast` profile overflows it inside `nub install` before any
      # lifecycle script runs (0xC00000FD, STATUS_STACK_OVERFLOW). That is a
      # separate defect; linking with a Linux-sized stack lets this probe measure
      # the jail rather than a debug-build frame-size artifact.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: corpus-3os-${{ matrix.os }}
      - name: Build the dev binary
        run: cargo build -p nub-cli --profile fast
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p stage
          cp target/fast/nub stage/nub 2>/dev/null || cp target/fast/nub.exe stage/nub.exe
          ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: nub-${{ matrix.os }}
          path: stage
          retention-days: 7

  # THE APPDATA CONTROL. Two binaries from ONE commit, differing by one cargo feature,
  # so the comparison has exactly one variable. Measuring the redirect against the
  # previous corpus run instead would put ~23 commits of unrelated tree movement inside
  # the control, which is the failure this effort has repeated most.
  build-control:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: '-C link-arg=/STACK:8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: corpus-3os-windows-latest
      - name: Build with the APPDATA redirect dropped
        run: cargo build -p nub-cli --profile fast --features nub-cli/build-jail-appdata-arm
      - name: Stage
        shell: bash
        run: mkdir -p stage-control && cp target/fast/nub.exe stage-control/nub.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nub-windows-appdata-arm
          path: stage-control
          retention-days: 7

  appdata-control:
    needs: [build, build-control]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: nub-windows-latest
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: nub-windows-appdata-arm
          path: stage-control
      - name: 'Three cells, one variable'
        working-directory: tests/build-jail-corpus
        shell: bash
        env:
          NUB_EXPECT_GIT_SHA: ${{ github.sha }}
          PER_PKG: '1'
        run: |
          set -u
          export STUDY_PATH="/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem"
          chmod +x run-shard.sh
          DEF="$PWD/../../stage/nub.exe"; CTL="$PWD/../../stage-control/nub.exe"
          echo "default_sha256=$(sha256sum "$DEF" | awk '{print $1}')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "control_sha256=$(sha256sum "$CTL" | awk '{print $1}')" | tee -a "$GITHUB_STEP_SUMMARY"
          FAILED=""
          NUB_BIN="$DEF" OUTROOT="${{ runner.temp }}/ad-base" \
            ./run-shard.sh winappdata shard-winappdata.tsv A0 || FAILED="$FAILED A0"
          NUB_BIN="$DEF" OUTROOT="${{ runner.temp }}/ad-on" \
            ./run-shard.sh winappdata shard-winappdata.tsv PROD || FAILED="$FAILED PROD-redirect-on"
          NUB_BIN="$CTL" OUTROOT="${{ runner.temp }}/ad-off" \
            ./run-shard.sh winappdata shard-winappdata.tsv PROD || FAILED="$FAILED PROD-redirect-off"
          echo "INADMISSIBLE:${FAILED:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          # ANTI-HOLLOW: the control arm must ANNOUNCE itself, and the default arm must
          # not. A featured build whose feature silently did nothing would make both
          # cells the same experiment — which is how a prior run measured jail-on
          # against jail-on and reported an effect.
          ON=$(grep -c 'APPDATA redirect DROPPED' "${{ runner.temp }}/ad-on/winappdata-PROD/run.log" || true)
          OFF=$(grep -c 'APPDATA redirect DROPPED' "${{ runner.temp }}/ad-off/winappdata-PROD/run.log" || true)
          echo "arm banners — redirect-on cell: ${ON:-0} (must be 0), redirect-off cell: ${OFF:-0} (must be >0)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '| cell | npm-cache EPERM lines |'; echo '| --- | --- |'
            for c in ad-base:A0 ad-on:PROD ad-off:PROD; do
              L="${{ runner.temp }}/${c%%:*}/winappdata-${c##*:}/run.log"
              echo "| ${c%%:*} | $(grep -c 'AppData\\Roaming\\npm-cache' "$L" 2>/dev/null || echo 0) |"
            done; } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$FAILED" ] || exit 1
          [ "${ON:-0}" -eq 0 ] && [ "${OFF:-0}" -gt 0 ] || { echo "ARM DID NOT ENGAGE AS BUILT"; exit 1; }
      - name: Verdicts per cell
        if: always()
        working-directory: tests/build-jail-corpus
        shell: bash
        run: |
          for c in ad-base ad-on ad-off; do
            echo "### $c"; node aggregate.mjs "${{ runner.temp }}/$c" 2>&1 | tail -25
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appdata-control
          path: ${{ runner.temp }}/ad-*
          retention-days: 7

  # Nine corpus rows fail PROD naming `…\Packages\<profile>\AC\Temp`. This job asks
  # whether that is a jail defect or a path disagreement this harness manufactures,
  # by reproducing the signature on the affected nine and then LOOKING at where the
  # AppContainer profile actually landed. See the observation step for why the
  # obvious differential — vary LOCALAPPDATA — is not available.
  appcontainer-profile-location:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: nub-windows-latest
          path: stage
      - name: 'Both cells, then the signature counts'
        working-directory: tests/build-jail-corpus
        shell: bash
        env:
          NUB_EXPECT_GIT_SHA: ${{ github.sha }}
          PER_PKG: '1'
        run: |
          set -u
          export NUB_BIN="$PWD/../../stage/nub.exe"
          export STUDY_PATH="/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem"
          chmod +x run-shard.sh
          FAILED=""
          # A0 is the denominator and is run ONCE — the variable under test is a
          # confined-path concern, so an unconfined arm per cell would measure nothing.
          OUTROOT="${{ runner.temp }}/lad-base" ./run-shard.sh winlad shard-winlad.tsv A0 || FAILED="$FAILED A0"
          OUTROOT="${{ runner.temp }}/lad-synth" ./run-shard.sh winlad shard-winlad.tsv PROD || FAILED="$FAILED PROD-synthetic"
          # WHERE THE PROFILE ACTUALLY LANDS — an OBSERVATION, not a second cell.
          #
          # The first attempt varied LOCALAPPDATA and was invalid: on Windows nub's own
          # STORE lives at `%LOCALAPPDATA%\nub\pm\store`, so repointing the variable moved
          # the store outside every snapshot root and the run died
          # `FAILED-attribution-wipeout(installed=8,cells=0)`. LOCALAPPDATA is not
          # independent of the measurement and cannot be the variable.
          #
          # It does not need to be. `CreateAppContainerProfile` takes a name and no path,
          # so the claim is falsifiable by looking: if the profile is on disk under the
          # REAL user's LOCALAPPDATA while the child's synthetic one holds no `Packages`
          # entry, the ENOENT is a path disagreement this harness manufactures. Both
          # listings, no variable moved.
          echo '### Where the AppContainer profile actually is' | tee -a "$GITHUB_STEP_SUMMARY"
          REAL="$(cygpath -u "${LOCALAPPDATA}")/Packages"
          SYNTH="${{ runner.temp }}/lad-synth/winlad-PROD/home/AppData/Local/Packages"
          for label in "real:$REAL" "synthetic:$SYNTH"; do
            p="${label#*:}"
            n=$(ls "$p" 2>/dev/null | grep -c '^nub_sbx_' || true)
            echo "- ${label%%:*} \`$p\` → nub_sbx_* entries: ${n:-0} (dir exists: $([ -d "$p" ] && echo yes || echo no))" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "INADMISSIBLE:${FAILED:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '| cell | AC\Temp ENOENT/EPERM lines | packages naming the AC profile |'
            echo '| --- | --- | --- |'
            for c in lad-base:A0 lad-synth:PROD; do
              d="${{ runner.temp }}/${c%%:*}/winlad-${c##*:}"
              L="$d/run.log"
              n=$(grep -c 'AppData\\Local\\Packages' "$L" 2>/dev/null || echo 0)
              p=$(grep -oE '^--- window: [^ ]+' "$L" 2>/dev/null | sed 's/--- window: //' | sort -u | tr '\n' ' ')
              echo "| ${c##*:} | $n | $(grep -l 'AppData\\Local\\Packages' "$L" >/dev/null 2>&1 && echo "$p" || echo none) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # A cell that produced no data cannot be read.
          [ -z "$FAILED" ] || exit 1
      - name: Collect
        if: always()
        shell: bash
        run: |
          mkdir -p lad-evidence
          for c in lad-base lad-synth; do
            for d in "${{ runner.temp }}/$c"/*/; do
              n="$c-$(basename "$d")"; mkdir -p "lad-evidence/$n"
              cp "$d"/report.json "$d"/verdicts.json "$d"/windows.json "lad-evidence/$n/" 2>/dev/null || true
              tail -c 3000000 "$d"/run.log > "lad-evidence/$n/run.log" 2>/dev/null || true
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appcontainer-profile-location
          path: tests/build-jail-corpus/lad-evidence
          retention-days: 7

  corpus:
    needs: build
    # Held off: run 30662499497 is already sweeping these eight shards on this commit's
    # DEFAULT build, and the only change since is a cargo feature that is off in that
    # build (`cfg!` false leaves the redirect exactly as it was). Its corpus delta stands;
    # this push exists to add the control, not to re-measure. Flip back for the next sweep.
    if: ${{ false }}
    strategy:
      fail-fast: false
      # A ceiling on how much of the shared runner pool this one probe may hold.
      max-parallel: 9
      matrix:
        os: [windows-latest]
        # The pilot pass (run 30646319862) returned a confirmed arm effect on both
        # arms, 11 per-package windows with none multi-job — so zero truncation —
        # and a failure signature on a break row, which the `--all` archive could
        # not produce at all. The driver is established; widen to the same eight
        # shards the prior Windows sweep used, so this table is directly comparable
        # to it with PER_PKG as the variable that moved.
        shard: [pilot, default1, default2, default3, default4, default5, default6, default7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: nub-${{ matrix.os }}
          path: stage

      - name: Locate the binary
        id: prov
        shell: bash
        run: |
          set -euo pipefail
          if [ -f stage/nub.exe ]; then BIN="$PWD/stage/nub.exe"; else BIN="$PWD/stage/nub"; fi
          chmod +x "$BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "sha256=$(sha256sum "$BIN" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$BIN" | awk '{print $1}')"
            echo "version=$("$BIN" --version 2>&1 | head -1)"
            echo "node=$(node --version)"
            echo "host=$(uname -srm)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A0 IS THE DENOMINATOR and runs first. Without it a package that never
      # reaches its real path scores as "works under the jail", which is worthless
      # and wrong in the reassuring direction.
      - name: 'Both arms, one shard'
        working-directory: tests/build-jail-corpus
        shell: bash
        env:
          NUB_BIN: ${{ steps.prov.outputs.bin }}
          NUB_EXPECT_GIT_SHA: ${{ github.sha }}
          OUTROOT: ${{ runner.temp }}/build-jail-corpus
          # PER_PKG=1 IS LOAD-BEARING AND ITS ABSENCE INVALIDATED THE ENTIRE PRIOR
          # WINDOWS ARCHIVE. Without it the runner takes the `approve-builds --all`
          # path: aube stops scheduling the queue once any sibling fails, so a
          # missing delta means either "the jail blocked it" or "it never ran", and
          # the two are indistinguishable. Run 30573923410 approved 56 packages in
          # ONE window and exited 1 — every NEVER-RAN row in it is unattributable.
          # It also emits no `--- window:` markers, which is why 0 of 13 break rows
          # in that archive carried a failure signature: per-package attribution had
          # no boundary to attribute against. One window per package fixes all three.
          PER_PKG: '1'
        run: |
          case "$(uname -s)" in
            Darwin)              export STUDY_PATH="/usr/bin:/bin:/usr/sbin:/sbin" ;;
            Linux)               export STUDY_PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" ;;
            MINGW*|MSYS*|CYGWIN*) export STUDY_PATH="/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem" ;;
          esac
          chmod +x run-shard.sh
          FAILED=""
          for ARM in A0 PROD; do
            START=$(date +%s)
            rc=0
            ./run-shard.sh "${{ matrix.shard }}" "shard-${{ matrix.shard }}.tsv" "$ARM" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "${{ matrix.shard }}/$ARM ok $(( $(date +%s) - START ))s" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "${{ matrix.shard }}/$ARM INADMISSIBLE (rc=$rc)" | tee -a "$GITHUB_STEP_SUMMARY"
              FAILED="$FAILED ${{ matrix.shard }}/$ARM(rc=$rc)"
            fi
          done
          echo "INADMISSIBLE_ARMS:${FAILED:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          # THE EXIT IS THE POINT, and its absence is how the first pass reported a green
          # Windows job on two rc=7 aborts that measured nothing. Collecting the failure
          # into a variable and then ending the step on a successful `echo` leaves the
          # step's status reading the echo. A run that produced no admissible data must
          # turn its job red; the later steps still run under `if: always()`.
          [ -z "$FAILED" ] || exit 1

      # Read straight out of both arms' logs and scored PER ARM. A whole-log grep is
      # what let an earlier two-principal probe score an empty arm green: the pattern
      # matched the other arm's line and nothing asserted that this arm had produced
      # any output at all. Requiring a line from each arm separately is the fix.
      - name: 'Enforcement probe — both directions, one run'
        if: always()
        shell: bash
        env:
          OUTROOT: ${{ runner.temp }}/build-jail-corpus
        run: |
          MISSING=""
          for ARM in A0 PROD; do
            L="$OUTROOT/${{ matrix.shard }}-$ARM/run.log"
            LINE="$(grep -h '^ENFORCE ' "$L" 2>/dev/null | tail -1 || true)"
            if [ -z "$LINE" ]; then
              echo "$ARM: NO ENFORCE LINE — the probe produced no output in this arm" | tee -a "$GITHUB_STEP_SUMMARY"
              MISSING="$MISSING $ARM"
            else
              echo "$ARM: $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            # An override is not expressible in this binary (the cargo feature is off),
            # so any banner at all would mean the run did not read the compiled catalog.
            echo "$ARM catalog_override_banners=$(grep -c 'build-jail catalog OVERRIDDEN from' "$L" 2>/dev/null || echo 0)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "ENFORCE_ARMS_MISSING:${MISSING:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validity-gated verdict table
        if: always()
        working-directory: tests/build-jail-corpus
        shell: bash
        env:
          OUTROOT: ${{ runner.temp }}/build-jail-corpus
        run: |
          {
            echo '```'
            node aggregate.mjs "$OUTROOT" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The heavy trees are dropped; only the derived JSON and the failure lines are
      # kept, so the artifact stays small enough to be worth downloading.
      - name: Collect evidence
        if: always()
        working-directory: tests/build-jail-corpus
        shell: bash
        env:
          OUTROOT: ${{ runner.temp }}/build-jail-corpus
        run: |
          mkdir -p evidence
          for d in "$OUTROOT"/*/; do
            n=$(basename "$d")
            mkdir -p "evidence/$n"
            # windows.json is what the scheduling gate rules on. Without it in the
            # archive a re-score silently falls back to the per-shard approximation,
            # which is the weaker fact the prior archive was stuck with.
            cp "$d"/report.json "$d"/verdicts.json "$d"/delta.json "$d"/windows.json "evidence/$n/" 2>/dev/null || true
            grep -iE 'EPERM|EACCES|EROFS|Cannot find module|not permitted|Access is denied|arm_effect|optout_warnings|node_gyp_identity|FATAL|^ENFORCE |WSAEACCES|EAI_AGAIN|ERR_NUB_|OVERRIDDEN' \
              "$d"/run.log > "evidence/$n/failures.txt" 2>/dev/null || true
            tail -c 4000000 "$d"/run.log > "evidence/$n/run.log" 2>/dev/null || true
          done
          cp "$OUTROOT/../verdict-table.json" evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ matrix.os }}-${{ matrix.shard }}
          path: tests/build-jail-corpus/evidence
          retention-days: 7
