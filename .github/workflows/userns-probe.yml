name: userns-probe

on:
  push:
    branches: [probe/userns-prevalence]
  workflow_dispatch:

jobs:
  probe:
    name: userns (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - name: 1. Environment
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER LABEL: ${{ matrix.os }} ==="
          echo "--- uname ---"; uname -a
          echo "--- os-release ---"; cat /etc/os-release
          echo "--- sysctls ---"
          for s in kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined; do
            printf '%s = ' "$s"; sysctl -n "$s" 2>&1; echo "   (rc=$?)"
          done
          echo "--- /proc/sys/user/max_user_namespaces ---"; cat /proc/sys/user/max_user_namespaces 2>&1; echo "rc=$?"
          echo "--- id ---"; id
          echo "--- aa-status ---"; aa-status 2>&1 | head -30; echo "rc=$?"
          echo "--- apparmor profiles (head) ---"; cat /sys/kernel/security/apparmor/profiles 2>&1 | head -40; echo "rc=$?"
          echo "--- apparmor profiles containing bwrap/unshare ---"; grep -Ei 'bwrap|unshare|userns' /sys/kernel/security/apparmor/profiles 2>&1 | head -20
          echo "--- sudo ---"
          sudo -n true && echo "PASSWORDLESS_SUDO=yes" || echo "PASSWORDLESS_SUDO=no"
          echo "--- kernel config userns ---"
          (zgrep -E 'CONFIG_USER_NS' /proc/config.gz 2>/dev/null || grep -E 'CONFIG_USER_NS' /boot/config-$(uname -r) 2>&1) | head -5
          exit 0

      - name: 2. unshare probes (UNPRIVILEGED, no sudo)
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER LABEL: ${{ matrix.os }} ==="
          echo "--- P1: unshare -Ur true ---"
          unshare -Ur true 2>&1; echo "P1_rc=$?"
          echo "--- P2: unshare -Urm true ---"
          unshare -Urm true 2>&1; echo "P2_rc=$?"
          echo "--- P3: unshare -Urn true ---"
          unshare -Urn true 2>&1; echo "P3_rc=$?"
          echo "--- P4: unshare -Urmn -- id + caps ---"
          unshare -Urmn -- sh -c 'id; grep -E "^Cap(Eff|Prm|Bnd|Inh|Amb)" /proc/self/status' 2>&1; echo "P4_rc=$?"
          echo "--- P4b: caps OUTSIDE any ns (baseline) ---"
          grep -E "^Cap(Eff|Prm|Bnd|Inh|Amb)" /proc/self/status
          echo "--- P5: unshare -Urm mount tmpfs (THE capability test) ---"
          unshare -Urm -- sh -c 'mkdir -p /tmp/m && mount -t tmpfs none /tmp/m && echo MOUNT_OK' 2>&1; echo "P5_rc=$?"
          echo "--- P6: unshare -Ur chroot ---"
          unshare -Ur -- sh -c 'chroot / true && echo CHROOT_OK' 2>&1; echo "P6_rc=$?"
          echo "--- P7: unshare -Urm pivot_root-ish (bind mount) ---"
          unshare -Urm -- sh -c 'mkdir -p /tmp/b1 /tmp/b2 && mount --bind /tmp/b1 /tmp/b2 && echo BIND_OK' 2>&1; echo "P7_rc=$?"
          exit 0

      - name: 3. bwrap probes
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER LABEL: ${{ matrix.os }} ==="
          echo "--- preinstalled? ---"; command -v bwrap; echo "rc=$?"
          echo "--- install ---"
          sudo apt-get update -qq >/dev/null 2>&1; echo "update_rc=$?"
          sudo apt-get install -y -qq bubblewrap >/dev/null 2>&1; echo "install_rc=$?"
          echo "--- which/version/mode ---"
          which bwrap; bwrap --version; ls -l "$(which bwrap)"
          echo "--- B1: bwrap --dev-bind / / true ---"
          bwrap --dev-bind / / true 2>&1; echo "B1_rc=$?"
          echo "--- B2: full confinement ---"
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-all --die-with-parent -- /bin/true 2>&1; echo "B2_rc=$?"
          echo "--- B3 NEGATIVE CONTROL: --unshare-net getent hosts github.com (expect NONZERO = confined) ---"
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net -- getent hosts github.com 2>&1; echo "B3_unshare_net_rc=$?"
          echo "--- B4 POSITIVE CONTROL: no --unshare-net getent hosts github.com (expect ZERO = passes) ---"
          bwrap --ro-bind / / --dev /dev --proc /proc -- getent hosts github.com 2>&1; echo "B4_no_unshare_net_rc=$?"
          echo "--- B5: unprofiled-path copy of bwrap (AppArmor path-profile test) ---"
          cp "$(which bwrap)" /tmp/mybwrap && chmod +x /tmp/mybwrap
          /tmp/mybwrap --dev-bind / / true 2>&1; echo "B5_rc=$?"
          echo "--- B6: unprofiled copy, full confinement ---"
          /tmp/mybwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-all --die-with-parent -- /bin/true 2>&1; echo "B6_rc=$?"
          echo "--- B7: bwrap caps inside sandbox ---"
          bwrap --ro-bind / / --proc /proc --unshare-all -- grep -E "^Cap(Eff|Prm|Bnd)" /proc/self/status 2>&1; echo "B7_rc=$?"
          exit 0

      - name: 4. Landlock ABI probe
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER LABEL: ${{ matrix.os }} ==="
          cat > /tmp/ll.c <<'EOF'
          #include <stdio.h>
          #include <unistd.h>
          #include <errno.h>
          #include <string.h>
          #include <sys/syscall.h>
          #ifndef __NR_landlock_create_ruleset
          #define __NR_landlock_create_ruleset 444
          #endif
          int main(void){
            long v = syscall(__NR_landlock_create_ruleset, NULL, 0, 1U);
            if (v < 0) { printf("LANDLOCK_UNAVAILABLE errno=%d (%s)\n", errno, strerror(errno)); return 0; }
            printf("LANDLOCK_ABI=%ld\n", v);
            return 0;
          }
          EOF
          cc -o /tmp/ll /tmp/ll.c 2>&1; echo "compile_rc=$?"
          /tmp/ll; echo "run_rc=$?"
          echo "--- LSM list ---"; cat /sys/kernel/security/lsm 2>&1
          exit 0

      - name: 5. Nested Docker userns check
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER LABEL: ${{ matrix.os }} ==="
          command -v docker; echo "docker_present_rc=$?"
          docker version --format '{{.Server.Version}}' 2>&1; echo "dv_rc=$?"
          for IMG in ubuntu:24.04 node:22-slim; do
            echo "########## IMAGE: $IMG (default seccomp, NOT privileged) ##########"
            docker run --rm "$IMG" sh -c '
              echo "--- id ---"; id
              echo "--- caps baseline ---"; grep -E "^Cap(Eff|Prm|Bnd)" /proc/self/status
              echo "--- max_user_namespaces ---"; cat /proc/sys/user/max_user_namespaces 2>&1
              command -v unshare >/dev/null 2>&1 || { echo "NO_UNSHARE_BINARY"; exit 0; }
              echo "--- D1: unshare -Ur true ---"; unshare -Ur true 2>&1; echo "D1_rc=$?"
              echo "--- D2: unshare -Urm true ---"; unshare -Urm true 2>&1; echo "D2_rc=$?"
              echo "--- D3: caps in userns ---"; unshare -Urm -- sh -c "id; grep -E \"^Cap(Eff|Prm|Bnd)\" /proc/self/status" 2>&1; echo "D3_rc=$?"
              echo "--- D4: mount tmpfs in userns ---"; unshare -Urm -- sh -c "mkdir -p /tmp/m && mount -t tmpfs none /tmp/m && echo MOUNT_OK" 2>&1; echo "D4_rc=$?"
            ' 2>&1
            echo "docker_run_rc=$?"
          done
          echo "########## nested docker as NON-ROOT user (uid 1000) ##########"
          docker run --rm --user 1000:1000 ubuntu:24.04 sh -c 'id; unshare -Ur true 2>&1; echo "ND_rc=$?"' 2>&1
          echo "rc=$?"
          exit 0

  # ---------------------------------------------------------------------------
  # Round 2: does UNPRIVILEGED self-confinement (Landlock + seccomp) work where
  # bwrap+userns does not? This is the build-jail tier, which claims to need no
  # setup at all. Run on the host AND inside a default docker container.
  # ---------------------------------------------------------------------------
  confine:
    name: confine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: build probe (static)
        continue-on-error: true
        run: |
          set +e
          cc -static -O1 -o /tmp/confine_probe tests/userns-probe/confine_probe.c 2>&1
          echo "compile_rc=$?"
          ls -l /tmp/confine_probe; file /tmp/confine_probe 2>/dev/null
          exit 0
      - name: HOST — landlock fs / net / seccomp
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER: ${{ matrix.os }} (HOST, unprivileged uid=$(id -u)) ==="
          mkdir -p /tmp/allowed && echo PUBLIC > /tmp/allowed/ok.txt
          echo "TOPSECRET" > "$HOME/secret.txt"
          echo "--- C1 abi ---";     /tmp/confine_probe abi; echo "rc=$?"
          echo "--- C2 fs (allow /tmp/allowed; deny \$HOME/secret.txt) ---"
          /tmp/confine_probe fs /tmp/allowed "$HOME/secret.txt" /tmp/allowed/ok.txt; echo "rc=$?"
          echo "--- C3 net (landlock TCP deny) ---"; /tmp/confine_probe net; echo "rc=$?"
          echo "--- C4 seccomp (deny socket) ---";   /tmp/confine_probe seccomp; echo "rc=$?"
          exit 0
      - name: DOCKER default (no --privileged) — same probes
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER: ${{ matrix.os }} (inside default docker) ==="
          for IMG in ubuntu:24.04 node:22-slim; do
            echo "########## $IMG ##########"
            docker run --rm -v /tmp/confine_probe:/p:ro "$IMG" sh -c '
              mkdir -p /tmp/allowed && echo PUBLIC > /tmp/allowed/ok.txt
              echo TOPSECRET > /root/secret.txt
              echo "--- abi ---";     /p abi;     echo "rc=$?"
              echo "--- fs ---";      /p fs /tmp/allowed /root/secret.txt /tmp/allowed/ok.txt; echo "rc=$?"
              echo "--- net ---";     /p net;     echo "rc=$?"
              echo "--- seccomp ---"; /p seccomp; echo "rc=$?"
            ' 2>&1
            echo "docker_rc=$?"
          done
          echo "########## node:22-slim as NON-ROOT (uid 1000) ##########"
          docker run --rm --user 1000:1000 -v /tmp/confine_probe:/p:ro node:22-slim sh -c '
            mkdir -p /tmp/allowed && echo PUBLIC > /tmp/allowed/ok.txt
            echo TOPSECRET > /tmp/secret.txt
            /p abi; /p fs /tmp/allowed /tmp/secret.txt /tmp/allowed/ok.txt; /p net; /p seccomp' 2>&1
          echo "rc=$?"
          exit 0

  # ---------------------------------------------------------------------------
  # Round 2: which docker security-opt (if any) restores unprivileged userns?
  # 22.04 vs 24.04 host is the differential that separates "docker's own policy"
  # from "the host apparmor sysctl reaching into the container".
  # ---------------------------------------------------------------------------
  dockeropts:
    name: dockeropts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: docker security-opt matrix
        continue-on-error: true
        run: |
          set +e
          echo "=== RUNNER: ${{ matrix.os }} ==="
          echo "--- host sysctl ---"; sysctl -n kernel.apparmor_restrict_unprivileged_userns
          echo "--- docker info security ---"; docker info --format '{{json .SecurityOptions}}'
          run_case () {
            echo "########## CASE: $1 ##########"
            shift
            docker run --rm "$@" ubuntu:24.04 sh -c '
              grep -E "^Cap(Eff|Bnd)" /proc/self/status
              unshare -Ur true 2>&1; echo "unshare_Ur_rc=$?"
              unshare -Urm -- sh -c "mount -t tmpfs none /mnt && echo MOUNT_OK" 2>&1; echo "mount_rc=$?"
            ' 2>&1
            echo "case_rc=$?"
          }
          run_case "default"                     
          run_case "seccomp=unconfined"          --security-opt seccomp=unconfined
          run_case "apparmor=unconfined"         --security-opt apparmor=unconfined
          run_case "seccomp+apparmor unconfined" --security-opt seccomp=unconfined --security-opt apparmor=unconfined
          run_case "cap-add SYS_ADMIN"           --cap-add SYS_ADMIN
          run_case "cap-add SYS_ADMIN + seccomp=unconfined" --cap-add SYS_ADMIN --security-opt seccomp=unconfined
          run_case "privileged"                  --privileged
          exit 0

  # ---------------------------------------------------------------------------
  # Round 2: the GitHub Actions `container:` job shape — extremely common, and a
  # different code path from `docker run` inside a normal job.
  # ---------------------------------------------------------------------------
  containerjob:
    name: containerjob (node:22-slim on ubuntu-24.04)
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: node:22-slim
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: probe inside the job container
        continue-on-error: true
        run: |
          set +e
          echo "--- id/caps ---"; id; grep -E "^Cap(Eff|Bnd)" /proc/self/status
          cat /etc/os-release | head -2
          echo "--- userns ---"
          apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq util-linux gcc libc6-dev >/dev/null 2>&1
          echo "apt_rc=$?"
          unshare -Ur true 2>&1; echo "unshare_Ur_rc=$?"
          echo "--- bwrap ---"
          apt-get install -y -qq bubblewrap >/dev/null 2>&1; echo "bwrap_install_rc=$?"
          bwrap --dev-bind / / true 2>&1; echo "bwrap_rc=$?"
          echo "--- landlock/seccomp ---"
          cc -O1 -o /tmp/confine_probe tests/userns-probe/confine_probe.c 2>&1; echo "cc_rc=$?"
          mkdir -p /tmp/allowed && echo PUBLIC > /tmp/allowed/ok.txt && echo TOPSECRET > /tmp/secret.txt
          /tmp/confine_probe abi; /tmp/confine_probe fs /tmp/allowed /tmp/secret.txt /tmp/allowed/ok.txt
          /tmp/confine_probe net; /tmp/confine_probe seccomp
          exit 0

  # ---------------------------------------------------------------------------
  # Round 2: the two documented 24.04 fixes, and confirmation that neither is
  # reachable WITHOUT root.
  # ---------------------------------------------------------------------------
  fixes:
    name: fixes (ubuntu-24.04)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: unprivileged attempts to lift the gate (all must FAIL)
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq bubblewrap apparmor-utils >/dev/null 2>&1
          echo "--- F1: sysctl write as NON-root ---"
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1; echo "F1_rc=$?"
          echo "--- F2: write the proc file directly as NON-root ---"
          echo 0 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1; echo "F2_rc=$?"
          echo "--- F3: load an apparmor profile as NON-root ---"
          cat > /tmp/p.aa <<'EOP'
          abi <abi/4.0>,
          include <tunables/global>
          profile mybwrap /tmp/mybwrap flags=(unconfined) {
            userns,
            include if exists <local/mybwrap>
          }
          EOP
          apparmor_parser -r /tmp/p.aa 2>&1; echo "F3_rc=$?"
          echo "--- F4: write into /etc/apparmor.d as NON-root ---"
          cp /tmp/p.aa /etc/apparmor.d/mybwrap 2>&1; echo "F4_rc=$?"
          echo "--- F5: is there any user-writable dir under /etc/apparmor.d? ---"
          find /etc/apparmor.d -writable 2>/dev/null | head; echo "F5_found=$?"
          echo "--- F6: aa-exec into an existing permissive profile ---"
          aa-exec -p unconfined -- bwrap --dev-bind / / true 2>&1; echo "F6_rc=$?"
          echo "--- F7: setuid-copy of bwrap (must be refused by bwrap itself) ---"
          cp /usr/bin/bwrap /tmp/subwrap && sudo chown root:root /tmp/subwrap && sudo chmod u+s /tmp/subwrap
          ls -l /tmp/subwrap; /tmp/subwrap --dev-bind / / true 2>&1; echo "F7_rc=$?"
          exit 0
      - name: the two ROOT fixes (both must WORK)
        continue-on-error: true
        run: |
          set +e
          echo "--- G1: root installs a path-keyed apparmor profile for a COPIED bwrap ---"
          cp /usr/bin/bwrap /tmp/mybwrap && chmod +x /tmp/mybwrap
          /tmp/mybwrap --dev-bind / / true 2>&1; echo "G1_before_rc=$?"
          sudo cp /tmp/p.aa /etc/apparmor.d/mybwrap 2>/dev/null || sudo tee /etc/apparmor.d/mybwrap >/dev/null <<'EOP'
          abi <abi/4.0>,
          include <tunables/global>
          profile mybwrap /tmp/mybwrap flags=(unconfined) {
            userns,
            include if exists <local/mybwrap>
          }
          EOP
          sudo apparmor_parser -r /etc/apparmor.d/mybwrap 2>&1; echo "G1_parser_rc=$?"
          /tmp/mybwrap --dev-bind / / true 2>&1; echo "G1_after_rc=$?"
          /tmp/mybwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-all -- /bin/true 2>&1; echo "G1_full_rc=$?"
          echo "--- G2: root flips the sysctl ---"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1; echo "G2_rc=$?"
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-all -- /bin/true 2>&1; echo "G2_bwrap_rc=$?"
          exit 0

  # ---------------------------------------------------------------------------
  # Round 3: can Landlock express nub's build-jail policy SHAPE — grant a
  # directory then deny a path INSIDE it (/etc/shadow, the `.env*` floor)?
  # This decides whether a Landlock build-jail tier is buildable at all.
  # ---------------------------------------------------------------------------
  landlockdeny:
    name: landlockdeny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: deny-inside-grant experiment
        continue-on-error: true
        run: |
          set +e
          cc -O1 -o /tmp/lld tests/userns-probe/landlock_deny.c 2>&1; echo "cc_rc=$?"
          echo "################ MODE zero (allowed_access = 0) ################"
          /tmp/lld zero; echo "rc=$?"
          echo "################ MODE readless (EXECUTE only, no READ) ################"
          /tmp/lld readless; echo "rc=$?"
          echo "################ same, inside a DEFAULT docker container ################"
          cc -static -O1 -o /tmp/lld_s tests/userns-probe/landlock_deny.c 2>&1
          docker run --rm -v /tmp/lld_s:/lld:ro ubuntu:24.04 sh -c '/lld zero; echo rc=$?; /lld readless; echo rc=$?' 2>&1
          exit 0
