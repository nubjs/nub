name: gha-sandbox-probe

# Branch-scoped feasibility probe (NO PR). Answers: can nub's Linux sandbox run
# on GitHub-hosted runners — single-level and nested — and what is the SIMPLEST
# setup that makes nested bwrap work on a hosted image?
on:
  push:
    branches: [probe/gha-sandbox-feasibility]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---- FAST CORE: diagnostics + baseline capability, per image ----------------
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostics + baseline sandbox probe
        run: bash tests/gha-sandbox-probe/diagnostics.sh

  # ---- WORKAROUND MATRIX: one candidate per fresh runner ----------------------
  workarounds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        mode: [baseline, sysctl-disable, complain-knob, aa-complain, setuid, d5-helper]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Nested bwrap under workaround "${{ matrix.mode }}"
        run: bash tests/gha-sandbox-probe/probe-nesting.sh "${{ matrix.mode }}"

  # ---- CONTAINER JOBS (candidate E): nested bwrap inside a job container -------
  container-plain:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup + nested bwrap inside plain container
        shell: bash
        run: |
          set +e
          apt-get update -qq && apt-get install -y -qq bubblewrap >/dev/null 2>&1
          echo "container: plain ubuntu:24.04 (no extra caps)"
          bwrap --version
          echo "== single-level =="
          bwrap --die-with-parent --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          echo "single-level rc=$?"
          echo "== nested =="
          bwrap --die-with-parent --unshare-user --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --die-with-parent --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          rc=$?; echo "RESULT:nested-container-plain=$([[ $rc -eq 0 ]] && echo PASS || echo FAIL)"; echo "DETAIL:nested-container-plain=rc=$rc"

  container-sysadmin:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --cap-add=SYS_ADMIN --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Setup + nested bwrap inside --cap-add=SYS_ADMIN container
        shell: bash
        run: |
          set +e
          apt-get update -qq && apt-get install -y -qq bubblewrap >/dev/null 2>&1
          echo "container: ubuntu:24.04 --cap-add=SYS_ADMIN --security-opt seccomp=unconfined"
          bwrap --version
          bwrap --die-with-parent --unshare-user --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --die-with-parent --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          rc=$?; echo "RESULT:nested-container-sysadmin=$([[ $rc -eq 0 ]] && echo PASS || echo FAIL)"; echo "DETAIL:nested-container-sysadmin=rc=$rc"

  container-privileged:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Setup + nested bwrap inside --privileged container
        shell: bash
        run: |
          set +e
          apt-get update -qq && apt-get install -y -qq bubblewrap >/dev/null 2>&1
          echo "container: ubuntu:24.04 --privileged"
          bwrap --version
          bwrap --die-with-parent --unshare-user --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --die-with-parent --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          rc=$?; echo "RESULT:nested-container-privileged=$([[ $rc -eq 0 ]] && echo PASS || echo FAIL)"; echo "DETAIL:nested-container-privileged=rc=$rc"

  # ---- ISOLATION: separate userns gate from loopback/net setup ----------------
  single-level-isolate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        wa: [none, sysctl-disable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Single-level isolation (wa=${{ matrix.wa }})
        run: bash tests/gha-sandbox-probe/single-level-isolate.sh "${{ matrix.wa }}"

  # ---- DEFINITIVE nub D5: build 0.11.2 bwrap, real install.sh, cargo nesting ---
  nub-d5-real:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned Bubblewrap 0.11.2 resource (Docker, reproducible)
        run: |
          set -e
          bash scripts/build-bwrap-resource.sh /tmp/bwrapout
          ls -l /tmp/bwrapout/bwrap
          /tmp/bwrapout/bwrap --version
      - name: Run the REAL D5 install.sh (dedicated helper + path-bound profile)
        run: |
          set +e
          SHA=$(sha256sum /tmp/bwrapout/bwrap | awk '{print $1}')
          echo "built bwrap sha256=$SHA"
          echo "BWRAP_SHA=$SHA" >> "$GITHUB_ENV"
          sudo bash crates/nub-sandbox/setup/linux-nesting/install.sh \
            --bwrap /tmp/bwrapout/bwrap --user "${USER:-runner}" --sha256 "$SHA"
          echo "install.sh rc=$?"
          echo "--- installed helper ---"; ls -l /usr/libexec/nub/nub-bwrap
          echo "--- loaded profile ---"; sudo aa-status 2>/dev/null | grep -i nub_bwrap || echo "(nub_bwrap profile not listed)"
      - name: Run nub linux_nesting + linux_nested_composition (NUB_SANDBOX_REQUIRE_NESTING=1, under sg)
        run: |
          set +e
          export NUB_BWRAP_SHA256="$BWRAP_SHA"
          export NUB_BWRAP_VERSION="bubblewrap 0.11.2"
          # Build the test + harness binaries OUTSIDE the sg subshell (faster, shared target).
          cargo test -p nub-sandbox --test linux_nesting --test linux_nested_composition --no-run 2>&1 | tail -15
          echo "== run under sg nub-sandbox with nesting REQUIRED =="
          sg nub-sandbox -c "NUB_SANDBOX_REQUIRE_NESTING=1 NUB_BWRAP_SHA256='$BWRAP_SHA' NUB_BWRAP_VERSION='bubblewrap 0.11.2' cargo test -p nub-sandbox --test linux_nesting --test linux_nested_composition -- --nocapture" 2>&1 | tail -50
          echo "RESULT:nub-d5-nesting=exit${PIPESTATUS[0]:-$?}"

  # ---- BEST-EFFORT: tie raw findings to nub's ACTUAL single-level tests --------
  nub-single-level-tests:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bwrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Run nub linux_enforcement (NUB_SANDBOX_REQUIRE_BWRAP=1)
        env:
          NUB_SANDBOX_REQUIRE_BWRAP: "1"
        run: |
          set +e
          cargo test -p nub-sandbox --test linux_enforcement -- --nocapture 2>&1 | tail -60
          echo "RESULT:nub-linux-enforcement-${{ matrix.os }}=exit${PIPESTATUS[0]:-$?}"
