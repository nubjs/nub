name: Release

# Two publish paths share this file (npm OIDC trusted publishing binds ONE
# workflow filename per package, so the canary publish cannot live in its own
# workflow):
#   - TAG (v*): stage + verify the immutable versioned assets, publish npm
#     `latest`, promote the GitHub Release, then docker/homebrew/winget and
#     post-publish install smokes.
#   - CANARY (nightly schedule): bun-style rolling prerelease, built ONCE A DAY
#     from the head of main rather than on every push. The nightly builds the
#     full 8-platform matrix with an uncommitted `<base>-canary.<yyyymmdd>.<run#>`
#     version stamp, publishes all packages to npm under the `canary` dist-tag
#     after its immutable versioned assets are complete, then recreates the
#     rolling `canary` GitHub prerelease at the built commit. A nightly whose
#     only new commits are inert is skipped, as is one where main has not moved
#     at all (the `verify` job's canary gate); the test/conformance gates are
#     skipped too — ci.yml runs them on the same commit, and the canary contract
#     is "newest main, built and installable," not a second CI.
#
#     CADENCE IS A PACKUMENT BUDGET, not a scheduling preference. Every canary
#     publish appends a permanent version entry to the packument of all 19
#     published packages, and npm serves that document on every install — so the
#     publish rate is a tax every user pays forever. Measured over the
#     per-push channel's first 42 days: 82 canary versions, already 45% of
#     `@nubjs/nub`'s 183-version packument, at up to 9 in a single day. Only 23
#     of those 42 days carried any code change, so a once-a-day build that skips
#     an unchanged main cuts the rate ~3.6x. Do not restore a per-push trigger.
# Stable publishing jobs gate on verify's validated tag output; canary-only jobs
# gate on verify's `is_canary` output. A canary run must never reach the stable
# publish path.
on:
  push:
    tags: ["v*"]
  schedule:
    # The nightly canary. Off the hour because GitHub delays :00 crons hardest
    # under load, and clear of the repo's other nightlies (00:15 through 08:00
    # UTC) so the 8-platform matrix is not queued behind them.
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the selected v<semver> tag across release channels. Default off = build + assemble only (for CI debugging)."
        type: boolean
        default: false
      canary:
        description: "Run the nightly canary now against the head of main, instead of waiting for the schedule. Mutually exclusive with publish."
        type: boolean
        default: false
      linux_only:
        description: "Build only the Linux targets — cheap iteration that skips the 10×-billed macOS and 2× Windows runners. Ignored on tag pushes and on publishing or canary dispatches, which always build the full matrix."
        type: boolean
        default: false

# Default-deny at the workflow level; each job requests exactly the scopes its
# steps use (id-token:write only in npm publication jobs; contents:write only in
# immutable/presentation release jobs that create, upload, or promote releases).
permissions: {}

# Canary runs coalesce WITHOUT cancellation: the scheduled nightly and any manual
# canary dispatch share one group, and a running build always finishes
# (cancelling mid-`npm publish` could strand a half-published canary version).
# One run a day rarely contends, but the group is what stops a manual dispatch
# from interleaving with the schedule inside canary-release's delete-then-
# recreate of the rolling tag. Tag/stable-dispatch runs get per-run groups:
# never queued against each other, never cancelled.
concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canary)) && 'canary' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Metadata-primer embed (the time-bearing seed that kills the cold-install cliff).
# The primer-related env vars (AUBE_PRIMER_TOP / AUBE_PRIMER_VERSION_CAP /
# AUBE_REQUIRE_PRIMER) are scoped to the `primer` job (generation) and the `build`
# job (embed), NOT to this workflow-level env — deliberately, so the `test` and
# `conformance` jobs (which also `cargo build` nub-cli) are NOT forced to generate
# a primer or fail under the require guard, keeping them off the registry's
# critical path the way they were before this fix.

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      # Whether this run is a canary run AT ALL (the nightly schedule, or a
      # manual canary dispatch) - computed once here because GitHub Actions has
      # no workflow-level alias for a job `if:`, and six jobs need the same
      # predicate. Every canary-gated job already `needs: verify`.
      is_canary: ${{ steps.channel.outputs.is_canary }}
      # Canary plumbing (empty on tag/stable-dispatch runs): whether the nightly
      # found anything worth building, and the prerelease version it publishes as.
      canary: ${{ steps.canary.outputs.canary }}
      canary_version: ${{ steps.canary.outputs.canary_version }}
      # Stable publication is allowed only after this step validates the selected
      # tag against the checked-out workspace version.
      publish_version: ${{ steps.publish_tag.outputs.version }}
      publish_tag: ${{ steps.publish_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] verify is a check-only gate; nothing built here is published
        with:
          node-version: "24"
      # Fail rather than silently pick a channel: `publish` selects a stable tag
      # and `canary` builds the head of main, so a dispatch asking for both has
      # no correct interpretation.
      #
      # The ref check is a release-safety gate, not a tidiness one. A dispatch
      # runs against whatever branch or tag the operator selected in the UI, and
      # every canary job downstream trusts `is_canary` and targets GITHUB_SHA —
      # so without this, a canary dispatch from a feature branch would build that
      # branch, publish it to the `canary` dist-tag, and repoint the rolling
      # release at it while the notes claim it is main. The schedule event cannot
      # reach this state (GitHub runs it on the default branch), so the guard
      # costs nothing there.
      - id: channel
        name: Resolve release channel
        env:
          IS_CANARY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canary) }}
          WANT_CANARY: ${{ inputs.canary }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$WANT_CANARY" = "true" ] && [ "$WANT_PUBLISH" = "true" ]; then
            echo "::error::publish and canary are mutually exclusive - publish releases a v* tag, canary builds the head of main"
            exit 1
          fi
          if [ "$IS_CANARY" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a canary publishes the head of main, but this run is on $GITHUB_REF"
            exit 1
          fi
          echo "is_canary=$IS_CANARY" >> "$GITHUB_OUTPUT"
      # Internal consistency: all npm packages + Cargo.toml + preload.mjs agree.
      - name: Check internal version consistency
        run: make version-check
      # The binary is built from the committed Cargo.toml and the committed
      # preload.mjs is shipped as-is, so a stable publication must use a SemVer
      # tag that matches the checked-out workspace. A publishing dispatch may
      # select a tag, while a non-publishing dispatch remains a build-only run.
      - id: publish_tag
        name: Validate stable publish tag
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$PUBLISH_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Stable publication requires selecting a v<semver> tag; got '$PUBLISH_REF'."
              exit 1
              ;;
          esac
          TAG="${PUBLISH_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          node - "$TAG_VERSION" <<'NODE'
          const version = process.argv[2];
          const prereleaseIdentifier = '(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)';
          const semver = new RegExp(`^(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-${prereleaseIdentifier}(?:\\.${prereleaseIdentifier})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`);
          if (!semver.test(version)) {
            console.error(`::error::Stable publication tag v${version} is not valid SemVer 2.0.0.`);
            process.exit(1);
          }
          NODE
          COMMITTED=$(node -e "console.log(require('./npm/nub/package.json').version)")
          if [ "$TAG_VERSION" != "$COMMITTED" ]; then
            echo "::error::Tag v$TAG_VERSION does not match committed version $COMMITTED. Run 'make version V=$TAG_VERSION', commit, then re-tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ Stable publication tag $TAG matches committed version"
      # Build matrix as data, so a non-publishing debug dispatch with
      # linux_only=true can drop the 10×-billed macOS + 2× Windows targets. Tag
      # pushes and publishing dispatches always get the full 8-platform matrix —
      # and so does a canary dispatch, which publishes all eight platform
      # packages and would otherwise ship a partial set under the canary tag.
      - id: matrix
        name: Compute build matrix
        run: |
          FULL='[
            {"platform":"darwin-arm64","runner":"macos-14","target":"aarch64-apple-darwin","cross":false},
            {"platform":"darwin-x64","runner":"macos-14","target":"x86_64-apple-darwin","cross":false},
            {"platform":"linux-x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","cross":false},
            {"platform":"linux-x64-musl","runner":"ubuntu-latest","target":"x86_64-unknown-linux-musl","cross":true},
            {"platform":"linux-arm64","runner":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","cross":true},
            {"platform":"linux-arm64-musl","runner":"ubuntu-latest","target":"aarch64-unknown-linux-musl","cross":true},
            {"platform":"win32-x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","cross":false},
            {"platform":"win32-arm64","runner":"windows-latest","target":"aarch64-pc-windows-msvc","cross":false}
          ]'
          if [ "${{ inputs.linux_only }}" = "true" ] && [ "${{ inputs.publish }}" != "true" ] && [ "${{ inputs.canary }}" != "true" ]; then
            SEL=$(echo "$FULL" | jq -c '[.[] | select(.platform | startswith("linux"))]')
            echo "linux_only debug build — Linux targets only"
          else
            SEL=$(echo "$FULL" | jq -c '.')
          fi
          echo "matrix={\"include\":$SEL}" >> "$GITHUB_OUTPUT"
      # Canary gate + version, canary runs only. The version mirrors bun's
      # scheme (`1.3.13-canary.20260425.1`): the committed base version plus
      # `-canary.<utc-date>.<run#>` — run_number is monotonic per workflow, so
      # every canary version is unique and semver-orders after the previous one.
      #
      # THE BASELINE IS THE LAST PUBLISHED CANARY, not a push's `before` SHA,
      # because a nightly has no push event behind it: it wakes on a timer and
      # must decide for itself what has landed since the channel last moved. The
      # rolling `canary` tag is that record — canary-release recreates it at each
      # built commit — so `canary...HEAD` is exactly the span this build would
      # newly ship. It answers both halves of the gate at once: an empty span
      # means main has not moved since the last nightly, and a span of purely
      # inert files means nothing in it can change the binary. Under the old
      # per-push trigger the first case could not arise; on a timer it is the
      # common one (19 of the channel's first 42 days carried no code change at
      # all), and skipping it is most of what makes the nightly cheaper than a
      # per-push build in packument terms.
      #
      # Polarity is deliberate and unchanged: BUILD unless every changed file is
      # provably inert (markdown anywhere; site/; .claude/; .github/ except this
      # workflow), and BUILD on any compare-API failure, a missing canary tag
      # (first run after this trigger changed, or a manually deleted release), or
      # a truncated file list — a wasted build is cheap, a missing canary is a
      # silent gap. The 300-file truncation cap is hit more readily now that a
      # span is a day of commits rather than one push, which costs an occasional
      # unnecessary build and never a skipped one.
      #
      # The release-bump commit is NOT exempt, though the v* tag run builds the
      # same tree. That exemption cost one extra matrix per release and left the
      # canary channel serving the PREVIOUS base version until the next code
      # commit landed — measured at 21% of the channel's lifetime, a median 17h
      # and a worst case of 51h after each release (#748). The two runs publish
      # disjoint artifacts (`X.Y.Z` under `latest` and the immutable `vX.Y.Z`
      # release; `X.Y.Z-canary.<date>.<run>` under `canary`), and they sit in
      # different concurrency groups, so they run side by side rather than
      # queueing.
      - id: canary
        name: Canary gate + version (canary runs only)
        if: steps.channel.outputs.is_canary == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=true
          # The commit the rolling canary release currently points at. Absent on
          # the first run after this trigger changed; `|| true` keeps BUILD=true.
          BEFORE=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/canary" --jq '.object.sha' 2>/dev/null) || BEFORE=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" = "$GITHUB_SHA" ]; then
            BUILD=false
            REASON="main has not moved since the last canary"
          elif [ -n "$BEFORE" ]; then
            COMPARE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" 2>/dev/null) || COMPARE=""
            if [ -n "$COMPARE" ]; then
              COUNT=$(echo "$COMPARE" | jq '.files | length')
              # The compare API caps .files at 300 — a truncated list could hide
              # a code file, so only trust a complete one.
              if [ "$COUNT" -gt 0 ] && [ "$COUNT" -lt 300 ]; then
                BUILD=false
                REASON="no code change since the last canary"
                while IFS= read -r f; do
                  case "$f" in
                    .github/workflows/release.yml) BUILD=true; break ;;
                    *.md) ;;
                    site/*|.claude/*|.github/*) ;;
                    *) BUILD=true; break ;;
                  esac
                done < <(echo "$COMPARE" | jq -r '.files[].filename')
              fi
            fi
          fi
          BASE=$(node -e "console.log(require('./npm/nub/package.json').version)")
          # Date from the built commit's timestamp, not wall clock: a re-run of a
          # failed canary run keeps its run_number, and a wall-clock date would
          # mint a DIFFERENT version for the same run after UTC midnight —
          # semver-sorting it past newer same-base canaries. The commit
          # timestamp is stable across re-runs. Read from the checkout because a
          # schedule event carries no head_commit payload.
          HEAD_TS=$(git log -1 --format=%cI "$GITHUB_SHA" 2>/dev/null) || HEAD_TS=""
          DATE=$(date -u -d "$HEAD_TS" +%Y%m%d 2>/dev/null) || DATE=$(date -u +%Y%m%d)
          CANARY_VERSION="${BASE}-canary.${DATE}.${GITHUB_RUN_NUMBER}"
          echo "canary=$BUILD" >> "$GITHUB_OUTPUT"
          echo "canary_version=$CANARY_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = "true" ]; then
            echo "canary build: $CANARY_VERSION at ${GITHUB_SHA}"
          else
            echo "skipping the canary build — ${REASON}"
          fi

  primer:
    name: Generate metadata primer (once, shared to all builds)
    needs: verify
    # Runs for the stable paths always; for a canary run only when the gate
    # said build. Skipping primer here is what skips the whole canary pipeline
    # on a nightly with nothing new to ship — build `needs:` primer, and
    # everything heavier `needs:` build, so the skip cascades.
    if: needs.verify.outputs.is_canary != 'true' || needs.verify.outputs.canary == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    # Must match what vendor/aube/crates/aube-resolver/build.rs computes for a
    # `--release` build, because TOP/CAP form the on-disk primer filename
    # (`primer-top{TOP}-v{CAP}-s{SCHEMA}.rkyv.{zst,json}`) the build jobs' build.rs
    # looks for. TOP=2000 == build.rs RELEASE_TOP; CAP=100 == build.rs DEFAULT_VERSION_CAP.
    env:
      AUBE_PRIMER_TOP: "2000"
      AUBE_PRIMER_VERSION_CAP: "100"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] this job runs no package install (generate-primer.mjs uses node: builtins only), so the default cache is unused
        with:
          node-version: "24"
      # === produce-the-blob: source decision (ISOLATED on purpose) ================
      # This is the ONLY place the primer's SOURCE is decided. Two sources, in
      # preference order, both leaving ONE file under
      # vendor/aube/crates/aube-resolver/data/ named
      # primer-top${AUBE_PRIMER_TOP}-v${AUBE_PRIMER_VERSION_CAP}-s<schema>.rkyv.{zst,json}
      # — the exact name the consumers' build.rs computes from those same TOP/CAP
      # and PRIMER_DATA_SCHEMA, so it's picked up directly with no node needed in
      # the cross containers. The downstream contract (the metadata-primer artifact
      # → every build embeds it; AUBE_REQUIRE_PRIMER=1 + the per-target gate) is
      # IDENTICAL regardless of which source wins:
      #
      #   1. SMART blob (token present): the private nubjs/nub-primer pipeline's
      #      latest-s2 release asset (multi-factor scoring, ~93% lockfile coverage
      #      @ 7.3MB). It is the on-disk `.rkyv.zst` form build.rs reads directly
      #      (read raw bytes → zstd-decode → rkyv → per-package re-pack), byte-
      #      compatible with the public generator's output. We download it, validate
      #      it (non-empty + zstd-decodes), and RENAME it to the build-expected
      #      `-s<schema>.rkyv.zst` filename for this TOP/CAP. The blob's own TOP/CAP
      #      (6172/60) are irrelevant downstream — at this point the filename is just
      #      the selector build.rs greps for; the embedded content is whatever we put
      #      there. A schema mismatch (build.rs bumped past the blob's -sK) downloads
      #      nothing → clean fallback.
      #   2. PUBLIC generate (token absent OR download/validation failed): the
      #      committed tokenless generate-primer.mjs against the public registry
      #      (~70% coverage @ 9.1MB) — the unchanged 0.0.38/0.0.39 behavior. Emits
      #      the `.rkyv.json` form; build.rs's `source.with_extension("json")` branch
      #      compresses it into the embedded rkyv+zstd blob.
      #
      # INERT WITHOUT THE PAT: a missing GitHub Actions secret is the empty string,
      # so the smart step explicitly tests `-z "$PRIMER_BLOB_TOKEN"` and skips the
      # download entirely when it's empty — no PAT ⇒ source=fallback ⇒ identical to
      # today. The smart step is non-fatal by construction (it never `exit 1`s on a
      # download/validation miss; it just records source=fallback), so a private-repo
      # outage or a revoked token degrades to the public path rather than failing the
      # release.
      - name: Try smart primer blob (private repo, token-gated)
        id: smart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIMER_BLOB_TOKEN }}
        run: |
          # Default: fall back to public-generate. Only flips to "smart" on a fully
          # validated download. Never exits non-zero — a miss must downgrade, not
          # fail the release.
          echo "source=fallback" >> "$GITHUB_OUTPUT"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PRIMER_BLOB_TOKEN absent (empty secret) — using public-generate fallback (current 0.0.38/0.0.39 behavior)."
            exit 0
          fi

          schema=$(grep -E '^const PRIMER_DATA_SCHEMA: u32 = [0-9]+;' \
            vendor/aube/crates/aube-resolver/build.rs | awk -F'= ' '{print $2}' | tr -d ';')
          if [ -z "$schema" ]; then
            echo "::warning::could not parse PRIMER_DATA_SCHEMA — using public-generate fallback"
            exit 0
          fi

          dir="vendor/aube/crates/aube-resolver/data"
          mkdir -p "$dir"
          tmp="$(mktemp -d)"

          # Pull the rolling latest-s${schema} pointer, matching ONLY blobs whose
          # filename schema matches what build.rs expects. A schema mismatch (or a
          # missing pointer) downloads nothing → fallback.
          if ! gh release download "latest-s${schema}" \
                 --repo nubjs/nub-primer \
                 --pattern "primer-*-s${schema}.rkyv.zst" \
                 --dir "$tmp" --clobber; then
            echo "::warning::smart primer download failed (no token access, missing latest-s${schema}, or network) — using public-generate fallback"
            exit 0
          fi

          blob="$(find "$tmp" -maxdepth 1 -name "primer-*-s${schema}.rkyv.zst" 2>/dev/null | head -1)"
          if [ -z "$blob" ] || [ ! -s "$blob" ]; then
            echo "::warning::smart primer download produced no non-empty -s${schema} blob — using public-generate fallback"
            exit 0
          fi
          if ! zstd -t "$blob" 2>/dev/null; then
            echo "::warning::smart primer blob failed zstd validation — using public-generate fallback"
            exit 0
          fi

          # Rename into the build-expected on-disk name for THIS TOP/CAP/schema so
          # the consumers' build.rs reads it directly (the .rkyv.zst branch).
          out="$dir/primer-top${AUBE_PRIMER_TOP}-v${AUBE_PRIMER_VERSION_CAP}-s${schema}.rkyv.zst"
          mv "$blob" "$out"
          bytes=$(wc -c < "$out")
          echo "✓ smart primer: $(basename "$out") is $bytes bytes (private nubjs/nub-primer latest-s${schema})"
          echo "source=smart" >> "$GITHUB_OUTPUT"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      # The smart blob contains only metadata, so it still needs the exact popular
      # name list that AUBE_REQUIRE_PRIMER=1 makes build.rs require. The generator's
      # names-only mode reuses its public-source fetch/parser/retry path without
      # fetching packuments. The public fallback below writes both files in one pass.
      - name: Generate popular package names (smart metadata primer)
        if: steps.smart.outputs.source == 'smart'
        shell: bash
        run: |
          cd vendor/aube
          popular_out="crates/aube-resolver/data/popular-top100000-v1.json"
          attempt=0
          until node scripts/generate-primer.mjs \
                  --popular-names-only \
                  --popular-names-out "$popular_out"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::generate-primer.mjs could not generate validated popular names after $attempt attempts"
              exit 1
            fi
            echo "--- popular-name generation attempt $attempt failed; retrying in 30s ---"
            sleep 30
          done

      # Public-registry fallback. Runs only when the smart blob was not adopted
      # (token absent, download failed, or validation failed), retries the whole
      # generation, and emits both the metadata `.rkyv.json` build.rs compresses
      # and the exactly-100000-name list build.rs embeds under the require guard.
      - name: Generate metadata primer (public fallback)
        id: primer
        if: steps.smart.outputs.source != 'smart'
        shell: bash
        run: |
          cd vendor/aube
          schema=$(grep -E '^const PRIMER_DATA_SCHEMA: u32 = [0-9]+;' \
            crates/aube-resolver/build.rs | awk -F'= ' '{print $2}' | tr -d ';')
          if [ -z "$schema" ]; then
            echo "::error::failed to parse PRIMER_DATA_SCHEMA from vendor/aube/crates/aube-resolver/build.rs"
            exit 1
          fi
          out="crates/aube-resolver/data/primer-top${AUBE_PRIMER_TOP}-v${AUBE_PRIMER_VERSION_CAP}-s${schema}.rkyv.json"
          popular_out="crates/aube-resolver/data/popular-top100000-v1.json"
          attempt=0
          until node scripts/generate-primer.mjs \
                  --top "$AUBE_PRIMER_TOP" \
                  --versions "$AUBE_PRIMER_VERSION_CAP" \
                  --out "$out" \
                  --popular-names-out "$popular_out"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::generate-primer.mjs failed after $attempt attempts"
              exit 1
            fi
            echo "--- generate attempt $attempt failed; retrying in 30s ---"
            sleep 30
          done
          # Fail loud here too (don't wait for build.rs): a syntactically-valid but
          # empty/near-empty primer must never reach the builds under the require guard.
          bytes=$(wc -c < "$out")
          if [ "$bytes" -lt 100000 ]; then
            echo "::error::generated primer is suspiciously small ($bytes bytes) — refusing to ship a degraded primer"
            exit 1
          fi
          echo "primer $out is $bytes bytes"
          echo "path=vendor/aube/$out" >> "$GITHUB_OUTPUT"
      # The typosquat corpus, which is a SEPARATE artifact from the primer and is
      # required by build.rs whenever AUBE_REQUIRE_PRIMER=1 (which the build job
      # sets) — without it every build job dies in write_popular_names_blob with
      # "popular package names are required". It has to be its own step because
      # the smart-blob path above never runs generate-primer.mjs at all, so
      # hanging --popular-names-out off the public fallback (as upstream aube
      # does, .github/workflows/release.yml there) would leave the smart path
      # short. `--top 1` is the cheapest way to reach the script's popular-names
      # branch — one packument — and its primer output is discarded outside data/
      # so it can never be mistaken for the real blob.
      #
      # This file is what makes the corpus DOWNLOAD-RANKED rather than the
      # alphabetical metadata-primer fallback, which is the condition
      # aube_resolver::popular_package_names_are_ranked() reports and the
      # similar-name gate refuses to run without.
      - name: Generate typosquat popularity corpus
        shell: bash
        run: |
          cd vendor/aube
          attempt=0
          until node scripts/generate-primer.mjs \
                  --top 1 \
                  --out "$RUNNER_TEMP/primer-discard.json" \
                  --popular-names-out crates/aube-resolver/data/popular-top100000-v1.json; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::generate-primer.mjs failed to produce the popularity corpus after $attempt attempts"
              exit 1
            fi
            echo "--- popularity-corpus attempt $attempt failed; retrying in 30s ---"
            sleep 30
          done
          bytes=$(wc -c < crates/aube-resolver/data/popular-top100000-v1.json)
          echo "popularity corpus is $bytes bytes"
      # Upload whichever source won, plus the popularity corpus. Exactly ONE
      # primer-* file exists in data/ at this point (smart .rkyv.zst XOR public
      # .rkyv.json), both named for the build-expected TOP/CAP/schema; the glob
      # captures it. The downstream build job downloads this artifact into the same
      # data/ dir, so build.rs picks both files up directly. `if-no-files-found:
      # error` keeps the empty-primer guard: a missing file here (both sources
      # failed) fails the release loud rather than shipping an empty primer.

      # Verify the exact two-file artifact contract before upload. `if-no-files-found`
      # only rejects an empty glob set, so it cannot prove the popular-name file is
      # present when a metadata primer exists.
      - name: Gate metadata primer artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/aube
          shopt -s nullglob
          primers=(crates/aube-resolver/data/primer-*-s*.rkyv.zst crates/aube-resolver/data/primer-*-s*.rkyv.json)
          if [ "${#primers[@]}" -ne 1 ]; then
            echo "::error::expected exactly one metadata primer file, found ${#primers[@]}"
            printf '%s\n' "${primers[@]}"
            exit 1
          fi
          node - crates/aube-resolver/data/popular-top100000-v1.json <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const names = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(names) || names.length !== 100000 || names.some((name) => typeof name !== 'string' || !name || /[\u0009-\u000d\u0020]/.test(name)) || new Set(names).size !== 100000) {
            throw new Error(`${path} must contain exactly 100000 unique names without ASCII whitespace`);
          }
          NODE

      # Upload whichever metadata source won plus the validated popular-name list.
      # Exactly ONE primer-* file exists in data/ at this point (smart .rkyv.zst XOR
      # public .rkyv.json), both named for the build-expected TOP/CAP/schema; the
      # glob captures it. The downstream build job downloads both into the same data/
      # dir, so build.rs picks them up directly. `if-no-files-found: error` keeps the
      # require guard intact: a missing metadata or popular-name file fails the
      # release loud rather than shipping a degraded primer.
      - name: Upload metadata primer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: metadata-primer
          path: |
            vendor/aube/crates/aube-resolver/data/primer-*-s*.rkyv.*
            vendor/aube/crates/aube-resolver/data/popular-top100000-v1.json
          if-no-files-found: error

  test:
    name: Test gate (cargo test)
    needs: verify
    # Tag + stable-dispatch only. Canary runs skip this gate: ci.yml runs the
    # same suite on the same commit, and the canary contract is "newest main,
    # built and installable" — a broken canary is what canary means, and
    # doubling the test run per nightly only burns the shared runner pool.
    if: ${{ needs.verify.outputs.is_canary != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No release without a green `cargo test` (fast unit + integration suite).
      # `publish` needs this job, so a broken fast suite blocks the release (the
      # binaries still build, but nothing is published).
      #
      # The heavyweight Node-suite compat corpus is intentionally NOT in this
      # publish gate: it reproducibly exhausts the GitHub runner at parallel
      # fan-out (regressed during the 2026-06 repo move; tracked separately), and
      # its CI job was removed on 2026-06-03 (see ci.yml). Its two tests are
      # #[ignore]d, so a plain `cargo test` never reads tests/node-suite and the
      # submodule is left unpopulated here.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 # zizmor: ignore[cache-poisoning] test gate only; objects compiled here never reach published artifacts
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] test gate only; node_modules here only feed cargo test
        with:
          node-version: "24"
      # The root is nub-identity (nub.lock), so nub installs its own deps. The
      # release workflow deliberately uses the nub it BUILDS, never a published
      # one: bootstrapping a release from the last release means a broken
      # release wedges the very workflow that would publish the fix. The debug
      # build is nearly free here because `cargo test` below compiles the same
      # crates in the same profile.
      - name: Install JS dependencies with the nub built here
        run: |
          cargo build -p nub-cli
          ./target/debug/nub install --frozen-lockfile --node-linker hoisted
      # The data-format loader tests (data_format_loaders, and the env-* tests whose
      # fixture imports a .json5/.yaml file) need the nub-native addon — the npm
      # parser fallback (yaml/@iarna/toml/json5) isn't a dev dependency, so without
      # the addon those tests fail with "requires the yaml package". Build + place it
      # so the test job exercises the real loaders. (linux-x64-glibc runner = native.)
      - name: Build nub-native addon (for data-format loader tests)
        run: |
          # nub-native is its own workspace (panic=unwind cdylib); build from inside the crate.
          (cd crates/nub-native && cargo build --release)
          mkdir -p runtime/addons
          cp target/release/libnub_native.so runtime/addons/nub-native.node
      - run: cargo test

  conformance:
    name: Lockfile conformance gate (real PMs)
    needs: verify
    # Tag + stable-dispatch only — same rationale as the `test` gate above: the
    # aube-parity workflow covers main, and canary doesn't re-gate.
    if: ${{ needs.verify.outputs.is_canary != 'true' }}
    # The lockfile-compat regression gate that 0.0.35/0.0.36 slipped through:
    # those releases shipped with the conformance suite RED because publish only
    # gated on the fast `test:` job, and the conformance/daily-driver/native-dep
    # suites live in SEPARATE workflows (aube-parity.yml, …) that don't gate the
    # release. This reproduces tests/aube-conformance/run.sh — nub writes each
    # foreign lockfile format in a hermetic sandbox and the REAL pinned package
    # manager judges it (pnpm/npm frozen-accept + zero-churn rewrite, bun
    # frozen-accept, yarn-mutation refusal, the nub round-trip) — and `publish`
    # `needs:` it, so a lockfile-compat regression now blocks the release.
    #
    # Its OWN serial job (needs: verify only — NOT folded into the build matrix),
    # deliberately, to avoid the runner-exhaustion the `test:` gate's comment
    # warns about: this is one real-registry install matrix, run once on ubuntu,
    # not fanned out across the 8 platform runners. Mirrors the aube-conformance
    # job in aube-parity.yml (same setup: nub-cli build + pinned pnpm/npm via npx
    # + pinned bun). Known-red scenarios live in expected-failures.txt and must
    # shrink — a stale entry fails the job. The addon is NOT needed here: the
    # harness exercises the PM engine (install/add/pm use), not the data-format
    # loaders.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 # zizmor: ignore[cache-poisoning] conformance gate; the debug binary built here is exercised, not published
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] conformance gate; nothing built here is published
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2 # zizmor: ignore[cache-poisoning] bun only judges lockfiles in the conformance gate; nothing published
        with:
          # Keep in sync with BUN_PIN in tests/aube-conformance/run.sh.
          bun-version: "1.3.14"
      - name: Build nub
        run: cargo build -p nub-cli
      - name: Run lockfile conformance matrix
        run: tests/aube-conformance/run.sh target/debug/nub

  build:
    name: Build (${{ matrix.platform }})
    needs: [verify, primer]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Primer embed (see the `primer` job + the "Download metadata primer" step):
    # TOP/CAP select which downloaded primer-top{TOP}-v{CAP}-s<schema> file
    # vendor/aube's build.rs embeds; AUBE_REQUIRE_PRIMER=1 makes build.rs FAIL LOUD
    # on an empty/missing primer instead of silently shipping write_package_blob(&[])
    # (the 0.0.37 bug). For the cross targets these are forwarded into the cross
    # Docker container by the root Cross.toml passthrough — without that entry the
    # require guard never fires inside the container. Scoped to this job (not the
    # workflow env) so the test/conformance jobs stay off the registry critical path.
    env:
      AUBE_PRIMER_TOP: "2000"
      AUBE_PRIMER_VERSION_CAP: "100"
      AUBE_REQUIRE_PRIMER: "1"
    strategy:
      fail-fast: false
      # Built as data by the `verify` job so a linux_only debug dispatch can drop the
      # expensive macOS/Windows runners (see that job's "Compute build matrix" step).
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # Pull the metadata primer generated ONCE by the `primer` job into the dir
      # vendor/aube/crates/aube-resolver/build.rs reads. It lands as the
      # `primer-top{TOP}-v{CAP}-s<schema>.rkyv.json` file build.rs's
      # `source.with_extension("json")` branch compresses+embeds — so EVERY
      # platform (including the node-LESS cross containers for musl/arm) embeds
      # the real primer instead of the empty fallback. With AUBE_REQUIRE_PRIMER=1
      # (workflow env), a missing artifact here fails the build loud rather than
      # silently shipping an empty primer (the 0.0.37 bug).
      #
      # The same artifact carries `popular-top100000-v1.json`, the download-ranked
      # typosquat corpus. build.rs treats it as mandatory under the require guard,
      # so it is not optional decoration: without it every build job here fails.
      - name: Download metadata primer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: metadata-primer
          path: vendor/aube/crates/aube-resolver/data

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 # zizmor: ignore[cache-poisoning] tag runs restore only caches saved by main/tag runs (PR caches are branch-isolated), so seeding requires push access
        with:
          key: ${{ matrix.platform }}
          # nub-launcher is its own workspace with its own target dir, so the default
          # `. -> target` alone would leave its build (nub-core's whole dep graph under
          # fat LTO) uncached. Kept as a SEPARATE target dir, not merged into the root
          # one: the two workspaces set different `release` profile settings, so
          # sharing a dir makes each build invalidate the other's fingerprints.
          workspaces: |
            . -> target
            crates/nub-launcher -> target

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] tag runs restore only caches saved by main/tag runs (PR caches are branch-isolated), so seeding requires push access
        with:
          node-version: "24"

      # These deps are staged into the embedded runtime, so they must exist
      # before the release binary is built — but the publish path must never
      # bootstrap from a PUBLISHED nub, or a broken release wedges the workflow
      # that would publish its fix. So build a HOST nub first and install with
      # it. Host, not `matrix.target`: this binary is a build tool that runs on
      # the runner, never an artifact, so a cross leg still builds it natively.
      # `hoisted` keeps node_modules real directories for the staging below.
      #
      # No store cache here, deliberately: caching rides on the `./setup` action,
      # and using it would put a PUBLISHED nub on this job — the one thing the
      # publish path must not depend on. The root is six direct dependencies, so
      # a cold install costs seconds against a build measured in minutes.
      - name: Install JS dependencies with a host nub built here
        run: |
          cargo build -p nub-cli
          ./target/debug/nub install --frozen-lockfile --node-linker hoisted

      # Canary builds self-report the canary version: `--version` is asserted by
      # the pre-publish gate and NUB_VERSION keys the transpile cache, so every
      # version surface must carry the canary string BEFORE the addon + binary
      # builds embed it. Stamped locally on the runner, never committed. Plain
      # node (not `make version`) because the Windows runners can't be trusted
      # to have make. The script itself stamps the two out-of-workspace lockfiles,
      # which is load-bearing here rather than tidy: the launcher build below runs
      # `--locked` in THIS job, and `--locked` refuses to reconcile a lock rather
      # than doing it, so a stamp that skipped them failed all eight targets.
      - name: Stamp canary version (uncommitted)
        if: needs.verify.outputs.is_canary == 'true'
        shell: bash
        env:
          CANARY_VERSION: ${{ needs.verify.outputs.canary_version }}
        run: node scripts/set-version.mjs "$CANARY_VERSION"

      - name: Install cross
        if: matrix.cross
        # Pinned to a released version (cached binary build) instead of
        # `--git` (a from-source rebuild of cross on every cross-target job).
        run: cargo install cross --version 0.2.5 --locked

      # SINGLE-BINARY EMBED — the runtime now ships INSIDE the binary. Stage the
      # runtime (per-platform addon + the os/cpu-agnostic vendored node_modules)
      # into the repo's runtime/ BEFORE building nub-cli, so nub-core's build.rs
      # tars + zstd-19-compresses it and `include_bytes!`-embeds it into THIS
      # platform's binary. build.rs reads <repo>/runtime by default, so the staging
      # location needs no env override (and so it works inside the cross containers,
      # which mount the project — no AUBE_*-style passthrough needed).
      - name: Build + stage nub-native addon (embedded into the binary)
        env:
          MATRIX_CROSS: ${{ matrix.cross }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          CMD="cargo"; [ "$MATRIX_CROSS" = "true" ] && CMD="cross"
          case "$MATRIX_TARGET" in
            *-musl)
              # musl's default crt-static can't produce a cdylib (a .node is a
              # dynamic lib); disable it for the ADDON only so it builds dynamic.
              # The static nub BINARY (built below) is untouched. napi-rs's canonical
              # musl recipe (what oxc/swc ship); the crate-local Cross.toml carries
              # the RUSTFLAGS passthrough into the cross container.
              (cd crates/nub-native && RUSTFLAGS="-C target-feature=-crt-static" $CMD build --release --target "$MATRIX_TARGET")
              ;;
            *)
              (cd crates/nub-native && $CMD build --release --target "$MATRIX_TARGET")
              ;;
          esac
          mkdir -p runtime/addons
          if [[ "$MATRIX_PLATFORM" == win32-* ]]; then
            cp "target/$MATRIX_TARGET/release/nub_native.dll" runtime/addons/nub-native.node
          elif [[ "$MATRIX_PLATFORM" == darwin-* ]]; then
            cp "target/$MATRIX_TARGET/release/libnub_native.dylib" runtime/addons/nub-native.node
          else
            cp "target/$MATRIX_TARGET/release/libnub_native.so" runtime/addons/nub-native.node
          fi
          # The addon is MANDATORY — if it didn't build, it would be silently absent
          # from the embedded runtime and the data-format loaders would be dead. Gate
          # it here, BEFORE the binary build embeds the staged tree.
          test -f runtime/addons/nub-native.node \
            || { echo "::error::missing nub-native.node for $MATRIX_PLATFORM — the addon didn't build; it would be absent from the embedded runtime. Fix the addon build before releasing."; exit 1; }
        shell: bash

      - name: Stage vendored runtime node_modules (embedded into the binary)
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] the npm install below is pinned to the exact root-lock-installed versions (read via ver()); --no-save vendoring is the point
          # Vendor the pure-JS runtime deps into runtime/node_modules at the EXACT
          # versions installed in the workspace (so a shipped nub's transpile output
          # is byte-identical to dev's). Read versions by relative-FILE require from
          # the workspace root (cwd), which is Windows-safe and bypasses package
          # `exports` (modern packages don't export ./package.json). Only the deps the
          # EMITTED code / JS runtime need are vendored: @oxc-project/runtime (helper
          # imports) + the web-API polyfills; oxc itself is compiled into the addon.
          ver() { node -p "require('./node_modules/$1/package.json').version"; }
          OXCRT_VERSION=$(ver @oxc-project/runtime)
          URLP_VERSION=$(ver urlpattern-polyfill)
          TEMPORAL_VERSION=$(ver @js-temporal/polyfill)
          FLOAT16_VERSION=$(ver @petamoriken/float16)
          JSBI_VERSION=$(ver jsbi)
          rm -rf runtime/node_modules
          mkdir -p runtime/node_modules
          cd runtime
          npm init -y > /dev/null 2>&1
          # SINGLE install — a second --no-save install would prune the first as
          # "extraneous" (the 0.0.7 breakage). Keep it one call.
          npm install --no-save \
            "@oxc-project/runtime@$OXCRT_VERSION" \
            "urlpattern-polyfill@$URLP_VERSION" \
            "@js-temporal/polyfill@$TEMPORAL_VERSION" \
            "@petamoriken/float16@$FLOAT16_VERSION" \
            "jsbi@$JSBI_VERSION" \
            2>&1 | tail -8
          # npm's hidden lockfile is installer bookkeeping rather than a runtime
          # dependency. Do not embed it: its format may change across npm versions.
          rm -f node_modules/.package-lock.json
          rm -f package.json package-lock.json
          cd "$GITHUB_WORKSPACE"
          EXPECTED_PACKAGES=(
            "@oxc-project/runtime"
            "urlpattern-polyfill"
            "@js-temporal/polyfill"
            "@petamoriken/float16"
            "jsbi"
          )
          for d in "${EXPECTED_PACKAGES[@]}"; do
            ROOT_VERSION=$(node -p "require('./node_modules/$d/package.json').version")
            RUNTIME_VERSION=$(node -p "require('./runtime/node_modules/$d/package.json').version")
            [ "$RUNTIME_VERSION" = "$ROOT_VERSION" ] \
              || { echo "::error::vendored $d version $RUNTIME_VERSION does not match workspace version $ROOT_VERSION"; exit 1; }
          done
          if ! diff -u \
            <(printf '%s\n' "${EXPECTED_PACKAGES[@]}" | LC_ALL=C sort) \
            <(for manifest in runtime/node_modules/*/package.json runtime/node_modules/@*/*/package.json; do
                [ -f "$manifest" ] || continue
                node -p "require('./$manifest').name"
              done | LC_ALL=C sort -u); then
            echo "::error::runtime/node_modules contains packages outside the pinned runtime dependency set"
            exit 1
          fi
          if [ -e runtime/node_modules/.package-lock.json ]; then
            echo "::error::runtime/node_modules/.package-lock.json must not be embedded"
            exit 1
          fi

      # `compile` rides along with `embed-runtime`: the two feature lists are
      # disjoint (embed-runtime forwards to nub-core; compile adds Rolldown +
      # libsui + zstd + the oxc parser subset), and without it the shipped binary
      # has no `nub compile` verb at all. It is a COMPILE-TIME-only dep set — it
      # costs release build minutes, not runtime behavior.
      - name: Build binary (embeds the staged runtime)
        env:
          MATRIX_CROSS: ${{ matrix.cross }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          # Windows ships with a STATIC MSVC C runtime. Rust's msvc targets link it
          # dynamically by default, which put VCRUNTIME140.dll and VCRUNTIME140_1.dll in
          # nub.exe's import table — and on a clean Windows Server 2022 the binary then
          # died at 0xC0000135 (STATUS_DLL_NOT_FOUND) with EMPTY stderr, because the
          # loader kills the process before any code exists to report the failure.
          # Installing the VC++ redistributable fixed it with one variable changed;
          # busybox.exe, which imports only msvcrt.dll, ran on the same box as a control.
          # Most Windows 10/11 desktops carry that redistributable incidentally, so this
          # is invisible until someone installs on a clean Server or a fresh image.
          #
          # Applied HERE, per-target, rather than in a `.cargo/config.toml`: cargo
          # CONCATENATES rustflags from every config file up the directory tree, and
          # `+crt-static` is STICKY (a later `-crt-static` cannot undo it, in either
          # order, with no warning). A root config would therefore reach
          # crates/nub-native — a cdylib loaded into the user's node.exe, which must keep
          # the dynamic CRT or it gets a private heap and cross-boundary allocations
          # become memory corruption — with no way to opt back out. The launcher pins its
          # own linkage in crates/nub-launcher/.cargo/config.toml, which is safe because
          # nothing beneath that directory is a cdylib.
          case "$MATRIX_TARGET" in
            *-pc-windows-msvc) export RUSTFLAGS="-C target-feature=+crt-static" ;;
          esac
          if [ "$MATRIX_CROSS" = "true" ]; then
            cross build --release -p nub-cli --features embed-runtime,compile --target "$MATRIX_TARGET"
          else
            cargo build --release -p nub-cli --features embed-runtime,compile --target "$MATRIX_TARGET"
          fi
        shell: bash

      # The runtime half of `nub compile`: the per-triple template the compile-time
      # pipeline copies and injects a payload into. Built from inside the crate (its
      # OWN workspace, excluded at the root Cargo.toml, so `-p nub-launcher` cannot
      # see it) — the same `cd`-first shape as the nub-native addon above, and it
      # inherits that shape's hazard: `cross` mounts only this workspace and its path
      # deps, so crates/nub-core's manifest must parse WITHOUT the repo-root
      # manifest. That is why nub-core is self-contained; see the note atop
      # crates/nub-core/Cargo.toml before reintroducing any `.workspace = true` there.
      - name: Build nub-launcher template
        env:
          MATRIX_CROSS: ${{ matrix.cross }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          CMD="cargo"; [ "$MATRIX_CROSS" = "true" ] && CMD="cross"
          (cd crates/nub-launcher && $CMD build --locked --release --target "$MATRIX_TARGET")
        shell: bash

      # CI GATE: the built binary must embed a NON-EMPTY metadata primer.
      # vendor/aube's build.rs generates a PRIMER_INDEX of package-NAME string
      # literals (crates/aube-resolver/src/primer.rs `include!`s it and references
      # it at runtime, so the names survive release stripping in the binary's
      # rodata). An EMPTY primer => empty index => none of these names are present.
      # This is exactly the 0.0.37 failure (cross containers shipped write_package_blob(&[]));
      # this gate would have caught it. It mirrors the addon-presence gate in the
      # assemble step and runs per-target, so a degraded cross build fails HERE
      # rather than silently shipping. (Enabling this BEFORE the artifact-share fix
      # would correctly fail the cross builds — it lands together with the fix.)
      - name: Gate — binary embeds a non-empty primer
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          case "$MATRIX_PLATFORM" in
            win32-*) BIN="target/$MATRIX_TARGET/release/nub.exe" ;;
            *)       BIN="target/$MATRIX_TARGET/release/nub" ;;
          esac
          # A handful of packages near-certain to be in any "top npm packages"
          # primer; require at least one to be embedded as a string literal in the
          # binary's rodata (the PRIMER_INDEX names survive release stripping). An
          # EMPTY primer => empty index => none present. `grep -a` scans the binary
          # as text, so this needs no `strings` binary (not guaranteed on the
          # Windows runner). The patterns are distinctive enough not to collide
          # with unrelated rodata.
          # `typescript` and `@types/node` are NOT usable markers: crates/nub-cli/src/init.rs
          # writes both literals into the `nub init` scaffold, so they sit in every
          # binary's rodata whether the primer has 100 000 entries or zero — which
          # is precisely the bug this gate exists to catch.
          if grep -aqE 'react-dom|@babel/core' "$BIN"; then
            echo "✓ $MATRIX_PLATFORM: binary embeds a non-empty primer"
          else
            echo "::error::$MATRIX_PLATFORM: binary does NOT embed a populated primer — the primer index is empty (the 0.0.37 cross-build bug). The 'Download metadata primer' step or the AUBE_* cross passthrough is broken."
            exit 1
          fi

      - name: Assemble platform package (single binary — bin/ only)
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          # The runtime is EMBEDDED in the binary (staged + built above), so the
          # platform package ships ONLY bin/ — no runtime/ sidecar. And ONE binary,
          # not two: the launcher passes the verb in `__NUB_ARGV0` rather than relying
          # on a separately-named `nubx` file (npm/nub/bin/launch.js,
          # Argv0::capture_argv0_override). This is what keeps every platform package
          # under cnpm/npmmirror's 80 MiB sync cap, and it halves the release archive
          # too — the archive is tarred from THIS directory further down.
          PKG="npm/nub-$MATRIX_PLATFORM"
          EXE=""; [[ "$MATRIX_PLATFORM" == win32-* ]] && EXE=".exe"
          mkdir -p "$PKG/bin"
          if [[ "$MATRIX_PLATFORM" == win32-* ]]; then
            cp "target/$MATRIX_TARGET/release/nub.exe" "$PKG/bin/nub.exe"
            # Bundle the arch-appropriate busybox-w32 POSIX-sh sidecar next to
            # nub.exe (nub's Windows script shell — see vendor/busybox-w32/README.md
            # and crates/nub-cli/src/cli.rs resolve_bundled_busybox). Verify the
            # vendored bytes against upstream's published SHA-256 before shipping —
            # a mismatch means the vendored binary drifted and MUST block the release.
            case "$MATRIX_PLATFORM" in
              win32-x64)   SRC=vendor/busybox-w32/busybox64.exe;  SHA=07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075 ;;
              win32-arm64) SRC=vendor/busybox-w32/busybox64a.exe; SHA=e67f873d19d58c535cc9f0c4965ffd622e19b7bab87e3da89cb2185fb54464d7 ;;
            esac
            echo "$SHA  $SRC" | sha256sum -c - \
              || { echo "::error::vendored busybox ($SRC) failed its pinned SHA-256 — refusing to ship a drifted shell binary"; exit 1; }
            cp "$SRC" "$PKG/bin/busybox.exe"
          else
            cp "target/$MATRIX_TARGET/release/nub" "$PKG/bin/nub"
            chmod +x "$PKG/bin/nub"
          fi
          # The template ships NEXT TO nub under the exact name
          # compile::launcher::locate looks for — that sibling relationship is
          # the distribution contract, and it carries the template through every
          # channel for free: the npm platform package ships all of bin/
          # (`files: ["bin"]`), and github-release tars this same bin/ for install.sh
          # / install.ps1 / `nub upgrade`. No +x: it is data to be injected into, not
          # a command.
          LAUNCHER="crates/nub-launcher/target/$MATRIX_TARGET/release/nub-launcher$EXE"
          test -f "$LAUNCHER" \
            || { echo "::error::missing nub-launcher template for $MATRIX_PLATFORM at $LAUNCHER — 'nub compile' would ship unable to find its launcher on this platform."; exit 1; }
          cp "$LAUNCHER" "$PKG/bin/nub-launcher-$MATRIX_PLATFORM$EXE"
          # Test-only copy for the native pre-publish compile gate. The artifact
          # carries it between jobs, but platform npm manifests publish only bin/
          # and GitHub release archives explicitly package only bin/ + runtime/,
          # so this path never reaches a distribution channel.
          mkdir -p "$PKG/test"
          cp runtime/addons/nub-native.node "$PKG/test/compile-native.node"

      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nub-${{ matrix.platform }}
          path: npm/nub-${{ matrix.platform }}

      - name: Assemble loader platform package (addon only)
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          # The standalone loader (npm/loader) ships the SAME nub-native addon
          # staged above, as its own per-platform package — the addon is the only
          # platform-specific part of the loader; its JS is a verbatim slice of
          # runtime/ that the publish job stages once (scripts/build-loader-npm.mjs).
          cp runtime/addons/nub-native.node "npm/loader-$MATRIX_PLATFORM/nub-native.node"

      - name: Upload loader platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: loader-${{ matrix.platform }}
          path: npm/loader-${{ matrix.platform }}

  glibc-floor-guard:
    # The real glibc-floor gate. test-install runs on glibc-2.39 hosts and would
    # NOT catch a floor regression (0.0.44 shipped a GLIBC_2.39-requiring
    # linux-x64 binary that failed on every node:*-slim — Debian bookworm =
    # glibc 2.36 — and CI stayed green). This leg runs the FRESHLY-BUILT
    # linux-x64 artifact (NOT the published package — it gates BEFORE publish)
    # inside node:22-slim (bookworm / glibc 2.36) and asserts `nub --version`
    # exits 0. A binary linked against a glibc newer than 2.36 fails the dynamic
    # link here with the exact "GLIBC_2.xx not found" error a slim-image user
    # would hit, blocking the release. `publish` needs: this job.
    name: glibc floor guard (node:22-slim)
    needs: build
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - name: Download linux-x64 platform package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: nub-linux-x64
          path: nub-linux-x64
      - name: Run the freshly-built binary on bookworm (glibc 2.36)
        shell: bash
        run: |
          echo "=== environment ==="
          echo "libc: $(ldd --version 2>&1 | head -1)"
          BIN="nub-linux-x64/bin/nub"
          # The upload→download artifact round-trip strips the +x mode bit (binaries
          # arrive at 0644), so re-apply it before exec.
          chmod +x "$BIN"
          # The load-bearing assertion: if the binary links a glibc newer than
          # bookworm's 2.36, this exec fails with "GLIBC_2.xx not found" and the
          # job goes red — exactly the floor regression test-install can't see.
          if ! "$BIN" --version; then
            echo "::error::linux-x64 binary failed to run on node:22-slim (Debian bookworm, glibc 2.36) — a glibc-floor regression. The binary requires a newer glibc than slim images provide. Confirm the linux-x64 matrix leg builds on ubuntu-22.04 (glibc 2.35)."
            exit 1
          fi
          echo "✓ linux-x64 binary runs on bookworm/glibc-2.36 — floor is low enough for slim images"

  pre-publish-gate:
    # Smoke the FRESHLY-BUILT artifacts BEFORE anything is published, so a broken
    # build (one that builds + links but can't actually run / reports the wrong
    # version) FAILS THE RELEASE here instead of after npm has the bits. Distinct
    # from glibc-floor-guard (which proves the linux-x64 binary *links* on an old
    # glibc): this gate proves each binary RUNS on its NATIVE platform and self-
    # reports the EXACT release version, asserting `nub --version` == the tag.
    # `publish-npm` needs: this whole matrix, so a version-mismatch or non-runnable
    # binary on ANY hosted-runner platform blocks publish.
    #
    # MATRIX coverage is all 8 published targets, each executing its own packaged
    # binary natively before publication:
    #     linux-x64       (ubuntu-latest)
    #     linux-arm64     (ubuntu-24.04-arm)
    #     linux-x64-musl  (node:22-alpine on ubuntu-latest)
    #     linux-arm64-musl (multiarch node:22-alpine on ubuntu-24.04-arm)
    #     darwin-arm64    (macos-14)
    #     darwin-x64      (macos-15-intel)
    #     win32-x64       (windows-latest)
    #     win32-arm64     (windows-11-arm)
    # GitHub currently lists its standard Linux/Windows arm64 labels as public
    # preview. They remain release gates; preview capacity is an infrastructure
    # caveat, not a reason to publish an unexecuted target. GitHub has announced
    # `macos-15-intel` availability through August 2027, so that label will need
    # replacement when GitHub retires hosted Intel macOS.
    # Each leg downloads only ITS platform artifact, checks the packaged CLI,
    # then compiles + executes both supported artifact shapes. The default shape
    # runs cold and warm from an isolated runtime cache with no host Node on PATH.
    name: Pre-publish smoke gate (${{ matrix.platform }})
    if: ${{ github.event_name == 'push' || inputs.publish || needs.verify.outputs.is_canary == 'true' }}
    # verify supplies the expected canary version on canary runs.
    needs: [verify, build]
    # actions:read is for the container legs' REST artifact download below —
    # the JS download-artifact action cannot run at all in an Alpine container
    # on an arm64 runner ("JavaScript Actions in Alpine containers are only
    # supported on x64 Linux runners"), so those legs fetch the artifact with
    # curl against the artifacts API instead.
    permissions:
      actions: read
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            bin: bin/nub
            expected_platform: linux
            expected_arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            bin: bin/nub
            expected_platform: linux
            expected_arch: arm64
          - platform: linux-x64-musl
            runner: ubuntu-latest
            container: node:22-alpine
            bin: bin/nub
            expected_platform: linux
            expected_arch: x64
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            container: node:22-alpine
            bin: bin/nub
            expected_platform: linux
            expected_arch: arm64
          - platform: darwin-arm64
            runner: macos-14
            bin: bin/nub
            expected_platform: darwin
            expected_arch: arm64
          - platform: darwin-x64
            runner: macos-15-intel
            bin: bin/nub
            expected_platform: darwin
            expected_arch: x64
          - platform: win32-x64
            runner: windows-latest
            bin: bin/nub.exe
            expected_platform: win32
            expected_arch: x64
          - platform: win32-arm64
            runner: windows-11-arm
            bin: bin/nub.exe
            expected_platform: win32
            expected_arch: arm64
    steps:
      # The alpine container is toolchain-bare: bash for the smoke shell below.
      - name: Toolchain (bash, musl container only)
        if: ${{ matrix.container != '' }}
        run: apk add --no-cache bash curl jq unzip
      - name: Download ${{ matrix.platform }} platform package
        if: ${{ matrix.container == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: nub-${{ matrix.platform }}
          path: nub-pkg
      # The container legs cannot use the JS action (Alpine + arm64 runner), so
      # they pull the same artifact through the REST API. v4 artifacts are
      # downloadable while the run is still in progress.
      - name: Download ${{ matrix.platform }} platform package (container legs)
        if: ${{ matrix.container != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: nub-${{ matrix.platform }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          id="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" | jq -r '.artifacts[0].id // empty')"
          if [ -z "$id" ]; then
            echo "::error::artifact $ARTIFACT_NAME not found in run $GITHUB_RUN_ID"
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"
          mkdir -p nub-pkg
          unzip -q /tmp/artifact.zip -d nub-pkg
      - name: Assert the built binary runs and reports the release version
        shell: bash
        env:
          # Hoisted from the run block: an expression expanding inside the
          # script is zizmor error-level template injection; env is inert.
          CANARY_VERSION: ${{ needs.verify.outputs.canary_version }}
          PUBLISH_VERSION: ${{ needs.verify.outputs.publish_version }}
          IS_CANARY: ${{ needs.verify.outputs.is_canary }}
        run: |
          set -euo pipefail
          BIN="nub-pkg/${{ matrix.bin }}"
          # The upload→download artifact round-trip strips the +x mode bit on POSIX
          # (no-op on Windows). Re-apply to both staged copies before exec.
          chmod +x "nub-pkg/bin"/* 2>/dev/null || true
          # `nub --version` prints `v<semver>` on STDOUT (print_version's
          # `println!("v{}", …)`) and an informational `» node v… (provenance)`
          # line on STDERR. Read STDOUT ONLY (drop 2>&1) so the stderr provenance
          # line doesn't contaminate the match, take the first line, then strip the
          # leading `v` so it compares apples-to-apples with the tag (which we also
          # strip the leading `v` from). Both 2>&1 + the un-stripped `v` would make
          # the equality below NEVER hold — failing every real release at this gate.
          REPORTED="$("$BIN" --version 2>/dev/null | head -1 | tr -d '[:space:]')"
          REPORTED="${REPORTED#v}"
          echo "${{ matrix.platform }} binary reports: '$REPORTED'"
          # A stable publication gets its expected version only from verify's
          # validated tag output. A canary run uses its stamped version; a
          # non-publishing dispatch only checks that the binary is runnable.
          # Select the canary expectation from IS_CANARY, never from the event
          # name: a canary arrives on `schedule` (or a dispatch), so an
          # event-name test silently drops every canary run into the
          # runnable-only branch below and publishes without ever comparing the
          # stamped version — the exact stale-build case this gate exists for.
          EXPECTED=""
          if [ -n "$PUBLISH_VERSION" ]; then
            EXPECTED="$PUBLISH_VERSION"
          elif [ "$IS_CANARY" = "true" ]; then
            EXPECTED="$CANARY_VERSION"
          fi
          if [ -n "$EXPECTED" ]; then
            if [ "$REPORTED" != "$EXPECTED" ]; then
              echo "::error::built ${{ matrix.platform }} binary reports version '$REPORTED' but this run publishes '$EXPECTED'. A broken/stale build must not publish."
              exit 1
            fi
            echo "✓ ${{ matrix.platform }} binary reports the publish version ($EXPECTED) — safe to publish"
          else
            if [ -z "$REPORTED" ]; then
              echo "::error::built ${{ matrix.platform }} binary produced no --version output — refusing to publish a non-runnable build."
              exit 1
            fi
            echo "✓ ${{ matrix.platform }} binary runs and reports version '$REPORTED' (non-publishing dispatch)"
          fi

      # A binary whose embedded runtime is missing its vendored node_modules passes
      # `--version` above AND the compile fixture below, because that fixture is plain
      # JS and never transpiles. It fails only on a file needing a transpile HELPER.
      # Before this step the earliest check that could see it was .github/scripts/
      # smoke.sh, which installs from npm — i.e. it runs AFTER publish, past the
      # irreversible step.
      #
      # A legacy decorator is the detector, and a Temporal/URLPattern/Float16Array probe
      # cannot do this job: those are native on a modern runner Node, so they answer
      # "function" on a binary whose polyfills never loaded. oxc down-levels a legacy
      # decorator on every Node version, so its helper import must resolve through the
      # extracted tree's own node_modules.
      #
      # The fixture is an ESM entry (`{"type":"module"}`) deliberately. Down-levelling is
      # version-independent, but RESOLVING the helper from a CommonJS entry is not: a CJS
      # entry whose transpiled output `require()`s an external helper is unsupported below
      # require(esm) (Node <20.19 / 22.0-22.11), which is why the repo's own
      # `legacy_decorators_require_experimental_flag` skips that shape
      # (crates/nub-cli/tests/integration.rs). This job pins no Node and inherits whatever
      # each runner image ships, so an ESM entry keeps the gate off that floor by
      # construction instead of depending on image versions. The fixture has no imports,
      # so the package.json changes nothing else.
      - name: Assert the packaged binary resolves a vendored transpile helper
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/nub-pkg/${{ matrix.bin }}"
          WORK="$RUNNER_TEMP/nub-helper-smoke-${{ matrix.platform }}"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          printf '%s\n' '{"type":"module"}' > "$WORK/package.json"
          printf '%s\n' '{"compilerOptions":{"experimentalDecorators":true,"emitDecoratorMetadata":true}}' > "$WORK/tsconfig.json"
          printf '%s\n' \
            'function tag(_t: any, _k: string, d: PropertyDescriptor) { return d; }' \
            'class Probe { @tag greet(): string { return "helper-ok"; } }' \
            'console.log(new Probe().greet());' \
            > "$WORK/helper.ts"
          if ! OUT="$(cd "$WORK" && "$BIN" helper.ts 2>&1)"; then
            echo "$OUT"
            echo "::error::${{ matrix.platform }} binary could not run a file that needs a transpile helper — see the output above. The usual cause is an embedded runtime missing its vendored node_modules; a transpile failure or an unusable runner Node lands here too. Refusing to publish."
            exit 1
          fi
          case "$OUT" in
            *helper-ok*)
              echo "✓ ${{ matrix.platform }} resolves @oxc-project/runtime from the embedded runtime"
              ;;
            *)
              echo "$OUT"
              echo "::error::${{ matrix.platform }} decorator smoke printed unexpected output"
              exit 1
              ;;
          esac

      - name: Compile and run packaged default + --smol artifacts
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          BIN="nub-pkg/${{ matrix.bin }}"
          EXE=""
          case "${{ matrix.platform }}" in
            win32-*) EXE=".exe" ;;
          esac
          # Use one exact target across both shapes. The default compile acquires
          # and embeds that official Node into an isolated compile cache. The
          # first smol run uses runner Node; Windows also exercises controlled
          # no-host provisioning below.
          NODE_VERSION="$(node --version)"
          NODE_VERSION="${NODE_VERSION#v}"
          test -n "$NODE_VERSION"             || { echo "::error::runner Node did not report a version"; exit 1; }
          WORKDIR="$RUNNER_TEMP/nub-release-compile-${{ matrix.platform }}"
          rm -rf "$WORKDIR"
          SOURCE_DIR="$WORKDIR/source"
          OUTPUT_DIR="$WORKDIR/output"
          FOREIGN_CWD="$WORKDIR/foreign-cwd"
          mkdir -p "$SOURCE_DIR" "$OUTPUT_DIR" "$FOREIGN_CWD"
          FIXTURE="$SOURCE_DIR/release-compile.js"
          MANIFEST="$SOURCE_DIR/package.json"
          DEPENDENCY="$SOURCE_DIR/dependency.js"
          INCLUDED="$SOURCE_DIR/included.txt"
          NATIVE_ADDON="$SOURCE_DIR/compile-native.node"
          FORK_CHILD="$SOURCE_DIR/fork-child.cjs"
          USER_LOADER="$SOURCE_DIR/strip-create-require-loader.mjs"
          LOADER_FIXTURE="$SOURCE_DIR/loader-compatible.mjs"
          EMBED_OUT="$OUTPUT_DIR/release-embed$EXE"
          SMOL_OUT="$OUTPUT_DIR/release-smol$EXE"
          LOADER_OUT="$OUTPUT_DIR/release-user-loader$EXE"
          COMPILE_CACHE="$WORKDIR/compile-cache"
          RUNTIME_CACHE="$WORKDIR/runtime-cache"
          SMOL_RUNTIME_CACHE="$WORKDIR/smol-runtime-cache"
          LICENSE_CACHE="$WORKDIR/licenses-cache"
          EMPTY_PATH="$WORKDIR/no-host-node"
          mkdir -p "$COMPILE_CACHE" "$RUNTIME_CACHE" "$SMOL_RUNTIME_CACHE" "$EMPTY_PATH"
          # A loose `.node` beside the entry is `Island::Colocated`, whose owning
          # manifest is the APPLICATION's — so the fixture needs one or the addon
          # plugin fails with "no owning package.json in any parent directory".
          # `type: module` so the ESM fixtures keep their format once a manifest
          # exists; `windows-long-replace.js` has no ESM syntax and is the one
          # fixture this reclassifies, which its bare `console.log` tolerates.
          printf '%s\n' '{"name":"nub-release-compile-fixture","version":"0.0.0","private":true,"type":"module"}' > "$MANIFEST"
          printf '%s\n' 'export const dependency = "bundled-dependency";' > "$DEPENDENCY"
          printf '%s\n' 'included-asset' > "$INCLUDED"
          test -f nub-pkg/test/compile-native.node \
            || { echo "::error::platform artifact is missing its test-only target native addon"; exit 1; }
          cp nub-pkg/test/compile-native.node "$NATIVE_ADDON"
          # shellcheck disable=SC2016 # The JavaScript template literal must reach the fixture unchanged.
          printf '%s\n' \
            'import { readFileSync } from "node:fs";' \
            'import { dirname, join } from "node:path";' \
            'import { fork } from "node:child_process";' \
            'import { createRequire } from "node:module";' \
            'import { fileURLToPath } from "node:url";' \
            'import { dependency } from "./dependency.js";' \
            'const here = dirname(fileURLToPath(import.meta.url));' \
            'const included = readFileSync(join(here, "included.txt"), "utf8").trim();' \
            'require = createRequire(import.meta.url);' \
            'const native = require("./compile-native.node");' \
            'const answer = native.parseJson5("{answer:42}").answer;' \
            'const child = fork(new URL("./fork-child.cjs", import.meta.url), { stdio: ["ignore", "ignore", "ignore", "ipc"] });' \
            'const childMessage = await new Promise((resolve, reject) => {' \
            '  child.once("message", resolve);' \
            '  child.once("error", reject);' \
            '  child.once("exit", (code) => { if (code !== 0) reject(new Error(`fork child exited ${code}`)); });' \
            '});' \
            'console.log([process.platform, process.arch, RELEASE_DEFINE, dependency, included, answer, childMessage].join("|"));' \
            > "$FIXTURE"
          printf '%s\n' 'if (process.send) process.send("child-once", () => process.exit(0))' > "$FORK_CHILD"
          # This inherited user loader substitutes a node:module surface with a
          # createRequire binding that cannot be called. The compiled runtime must
          # still start because its bootstrap takes the CJS-bound builtin before
          # user loaders can rewrite node:module.
          printf '%s\n' \
            'import { registerHooks } from "node:module";' \
            'registerHooks({' \
            '  load(url, context, nextLoad) {' \
            '    if (url === "node:module") return { format: "module", shortCircuit: true, source: "export const createRequire = undefined;" };' \
            '    return nextLoad(url, context);' \
            '  },' \
            '});' \
            > "$USER_LOADER"
          printf '%s\n' 'console.log("user-loader-compatible")' > "$LOADER_FIXTURE"
          DEFINE_ARG='RELEASE_DEFINE="defined-value"'
          EXPECTED_OUTPUT="$EXPECTED_PLATFORM|$EXPECTED_ARCH|defined-value|bundled-dependency|included-asset|42|child-once"

          XDG_CACHE_HOME="$COMPILE_CACHE" \
            "$BIN" compile --target "$NODE_VERSION" --define "$DEFINE_ARG" --include "$INCLUDED" --include "$FORK_CHILD" \
              --out "$EMBED_OUT" "$FIXTURE"
          test -f "$EMBED_OUT" \
            || { echo "::error::nub compile produced no default artifact at $EMBED_OUT"; exit 1; }
          [ -n "$EXE" ] || chmod +x "$EMBED_OUT"
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --verify --strict --verbose=1 "$EMBED_OUT"
            EMBED_SIGNATURE="$(codesign -dvvv "$EMBED_OUT" 2>&1)"
            printf '%s\n' "$EMBED_SIGNATURE" | grep -qx 'Signature=adhoc' \
              || { echo "::error::compiled default artifact is not ad-hoc signed"; exit 1; }
          fi

          # The embedded Node notice rides a private launcher channel, not a
          # reserved argument, so a compiled application keeps its whole argv
          # surface. The verifier mode must stream that notice without resolving
          # a cache, extracting the application, or provisioning/extracting Node.
          # Use a brand-new cache root to make any write a release-blocking
          # failure on every native platform.
          rm -rf "$LICENSE_CACHE"
          LICENSE_OUTPUT="$WORKDIR/embedded-node-license.txt"
          (
            cd "$FOREIGN_CWD"
            XDG_CACHE_HOME="$LICENSE_CACHE" \
              __NUB_COMPILE_CACHE_DIR="$LICENSE_CACHE" \
              __NUB_COMPILED_LAUNCHER_MODE=licenses \
              "$EMBED_OUT"
          ) > "$LICENSE_OUTPUT"
          if ! grep -Eq 'Node\.js|MIT License' "$LICENSE_OUTPUT"; then
            echo "::error::compiled default artifact license verifier did not emit embedded Node license material"
            cat "$LICENSE_OUTPUT"
            exit 1
          fi
          if [ -e "$LICENSE_CACHE" ] && find "$LICENSE_CACHE" -mindepth 1 -print -quit | grep -q .; then
            echo "::error::compiled default artifact license verifier created cache or extracted application artifacts"
            find "$LICENSE_CACHE" -mindepth 1 -print
            exit 1
          fi
          echo "✓ packaged ${{ matrix.platform }} default artifact emitted its embedded Node license without cache writes"

          if [ -n "$EXE" ]; then
            # Exercise a native Windows path beyond MAX_PATH and an in-place
            # replacement. The second executable must carry the changed entry.
            WINDOWS_ENTRY="$SOURCE_DIR/windows-long-replace.js"
            LONG_SEGMENT="windows-long-output-segment-0123456789abcdefghijklmnopqrstuvwxyz"
            LONG_DIR="$WORKDIR/$LONG_SEGMENT/$LONG_SEGMENT/$LONG_SEGMENT/$LONG_SEGMENT"
            mkdir -p "$LONG_DIR"
            LONG_OUT="$(cd "$LONG_DIR" && pwd)/replace-existing$EXE"
            [ "${#LONG_OUT}" -gt 260 ] \
              || { echo "::error::Windows long-path gate did not exceed 260 characters: $LONG_OUT"; exit 1; }
            printf '%s\n' 'console.log("windows-long-first")' > "$WINDOWS_ENTRY"
            XDG_CACHE_HOME="$COMPILE_CACHE" \
              "$BIN" compile --target "$NODE_VERSION" --out "$LONG_OUT" "$WINDOWS_ENTRY"
            test -f "$LONG_OUT" \
              || { echo "::error::Windows long-path compile produced no artifact at $LONG_OUT"; exit 1; }
            printf '%s\n' 'console.log("windows-long-second")' > "$WINDOWS_ENTRY"
            XDG_CACHE_HOME="$COMPILE_CACHE" \
              "$BIN" compile --target "$NODE_VERSION" --out "$LONG_OUT" "$WINDOWS_ENTRY"
            WINDOWS_REPLACED_ACTUAL="$(
              cd "$FOREIGN_CWD"
              __NUB_COMPILE_CACHE_DIR="$RUNTIME_CACHE" "$LONG_OUT"
            )"
            if [ "$WINDOWS_REPLACED_ACTUAL" != "windows-long-second" ]; then
              echo "::error::Windows long-path replacement printed '$WINDOWS_REPLACED_ACTUAL', expected 'windows-long-second'"
              exit 1
            fi
            echo "✓ Windows long-path compile replaced an existing executable"
          fi

          "$BIN" compile --smol --target "$NODE_VERSION" --define "$DEFINE_ARG" --include "$INCLUDED" --include "$FORK_CHILD" \
            --out "$SMOL_OUT" "$FIXTURE"
          test -f "$SMOL_OUT" \
            || { echo "::error::nub compile produced no --smol artifact at $SMOL_OUT"; exit 1; }
          [ -n "$EXE" ] || chmod +x "$SMOL_OUT"
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --verify --strict --verbose=1 "$SMOL_OUT"
            SMOL_SIGNATURE="$(codesign -dvvv "$SMOL_OUT" 2>&1)"
            printf '%s\n' "$SMOL_SIGNATURE" | grep -qx 'Signature=adhoc' \
              || { echo "::error::compiled --smol artifact is not ad-hoc signed"; exit 1; }
          fi

          # NODE_OPTIONS is deliberately inherited by compiled executables. This
          # loader removes the usable node:module createRequire export after loading
          # itself; the dedicated artifact has no such app import, so success proves
          # the runtime bootstrap does not traverse the user-rewritten builtin.
          "$BIN" compile --smol --target "$NODE_VERSION" --out "$LOADER_OUT" "$LOADER_FIXTURE"
          test -f "$LOADER_OUT" \
            || { echo "::error::nub compile produced no user-loader artifact at $LOADER_OUT"; exit 1; }
          [ -n "$EXE" ] || chmod +x "$LOADER_OUT"
          # --import takes a file URL: Node parses a raw Windows absolute path as
          # a URL with protocol "d:" and refuses it (ERR_UNSUPPORTED_ESM_URL_SCHEME)
          # — stock node fails the same way, so the URL form is the fixture's job.
          if [ -n "$EXE" ]; then
            USER_LOADER_IMPORT="file:///$(cygpath -m "$USER_LOADER")"
          else
            USER_LOADER_IMPORT="$USER_LOADER"
          fi
          LOADER_ACTUAL="$(
            cd "$FOREIGN_CWD"
            NODE_OPTIONS="--import=$USER_LOADER_IMPORT" \
              __NUB_COMPILE_CACHE_DIR="$WORKDIR/user-loader-runtime-cache" "$LOADER_OUT"
          )"
          if [ "$LOADER_ACTUAL" != "user-loader-compatible" ]; then
            echo "::error::compiled artifact with inherited createRequire-stripping loader printed '$LOADER_ACTUAL'"
            exit 1
          fi
          echo "✓ packaged ${{ matrix.platform }} compiled artifact starts under an inherited createRequire-stripping loader"

          # Both artifacts must run solely from their extracted app payload.
          # Removing the authored source tree makes a missed dependency, include,
          # or native-addon embedding fail even though the build job still exists.
          rm -rf "$SOURCE_DIR"
          COLD_ACTUAL="$(
            cd "$FOREIGN_CWD"
            PATH="$EMPTY_PATH" __NUB_COMPILE_CACHE_DIR="$RUNTIME_CACHE" "$EMBED_OUT"
          )"
          if [ "$COLD_ACTUAL" != "$EXPECTED_OUTPUT" ]; then
            echo "::error::cold default artifact printed '$COLD_ACTUAL', expected '$EXPECTED_OUTPUT'"
            exit 1
          fi
          WARM_ACTUAL="$(
            cd "$FOREIGN_CWD"
            PATH="$EMPTY_PATH" __NUB_COMPILE_CACHE_DIR="$RUNTIME_CACHE" "$EMBED_OUT"
          )"
          if [ "$WARM_ACTUAL" != "$EXPECTED_OUTPUT" ]; then
            echo "::error::warm default artifact printed '$WARM_ACTUAL', expected '$EXPECTED_OUTPUT'"
            exit 1
          fi
          echo "✓ packaged ${{ matrix.platform }} CLI ran default shape cold + warm with embedded Node, define, dependency, include, and native addon"

          # No argument spelling is reserved. `--licenses` in particular reaches
          # the application unchanged, so a publisher whose CLI already defines
          # it keeps that flag. The fixture ignores argv, so a launcher that
          # intercepted this would print a license notice instead of its line.
          # Runs on the warm cache deliberately: the cold assertion above must
          # stay the first execution.
          ARGV_PASSTHROUGH_ACTUAL="$(
            cd "$FOREIGN_CWD"
            PATH="$EMPTY_PATH" __NUB_COMPILE_CACHE_DIR="$RUNTIME_CACHE" "$EMBED_OUT" --licenses
          )"
          if [ "$ARGV_PASSTHROUGH_ACTUAL" != "$EXPECTED_OUTPUT" ]; then
            echo "::error::default artifact intercepted the application argument --licenses: printed '$ARGV_PASSTHROUGH_ACTUAL', expected '$EXPECTED_OUTPUT'"
            exit 1
          fi
          echo "✓ packaged ${{ matrix.platform }} default artifact forwarded --licenses to the application"

          SMOL_ACTUAL="$(
            cd "$FOREIGN_CWD"
            __NUB_COMPILE_CACHE_DIR="$SMOL_RUNTIME_CACHE" "$SMOL_OUT"
          )"
          if [ "$SMOL_ACTUAL" != "$EXPECTED_OUTPUT" ]; then
            echo "::error::compiled --smol artifact printed '$SMOL_ACTUAL', expected '$EXPECTED_OUTPUT'"
            exit 1
          fi
          echo "✓ packaged ${{ matrix.platform }} CLI ran --smol from a foreign cwd using runner Node $NODE_VERSION"

          if [ -n "$EXE" ]; then
            # Build a controlled Node mirror from the runner's matching node.exe.
            # The launcher sees curl but no Node on PATH, so success proves the
            # Windows zip selection, checksum, extraction, and publication path.
            # Under $HOME, not $WORKDIR: the arm64 runner image stamps explicit
            # "Authenticated Users:(M)" ACEs down the whole RUNNER_TEMP chain, and
            # nub refuses a cache whose ancestry any authenticated user can write
            # (by design - it falls back to its own hardened home store, which
            # made this case pass without ever exercising the mirror). The user
            # profile ancestry is private, so the passed cache dir is honored
            # there. Probed on windows-11-arm before landing.
            NO_HOST_ROOT="$HOME/nub-smoke-no-host"
            rm -rf "$NO_HOST_ROOT"
            NO_HOST_PROFILE="$NO_HOST_ROOT/profile"
            NO_HOST_CACHE="$NO_HOST_ROOT/cache"
            BAD_SUM_CACHE="$NO_HOST_ROOT/bad-checksum-cache"
            MIRROR_ROOT="$NO_HOST_ROOT/mirror"
            MIRROR_VERSION="$MIRROR_ROOT/v$NODE_VERSION"
            DIST_TOKEN="win-$EXPECTED_ARCH"
            ARCHIVE_NAME="node-v$NODE_VERSION-$DIST_TOKEN.zip"
            ARCHIVE_TOP="$NO_HOST_ROOT/node-v$NODE_VERSION-$DIST_TOKEN"
            ARCHIVE_PATH="$MIRROR_VERSION/$ARCHIVE_NAME"
            WINDOWS_TOOLS="$NO_HOST_ROOT/windows-tools"
            mkdir -p "$NO_HOST_PROFILE" "$MIRROR_VERSION" "$ARCHIVE_TOP" "$WINDOWS_TOOLS"
            cp "$(command -v node)" "$ARCHIVE_TOP/node.exe"
            ARCHIVE_TOP_NATIVE="$(cygpath -w "$ARCHIVE_TOP")"
            ARCHIVE_PATH_NATIVE="$(cygpath -w "$ARCHIVE_PATH")"
            powershell.exe -NoProfile -NonInteractive -Command \
              "Compress-Archive -LiteralPath '$ARCHIVE_TOP_NATIVE' -DestinationPath '$ARCHIVE_PATH_NATIVE' -Force"
            # sha256sum backslash-escapes its whole output line when the path
            # argument carries a backslash (leading "\" + doubled separators in
            # the name), so a RUNNER_TEMP-rooted Windows path corrupts the hash
            # field into "\<64-hex>" and the launcher rightly refuses it. Hand
            # it the POSIX spelling; no escaping fires. Measured on the
            # probe/win-shasums run before landing.
            ARCHIVE_SHA="$(sha256sum "$(cygpath -u "$ARCHIVE_PATH")" | awk '{print $1}')"
            printf '%s  %s\n' "$ARCHIVE_SHA" "$ARCHIVE_NAME" > "$MIRROR_VERSION/SHASUMS256.txt"
            # Windows stores this as `SystemRoot`; bash lookup is case-sensitive
            # and MSYS2 does not uppercase it, so a bare $SYSTEMROOT is unbound
            # and fatal under `set -u`. Every other reference in this repo uses
            # the `SystemRoot` spelling.
            WINDIR_PATH="${SystemRoot:-${SYSTEMROOT:-C:/Windows}}"
            cp "$(cygpath -u "$WINDIR_PATH/System32/curl.exe")" "$WINDOWS_TOOLS/curl.exe"
            MIRROR_NATIVE="$(cygpath -m "$MIRROR_ROOT")"
            MIRROR_URL="file:///$MIRROR_NATIVE"

            # Earlier compile steps hit the same cache-dir refusal on the arm
            # runner and provisioned the target Node into the real home store;
            # the launcher reads that store before provisioning, so the no-host
            # case must start without it.
            rm -rf "$HOME/.cache/nub/node"

            NO_HOST_ACTUAL="$(
              cd "$FOREIGN_CWD"
              PATH="$WINDOWS_TOOLS" \
                __NUB_COMPILE_CACHE_DIR="$NO_HOST_CACHE" \
                NODEJS_ORG_MIRROR="$MIRROR_URL" \
                NVM_HOME="$NO_HOST_PROFILE/nvm" \
                FNM_DIR="$NO_HOST_PROFILE/fnm" \
                APPDATA="$NO_HOST_PROFILE/appdata" \
                VOLTA_HOME="$NO_HOST_PROFILE/volta" \
                LOCALAPPDATA="$NO_HOST_PROFILE/localappdata" \
                MISE_DATA_DIR="$NO_HOST_PROFILE/mise" \
                "$SMOL_OUT"
            )"
            if [ "$NO_HOST_ACTUAL" != "$EXPECTED_OUTPUT" ]; then
              echo "::error::Windows no-host --smol provisioning printed '$NO_HOST_ACTUAL', expected '$EXPECTED_OUTPUT'"
              exit 1
            fi
            test -f "$NO_HOST_CACHE/node/$NODE_VERSION/node.exe" \
              || { echo "::error::Windows --smol did not publish the provisioned node.exe"; exit 1; }
            test -f "$NO_HOST_CACHE/node/$NODE_VERSION/.nub-complete" \
              || { echo "::error::Windows --smol published Node without its completion marker"; exit 1; }
            WARM_NO_HOST_ACTUAL="$(
              cd "$FOREIGN_CWD"
              PATH="$WINDOWS_TOOLS" \
                __NUB_COMPILE_CACHE_DIR="$NO_HOST_CACHE" \
                NODEJS_ORG_MIRROR="$MIRROR_URL" \
                NVM_HOME="$NO_HOST_PROFILE/nvm" \
                FNM_DIR="$NO_HOST_PROFILE/fnm" \
                APPDATA="$NO_HOST_PROFILE/appdata" \
                VOLTA_HOME="$NO_HOST_PROFILE/volta" \
                LOCALAPPDATA="$NO_HOST_PROFILE/localappdata" \
                MISE_DATA_DIR="$NO_HOST_PROFILE/mise" \
                "$SMOL_OUT"
            )"
            if [ "$WARM_NO_HOST_ACTUAL" != "$EXPECTED_OUTPUT" ]; then
              echo "::error::warm Windows no-host --smol run printed '$WARM_NO_HOST_ACTUAL', expected '$EXPECTED_OUTPUT'"
              exit 1
            fi

            printf '%s  %s\n' "$(printf '0%.0s' {1..64})" "$ARCHIVE_NAME" \
              > "$MIRROR_VERSION/SHASUMS256.txt"
            BAD_SUM_LOG="$NO_HOST_ROOT/bad-checksum.log"
            set +e
            (
              cd "$FOREIGN_CWD"
              PATH="$WINDOWS_TOOLS" \
                __NUB_COMPILE_CACHE_DIR="$BAD_SUM_CACHE" \
                NODEJS_ORG_MIRROR="$MIRROR_URL" \
                NVM_HOME="$NO_HOST_PROFILE/nvm" \
                FNM_DIR="$NO_HOST_PROFILE/fnm" \
                APPDATA="$NO_HOST_PROFILE/appdata" \
                VOLTA_HOME="$NO_HOST_PROFILE/volta" \
                LOCALAPPDATA="$NO_HOST_PROFILE/localappdata" \
                MISE_DATA_DIR="$NO_HOST_PROFILE/mise" \
                "$SMOL_OUT"
            ) >"$BAD_SUM_LOG" 2>&1
            BAD_SUM_STATUS=$?
            set -e
            if [ "$BAD_SUM_STATUS" -eq 0 ]; then
              echo "::error::Windows --smol accepted a Node archive with a mismatched checksum"
              exit 1
            fi
            if ! grep -Fq -- "checksum mismatch" "$BAD_SUM_LOG"; then
              echo "::error::Windows --smol checksum rejection did not report the mismatch"
              cat "$BAD_SUM_LOG"
              exit 1
            fi
            if [ -e "$BAD_SUM_CACHE/node/$NODE_VERSION/node.exe" ]; then
              echo "::error::Windows --smol published Node after checksum rejection"
              exit 1
            fi
            echo "✓ Windows --smol provisions from a verified zip without host Node and rejects a bad checksum"
          fi

  publish-npm:
    name: Publish to npm
    # Publish only after verify validates a stable tag for this run.
    # A plain `workflow_dispatch` (publish=false) runs verify+test+build (incl. the
    # platform-package assemble) for CI debugging and stops there — nothing is
    # published and no GitHub release is cut.
    #
    # The immutable versioned release job below must publish and verify all 32
    # assets first. That prevents npm from exposing a package whose cross-target
    # compile launcher or installer archive is still absent. This job remains
    # idempotent so a rerun can skip packages already on the registry.
    # Canary runs never reach this job; canary-publish-npm owns them.
    if: ${{ needs.verify.outputs.publish_version != '' }}
    # Gate on the test, conformance, glibc-floor, AND pre-publish smoke jobs: a
    # broken test, a lockfile-compat regression, a glibc-floor regression, or a
    # build that can't run / reports the wrong version must block publish — not
    # just a failed compile. (conformance = the 0.0.35/0.0.36 gap; glibc-floor =
    # the 0.0.44 gap; pre-publish-gate = a build that links but doesn't run.)
    needs: [verify, build, test, conformance, glibc-floor-guard, pre-publish-gate, stable-immutable-release]
    runs-on: ubuntu-latest
    permissions:
      # checkout reads; npm publish authenticates via OIDC trusted publishing,
      # which mints its token from the job's OIDC identity (id-token: write).
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] this job installs nothing; the published bits come from the build artifacts, not the cache
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Preflight — loader packages must exist and be trusted on npm
        run: |
          # npm OIDC cannot perform a package's FIRST publish (npm/cli#8544), so
          # the nine loader packages must have been created and trusted once by
          # scripts/npm-first-publish-loader.sh. Check EXISTENCE here, before
          # anything publishes: without this, @nubjs/nub would publish and then
          # the loader step would fail, leaving the two families version-skewed
          # on the registry until a manual fix. (Trust configuration cannot be
          # read unauthenticated; a missing trust still fails the loader publish
          # itself — but that failure now happens before @nubjs/nub goes out.)
          missing=0
          ROOT="$(node -p "require('./npm/loader/package.json').name")"
          for name in "$ROOT" @nubjs/loader-darwin-arm64 @nubjs/loader-darwin-x64 @nubjs/loader-linux-x64 @nubjs/loader-linux-x64-musl @nubjs/loader-linux-arm64 @nubjs/loader-linux-arm64-musl @nubjs/loader-win32-x64 @nubjs/loader-win32-arm64; do
            if ! npm view "$name" versions >/dev/null 2>&1; then
              echo "::error::$name does not exist on npm — run scripts/npm-first-publish-loader.sh once (see its header) before releasing"
              missing=1
            fi
          done
          exit $missing

      - name: Prepare and publish loader packages (idempotent)
        run: |
          # The standalone loader publishes FIRST, deliberately: it is the newest
          # package family, so if anything is going to fail it must fail before
          # the irreversible @nubjs/nub publishes below — a half-published
          # release must never leave @nubjs/nub@X on the registry without its
          # matching loader. Within the family: 8 addon-only platform packages,
          # then the root LAST (it exact-pins them, same ordering safety as the
          # CLI's packages). Same idempotent skip on an already-published
          # version. Each platform leg uploaded its addon package
          # (loader-<platform> artifact); the root's JS is staged here from this
          # checkout by build-loader-npm.mjs (no addon on this runner, by design).
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/loader-$platform"
            if [ ! -d "$PKG" ]; then
              echo "⚠️  Skipping loader-$platform (not built)"
              continue
            fi
            cp "npm/loader-$platform/package.json" "$PKG/package.json"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$PKG/package.json', 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync('$PKG/package.json', JSON.stringify(p, null, 2));
            "
            NAME="@nubjs/loader-$platform"
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "✓ $NAME@$VERSION already published — skipping"
              continue
            fi
            echo "→ $NAME@$VERSION"
            (cd "$PKG" && npm publish --access public)
          done
          node scripts/build-loader-npm.mjs --addon /nonexistent
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/loader/package.json', 'utf8'));
            p.version = process.env.VERSION;
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('npm/loader/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          NAME="$(node -p "require('./npm/loader/package.json').name")"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "✓ $NAME@$VERSION already published — skipping"
          else
            echo "→ $NAME@$VERSION"
            (cd npm/loader && npm publish --access public)
          fi

      - name: Prepare and publish platform packages (idempotent)
        run: |
          # IDEMPOTENT publish: a re-run of this job (after a partial publish, or
          # after github-release failed and the whole run is retried) must NOT
          # hard-fail on a package that's already on the registry. Check
          # `npm view <pkg>@<version> version` first and skip the ones already
          # published, publishing only the missing ones. This makes publish-npm
          # safely re-runnable: npm itself errors with E403 "cannot publish over
          # previously published version", which would otherwise abort the loop.
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/nub-$platform"
            if [ ! -d "$PKG" ]; then
              echo "⚠️  Skipping $platform (not built)"
              continue
            fi
            # Copy package.json from source and set version
            cp "npm/nub-$platform/package.json" "$PKG/package.json"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$PKG/package.json', 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync('$PKG/package.json', JSON.stringify(p, null, 2));
            "
            NAME="@nubjs/nub-$platform"
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "✓ $NAME@$VERSION already published — skipping"
              continue
            fi
            echo "→ $NAME@$VERSION"
            (cd "$PKG" && npm publish --access public)
          done

      - name: Prepare and publish root package (idempotent)
        run: |
          # Update version in root package + optionalDependencies
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/nub/package.json', 'utf8'));
            p.version = process.env.VERSION;
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('npm/nub/package.json', JSON.stringify(p, null, 2));
          "
          if [ "$(npm view "@nubjs/nub@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "✓ @nubjs/nub@$VERSION already published — skipping"
          else
            echo "→ @nubjs/nub@$VERSION"
            (cd npm/nub && npm publish --access public)
          fi

      - name: Prepare and publish types package (idempotent)
        run: |
          # Package #10: @nubjs/types — the types-only ambient-declarations package.
          # Tracks the binary's version in LOCKSTEP (set from verify's validated tag; kept
          # consistent by `make version` + the version-check gate). Publishes via npm
          # OIDC trusted publishing (configured on npm 2026-06-14 — repo nubjs/nub,
          # this workflow; no token). Standalone devDep, not in nub's optionalDependencies.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/nub-types/package.json', 'utf8'));
            p.version = process.env.VERSION;
            fs.writeFileSync('npm/nub-types/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          if [ "$(npm view "@nubjs/types@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "✓ @nubjs/types@$VERSION already published — skipping"
          else
            echo "→ @nubjs/types@$VERSION"
            (cd npm/nub-types && npm publish --access public)
          fi

  stable-immutable-release:
    name: Stage immutable stable release (+ verify assets)
    # Publish the exact versioned release and verify its complete 32-asset set
    # BEFORE npm publication. It starts as a prerelease so installer and compile
    # URLs are live while the ordinary release presentation remains post-npm.
    # A rerun compares every existing asset byte-for-byte, uploads only missing
    # assets, and fails if this commit would change a versioned release.
    # A validated stable tag only — canary runs update the rolling `canary`
    # prerelease via canary-release below.
    if: ${{ needs.verify.outputs.publish_tag != '' }}
    needs: [verify, build, test, conformance, glibc-floor-guard, pre-publish-gate]
    runs-on: ubuntu-24.04
    permissions:
      # Creates/updates the GitHub Release and uploads/re-uploads its assets.
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
      TAG: ${{ needs.verify.outputs.publish_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] no package install runs here — node is used only for `node --version` to pick the smoke's compile target — so the default cache is never populated or restored
        with:
          node-version: "24"
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Package release archives (single binary)
        run: |
          # Per-platform archives containing bin/ plus a VESTIGIAL EMPTY runtime/.
          # nub is a single self-contained binary that embeds its runtime and
          # JIT-extracts it on first run, so the new binary needs no runtime/ sidecar.
          # The empty runtime/ exists SOLELY for transitional back-compat with the
          # sidecar-era (v0.1.x) self-owned upgrader: that already-released, immutable
          # upgrader swaps BOTH ~/.nub/bin AND ~/.nub/runtime by blindly renaming the
          # archive's runtime/ dir into place (no content validation — verified
          # against v0.1.0→v0.1.14). Against a bin-only artifact that rename aborts
          # ("could not install new …/.nub/runtime"), stranding EVERY v0.1.x user on
          # `nub upgrade`. Shipping an empty runtime/ lets their swap complete; the
          # current embed-runtime binary resolves its runtime from the embedded blob
          # (~/.cache/nub) and never reads ~/.nub/runtime, so the empty dir is inert.
          # DO NOT "clean this up" until the sidecar-era upgraders are confirmed
          # extinct in the wild. Distinct names per platform avoid the GitHub-Release
          # asset collision of uploading bare `nub` for every target (A31). A `.sha256`
          # sidecar is published next to each archive so the self-owned `~/.nub`
          # upgrade channel (`nub upgrade`) can verify the download before swapping it
          # into place. Format is `sha256sum`'s `<hex>  <name>`; `nub upgrade` reads
          # the first field.
          # Normalize payload metadata before packaging. Immutable-release
          # reconciliation byte-compares reruns, so stable ordering, timestamps,
          # modes, archive ownership, and compression headers are required.
          # 1980-01-01 is ZIP's earliest representable timestamp.
          set -euo pipefail
          ARCHIVE_MTIME=315532800
          mkdir -p release-archives
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/nub-$platform"
            [ -d "$PKG" ] || { echo "skip $platform (not built)"; continue; }
            # The transitional empty runtime/ (see step comment). Created here, not in
            # the npm package, so only the self-owned upgrade archive carries it.
            mkdir -p "$PKG/runtime"
            find "$PKG/bin" -type d -exec chmod 755 {} +
            find "$PKG/bin" -type f -exec chmod 755 {} +
            chmod 755 "$PKG/runtime"
            find "$PKG/runtime" -type f -exec chmod 644 {} +
            find "$PKG/bin" "$PKG/runtime" -exec touch -h -d "@$ARCHIVE_MTIME" {} +
            if [[ "$platform" == win32-* ]]; then
              archive="nub-$platform.zip"
              (cd "$PKG" && LC_ALL=C find bin runtime -print | LC_ALL=C sort | TZ=UTC zip -X -q "$GITHUB_WORKSPACE/release-archives/$archive" -@)
            else
              # Re-apply +x BEFORE tarring: the build job's chmod (assemble step)
              # does NOT survive the upload-artifact → download-artifact round-trip
              # (it strips Unix mode bits), so the binaries arrive here at 0644. A
              # tarball built from those is non-executable — install.sh heals it
              # with its own chmod, but `nub upgrade`'s self-owned path extracts and
              # runs the binary directly, so a 0644 archive breaks every self-upgrade
              # ("command not found" after upgrade). Ship 0755 in the archive so both
              # the curl|sh installer and `nub upgrade` get an executable binary.
              archive="nub-$platform.tar.gz"
              (cd "$PKG" && tar --sort=name --mtime="@$ARCHIVE_MTIME" --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -cf - bin runtime | gzip -n > "$GITHUB_WORKSPACE/release-archives/$archive")
            fi
            (cd release-archives && sha256sum "$archive" > "$archive.sha256")
            # The `nub compile` launcher template as a STANDALONE asset, so a
            # cross-compile can fetch the one platform it needs (a few hundred KB)
            # instead of a whole release archive. This job is the only place all
            # eight exist together — the build matrix is per-platform, and each job
            # packages only the launcher it just built. compile::launcher resolves
            # `<release>/<tag>/nub-launcher-<platform><exe>` and verifies it against
            # the `.sha256` sidecar, so BOTH names are part of that contract.
            LEXE=""; [[ "$platform" == win32-* ]] && LEXE=".exe"
            LSRC="$PKG/bin/nub-launcher-$platform$LEXE"
            test -f "$LSRC" \
              || { echo "::error::missing nub-launcher template for $platform at $LSRC — 'nub compile --platform $platform' would have no launcher to fetch on this release."; exit 1; }
            cp "$LSRC" "release-archives/"
            (cd release-archives && sha256sum "nub-launcher-$platform$LEXE" > "nub-launcher-$platform$LEXE.sha256")
          done
          ls -la release-archives

      - name: Validate immutable stable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit() {
            local type sha record
            record="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r type sha <<<"$record"
            while [ "$type" = "tag" ]; do
              record="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$sha" --jq '[.object.type, .object.sha] | @tsv')"
              IFS=$'\t' read -r type sha <<<"$record"
            done
            [ "$type" = "commit" ] || { echo "::error::stable tag $TAG resolves to unsupported Git object type $type"; exit 1; }
            printf '%s\n' "$sha"
          }
          RUN_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          TAG_COMMIT="$(tag_commit)"
          if [ "$TAG_COMMIT" != "$RUN_COMMIT" ]; then
            echo "::error::stable tag $TAG points to $TAG_COMMIT, but this run checked out $RUN_COMMIT"
            exit 1
          fi
          # Fetch only the authoritative branch. Remove the default shallow
          # checkout boundary before asking Git to prove commit ancestry.
          FETCH_ARGS=(--no-tags --force)
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            FETCH_ARGS+=(--unshallow)
          fi
          git fetch "${FETCH_ARGS[@]}" origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "::error::stable tag $TAG points to $TAG_COMMIT, which is not reachable from origin/main"
            exit 1
          fi
          echo "✓ stable tag $TAG resolves to this run's commit and is reachable from origin/main"

      - name: Create immutable stable prerelease when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✓ release $TAG already exists; preserving its presentation state"
          else
            gh release create "$TAG" --verify-tag --prerelease --title "Nub $VERSION" --generate-notes
          fi

      - name: Reconcile immutable stable assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The exhaustive list of 32 assets (8 platforms × {archive, launcher} ×
          # {artifact, .sha256}) that a complete release MUST carry. This is the
          # load-bearing check that the v0.0.48 partial upload (9/16) would have
          # FAILED instead of shipping. The launcher templates are equally
          # load-bearing: `nub compile --platform <foreign>` fetches one from this
          # release, so a missing launcher asset silently disables cross-compiling
          # to that platform for everyone on this version. Existing assets are
          # downloaded and compared byte-for-byte; missing assets are the only
          # files uploaded. Asset names and .sha256 sidecars alone are not trusted.
          EXPECTED=(
            nub-darwin-arm64.tar.gz nub-darwin-arm64.tar.gz.sha256
            nub-darwin-x64.tar.gz nub-darwin-x64.tar.gz.sha256
            nub-linux-x64.tar.gz nub-linux-x64.tar.gz.sha256
            nub-linux-x64-musl.tar.gz nub-linux-x64-musl.tar.gz.sha256
            nub-linux-arm64.tar.gz nub-linux-arm64.tar.gz.sha256
            nub-linux-arm64-musl.tar.gz nub-linux-arm64-musl.tar.gz.sha256
            nub-win32-x64.zip nub-win32-x64.zip.sha256
            nub-win32-arm64.zip nub-win32-arm64.zip.sha256
            nub-launcher-darwin-arm64 nub-launcher-darwin-arm64.sha256
            nub-launcher-darwin-x64 nub-launcher-darwin-x64.sha256
            nub-launcher-linux-x64 nub-launcher-linux-x64.sha256
            nub-launcher-linux-x64-musl nub-launcher-linux-x64-musl.sha256
            nub-launcher-linux-arm64 nub-launcher-linux-arm64.sha256
            nub-launcher-linux-arm64-musl nub-launcher-linux-arm64-musl.sha256
            nub-launcher-win32-x64.exe nub-launcher-win32-x64.exe.sha256
            nub-launcher-win32-arm64.exe nub-launcher-win32-arm64.exe.sha256
          )
          asset_names() {
            gh release view "$TAG" --json assets --jq '.assets[].name'
          }

          missing_assets() {
            local present m=()
            # `mapfile < <(missing_assets)` discards this function's exit status,
            # so a transient listing failure under `set -e` would kill the
            # subshell with NO output — byte-identical to "nothing missing", and
            # enough to declare an incomplete immutable release complete. Emit a
            # sentinel that matches no expected asset instead, so the caller's
            # completeness check fails loudly and names the real cause.
            present="$(asset_names)" || { echo "__ASSET_LISTING_FAILED__"; return 0; }
            for a in "${EXPECTED[@]}"; do
              if ! grep -qxF "$a" <<<"$present"; then m+=("$a"); fi
            done
            printf '%s\n' "${m[@]}"
          }

          reconcile_assets() {
            local present a f remote
            present="$(asset_names)"
            mkdir -p remote-assets
            for a in "${EXPECTED[@]}"; do
              f="release-archives/$a"
              test -f "$f" \
                || { echo "::error::expected asset $a was never built (no $f)"; exit 1; }
              if grep -qxF "$a" <<<"$present"; then
                remote="remote-assets/$a"
                rm -f "$remote"
                gh release download "$TAG" --pattern "$a" --dir remote-assets
                test -f "$remote" \
                  || { echo "::error::release $TAG listed $a but gh did not download it"; exit 1; }
                if ! cmp -s "$f" "$remote"; then
                  echo "::error::immutable release $TAG asset $a differs from this run's bytes"
                  exit 1
                fi
                echo "✓ immutable $a matches"
              else
                echo "uploading missing $a"
                gh release upload "$TAG" "$f" || echo "  (upload of $a failed this pass; will retry)"
              fi
            done
          }

          # A failed missing-only upload may be retried. A present asset is always
          # byte-compared before success, so a rerun can repair a partial release
          # but cannot replace an existing versioned byte.
          for pass in 1 2 3; do
            reconcile_assets
            mapfile -t MISSING < <(missing_assets)
            [ "${#MISSING[@]}" -eq 1 ] && [ -z "${MISSING[0]}" ] && MISSING=()
            if [ "${#MISSING[@]}" -eq 0 ]; then
              # Compare once more after any upload before accepting completion.
              reconcile_assets
              mapfile -t MISSING < <(missing_assets)
              [ "${#MISSING[@]}" -eq 1 ] && [ -z "${MISSING[0]}" ] && MISSING=()
              if [ "${#MISSING[@]}" -eq 0 ]; then
                echo "✓ all ${#EXPECTED[@]} release assets present on $TAG"
                exit 0
              fi
            fi
            echo "--- pass $pass: ${#MISSING[@]} asset(s) missing: ${MISSING[*]} ---"
            sleep 10
          done

          mapfile -t STILL < <(missing_assets)
          [ "${#STILL[@]}" -eq 1 ] && [ -z "${STILL[0]}" ] && STILL=()
          if [ "${#STILL[@]}" -ne 0 ]; then
            echo "::error::release $TAG is still missing ${#STILL[@]} asset(s) after retries: ${STILL[*]}"
            exit 1
          fi
          echo "✓ all ${#EXPECTED[@]} release assets present on $TAG"

      - name: Smoke immutable stable cross-target launcher fetch
        shell: bash
        run: |
          set -euo pipefail
          # Copy only nub: locating from this directory cannot use the packaged
          # host sibling, and the empty cache forces the exact release fetch.
          SMOKE_DIR="$RUNNER_TEMP/nub-stable-template-fetch"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          cp artifacts/nub-linux-x64/bin/nub "$SMOKE_DIR/nub"
          chmod +x "$SMOKE_DIR/nub"
          printf '%s\n' 'console.log("immutable launcher fetch smoke")' > "$SMOKE_DIR/fixture.js"
          NODE_VERSION="$(node --version)"
          NODE_VERSION="${NODE_VERSION#v}"
          # The COMPILER's template cache is `discovery::cache_dir()`, which reads
          # XDG_CACHE_HOME and appends a `nub` segment. `__NUB_COMPILE_CACHE_DIR`
          # is read only by the compiled artifact's launcher
          # (crates/nub-launcher/src/cache.rs), so pointing this smoke at it left
          # the fetch landing in the real ~/.cache/nub and made both the
          # cache-was-empty precondition vacuous and the cache-entry assertion
          # fail on every release.
          CACHE_LAUNCHER="$SMOKE_DIR/cache/nub/compile-launchers/$VERSION/nub-launcher-win32-x64.exe"
          test ! -e "$SMOKE_DIR/nub-launcher-win32-x64.exe" && test ! -e "$SMOKE_DIR/nub-launcher-win32-x64" \
            || { echo "::error::immutable stable launcher-fetch smoke has a foreign sibling template"; exit 1; }
          test ! -e "$CACHE_LAUNCHER" \
            || { echo "::error::immutable stable launcher-fetch smoke cache was not empty"; exit 1; }
          env -u __NUB_LAUNCHER_TEMPLATE -u NUB_RELEASE_BASE_URL -u GH_TOKEN -u GITHUB_TOKEN \
            XDG_CACHE_HOME="$SMOKE_DIR/cache" \
            "$SMOKE_DIR/nub" compile --smol --target "$NODE_VERSION" \
              --platform win32-x64 --out "$SMOKE_DIR/fetch-smoke.exe" "$SMOKE_DIR/fixture.js"
          test -f "$SMOKE_DIR/fetch-smoke.exe" \
            || { echo "::error::immutable stable cross-target launcher fetch produced no artifact"; exit 1; }
          test -f "$CACHE_LAUNCHER" \
            || { echo "::error::immutable stable launcher fetch did not create the versioned cache entry"; exit 1; }
          cmp -s "$CACHE_LAUNCHER" "release-archives/nub-launcher-win32-x64.exe" \
            || { echo "::error::immutable stable launcher cache bytes differ from the reconciled release asset"; exit 1; }
          echo "✓ copied packaged CLI fetched the immutable stable win32-x64 template (no sibling fallback)"

  github-release:
    name: Publish stable GitHub Release
    # npm can publish only after the immutable prerelease above is asset-complete.
    # Once npm succeeds, promote that same versioned release without rebuilding or
    # retargeting it. Asset repair remains owned by stable-immutable-release.
    if: ${{ needs.verify.outputs.publish_tag != '' }}
    needs: [verify, publish-npm, stable-immutable-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote immutable release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 # zizmor: ignore[superfluous-actions] updates the existing asset-complete release without retargeting it
        with:
          tag_name: ${{ needs.verify.outputs.publish_tag }}
          generate_release_notes: true
          prerelease: false
          # Promotion is an UPDATE, and an update that omits make_latest leaves the
          # repo's "Latest" pointer untouched — v0.7.5 stayed latest through three
          # stable 0.8.x promotions, so `releases/latest` (nub upgrade + both
          # installers) kept serving 0.7.5. Claim it explicitly.
          make_latest: "true"
      - name: Assert the upgrade channel serves this release
        # `nub upgrade`, install.sh, and install.ps1 all resolve the version from
        # `releases/latest`, so a promotion that does not move the Latest pointer
        # ships a release nobody is served. Read the pointer back rather than
        # trusting the promote step's inputs.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.publish_tag }}
        run: |
          set -euo pipefail
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          [ "$LATEST" = "$TAG" ] \
            || { echo "::error::releases/latest is $LATEST, not $TAG — the upgrade channel is serving the wrong release"; exit 1; }
          echo "✓ releases/latest serves $TAG"

  canary-immutable-release:
    name: Create immutable canary release
    # Publish the immutable `v$VERSION` prerelease at this exact commit BEFORE
    # npm can advance its canary tag. `nub compile` for this package version
    # fetches launchers only from this immutable release, so its complete 32-asset
    # set is a publication prerequisite. The rolling `canary` installer and
    # self-upgrade release remains a separate post-npm job below.
    if: needs.verify.outputs.is_canary == 'true'
    needs: [verify, build, glibc-floor-guard, pre-publish-gate]
    runs-on: ubuntu-24.04
    permissions:
      # Creates the immutable prerelease and uploads/re-uploads its assets with
      # GITHUB_TOKEN. The workflow baseline is `permissions: {}`, so without
      # this block every gh/git write here 403s.
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.canary_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 # zizmor: ignore[cache-poisoning] no package install runs here — node is used only for `node --version` to pick the smoke's compile target — so the default cache is never populated or restored
        with:
          node-version: "24"
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Package release archives (single binary)
        run: |
          # Mirrors stable packaging (keep in sync): bin/ plus the vestigial
          # empty runtime/ the sidecar-era self-upgrader needs, normalized
          # metadata for reproducible bytes, and a `.sha256` sidecar per archive.
          set -euo pipefail
          ARCHIVE_MTIME=315532800
          mkdir -p release-archives
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/nub-$platform"
            [ -d "$PKG" ] || { echo "skip $platform (not built)"; continue; }
            mkdir -p "$PKG/runtime"
            find "$PKG/bin" -type d -exec chmod 755 {} +
            find "$PKG/bin" -type f -exec chmod 755 {} +
            chmod 755 "$PKG/runtime"
            find "$PKG/runtime" -type f -exec chmod 644 {} +
            find "$PKG/bin" "$PKG/runtime" -exec touch -h -d "@$ARCHIVE_MTIME" {} +
            if [[ "$platform" == win32-* ]]; then
              archive="nub-$platform.zip"
              (cd "$PKG" && LC_ALL=C find bin runtime -print | LC_ALL=C sort | TZ=UTC zip -X -q "$GITHUB_WORKSPACE/release-archives/$archive" -@)
            else
              archive="nub-$platform.tar.gz"
              (cd "$PKG" && tar --sort=name --mtime="@$ARCHIVE_MTIME" --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -cf - bin runtime | gzip -n > "$GITHUB_WORKSPACE/release-archives/$archive")
            fi
            (cd release-archives && sha256sum "$archive" > "$archive.sha256")
            LEXE=""; [[ "$platform" == win32-* ]] && LEXE=".exe"
            LSRC="$PKG/bin/nub-launcher-$platform$LEXE"
            test -f "$LSRC" \
              || { echo "::error::missing nub-launcher template for $platform at $LSRC — 'nub compile --platform $platform' would have no launcher to fetch on this release."; exit 1; }
            cp "$LSRC" "release-archives/"
            (cd release-archives && sha256sum "nub-launcher-$platform$LEXE" > "nub-launcher-$platform$LEXE.sha256")
          done
          ls -la release-archives

      - name: Validate or create immutable canary prerelease
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          tag_commit() {
            local type sha record
            record="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r type sha <<<"$record"
            while [ "$type" = "tag" ]; do
              record="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$sha" --jq '[.object.type, .object.sha] | @tsv')"
              IFS=$'\t' read -r type sha <<<"$record"
            done
            [ "$type" = "commit" ] || { echo "::error::immutable canary tag $TAG resolves to unsupported Git object type $type"; exit 1; }
            printf '%s\n' "$sha"
          }
          RUN_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          if gh release view "$TAG" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
            TAG_COMMIT="$(tag_commit)"
            if [ "$TAG_COMMIT" != "$RUN_COMMIT" ]; then
              echo "::error::immutable canary tag $TAG points to $TAG_COMMIT, but this run checked out $RUN_COMMIT"
              exit 1
            fi
            echo "✓ immutable canary tag $TAG resolves to this run's commit $RUN_COMMIT"
          else
            TAG_EXISTS=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✓ release $TAG already exists; preserving its presentation state"
          elif [ "$TAG_EXISTS" = true ]; then
            gh release create "$TAG" --verify-tag --prerelease --title "Canary $VERSION" --notes "Immutable canary build."
          else
            {
              echo "Immutable canary build."
              echo
              echo "- Version: \`$VERSION\`"
              echo "- Commit: $RUN_COMMIT"
            } > immutable-canary-notes.md
            gh release create "$TAG" \
              --target "$RUN_COMMIT" \
              --prerelease \
              --title "Canary $VERSION" \
              --notes-file immutable-canary-notes.md
          fi

      - name: Reconcile immutable canary assets
        shell: bash
        run: |
          set -euo pipefail
          # Same 32-asset completeness check as github-release (keep in sync),
          # against this exact canary version. Existing assets are downloaded and
          # compared byte-for-byte; only missing assets are uploaded, so a rerun
          # can repair a partial release without replacing versioned bytes.
          EXPECTED=(
            nub-darwin-arm64.tar.gz nub-darwin-arm64.tar.gz.sha256
            nub-darwin-x64.tar.gz nub-darwin-x64.tar.gz.sha256
            nub-linux-x64.tar.gz nub-linux-x64.tar.gz.sha256
            nub-linux-x64-musl.tar.gz nub-linux-x64-musl.tar.gz.sha256
            nub-linux-arm64.tar.gz nub-linux-arm64.tar.gz.sha256
            nub-linux-arm64-musl.tar.gz nub-linux-arm64-musl.tar.gz.sha256
            nub-win32-x64.zip nub-win32-x64.zip.sha256
            nub-win32-arm64.zip nub-win32-arm64.zip.sha256
            nub-launcher-darwin-arm64 nub-launcher-darwin-arm64.sha256
            nub-launcher-darwin-x64 nub-launcher-darwin-x64.sha256
            nub-launcher-linux-x64 nub-launcher-linux-x64.sha256
            nub-launcher-linux-x64-musl nub-launcher-linux-x64-musl.sha256
            nub-launcher-linux-arm64 nub-launcher-linux-arm64.sha256
            nub-launcher-linux-arm64-musl nub-launcher-linux-arm64-musl.sha256
            nub-launcher-win32-x64.exe nub-launcher-win32-x64.exe.sha256
            nub-launcher-win32-arm64.exe nub-launcher-win32-arm64.exe.sha256
          )
          TAG="v$VERSION"

          asset_names() {
            gh release view "$TAG" --json assets --jq '.assets[].name'
          }

          missing_assets() {
            local present m=()
            # `mapfile < <(missing_assets)` discards this function's exit status,
            # so a transient listing failure under `set -e` would kill the
            # subshell with NO output — byte-identical to "nothing missing", and
            # enough to declare an incomplete immutable release complete. Emit a
            # sentinel that matches no expected asset instead, so the caller's
            # completeness check fails loudly and names the real cause.
            present="$(asset_names)" || { echo "__ASSET_LISTING_FAILED__"; return 0; }
            for a in "${EXPECTED[@]}"; do
              if ! grep -qxF "$a" <<<"$present"; then m+=("$a"); fi
            done
            printf '%s\n' "${m[@]}"
          }

          reconcile_assets() {
            local present a f remote
            present="$(asset_names)"
            mkdir -p remote-assets
            for a in "${EXPECTED[@]}"; do
              f="release-archives/$a"
              test -f "$f" \
                || { echo "::error::expected asset $a was never built (no $f)"; exit 1; }
              if grep -qxF "$a" <<<"$present"; then
                remote="remote-assets/$a"
                rm -f "$remote"
                gh release download "$TAG" --pattern "$a" --dir remote-assets
                test -f "$remote" \
                  || { echo "::error::release $TAG listed $a but gh did not download it"; exit 1; }
                if ! cmp -s "$f" "$remote"; then
                  echo "::error::immutable canary release $TAG asset $a differs from this run's bytes"
                  exit 1
                fi
                echo "✓ immutable $a matches"
              else
                echo "uploading missing $a"
                gh release upload "$TAG" "$f" || echo "  (upload of $a failed this pass; will retry)"
              fi
            done
          }

          for pass in 1 2 3; do
            reconcile_assets
            mapfile -t MISSING < <(missing_assets)
            [ "${#MISSING[@]}" -eq 1 ] && [ -z "${MISSING[0]}" ] && MISSING=()
            if [ "${#MISSING[@]}" -eq 0 ]; then
              reconcile_assets
              mapfile -t MISSING < <(missing_assets)
              [ "${#MISSING[@]}" -eq 1 ] && [ -z "${MISSING[0]}" ] && MISSING=()
              if [ "${#MISSING[@]}" -eq 0 ]; then
                echo "✓ all ${#EXPECTED[@]} immutable canary assets present"
                exit 0
              fi
            fi
            echo "--- pass $pass: ${#MISSING[@]} asset(s) missing: ${MISSING[*]} ---"
            sleep 10
          done

          mapfile -t STILL < <(missing_assets)
          [ "${#STILL[@]}" -eq 1 ] && [ -z "${STILL[0]}" ] && STILL=()
          if [ "${#STILL[@]}" -ne 0 ]; then
            echo "::error::immutable canary release is still missing ${#STILL[@]} asset(s) after retries: ${STILL[*]}"
            exit 1
          fi
          echo "✓ all ${#EXPECTED[@]} immutable canary assets present"


      - name: Smoke immutable cross-target launcher fetch
        shell: bash
        run: |
          set -euo pipefail
          # Copy only nub: locating from this directory cannot use the packaged
          # host sibling, and the empty cache forces a release-asset fetch.
          SMOKE_DIR="$RUNNER_TEMP/nub-canary-template-fetch"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          cp artifacts/nub-linux-x64/bin/nub "$SMOKE_DIR/nub"
          chmod +x "$SMOKE_DIR/nub"
          printf '%s\n' 'console.log("immutable launcher fetch smoke")' > "$SMOKE_DIR/fixture.js"
          NODE_VERSION="$(node --version)"
          NODE_VERSION="${NODE_VERSION#v}"
          # The COMPILER's template cache is `discovery::cache_dir()`, which reads
          # XDG_CACHE_HOME and appends a `nub` segment. `__NUB_COMPILE_CACHE_DIR`
          # is read only by the compiled artifact's launcher
          # (crates/nub-launcher/src/cache.rs), so pointing this smoke at it left
          # the fetch landing in the real ~/.cache/nub and made both the
          # cache-was-empty precondition vacuous and the cache-entry assertion
          # fail on every release.
          CACHE_LAUNCHER="$SMOKE_DIR/cache/nub/compile-launchers/$VERSION/nub-launcher-win32-x64.exe"
          test ! -e "$SMOKE_DIR/nub-launcher-win32-x64.exe" && test ! -e "$SMOKE_DIR/nub-launcher-win32-x64" \
            || { echo "::error::immutable canary launcher-fetch smoke has a foreign sibling template"; exit 1; }
          test ! -e "$CACHE_LAUNCHER" \
            || { echo "::error::immutable canary launcher-fetch smoke cache was not empty"; exit 1; }
          env -u __NUB_LAUNCHER_TEMPLATE -u NUB_RELEASE_BASE_URL -u GH_TOKEN -u GITHUB_TOKEN \
            XDG_CACHE_HOME="$SMOKE_DIR/cache" \
            "$SMOKE_DIR/nub" compile --smol --target "$NODE_VERSION" \
              --platform win32-x64 --out "$SMOKE_DIR/fetch-smoke.exe" "$SMOKE_DIR/fixture.js"
          test -f "$SMOKE_DIR/fetch-smoke.exe" \
            || { echo "::error::immutable cross-target launcher fetch produced no artifact"; exit 1; }
          test -f "$CACHE_LAUNCHER" \
            || { echo "::error::immutable canary launcher fetch did not create the versioned cache entry"; exit 1; }
          cmp -s "$CACHE_LAUNCHER" "release-archives/nub-launcher-win32-x64.exe" \
            || { echo "::error::immutable canary launcher cache bytes differ from the reconciled release asset"; exit 1; }
          echo "✓ copied packaged CLI fetched the immutable win32-x64 template (no sibling fallback)"

  canary-publish-npm:
    name: Publish canary to npm
    # Canary runs only — npm advances only after the immutable release
    # matching this package version is complete, so cross-target compile fetches
    # cannot observe a published package whose versioned launcher assets are absent.
    # Mirrors publish-npm above (keep the two in sync) with three differences:
    # the version is the uncommitted canary stamp from verify, every publish
    # carries `--tag canary` so `latest` never moves, and the gates are build +
    # glibc-floor + pre-publish smoke — not test/conformance, which canary runs
    # skip (see the `test` job comment). Deliberately its OWN job rather than a
    # conditional branch of publish-npm: threading canary through the tag job
    # would loosen its needs/if gating, and the tag path must stay untouched.
    # Publish ORDER is the safety property shared with publish-npm: all 8
    # platform packages first, the root package LAST — so `@nubjs/nub@canary`
    # only ever resolves to a version whose exact-pinned platform deps all
    # published.
    if: needs.verify.outputs.is_canary == 'true'
    needs: [verify, canary-immutable-release]
    runs-on: ubuntu-latest
    permissions:
      # Same grant as publish-npm (the job this mirrors): checkout reads; npm
      # publish authenticates via OIDC trusted publishing, which mints its
      # token from the job's OIDC identity (id-token: write). The workflow
      # baseline is `permissions: {}`, so omitting this block deny-alls the
      # job — the maiden canary run failed exactly here (npm PUT E404 from the
      # unauthenticated fallback).
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.canary_version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      # ACCEPTED TRADEOFF (maintainer, 2026-07-24): zizmor's cache-poisoning
      # audit flags publishing from a main-push-triggered workflow whose build
      # jobs restore rust/pnpm caches — a poisoned Actions cache could in
      # theory reach published canary bits. Accepted: the tag-path stable
      # releases build from these same caches, and cold-building 8 platforms
      # per push is not worth the surface reduction (bun/deno ship canaries
      # the same way). setup-node is v5-pinned by SHA like every other action.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Preflight — loader packages must exist and be trusted on npm
        run: |
          # Mirrors publish-npm's preflight (keep the two in sync): the loader
          # packages must have been first-published + trusted once
          # (scripts/npm-first-publish-loader.sh; npm OIDC cannot create a
          # package, npm/cli#8544). Fails BEFORE anything publishes.
          missing=0
          ROOT="$(node -p "require('./npm/loader/package.json').name")"
          for name in "$ROOT" @nubjs/loader-darwin-arm64 @nubjs/loader-darwin-x64 @nubjs/loader-linux-x64 @nubjs/loader-linux-x64-musl @nubjs/loader-linux-arm64 @nubjs/loader-linux-arm64-musl @nubjs/loader-win32-x64 @nubjs/loader-win32-arm64; do
            if ! npm view "$name" versions >/dev/null 2>&1; then
              echo "::error::$name does not exist on npm — run scripts/npm-first-publish-loader.sh once (see its header)"
              missing=1
            fi
          done
          exit $missing

      - name: Prepare and publish loader packages (idempotent)
        run: |
          # Mirrors publish-npm's loader step (keep the two in sync): the loader
          # family publishes FIRST so a failure lands before @nubjs/nub's
          # irreversible publishes below; within the family, platform addon
          # packages first, root last, every publish tagged canary.
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/loader-$platform"
            if [ ! -d "$PKG" ]; then
              echo "⚠️  Skipping loader-$platform (not built)"
              continue
            fi
            cp "npm/loader-$platform/package.json" "$PKG/package.json"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$PKG/package.json', 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync('$PKG/package.json', JSON.stringify(p, null, 2));
            "
            NAME="@nubjs/loader-$platform"
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "✓ $NAME@$VERSION already published — skipping"
              continue
            fi
            echo "→ $NAME@$VERSION (canary)"
            (cd "$PKG" && npm publish --access public --tag canary)
          done
          node scripts/build-loader-npm.mjs --addon /nonexistent
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/loader/package.json', 'utf8'));
            p.version = process.env.VERSION;
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('npm/loader/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          NAME="$(node -p "require('./npm/loader/package.json').name")"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "✓ $NAME@$VERSION already published — skipping"
          else
            echo "→ $NAME@$VERSION (canary)"
            (cd npm/loader && npm publish --access public --tag canary)
          fi

      - name: Prepare and publish platform packages (idempotent)
        run: |
          # Same idempotent loop as publish-npm: a re-run skips already-published
          # versions instead of aborting on npm's E403.
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/nub-$platform"
            if [ ! -d "$PKG" ]; then
              echo "⚠️  Skipping $platform (not built)"
              continue
            fi
            cp "npm/nub-$platform/package.json" "$PKG/package.json"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$PKG/package.json', 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync('$PKG/package.json', JSON.stringify(p, null, 2));
            "
            NAME="@nubjs/nub-$platform"
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "✓ $NAME@$VERSION already published — skipping"
              continue
            fi
            echo "→ $NAME@$VERSION (canary)"
            (cd "$PKG" && npm publish --access public --tag canary)
          done

      - name: Prepare and publish root package (idempotent)
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/nub/package.json', 'utf8'));
            p.version = process.env.VERSION;
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('npm/nub/package.json', JSON.stringify(p, null, 2));
          "
          if [ "$(npm view "@nubjs/nub@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "✓ @nubjs/nub@$VERSION already published — skipping"
          else
            echo "→ @nubjs/nub@$VERSION (canary)"
            (cd npm/nub && npm publish --access public --tag canary)
          fi

      - name: Prepare and publish types package (idempotent)
        run: |
          # @nubjs/types tracks the binary version in lockstep on the canary
          # channel too, so a canary install can pull matching declarations.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/nub-types/package.json', 'utf8'));
            p.version = process.env.VERSION;
            fs.writeFileSync('npm/nub-types/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          if [ "$(npm view "@nubjs/types@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "✓ @nubjs/types@$VERSION already published — skipping"
          else
            echo "→ @nubjs/types@$VERSION (canary)"
            (cd npm/nub-types && npm publish --access public --tag canary)
          fi


  canary-release:
    name: Update rolling canary release
    # The rolling `canary` prerelease remains installer/self-upgrade-facing and
    # is updated only after npm succeeds. It carries the same 32 assets as the
    # immutable versioned release but is never used by `nub compile` lookup.
    if: needs.verify.outputs.is_canary == 'true'
    needs: [verify, canary-publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      # Deletes + recreates the rolling release and the canary tag ref with
      # GITHUB_TOKEN. The workflow baseline is `permissions: {}`, so without
      # this block every gh/git write here 403s.
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.canary_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Package release archives (single binary)
        run: |
          # Mirrors stable packaging (keep in sync): bin/ plus the vestigial
          # empty runtime/ the sidecar-era self-upgrader needs, normalized
          # metadata for reproducible bytes, and a `.sha256` sidecar per archive.
          set -euo pipefail
          ARCHIVE_MTIME=315532800
          mkdir -p release-archives
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64 win32-arm64; do
            PKG="artifacts/nub-$platform"
            [ -d "$PKG" ] || { echo "skip $platform (not built)"; continue; }
            mkdir -p "$PKG/runtime"
            find "$PKG/bin" -type d -exec chmod 755 {} +
            find "$PKG/bin" -type f -exec chmod 755 {} +
            chmod 755 "$PKG/runtime"
            find "$PKG/runtime" -type f -exec chmod 644 {} +
            find "$PKG/bin" "$PKG/runtime" -exec touch -h -d "@$ARCHIVE_MTIME" {} +
            if [[ "$platform" == win32-* ]]; then
              archive="nub-$platform.zip"
              (cd "$PKG" && LC_ALL=C find bin runtime -print | LC_ALL=C sort | TZ=UTC zip -X -q "$GITHUB_WORKSPACE/release-archives/$archive" -@)
            else
              archive="nub-$platform.tar.gz"
              (cd "$PKG" && tar --sort=name --mtime="@$ARCHIVE_MTIME" --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -cf - bin runtime | gzip -n > "$GITHUB_WORKSPACE/release-archives/$archive")
            fi
            (cd release-archives && sha256sum "$archive" > "$archive.sha256")
            LEXE=""; [[ "$platform" == win32-* ]] && LEXE=".exe"
            LSRC="$PKG/bin/nub-launcher-$platform$LEXE"
            test -f "$LSRC" \
              || { echo "::error::missing nub-launcher template for $platform at $LSRC — 'nub compile --platform $platform' would have no launcher to fetch on this release."; exit 1; }
            cp "$LSRC" "release-archives/"
            (cd release-archives && sha256sum "nub-launcher-$platform$LEXE" > "nub-launcher-$platform$LEXE.sha256")
          done
          ls -la release-archives

      - name: Recreate rolling canary release
        run: |
          # Rolling tag: delete the previous release + tag, recreate at the
          # built commit. The brief no-canary window between the two self-heals
          # on the next run, and the shared `canary` concurrency group keeps two
          # canary runs from interleaving here.
          gh release delete canary --yes 2>/dev/null || true
          # The tag deletion must NOT be error-swallowed: `gh release create`
          # silently attaches to an EXISTING tag (ignoring --target), so a
          # leftover `canary` tag would pin the "new" release to the old commit.
          # Tolerate only genuine absence (first run); fail loud otherwise.
          if git ls-remote --exit-code --tags origin canary >/dev/null 2>&1; then
            # gh api, not `git push :refs/tags/canary`: the checkout no longer
            # persists credentials (artipacked), and GH_TOKEN authenticates gh.
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/canary"
          fi
          {
            echo "Rolling canary build of \`main\`, rebuilt nightly."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: $GITHUB_SHA"
            echo "- Install: \`npm install -g @nubjs/nub@canary\`"
            echo
            echo "Prerelease channel — the assets below track the head of main as of the last nightly build."
          } > canary-notes.md
          gh release create canary \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Canary $VERSION" \
            --notes-file canary-notes.md \
            release-archives/*

      - name: Verify all canary assets present (re-upload missing, else FAIL)
        shell: bash
        run: |
          set -uo pipefail
          # Same 32-asset completeness check as github-release (keep in sync),
          # against the rolling `canary` tag: list, re-upload any missing with
          # retries, fail loud if a gap survives. A canary build's `nub compile`
          # fetches its launcher templates from THIS tag, so they are as required
          # here as on a stable release.
          EXPECTED=(
            nub-darwin-arm64.tar.gz nub-darwin-arm64.tar.gz.sha256
            nub-darwin-x64.tar.gz nub-darwin-x64.tar.gz.sha256
            nub-linux-x64.tar.gz nub-linux-x64.tar.gz.sha256
            nub-linux-x64-musl.tar.gz nub-linux-x64-musl.tar.gz.sha256
            nub-linux-arm64.tar.gz nub-linux-arm64.tar.gz.sha256
            nub-linux-arm64-musl.tar.gz nub-linux-arm64-musl.tar.gz.sha256
            nub-win32-x64.zip nub-win32-x64.zip.sha256
            nub-win32-arm64.zip nub-win32-arm64.zip.sha256
            nub-launcher-darwin-arm64 nub-launcher-darwin-arm64.sha256
            nub-launcher-darwin-x64 nub-launcher-darwin-x64.sha256
            nub-launcher-linux-x64 nub-launcher-linux-x64.sha256
            nub-launcher-linux-x64-musl nub-launcher-linux-x64-musl.sha256
            nub-launcher-linux-arm64 nub-launcher-linux-arm64.sha256
            nub-launcher-linux-arm64-musl nub-launcher-linux-arm64-musl.sha256
            nub-launcher-win32-x64.exe nub-launcher-win32-x64.exe.sha256
            nub-launcher-win32-arm64.exe nub-launcher-win32-arm64.exe.sha256
          )
          TAG="canary"

          missing_assets() {
            local present
            present="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            local m=()
            for a in "${EXPECTED[@]}"; do
              if ! grep -qxF "$a" <<<"$present"; then m+=("$a"); fi
            done
            printf '%s\n' "${m[@]}"
          }

          for pass in 1 2 3; do
            mapfile -t MISSING < <(missing_assets)
            [ "${#MISSING[@]}" -eq 1 ] && [ -z "${MISSING[0]}" ] && MISSING=()
            if [ "${#MISSING[@]}" -eq 0 ]; then
              echo "✓ all ${#EXPECTED[@]} canary assets present"
              exit 0
            fi
            echo "--- pass $pass: ${#MISSING[@]} asset(s) missing: ${MISSING[*]} ---"
            for a in "${MISSING[@]}"; do
              f="release-archives/$a"
              if [ ! -f "$f" ]; then
                echo "::error::expected asset $a was never built (no $f) — cannot complete the canary release. Check the build matrix."
                exit 1
              fi
              echo "re-uploading $a"
              gh release upload "$TAG" "$f" --clobber || echo "  (upload of $a failed this pass; will retry)"
            done
            sleep 10
          done

          mapfile -t STILL < <(missing_assets)
          [ "${#STILL[@]}" -eq 1 ] && [ -z "${STILL[0]}" ] && STILL=()
          if [ "${#STILL[@]}" -ne 0 ]; then
            echo "::error::canary release is STILL missing ${#STILL[@]} asset(s) after retries: ${STILL[*]}"
            exit 1
          fi
          echo "✓ all ${#EXPECTED[@]} canary assets present"

  docker:
    name: Publish Docker images
    # Republish the official Docker images (ghcr.io/nubjs/nub) for THIS release, as a
    # same-run job rather than via docker.yml's own trigger. WHY: docker.yml used to
    # fire on `release: published`, but release.yml creates the GitHub Release with
    # the default GITHUB_TOKEN, and GitHub's anti-recursion rule means a GITHUB_TOKEN-
    # raised event does NOT trigger another workflow — so that trigger never fired for
    # an automated release and the image froze at v0.2.0. Invoking docker.yml here via
    # `workflow_call` runs the build+push INSIDE this run (no cascade) and `needs:
    # publish-npm` sequences it after `@nubjs/nub@<version>` is live on npm, which the
    # image installs at build time. The validated stable-tag path only includes
    # publishing dispatches; a build-only dispatch or a canary run cannot
    # push an image.
    needs: [verify, publish-npm]
    if: needs.verify.outputs.publish_tag != ''
    # The called workflow inherits the calling job's token scope; the GHCR push needs
    # packages:write (release.yml's top-level token has only id-token+contents).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    # docker.yml's Resolve-version step strips the validated leading v into a
    # bare NUB_VERSION.
    with:
      nub_version: ${{ needs.verify.outputs.publish_tag }}
    secrets: inherit # zizmor: ignore[secrets-inherit] docker.yml declares no workflow_call secrets, so explicit pass-through of the DOCKERHUB_TOKEN it reads would need a docker.yml change

  test-install:
    name: Test install (${{ matrix.os }})
    needs: [verify, publish-npm]
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
    strategy:
      fail-fast: false
      matrix:
        # Smoke the PUBLISHED package on every runner OS — not just linux. darwin-arm64
        # + win32-x64 catch binary-selection (bin/nub vs nub.exe) and addon-load
        # regressions a linux-only smoke misses; windows-11-arm exercises the
        # aarch64-pc-windows-msvc nub.exe that's built + published but otherwise never
        # run (free for public repos). linux-musl is a separate job below (a container,
        # not a runner OS).
        os: [ubuntu-latest, macos-14, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # zizmor: ignore[cache-poisoning] post-publish smoke of the already-published package; this job publishes nothing
        with:
          node-version: "24"
      - name: Install from npm and smoke (with propagation-race retry)
        # Wraps BOTH the install AND the smoke in a single retry loop so a transient
        # npm propagation race (optionalDependency not yet on all CDN nodes right after
        # publish — false-red on 0.0.36 and 0.0.38) self-heals instead of failing the
        # release. Up to 12 attempts with stepped backoff (30 s × first 3 retries,
        # then 60 s) ≈ 9.5 min max window. Cross-region CDN propagation can take
        # several minutes; the wider window absorbs that. A genuine bad release fails
        # every attempt (real breakage is not masked — all 12 must fail to report red).
        # The retry re-runs npm install each attempt so the binary resolves fresh.
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] installs the package this run just published to smoke it; no lockfile applies to a global install
          MAX=12; attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "--- install+smoke attempt $attempt/$MAX ---"
            if npm install -g "@nubjs/nub@$VERSION" && bash "$GITHUB_WORKSPACE/.github/scripts/smoke.sh"; then
              echo "--- attempt $attempt succeeded ---"
              exit 0
            fi
            if [ "$attempt" -ge "$MAX" ]; then
              echo "--- all $MAX attempts failed; treating as real failure ---"
              exit 1
            fi
            # Stepped backoff: 30 s for the first 3 retries (catches fast CDN sync),
            # then 60 s for subsequent retries (covers multi-minute propagation lag).
            DELAY=$( [ "$attempt" -le 3 ] && echo 30 || echo 60 )
            echo "--- attempt $attempt failed; retrying in ${DELAY}s ---"
            sleep "$DELAY"
          done

  test-install-musl:
    # The musl leg the 0.0.10 musl-detection bug slipped through — none of the
    # runner OSes above are musl, so an Alpine container is the only way to catch a
    # broken `-musl` platform-package selection / a glibc-only addon link in CI.
    # node:22-alpine also exercises a floor-ish Node on musl in one shot.
    name: Test install (linux-musl)
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
    container: node:22-alpine
    steps:
      - name: Toolchain (bash + git for checkout/smoke)
        run: apk add --no-cache bash git
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Install from npm and smoke (with propagation-race retry)
        # Same retry logic as the runner-OS legs above — musl hit the 0.0.38
        # propagation race. Wrapped identically: both install + smoke per attempt.
        # Up to 12 attempts with stepped backoff (30 s × first 3 retries, then 60 s)
        # ≈ 9.5 min max window. A genuine bad release fails every attempt.
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] installs the package this run just published to smoke it; no lockfile applies to a global install
          MAX=12; attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "--- install+smoke attempt $attempt/$MAX ---"
            if npm install -g "@nubjs/nub@$VERSION" && bash "$GITHUB_WORKSPACE/.github/scripts/smoke.sh"; then
              echo "--- attempt $attempt succeeded ---"
              exit 0
            fi
            if [ "$attempt" -ge "$MAX" ]; then
              echo "--- all $MAX attempts failed; treating as real failure ---"
              exit 1
            fi
            # Stepped backoff: 30 s for the first 3 retries (catches fast CDN sync),
            # then 60 s for subsequent retries (covers multi-minute propagation lag).
            DELAY=$( [ "$attempt" -le 3 ] && echo 30 || echo 60 )
            echo "--- attempt $attempt failed; retrying in ${DELAY}s ---"
            sleep "$DELAY"
          done

  bump-homebrew-tap:
    name: Bump Homebrew tap formula
    # Update the nubjs/homebrew-tap formula after a validated stable release. A
    # build-only dispatch and a canary run do not reach this job. Gated on
    # `verify`'s computed output rather than re-deriving the condition from the
    # event, because this branch adds release jobs main does not have and the
    # output is the one place that already decides "is this a real publish".
    if: needs.verify.outputs.publish_version != ''
    needs: [verify, github-release]
    # macOS, not ubuntu: the "Install the formula before pushing it" step below is
    # the only thing that ever exercises the generated formula, and it needs a real
    # `brew` plus the darwin asset the overwhelming majority of tap users install.
    # Homebrew is preinstalled on the macOS runner image.
    runs-on: macos-latest
    permissions:
      # Reads this repo + the release's .sha256 sidecars; the tap push itself
      # uses the HOMEBREW_TAP_TOKEN PAT, not the job token.
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
    steps:
      # Check out the nub repo for the formula generator script.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # Push access to nubjs/homebrew-tap is CROSS-REPO, so the default
      # GITHUB_TOKEN (scoped to nubjs/nub only) cannot push there. A PAT (or
      # fine-grained token) with contents:write on nubjs/homebrew-tap must be
      # added as the HOMEBREW_TAP_TOKEN repo secret. If the secret is absent
      # (empty string), skip the bump rather than fail the release.
      - name: Check tap token present
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret absent — skipping Homebrew tap bump. Add a PAT with contents:write on nubjs/homebrew-tap to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 # zizmor: ignore[artipacked] the commit-and-push step below pushes with this checkout's persisted HOMEBREW_TAP_TOKEN
        with:
          repository: nubjs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Regenerate formula for this release
        if: steps.gate.outputs.enabled == 'true'
        env:
          # The generator reads the release's `.sha256` sidecars via `gh`; the
          # default GITHUB_TOKEN can read nubjs/nub releases.
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/gen-homebrew-formula.sh "$VERSION" homebrew-tap/Formula/nub.rb

      # The formula hardcodes the archive's internal layout, and nothing else in
      # this workflow reads it — so before v0.7.0 a layout change could reach the
      # tap untested and every `brew install` would fail on a user's machine
      # (#676: the archive stopped shipping bin/nubx, the formula kept installing
      # it). Installing it here, from a throwaway local tap, is what makes the
      # push safe. A failure skips the push, leaving the tap on the previous
      # working formula, and turns the release run red.
      - name: Install the formula before pushing it
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          # A tap is just a directory under Library/Taps — created by hand rather
          # than with `brew tap-new`, which inits a git repo and commits, and so
          # needs a git identity the runner does not have.
          TAP_DIR="$(brew --repository)/Library/Taps/local/homebrew-formula-check/Formula"
          mkdir -p "$TAP_DIR"
          cp homebrew-tap/Formula/nub.rb "$TAP_DIR/nub.rb"
          brew install local/formula-check/nub
          brew test local/formula-check/nub

      - name: Commit and push the bump
        if: steps.gate.outputs.enabled == 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/nub.rb; then
            echo "Formula already at v$VERSION — nothing to commit."
            exit 0
          fi
          git add Formula/nub.rb
          git commit -m "nub: update formula to v$VERSION"
          git push

  submit-winget:
    name: Submit winget manifest
    # Open/refresh the Nubjs.Nub manifest in microsoft/winget-pkgs for this release.
    # Runs after a validated stable release, because the manifest references the
    # published release-asset URLs + their SHA256 sidecars.
    #
    # HELD FOR MAINTAINER ENABLEMENT — this is an EXTERNAL, effectively-irreversible
    # publish under the nubjs publisher identity (winget-releaser opens a PR on
    # microsoft/winget-pkgs from the token owner's fork). It is a NO-OP until a
    # WINGET_PAT secret is present: the gate step below reads the secret and skips
    # the submission when it is absent (empty string), so merging this workflow
    # fires NOTHING. winget-releaser also UPDATES an existing package — the FIRST
    # version (Nubjs.Nub v1) is bootstrapped manually from the committed
    # winget/manifests/... set. Both are documented in winget/README.md.
    if: needs.verify.outputs.publish_tag != ''
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    permissions:
      # Reads this repo's release assets; the winget-pkgs submission itself
      # uses the WINGET_PAT token, not the job token.
      contents: read
    steps:
      # winget-releaser opens the PR under a FORK of microsoft/winget-pkgs owned by
      # the WINGET_PAT account. The default GITHUB_TOKEN cannot fork or push there,
      # so a classic PAT (scope: public_repo) — or a fine-grained token with
      # contents+pull-requests:write on that fork — must be added as the WINGET_PAT
      # repo secret. Absent the secret (empty string), skip rather than fail.
      - name: Check winget token present
        id: gate
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          VERSION: ${{ needs.verify.outputs.publish_version }}
        run: |
          if [ -z "${WINGET_PAT:-}" ]; then
            echo "::warning::WINGET_PAT secret absent — skipping winget-pkgs submission. See winget/README.md to enable."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit manifest to winget-pkgs
        if: steps.gate.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: Nubjs.Nub
          version: ${{ steps.gate.outputs.version }}
          release-tag: ${{ needs.verify.outputs.publish_tag }}
          # Match only the two Windows portable zips this release uploads.
          installers-regex: '^nub-win32-(x64|arm64)\.zip$'
          token: ${{ secrets.WINGET_PAT }}
