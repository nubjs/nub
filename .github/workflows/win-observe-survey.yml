# Branch-scoped Windows observability survey (see .claude/skills/ci-adhoc-test) -- NO PR needed.
#
# Question: what can actually SEE a process tree's filesystem writes on Windows,
# with administrator god-mode available? Specifically whether any mechanism
# resolves the DESTINATION of a rename and of a hardlink, whether anything sees a
# memory-mapped write, and whether a minifilter -- Process Monitor's, Sysmon's, or
# one of our OWN -- is deployable on a hosted runner.
#
# Run 1 (31119867421) settled: runner is admin, Secure Boot off, `testsigning Yes`
# already in the BCD, Procmon's minifilter attaches headlessly, ETW event 27
# carries the rename destination in a `FilePath` field at keyword 0x800. It left
# three holes, which this run closes: the mmap workload threw and never ran, the
# NT Kernel Logger never started, and Sysmon's install returned 87.
name: win-observe-survey
on:
  push:
    branches: [win-observe-survey]
    paths:
      - 'tests/win-observe-survey/**'
      - '.github/workflows/win-observe-survey.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    name: filesystem observability survey (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # ============================================================== DRIVER GATE
      # Run 1 found `testsigning Yes` in the runner's BCD store. The BCD value is
      # not the runtime state, so this asks the KERNEL directly, then tries to
      # actually load a driver signed by a self-signed cert. If that works, a
      # minifilter of our own is deployable on hosted CI and the whole ranking
      # changes; if it doesn't, only someone else's pre-signed driver is.
      - name: '00 runtime code-integrity state + self-signed driver load'
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force C:\obs | Out-Null
          Write-Host "== bcdedit (as shipped, untouched) =="
          bcdedit /enum "{current}" | Select-String 'testsigning|nointegritychecks|hypervisor'
          Write-Host "== SecureBoot =="
          try { "SecureBoot: " + (Confirm-SecureBootUEFI) } catch { "Confirm-SecureBootUEFI threw: $($_.Exception.Message)" }

          Write-Host ""
          Write-Host "== NtQuerySystemInformation(SystemCodeIntegrityInformation) -- the RUNTIME state =="
          Add-Type -Path .\tests\win-observe-survey\CodeIntegrity.cs
          try {
            $o = [CI]::Options()
            "CodeIntegrityOptions = 0x{0:X}" -f $o
            "  CODEINTEGRITY_OPTION_ENABLED       (0x001): {0}" -f [bool]($o -band 0x1)
            "  CODEINTEGRITY_OPTION_TESTSIGN      (0x002): {0}" -f [bool]($o -band 0x2)
            "  CODEINTEGRITY_OPTION_UMCI_ENABLED  (0x004): {0}" -f [bool]($o -band 0x4)
            "  CODEINTEGRITY_OPTION_DEBUGMODE     (0x080): {0}" -f [bool]($o -band 0x80)
            "  CODEINTEGRITY_OPTION_HVCI_KMCI_ENABLED (0x400): {0}" -f [bool]($o -band 0x400)
          } catch { "CI query failed: $($_.Exception.Message)" }

          Write-Host ""
          Write-Host "== can a SELF-SIGNED kernel driver load? =="
          # null.sys is a real, tiny, already-installed driver. Re-signing a COPY
          # with our own cert replaces Microsoft's signature, so a successful
          # start proves self-signed kernel code is accepted right now.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=NubSurveyTestCert' `
                    -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -NotAfter (Get-Date).AddDays(2)
          $pw = ConvertTo-SecureString -String 'p' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath C:\obs\t.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath C:\obs\t.cer | Out-Null
          Import-Certificate -FilePath C:\obs\t.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath C:\obs\t.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          Copy-Item C:\Windows\System32\drivers\null.sys C:\obs\nubtest.sys -Force
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          Write-Host "signtool: $($st.FullName)"
          if ($st) {
            & $st.FullName sign /f C:\obs\t.pfx /p p /fd sha256 C:\obs\nubtest.sys
            Write-Host "signtool EXIT=$LASTEXITCODE"
            & $st.FullName verify /pa /v C:\obs\nubtest.sys
            Write-Host "verify EXIT=$LASTEXITCODE"
          }
          sc.exe create nubtestdrv type= kernel start= demand binPath= C:\obs\nubtest.sys
          Write-Host "sc create EXIT=$LASTEXITCODE"
          sc.exe start nubtestdrv
          Write-Host "⛔ sc start EXIT=$LASTEXITCODE  (0 => SELF-SIGNED DRIVERS LOAD; 577 => signature rejected)"
          Write-Host "== System log entries for the load attempt =="
          Get-WinEvent -LogName System -MaxEvents 60 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'nubtest|signature|Code Integrity' } |
            Select-Object -First 8 | ForEach-Object { "  [$($_.Id)] $($_.Message -replace "`r?`n",' ')" }
          sc.exe stop nubtestdrv 2>$null | Out-Null
          sc.exe delete nubtestdrv 2>$null | Out-Null

      # ================================================== ETW: control vs +0x800
      - name: '01 ETW Kernel-File 0x11F0 (CONTROL) vs 0x1BF0, attributed per event ID'
        continue-on-error: true
        run: |
          foreach ($arm in @(@{n='A'; m='0x11F0'}, @{n='B'; m='0x1BF0'})) {
            $root = "C:\obs\kf$($arm.n)"
            New-Item -ItemType Directory -Force $root | Out-Null
            [System.IO.File]::WriteAllBytes("$root\omega_PREMMAP.bin", (New-Object byte[] 65536))
            logman start "nubkf$($arm.n)" -p "Microsoft-Windows-Kernel-File" $arm.m 0xFF `
              -o "C:\obs\kf$($arm.n).etl" -ets -bs 1024 -nb 64 320 -mode Sequential -max 512
            Start-Sleep -Seconds 2
            & .\tests\win-observe-survey\workload.ps1 -Root $root
            Start-Sleep -Seconds 3
            logman stop "nubkf$($arm.n)" -ets
            tracerpt "C:\obs\kf$($arm.n).etl" -o "C:\obs\kf$($arm.n).xml" -of XML -summary "C:\obs\kf$($arm.n).summary.txt" -y
            Write-Host ""
            Write-Host "===== ARM $($arm.n): keyword $($arm.m) ====="
            Get-Content "C:\obs\kf$($arm.n).summary.txt" | Select-String 'Total Events'
            & .\tests\win-observe-survey\scan-etw.ps1 -Path "C:\obs\kf$($arm.n).xml" -Label "Kernel-File $($arm.m)"
          }
          Write-Host ""
          Write-Host "== ARM B: every event 26/27/28 record, in full =="
          Select-String -Path C:\obs\kfB.xml -Pattern '<Data Name="FilePath">' -Context 12,0 |
            ForEach-Object { ($_.Context.PreContext + $_.Line) -join "`n"; "---" }

      # ============================================ legacy NT Kernel Logger (WPR)
      # logman's `-p "Windows Kernel Trace" (kw,…)` form returned "Type mismatch"
      # in run 1. WPR ships in Windows and drives the same system trace provider
      # through a named profile, so it sidesteps the quoting entirely.
      - name: '02 NT Kernel Logger via wpr (FileIO profile)'
        continue-on-error: true
        run: |
          $root = 'C:\obs\nt'
          New-Item -ItemType Directory -Force $root | Out-Null
          [System.IO.File]::WriteAllBytes("$root\omega_PREMMAP.bin", (New-Object byte[] 65536))
          wpr -cancel 2>$null | Out-Null
          wpr -start FileIO -filemode
          Write-Host "wpr -start EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 2
          & .\tests\win-observe-survey\workload.ps1 -Root $root
          Start-Sleep -Seconds 3
          wpr -stop C:\obs\nt.etl
          Write-Host "wpr -stop EXIT=$LASTEXITCODE"
          Get-ChildItem C:\obs\nt.etl -ErrorAction SilentlyContinue | Select-Object Name,Length
          tracerpt C:\obs\nt.etl -o C:\obs\nt.xml -of XML -summary C:\obs\nt.summary.txt -y
          Get-Content C:\obs\nt.summary.txt -ErrorAction SilentlyContinue | Select-Object -First 45
          & .\tests\win-observe-survey\scan.ps1 -Path C:\obs\nt.xml -Mechanism 'NT Kernel Logger (wpr FileIO)'
          Write-Host ""
          Write-Host "== does the legacy logger carry a rename DESTINATION, and in which event? =="
          Select-String -Path C:\obs\nt.xml -Pattern 'RENAMEDEST|ABANDONRENAME|ABANDONLINK|LINKDEST' -Context 20,4 |
            Select-Object -First 4 | ForEach-Object { $_.Context.PreContext; ">>> " + $_.Line; "" }
          Write-Host ""
          Write-Host "== MapFile / section events in the legacy logger? =="
          (Select-String -Path C:\obs\nt.xml -Pattern 'MapFile|VirtualAlloc|PageFault' -AllMatches).Matches.Count

      # ============================================ MINIFILTER via Process Monitor
      - name: '03 Process Monitor headless -- rename/link/mmap detail'
        continue-on-error: true
        run: |
          $root = 'C:\obs\pm'
          New-Item -ItemType Directory -Force $root, C:\obs\pmtool | Out-Null
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/ProcessMonitor.zip' -OutFile C:\obs\pmtool\pm.zip -UseBasicParsing
          Expand-Archive C:\obs\pmtool\pm.zip -DestinationPath C:\obs\pmtool -Force
          $exe = 'C:\obs\pmtool\Procmon64.exe'
          [System.IO.File]::WriteAllBytes("$root\omega_PREMMAP.bin", (New-Object byte[] 65536))
          Start-Process -FilePath $exe -ArgumentList '/AcceptEula','/Quiet','/Minimized','/BackingFile','C:\obs\pmlog.pml'
          Start-Process -FilePath $exe -ArgumentList '/WaitForIdle' -Wait
          Write-Host "== fltmc (minifilter attached?) =="; fltmc filters | Select-String 'PROCMON|Filter Name'
          & .\tests\win-observe-survey\workload.ps1 -Root $root
          Start-Sleep -Seconds 3
          Start-Process -FilePath $exe -ArgumentList '/Terminate' -Wait
          Start-Sleep -Seconds 5
          Start-Process -FilePath $exe -ArgumentList '/AcceptEula','/OpenLog','C:\obs\pmlog.pml','/SaveAs','C:\obs\pmlog.csv' -Wait
          Start-Sleep -Seconds 3
          Get-ChildItem C:\obs\pmlog.pml, C:\obs\pmlog.csv | Select-Object Name,Length
          & .\tests\win-observe-survey\scan.ps1 -Path C:\obs\pmlog.csv -Mechanism 'Process Monitor (minifilter, headless)'
          Write-Host ""
          Write-Host "== the RENAME and LINK operations themselves (source in Path, dest in Detail) =="
          Select-String -Path C:\obs\pmlog.csv -Pattern 'SetRenameInformationFile|SetLinkInformationFile' |
            ForEach-Object { $_.Line } | Select-Object -First 20
          Write-Host ""
          Write-Host "== the ABANDON pair =="
          Select-String -Path C:\obs\pmlog.csv -Pattern 'ABANDONRENAME|ABANDONLINK' | ForEach-Object { $_.Line } | Select-Object -First 12
          Write-Host ""
          Write-Host "== memory-mapped writes: who is credited? =="
          Select-String -Path C:\obs\pmlog.csv -Pattern 'epsilon_MMAP|omega_PREMMAP' | ForEach-Object { $_.Line } | Select-Object -First 25
          Write-Host ""
          Write-Host "== distinct Operations recorded against our root =="
          Get-Content C:\obs\pmlog.csv | Where-Object { $_ -like '*C:\obs\pm\*' } |
            ForEach-Object { ($_ -split '","')[3] } | Group-Object | Sort-Object Count -Descending |
            ForEach-Object { "  {0,-42} {1}" -f $_.Name, $_.Count }

      # ==================================================================== Sysmon
      - name: '04 Sysmon (install returned 87 in run 1 -- use the reported schema)'
        continue-on-error: true
        run: |
          $root = 'C:\obs\sm'
          New-Item -ItemType Directory -Force $root, C:\obs\smtool | Out-Null
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Sysmon.zip' -OutFile C:\obs\smtool\sm.zip -UseBasicParsing
          Expand-Archive C:\obs\smtool\sm.zip -DestinationPath C:\obs\smtool -Force
          $sm = 'C:\obs\smtool\Sysmon64.exe'
          $schema = (& $sm -accepteula -s 2>&1 | Select-String 'schemaversion="([\d.]+)"').Matches[0].Groups[1].Value
          Write-Host "sysmon reports schemaversion $schema"
          (Get-Content .\tests\win-observe-survey\sysmon.xml -Raw) -replace 'schemaversion="[\d.]+"', "schemaversion=`"$schema`"" |
            Set-Content C:\obs\sysmon.xml -Encoding utf8
          & $sm -accepteula -i C:\obs\sysmon.xml
          Write-Host "install EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 10
          fltmc filters | Select-String 'Sysmon|Filter Name'
          [System.IO.File]::WriteAllBytes("$root\omega_PREMMAP.bin", (New-Object byte[] 65536))
          $t0 = (Get-Date).AddSeconds(-2)
          & .\tests\win-observe-survey\workload.ps1 -Root $root
          Start-Sleep -Seconds 6
          $ev = @(Get-WinEvent -LogName 'Microsoft-Windows-Sysmon/Operational' -MaxEvents 4000 -ErrorAction SilentlyContinue |
                   Where-Object { $_.TimeCreated -ge $t0 })
          Write-Host "sysmon events since workload start: $($ev.Count)"
          $ev | Group-Object Id | Sort-Object { [int]$_.Name } | ForEach-Object { "  id={0,-4} count={1}" -f $_.Name, $_.Count }
          $ev | ForEach-Object { "$($_.Id)`t$($_.Message -replace "`r?`n",' | ')" } | Set-Content C:\obs\sysmon-events.txt
          & .\tests\win-observe-survey\scan.ps1 -Path C:\obs\sysmon-events.txt -Mechanism 'Sysmon'
          Write-Host ""
          Write-Host "== does Sysmon name any DESTINATION, and under which event id? =="
          Select-String -Path C:\obs\sysmon-events.txt -Pattern 'RENAMEDEST|LINKDEST|ABANDONRENAME|ABANDONLINK|MMAP' |
            ForEach-Object { $_.Line.Substring(0, [Math]::Min(320, $_.Line.Length)) } | Select-Object -First 12
          & $sm -u force 2>&1 | Select-Object -First 3

      # ================================================================ USN journal
      - name: '05 USN change journal -- both ends, and the hardlink reason flag'
        continue-on-error: true
        run: |
          $root = 'C:\obs\usn'
          New-Item -ItemType Directory -Force $root | Out-Null
          [System.IO.File]::WriteAllBytes("$root\omega_PREMMAP.bin", (New-Object byte[] 65536))
          $next = (fsutil usn queryjournal C: | Select-String 'Next Usn\s*:\s*(0x[0-9a-fA-F]+)').Matches[0].Groups[1].Value
          & .\tests\win-observe-survey\workload.ps1 -Root $root
          Start-Sleep -Seconds 3
          fsutil usn readjournal C: startusn=$next > C:\obs\usn.txt
          & .\tests\win-observe-survey\scan.ps1 -Path C:\obs\usn.txt -Mechanism 'USN change journal'
          Write-Host ""
          Write-Host "== reason flags on each end of the rename and the hardlink =="
          Select-String -Path C:\obs\usn.txt -Pattern 'ABANDONRENAME|ABANDONLINK|nu_src|xi_src|MMAP' -Context 0,4 |
            ForEach-Object { ">>> " + $_.Line; $_.Context.PostContext; "" } | Select-Object -First 60

      - name: '06 collect artifacts'
        if: always()
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force C:\obs\out | Out-Null
          foreach ($f in @('kfA.summary.txt','kfB.summary.txt','nt.summary.txt','sysmon-events.txt','usn.txt','sysmon.xml')) {
            if (Test-Path C:\obs\$f) { Copy-Item C:\obs\$f C:\obs\out\ }
          }
          foreach ($f in @('kfA.xml','kfB.xml','nt.xml','pmlog.csv')) {
            if (Test-Path C:\obs\$f) {
              Select-String -Path C:\obs\$f -Pattern 'ABANDONRENAME|ABANDONLINK|RENAMEDEST|LINKDEST|MMAP|SHORTNAME' -Context 22,4 |
                Select-Object -First 80 | ForEach-Object { $_.Context.PreContext; ">>> " + $_.Line; $_.Context.PostContext; "" } |
                Set-Content "C:\obs\out\$f.matches.txt"
            }
          }
          Get-ChildItem C:\obs\out | Select-Object Name,Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: win-observe-survey-run2
          path: C:\obs\out
          if-no-files-found: warn
