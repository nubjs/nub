name: Sandbox native API adapter probe

on:
  push:
    branches: [sandbox-native-adapter, sandbox-native-startup]
    paths:
      - crates/nub-sandbox/**
      - tests/sandbox-native-adapter/**
      - scripts/sandbox-native-tool-fixtures.mjs
      - .github/workflows/sandbox-native-adapter.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_OVERRIDE_HOST_TRIPLE: x86_64-pc-windows-msvc
      NATIVE_FOCUSED_RUN: ${{ github.ref_name == 'sandbox-native-startup' && '1' || '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: microsoft/Detours
          ref: adb07604aa56508448b95bf037c2a6d0d3b6831a
          path: .probe-detours
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-native-adapter-x64
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          architecture: x64
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13.15'
          architecture: x64
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          coverage: none
      - name: Building the isolated native probe
        id: probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports, .native-adapter | Out-Null
          git rev-parse HEAD > reports/environment.txt
          rustc -Vv >> reports/environment.txt
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $root = $env:GITHUB_WORKSPACE
          # Launchers and their children can have different architectures.
          $targets = ,@('amd64', 'X64', 'x64')
          if ('${{ matrix.os }}' -eq 'windows-11-arm') { $targets += ,@('amd64_arm64', 'ARM64', 'arm64') }
          foreach ($target in $targets) {
            $arch, $lib, $name = $target
            @"
          @echo off
          call "$vs\VC\Auxiliary\Build\vcvarsall.bat" $arch
          if errorlevel 1 exit /b 1
          cd /d "$root\.probe-detours\src"
          nmake
          if errorlevel 1 exit /b 1
          cd /d "$root\.native-adapter"
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc /I"$root\.probe-detours\include" "$root\tests\sandbox-native-adapter\probe.cpp" /LD /link "$root\.probe-detours\lib.$lib\detours.lib" advapi32.lib /OUT:probe-$name.dll /EXPORT:ProbeMarker,@1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc "$root\tests\sandbox-native-adapter\mount-query.cpp" /Fe:mount-query-$name.exe
          if errorlevel 1 exit /b 1
          mount-query-$name.exe
          if errorlevel 1 exit /b 1
          if not "$name" == "x64" exit /b 0
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc /DPROBE_INJECTOR /I"$root\.probe-detours\include" "$root\tests\sandbox-native-adapter\probe.cpp" /Fe:injector.exe /link "$root\.probe-detours\lib.$lib\detours.lib" advapi32.lib
          "@ | Set-Content ".native-adapter/build-$name.cmd"
            cmd /c ".\.native-adapter\build-$name.cmd" *> "reports/native-build-$name.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "reports/native-build-$name.log"; exit $LASTEXITCODE }
          }
          "NUB_NATIVE_ADAPTER_PROBE_DIR=$root\.native-adapter" >> $env:GITHUB_ENV
          Get-FileHash .native-adapter/*.dll, .native-adapter/injector.exe | ConvertTo-Json >> reports/environment.txt
      - name: Checking sandbox targets
        id: compile
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --all-targets --all-features -- -D warnings 2>&1 | tee reports/clippy.log
          cargo test -p nub-sandbox --profile fast --lib --no-run 2>&1 | tee reports/test-build.log
      - name: Compiling documented compatibility policies
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: cargo test -p nub-sandbox --profile fast --test compatibility_examples -- --nocapture
      - name: Comparing raw and adapted native operations
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.probe.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib native_adapter_primitives_with_raw_and_plain_controls -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/native-adapter.log
      - name: Checking embedded native adapter primitives
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib embedded_native_adapter_primitives_with_raw_and_plain_controls -- --nocapture --test-threads=1 2>&1 | tee reports/embedded-native-adapter.log
      - name: Checking the public grammar
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test production_readiness_grammar -- --nocapture --test-threads=1 2>&1 | tee reports/grammar.log
      - name: Checking public sessions as a standard user
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: pwsh
        run: |
          & cargo test -p nub-sandbox --profile fast --test production_readiness_windows --no-run --message-format=json-render-diagnostics > reports/standard-user-artifacts.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = Get-Content reports/standard-user-artifacts.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          $test = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'production_readiness_windows' -and $_.executable })
          if ($test.Count -ne 1) { throw "Expected one exact Windows probe executable, got $($test.Count)" }
          & ./tests/sandbox-native-adapter/run-standard-user.ps1 -TestBinary $test[0].executable -ReportDirectory reports
          exit $LASTEXITCODE
      - name: Checking native ownership and cleanup with the embedded adapter
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        env:
          NUB_NATIVE_EMBEDDED_ADAPTER: '1'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib backend::windows::native_child_tests -- --nocapture --test-threads=1 2>&1 | tee reports/embedded-ownership.log
          cargo test -p nub-sandbox --profile fast --lib backend::windows::windows_cleanup_tests -- --nocapture --test-threads=1 2>&1 | tee reports/embedded-cleanup.log
          for report in reports/embedded-ownership.log reports/embedded-cleanup.log; do
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$report" || exit 1
          done
      - name: Provisioning the existing pinned tool fixtures
        id: tools
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          rustup set default-host x86_64-pc-windows-msvc
          if [ -n "$NATIVE_FOCUSED_RUN" ]; then
            node scripts/sandbox-native-tool-fixtures.mjs --tools=cargo 2>&1 | tee reports/native-provision.log
          else
            node scripts/sandbox-native-tool-fixtures.mjs --tools=cargo,go,composer 2>&1 | tee reports/native-provision.log
            node scripts/sandbox-python-fixtures.mjs 2>&1 | tee reports/python-provision.log
            cp .sandbox-python-fixtures/matrix.json reports/python-matrix.json
          fi
          node scripts/sandbox-tool-fixtures.mjs 2>&1 | tee reports/js-provision.log
          cp .sandbox-native-tool-fixtures/matrix.json reports/native-matrix.json
          cp .sandbox-tool-fixtures/matrix.json reports/js-matrix.json
      - name: Preparing a disposable ASLR-enabled MSYS runtime
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: pwsh
        run: |
          $gitExec = (& git --exec-path).Trim()
          & ./tests/sandbox-native-adapter/prepare-msys-aslr.ps1 -SourceRoot (Split-Path (Split-Path (Split-Path $gitExec)))
          & ./tests/sandbox-native-adapter/prepare-msys-aslr.ps1 -SourceRoot (Split-Path (Split-Path (Split-Path $gitExec))) -IncludeExecutables
      - name: Comparing existing native tool sequences
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: pwsh
        run: |
          $cases = @(
            @('cargo', 'native_tool_functionality_probe::cargo_unconfined', 'native_tool_functionality_probe::cargo_tooldirs'),
            @('go', 'native_tool_functionality_probe::go_unconfined', 'native_tool_functionality_probe::go_tooldirs'),
            @('composer', 'native_tool_functionality_probe::composer_unconfined', 'native_tool_functionality_probe::composer_tooldirs'),
            @('uv', 'python_tool_functionality_probe::uv_unconfined', 'python_tool_functionality_probe::windows_adapter_uv_tooldirs'),
            @('pip', 'python_tool_functionality_probe::pip_unconfined', 'python_tool_functionality_probe::windows_adapter_pip_tooldirs'),
            @('git', 'git_tool_functionality_probe::git_windows_complete_runtime_plain', 'git_tool_functionality_probe::git_windows_complete_runtime_tooldirs'),
            @('git-lfs', 'git_tool_functionality_probe::git_windows_complete_runtime_lfs_plain', 'git_tool_functionality_probe::git_windows_complete_runtime_lfs_tooldirs')
          )
          foreach ($tool in @('npm', 'pnpm9', 'pnpm10', 'pnpm11', 'yarn1', 'yarn2', 'yarn3', 'yarn4', 'bun132', 'bun140')) {
            $cases += ,@($tool, "js_tool_functionality_probe::windows_native_$($tool)_plain", "js_tool_functionality_probe::windows_native_$($tool)_tooldirs")
          }
          if ($env:NATIVE_FOCUSED_RUN) {
            $cases = @($cases | Where-Object { $_[0] -in @('cargo', 'git', 'git-lfs', 'bun132', 'bun140') })
            Write-Host 'Focused startup diagnostics; this is not the full compatibility matrix'
          }
          $results = @()
          $gitExec = (& git --exec-path).Trim()
          $msysRoot = Split-Path (Split-Path (Split-Path $gitExec))
          if (!(Test-Path "$msysRoot/usr/bin/bash.exe")) { throw "Git's MSYS shell is missing: $msysRoot" }
          & git --version >> reports/environment.txt
          & "$msysRoot/usr/bin/bash.exe" -lc 'uname -a' >> reports/environment.txt
          Get-FileHash "$msysRoot/usr/bin/msys-2.0.dll", "$msysRoot/usr/bin/bash.exe", (Get-Command git).Source | ConvertTo-Json > reports/git-runtime-hashes.json
          & "$msysRoot/usr/bin/bash.exe" -lc 'while IFS= read -r line; do case "$line" in *msys-2.0.dll*) printf "%s\n" "$line";; esac; done < /proc/self/maps' > reports/msys-plain-mapping.log
          if ($LASTEXITCODE -ne 0) { throw 'Plain MSYS mapping control failed' }
          $modes = @('plain', 'raw', 'embedded')
          $originalPath = $env:PATH
          if ('${{ steps.probe.outcome }}' -eq 'success') { $modes += 'adapter' }
          foreach ($case in $cases) {
            $toolModes = $modes
            if ($case[0] -notin @('git', 'git-lfs')) { $toolModes += @('msys-plain', 'msys-embedded') }
            if ($case[0] -in @('git', 'git-lfs')) { $toolModes += @('dynamicbase-plain', 'dynamicbase-embedded', 'dynamicbase-adapter') }
            if ($case[0] -eq 'cargo') { $toolModes += @('msys-dynamicbase-plain', 'msys-dynamicbase-adapter') }
            if ($case[0] -eq 'git-lfs') { $toolModes += 'dynamicbase-section-adapter' }
            if ($case[0] -eq 'cargo') { $toolModes += 'msys-dynamicbase-section-adapter' }
            if ($case[0] -eq 'git-lfs') { $toolModes += 'dynamicbase-sync-adapter' }
            if ($case[0] -eq 'cargo') { $toolModes += 'msys-dynamicbase-sync-adapter' }
            if ($case[0] -eq 'git-lfs') { $toolModes += 'dynamicbase-null-adapter' }
            if ($case[0] -eq 'git-lfs') { $toolModes += @('dynamicbase-allimages-plain', 'dynamicbase-allimages-null-adapter') }
            if ($case[0] -eq 'cargo') { $toolModes += @('msys-dynamicbase-allimages-plain', 'msys-dynamicbase-allimages-null-adapter') }
            if ($case[0] -eq 'bun132') { $toolModes += 'mount-query-adapter' }
            foreach ($mode in $toolModes) {
              $env:PATH = $originalPath
              $selectedMsys = $msysRoot
              if ($mode.Contains('dynamicbase-')) {
                if (!$env:NUB_NATIVE_DYNAMICBASE_GIT) { throw 'ASLR runtime copy was not prepared' }
                $selectedMsys = $env:NUB_NATIVE_DYNAMICBASE_GIT
                if ($mode.Contains('allimages-')) {
                  if (!$env:NUB_NATIVE_DYNAMICBASE_ALLIMAGES_GIT) { throw 'ASLR executable copy was not prepared' }
                  $selectedMsys = $env:NUB_NATIVE_DYNAMICBASE_ALLIMAGES_GIT
                }
                $env:PATH = "$selectedMsys/cmd;$selectedMsys/mingw64/bin;$selectedMsys/usr/bin;$originalPath"
              }
              Remove-Item Env:NUB_SANDBOX_TOOL_MSYS_ROOT -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_ANCESTOR_NODES -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_ADAPTER_PROBE_ENABLE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_EMBEDDED_ADAPTER -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_DIRECTORY_MASK_PROBE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_MOUNT_QUERY_PROBE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_RELOCATION_PROBE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_RELOCATION_TREE_PROBE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_SECTION_DACL_PROBE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_SYNC_DACL_PROBE -ErrorAction SilentlyContinue
              Remove-Item Env:NUB_NATIVE_NT_NULL_PROBE -ErrorAction SilentlyContinue
              if ($mode -in @('adapter', 'nodes-adapter', 'directory-mask-adapter', 'mount-query-adapter', 'relocation-root-adapter', 'relocation-tree-adapter', 'msys-relocation-tree-adapter', 'dynamicbase-adapter', 'msys-dynamicbase-adapter')) { $env:NUB_NATIVE_ADAPTER_PROBE_ENABLE = '1' }
              if ($mode.Contains('relocation-')) { $env:NUB_NATIVE_RELOCATION_PROBE = '1' }
              if ($mode.Contains('relocation-tree-')) { $env:NUB_NATIVE_RELOCATION_TREE_PROBE = '1' }
              if ($mode.Contains('section-adapter')) {
                $env:NUB_NATIVE_ADAPTER_PROBE_ENABLE = '1'
                $env:NUB_NATIVE_SECTION_DACL_PROBE = '1'
              }
              if ($mode.Contains('sync-adapter')) {
                $env:NUB_NATIVE_ADAPTER_PROBE_ENABLE = '1'
                $env:NUB_NATIVE_SECTION_DACL_PROBE = '1'
                $env:NUB_NATIVE_SYNC_DACL_PROBE = '1'
              }
              if ($mode.Contains('null-adapter')) {
                $env:NUB_NATIVE_ADAPTER_PROBE_ENABLE = '1'
                $env:NUB_NATIVE_SECTION_DACL_PROBE = '1'
                $env:NUB_NATIVE_SYNC_DACL_PROBE = '1'
                $env:NUB_NATIVE_NT_NULL_PROBE = '1'
              }
              if ($mode -in @('directory-mask-adapter', 'mount-query-adapter')) { $env:NUB_NATIVE_DIRECTORY_MASK_PROBE = '1' }
              if ($mode -eq 'mount-query-adapter') { $env:NUB_NATIVE_MOUNT_QUERY_PROBE = '1' }
              if ($mode -in @('embedded', 'msys-embedded', 'nodes-embedded', 'dynamicbase-embedded')) { $env:NUB_NATIVE_EMBEDDED_ADAPTER = '1' }
              if ($mode.StartsWith('nodes-')) { $env:NUB_NATIVE_ANCESTOR_NODES = '1' }
              if ($mode.StartsWith('msys-')) { $env:NUB_SANDBOX_TOOL_MSYS_ROOT = $selectedMsys }
              $test = if ($mode -eq 'plain' -or $mode.EndsWith('-plain')) { $case[1] } else { $case[2] }
              & cargo test -p nub-sandbox --profile fast --lib $test -- --exact --ignored --nocapture --test-threads=1 *> "reports/$($case[0])-$mode.log"
              $code = $LASTEXITCODE
              $results += @{ tool = $case[0]; mode = $mode; test = $test; exit = $code }
              $results | ConvertTo-Json > reports/tool-results.json
              Write-Host "$($case[0]) $mode exit=$code"
              Get-Content "reports/$($case[0])-$mode.log" -Tail 20
            }
          }
          $env:PATH = $originalPath
          Remove-Item Env:NUB_NATIVE_ADAPTER_PROBE_ENABLE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_SANDBOX_TOOL_MSYS_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_ANCESTOR_NODES -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_EMBEDDED_ADAPTER -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_DIRECTORY_MASK_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_MOUNT_QUERY_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_RELOCATION_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_RELOCATION_TREE_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_SECTION_DACL_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_SYNC_DACL_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:NUB_NATIVE_NT_NULL_PROBE -ErrorAction SilentlyContinue
          $results | ConvertTo-Json > reports/tool-results.json
          # Diagnostic DLL/ancestor/mask alternatives remain results, not production verdicts.
          if ($results | Where-Object { $_.mode -in @('plain', 'embedded', 'msys-plain', 'msys-embedded') -and $_.exit -ne 0 }) { exit 1 }
          exit 0
      - name: Checking archived Bun packages and real global entrypoints
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        env:
          NUB_NATIVE_EMBEDDED_ADAPTER: '1'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib js_tool_functionality_probe::windows_bun140_link_primitives_and_global_sources -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee reports/bun-global-entrypoint.log
      - name: Checking Bun 1.3.2 archive entrypoints with mount-query probe
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        env:
          NUB_NATIVE_ADAPTER_PROBE_ENABLE: '1'
          NUB_NATIVE_DIRECTORY_MASK_PROBE: '1'
          NUB_NATIVE_MOUNT_QUERY_PROBE: '1'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib js_tool_functionality_probe::windows_bun132_link_primitives_and_global_sources -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee reports/bun132-global-entrypoint.log
      - name: Checking Bun 1.3.2 archive entrypoints with the embedded adapter
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        env:
          NUB_NATIVE_EMBEDDED_ADAPTER: '1'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib js_tool_functionality_probe::windows_bun132_link_primitives_and_global_sources -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee reports/bun132-embedded-global-entrypoint.log
      - name: Preserving native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-adapter-${{ matrix.os }}
          path: reports
