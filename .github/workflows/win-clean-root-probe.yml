# Branch-scoped Windows probe for the clean-DACL working root (no PR required).
#
# Answers two things a green `cargo test` on this repo cannot:
#   1. What a STOCK Windows machine's ancestor chain actually looks like for
#      `ALL APPLICATION PACKAGES` + `SE_DACL_PROTECTED` — the survey the fix rests on.
#   2. Whether establishing the protected root needs ADMIN. The windows-latest job user
#      is an administrator, so the admin leg alone cannot answer that; the second job
#      creates a standard local user and re-runs the same binary as that user.
#
# ANSWERS (run 30321816008, both jobs green):
#   1. Volume roots are not uniform — `C:\` grants AAP nothing, `D:\` grants 0x001200a9,
#      `C:\Users` grants 0x001200a9. EVERY AAP ace found is NON-INHERITABLE, and
#      `C:\Users\<name>` is SE_DACL_PROTECTED. So a path under the profile already
#      qualified; a path on another volume or at a volume root never could.
#   2. No admin. The standard user (BUILTIN\Users, Medium IL, no S-1-5-32-544) secured
#      roots on both volumes and kept its own read+write.
#
# Delete this file before the change graduates to a PR.
name: win-clean-root-probe
on:
  workflow_dispatch:
  push:
    branches: [fix/windows-clean-root]
    paths:
      - ".github/workflows/win-clean-root-probe.yml"
      - "crates/nub-sandbox/tests/windows_clean_root.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: Clean-root probe (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: win-clean-root-probe
          save-if: false

      - name: Host baseline
        shell: pwsh
        run: |
          whoami /all | Select-String -Pattern 'User Name|S-1-5-32-544|Mandatory Label'
          [Security.Principal.WindowsPrincipal]::new(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          ).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Get-Volume | Format-Table -AutoSize
          Write-Host "--- icacls C:\ ---";  icacls C:\
          if (Test-Path D:\) { Write-Host "--- icacls D:\ ---"; icacls D:\ }
          Write-Host "--- icacls TEMP ---"; icacls $env:TEMP
          Write-Host "--- icacls cwd ---";  icacls .

      # The residual suite drives bitsadmin, which Defender's behaviour monitor has
      # deleted mid-run before (recorded on the nub-win VM). Exclude the trees it uses so
      # a truncated run cannot masquerade as a result.
      - name: Defender exclusions for the probe trees
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP, $env:GITHUB_WORKSPACE, 'C:\' -ErrorAction SilentlyContinue
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

      - name: Build the Windows probes
        shell: pwsh
        run: |
          cargo test -p nub-sandbox --no-run `
            --test windows_clean_root --test windows_enforcement --test windows_residuals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: windows_clean_root (survey + ordinary-directory regression)
        shell: pwsh
        run: |
          cargo test -p nub-sandbox --test windows_clean_root
          exit $LASTEXITCODE

      - name: windows_enforcement (AAP trap before/after differential)
        shell: pwsh
        run: |
          cargo test -p nub-sandbox --test windows_enforcement
          exit $LASTEXITCODE

      # The deny-ACE ordering matrix lives here. Its verdict lines are the deliverable;
      # the TERMINAL line is the trust signal (a truncated run has printed FAILs and
      # still exited 0 before), so assert on it rather than on the exit status alone.
      - name: windows_residuals (deny-ACE matrix)
        shell: pwsh
        run: |
          cargo test -p nub-sandbox --test windows_residuals 2>&1 | Tee-Object -FilePath resid.log
          $rc = $LASTEXITCODE
          Write-Host "=== deny-ACE matrix verdicts ==="
          Select-String -Path resid.log -Pattern 'PROBE|INFO RT-B|ALL WINDOWS RESIDUAL|RESIDUAL PROBE'
          if (-not (Select-String -Path resid.log -Pattern 'ALL WINDOWS RESIDUAL PROBES PASSED')) {
            Write-Host "::error::residual suite did not print its terminal verdict line"
            exit 1
          }
          exit $rc

  unprivileged:
    name: Clean-root probe as a STANDARD user (no admin)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: win-clean-root-probe
          save-if: false

      - name: Build the probe and stage it outside the runner tree
        shell: pwsh
        run: |
          $out = cargo test -p nub-sandbox --test windows_clean_root --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = ($out | ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
                  Select-Object -Last 1).executable
          Write-Host "probe exe: $exe"
          New-Item -ItemType Directory -Force -Path C:\nubprobe | Out-Null
          Copy-Item $exe C:\nubprobe\windows_clean_root.exe
          "PROBE_DIR=C:\nubprobe" | Out-File -Append $env:GITHUB_ENV

      # A scheduled task with stored credentials is the only reliable non-interactive
      # "run as this other user" on a GitHub runner: Start-Process -Credential needs an
      # interactive logon the runner session cannot provide. Registering the task needs
      # admin (which this job has); the PROBE ITSELF then runs with a plain Users token,
      # which is the thing under test.
      - name: Create a standard (non-admin) local user and run the probe as them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = 'Nub-Probe-2026!x'
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name nubstd -Password $sec -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          Add-LocalGroupMember -Group Users -Member nubstd
          # Deliberately NOT in Administrators. Grant only read+execute on the staged exe.
          icacls C:\nubprobe /grant 'nubstd:(OI)(CI)RX' | Out-Null
          New-Item -ItemType Directory -Force -Path C:\nubprobe\out | Out-Null
          icacls C:\nubprobe\out /grant 'nubstd:(OI)(CI)M' | Out-Null

          # The task body goes in a FILE: schtasks caps /tr at 261 characters.
          # PowerShell, never cmd.exe: a cmd ancestor injects hidden `=C:` drive-cwd vars
          # and the sandbox rejects them as invalid env keys, which would void every cell.
          # A scheduled task starts in %SystemRoot%\System32, which a standard user cannot
          # write — and the probe creates a directory under its cwd.
          $body = @(
            'Set-Location C:\nubprobe\out',
            'whoami /groups | Out-File -Encoding utf8 C:\nubprobe\out\who.txt',
            "& 'C:\nubprobe\windows_clean_root.exe' *> 'C:\nubprobe\out\probe.txt'",
            '$LASTEXITCODE | Out-File -Encoding utf8 C:\nubprobe\out\rc.txt'
          )
          Set-Content -Encoding utf8 -Path C:\nubprobe\run.ps1 -Value $body
          icacls C:\nubprobe\run.ps1 /grant 'nubstd:(RX)' | Out-Null
          $action = 'powershell -NoProfile -ExecutionPolicy Bypass -File C:\nubprobe\run.ps1'

          # A task with stored credentials logs on as a BATCH principal, and a plain member
          # of Users has no SeBatchLogonRight — schtasks warns and the task silently never
          # runs (Last Result 267011 = SCHED_S_TASK_HAS_NOT_RUN). Extend the existing
          # assignment rather than replacing it: /areas USER_RIGHTS overwrites the whole
          # membership set for each privilege named in the .inf.
          $sid = (New-Object System.Security.Principal.NTAccount('nubstd')).
                   Translate([System.Security.Principal.SecurityIdentifier]).Value
          secedit /export /cfg C:\nubprobe\sec.inf /quiet
          $existing = (Get-Content C:\nubprobe\sec.inf | Where-Object { $_ -match '^SeBatchLogonRight' })
          $granted = if ($existing) { "$existing,*$sid" } else { "SeBatchLogonRight = *$sid" }
          Set-Content -Encoding Unicode -Path C:\nubprobe\batch.inf -Value @(
            '[Unicode]', 'Unicode=yes',
            '[Version]', 'signature="$CHICAGO$"', 'Revision=1',
            '[Privilege Rights]', $granted
          )
          secedit /configure /db C:\nubprobe\sec.sdb /cfg C:\nubprobe\batch.inf /areas USER_RIGHTS /quiet
          secedit /export /cfg C:\nubprobe\sec2.inf /quiet
          Write-Host "batch-logon assignment now: $(Get-Content C:\nubprobe\sec2.inf | Where-Object { $_ -match '^SeBatchLogonRight' })"
          schtasks /create /tn nubprobe /tr $action /sc once /st 23:59 /ru nubstd /rp $pw /rl LIMITED /f
          if ($LASTEXITCODE -ne 0) { throw "schtasks /create failed" }
          schtasks /run /tn nubprobe
          if ($LASTEXITCODE -ne 0) { throw "schtasks /run failed" }

          $deadline = (Get-Date).AddMinutes(6)
          while ((Get-Date) -lt $deadline -and -not (Test-Path C:\nubprobe\out\rc.txt)) {
            Start-Sleep -Seconds 5
          }
          Write-Host "=== task state ==="
          schtasks /query /tn nubprobe /v /fo LIST | Select-String 'Status|Last Run Time|Last Result|Run As User'
          if (Test-Path C:\nubprobe\out\who.txt) {
            Write-Host "=== probe user groups (must NOT contain S-1-5-32-544) ==="
            Get-Content C:\nubprobe\out\who.txt
          }
          Write-Host "=== probe output (as nubstd, non-admin) ==="
          if (Test-Path C:\nubprobe\out\probe.txt) { Get-Content C:\nubprobe\out\probe.txt } else { throw "probe produced no output" }
          $rc = (Get-Content C:\nubprobe\out\rc.txt -ErrorAction SilentlyContinue | Select-Object -First 1)
          Write-Host "probe exit code: '$rc'"
          if (Get-Content C:\nubprobe\out\who.txt | Select-String 'S-1-5-32-544') {
            throw "the probe user was an administrator — the unprivileged claim is unproven"
          }
          if ("$rc".Trim() -ne '' -and "$rc".Trim() -ne '0') { throw "probe failed as a standard user (exit $rc)" }
