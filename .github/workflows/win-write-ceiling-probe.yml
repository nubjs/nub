# Branch-scoped ad-hoc probe, NO pull request required (`.claude/skills/ci-adhoc-test/SKILL.md`).
#
# THE QUESTION: what is the greatest DISK permission a LowBox token can hold without elevation,
# and does a useful "maximum grantable" tier exist between today's narrow leaf grants and declining
# the token altogether? The shipping full-disk tier renders on Windows by NOT taking the token,
# which also hands the package the network, because egress denial is the withheld `internetClient`
# capability. A tier that keeps the token would keep the two axes separable.
#
# CI IS THE ONLY VENUE. An AppContainer cannot be launched over OpenSSH — sshd lands in services
# session 0, which has no window station a LowBox token can attach to, and every launch returns
# 0xC0000142 (MECHANISM-FACTS §5e/§5h). The standing `nub-win` VM therefore cannot answer this.
#
# NO RUST BUILD: PowerShell + a C# P/Invoke launcher, so a run is minutes rather than the 35+ a
# cold Windows cargo cache costs.
#
# BOTH IMAGES, `fail-fast: false`: a single-image answer to a kernel-physics question is a guess
# about the other one, and one image's failure must never hide the other's table.
name: win-write-ceiling-probe

on:
  push:
    branches: [probe/win-lowbox-write-ceiling]
  workflow_dispatch: # inert until this file reaches the default branch; `push` is what fires it

permissions:
  contents: read

jobs:
  ceiling:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe — the LowBox write ceiling
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pwsh -NoLogo -NonInteractive -File tests/win-write-ceiling/probe.ps1 *>&1 |
            Tee-Object -FilePath ceiling-${{ matrix.os }}.log
          exit 0

      - name: Upload the raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceiling-${{ matrix.os }}
          path: ceiling-${{ matrix.os }}.log
          if-no-files-found: warn
