# Branch-scoped ad-hoc probe: can a dependency lifecycle script RUN under the build jail
# on Windows at all?
#
# Two arms, one probe. The FIXED arm runs the branch as-is. The POISONED arm reverts the
# fix (tests/win-jail-cmdline/poison.patch), rebuilds, and runs the identical probe.
#
# WHAT THE DIFFERENTIAL IS. The gated property is `shell-ran-the-line`: the confined shell
# parsed the command line it was handed and began executing it, evidenced by a marker only
# a shell builtin wrote. On WINDOWS that must hold with the fix and must NOT without it,
# and the poisoned arm must additionally carry cmd.exe's own parse-failure message — a
# script can fail for a hundred reasons and only that one is the bug. On LINUX the fix is a
# deliberate no-op (there is no cmd.exe; the tail is ordinary `sh -c` argv), so BOTH arms
# must run every script in full. That is the control that the diff changed nothing on POSIX,
# and it independently proves the harness works on a platform where the bug never existed.
#
# The property is deliberately the SHELL's, not the script's. Run 30440103670 established
# that clearing the command line exposes a further Windows defect immediately behind it —
# the AppContainer withholds execute on the toolcache `node.exe` — so a verdict resting on
# the script's body would measure that defect instead of this one. See the Windows arm.
#
# THE BOTH-ARMS CONTROL, on every platform: `unjailed-quoted` runs the identical quoted
# script with `dependenciesMeta.<pkg>.sandbox: false`, so aube spawns it unconfined. It
# must pass in EVERY arm — so the probe cannot go green by being permissive, and a red
# jailed verdict cannot be a broken harness.
#
# Every step is `if: always()`, because a red step early in the job must never hide the
# end-to-end verdicts — which is the only thing this job exists to produce.
name: win-jail-cmdline-probe

on:
  push:
    branches: [sandbox/win-verbatim-cmdline, sandbox/win-interp-exec]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # A HARNESS ACCOMMODATION FOR A SEPARATE, OPEN DEFECT — deliberately not a product
      # change. Windows gives the main thread a 1MB stack against Linux's 8MB, and the
      # unoptimized `fast` profile overflows it inside `nub install` before any lifecycle
      # script runs (rc 3221225725 = 0xC00000FD, STATUS_STACK_OVERFLOW). A sibling lane
      # measured it identically in its fixed and poisoned arms, which is what makes it
      # pre-existing. Linking with a Linux-sized stack lets this probe measure the command
      # line instead of a debug-build frame-size artifact.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Toolchain baseline
        if: always()
        shell: bash
        run: |
          node -p "process.versions.node + ' ' + process.platform + '/' + process.arch"
          node -p "require('os').homedir()"

      # ARM 1 — the branch as written.
      - name: Build nub (fixed)
        run: cargo build -p nub-cli --profile fast

      - name: Probe (fixed)
        if: always()
        shell: bash
        run: |
          rc=0
          node tests/win-jail-cmdline/probe.mjs "$(bash tests/win-jail-native-build/nubpath.sh)" > fixed.log 2>&1 || rc=$?
          echo "probe exit=$rc"
          cat fixed.log

      # ARM 2 — the identical probe against a build with the fix reverted. Reverting in the
      # WORKFLOW rather than behind a runtime flag keeps the shipped binary free of a probe
      # seam, and makes the differential a property of the SOURCE rather than of a toggle.
      # The patch touches ONE function in aube, so the verbatim plumbing stays compiled in
      # both arms and the only variable is whether aube reports the encoded line at all.
      - name: Poison the fix
        if: always()
        shell: bash
        run: |
          git apply --verbose tests/win-jail-cmdline/poison.patch
          git --no-pager diff --stat

      - name: Build nub (poisoned)
        if: always()
        run: cargo build -p nub-cli --profile fast

      - name: Probe (poisoned)
        if: always()
        shell: bash
        run: |
          rc=0
          node tests/win-jail-cmdline/probe.mjs "$(bash tests/win-jail-native-build/nubpath.sh)" > poisoned.log 2>&1 || rc=$?
          echo "probe exit=$rc"
          cat poisoned.log

      # THE VERDICT, read off the two logs rather than off any step's exit status. An
      # assertion whose `prop:` line is ABSENT fails here — a probe that never ran must not
      # be indistinguishable from one that passed.
      - name: Verdict
        if: always()
        shell: bash
        run: |
          fail=0
          need() { # need <file> <literal-line> <label>
            if grep -qF "$2" "$1" 2>/dev/null; then
              echo "OK   [$3] $2"
            else
              echo "MISS [$3] $2"
              fail=1
            fi
          }
          for f in fixed.log poisoned.log; do
            if [ ! -s "$f" ]; then
              echo "MISS [$f] the probe produced no output at all"
              fail=1
            fi
          done

          # THE EXPERIMENT RAN. A run on this epic once reported success with rc=127 on
          # every arm, having executed nothing. Every variant in every arm must show the
          # dependency materialized on disk before any verdict below means anything.
          for f in fixed.log poisoned.log; do
            for v in jailed-quoted jailed-plain unjailed-quoted; do
              need "$f" "prop:$v/dependency-materialized=PASS" "ran/$f"
            done
          done

          # THE BOTH-ARMS CONTROL. Identical script, jail off. Passing here in both arms is
          # what proves a red jailed verdict is the jail and not the harness — and its
          # `allowed:` canary read is the positive half of the enforcement differential.
          for f in fixed.log poisoned.log; do
            need "$f" "prop:unjailed-quoted/shell-ran-the-line=PASS" "control/$f"
            need "$f" "prop:unjailed-quoted/script-ran=PASS" "control/$f"
            need "$f" "prop:unjailed-quoted/tag-round-trip=PASS" "control/$f"
            need "$f" "prop:unjailed-quoted/confinement-as-configured=PASS" "control/$f"
          done

          # THE PROPERTY THIS BRANCH OWNS, gated on every platform: the confined shell
          # parsed the command line it was handed and began executing it. Nothing
          # downstream of the command line can affect this.
          for v in jailed-quoted jailed-plain; do
            need fixed.log "prop:$v/shell-ran-the-line=PASS" "fixed"
            need fixed.log "prop:$v/mangled-signature=FAIL" "fixed"
          done

          if [ "${{ runner.os }}" = "Windows" ]; then
            # THE DIFFERENTIAL. Without the fix the re-encoded tail reaches cmd.exe
            # mangled, so it never parses the line and the shell marker is never written —
            # for the unquoted script as much as the quoted one, because the corruption is
            # in the `/d /s /c "` prefix. Asserting the signature alongside the absence is
            # what distinguishes THIS defect from any other reason a script might not run.
            for v in jailed-quoted jailed-plain; do
              need poisoned.log "prop:$v/shell-ran-the-line=FAIL" "poisoned/windows"
              need poisoned.log "prop:$v/script-ran=FAIL" "poisoned/windows"
              need poisoned.log "prop:$v/mangled-signature=PASS" "poisoned/windows"
            done
            # THE INTERPRETER DEFECT THIS BRANCH FIXED, pinned as a regression gate. The
            # confined shell used to reach `node` and nub then died with `failed to detect
            # Node version: …\node.exe: Access is denied (os error 5)`, which read as an
            # execute denial on the granted interpreter. It never was: a LowBox token is
            # refused the `NUL` device, and `Command::output()` redirects stdin to it, so
            # detection failed before the interpreter was opened. Measured object by object
            # in `nub-sandbox/tests/windows_interpreter_exec.rs`, whose own both-directions
            # control (granted interpreter execs, ungranted one refused) is the positive
            # evidence; this is the end-to-end half.
            echo "---- the interpreter defect must not reappear ----"
            if grep -hF "failed to detect Node version" fixed.log; then
              echo "REGRESSED: Node-version detection is refused inside the jail again"
              fail=1
            else
              echo "OK   Node-version detection succeeds inside the jail"
            fi

            # `script-ran` in the FIXED arm is STILL not gated on Windows, for a new reason
            # and a documented one. With the interpreter reachable, `node` starts and the
            # CJS loader `realpathSync`s the file it was asked to require — which lstats
            # every prefix including the drive root, and the jail grants no ancestor:
            #
            #   Error: EPERM: operation not permitted, lstat 'C:\'
            #       at Object.realpathSync (node:fs:2749:25)
            #       at toRealPath (node:internal/modules/helpers:61:13)
            #       at Function._findPath (node:internal/modules/cjs/loader:747:24)
            #
            # Leaf-only granting relies on traverse-bypass, which lets a deep path be OPENED
            # without rights on its ancestors but does not make an ancestor itself statable.
            # That is the next defect, not this one, and gating on it here would only
            # re-measure it. Printed so it stays visible instead of being designed around.
            echo "---- diagnostic: the confined script's own body, not gated on Windows ----"
            grep -hE "prop:jailed-[a-z]+/(shell-echoed|script-ran|tag-round-trip|confinement-as-configured|cwd-is-package-dir)=" fixed.log \
              || echo "(no lines)"
            grep -hF "lstat 'C:" fixed.log | head -2 \
              || echo "(the ancestor-lstat defect did not reproduce)"
          else
            # POSIX behavior must be preserved exactly: there is no cmd.exe and the tail was
            # always ordinary argv, so reverting the fix must change nothing. The confined
            # script's whole body is gated here, in both arms.
            for f in fixed.log poisoned.log; do
              for v in jailed-quoted jailed-plain; do
                need "$f" "prop:$v/shell-ran-the-line=PASS" "posix/$f"
                need "$f" "prop:$v/shell-echoed=PASS" "posix/$f"
                need "$f" "prop:$v/script-ran=PASS" "posix/$f"
                need "$f" "prop:$v/confinement-as-configured=PASS" "posix/$f"
                need "$f" "prop:$v/cwd-is-package-dir=PASS" "posix/$f"
                need "$f" "prop:$v/mangled-signature=FAIL" "posix/$f"
              done
            done
          fi

          echo "----"
          if [ "$fail" = 0 ]; then
            echo "VERDICT: PASS on ${{ matrix.os }}"
          else
            echo "VERDICT: FAILED on ${{ matrix.os }} — see the MISS lines above."
          fi
          exit $fail

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-jail-cmdline-${{ matrix.os }}
          path: |
            fixed.log
            poisoned.log
          if-no-files-found: warn
