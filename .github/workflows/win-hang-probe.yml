# Throwaway branch-scoped probe. The real CI log already named the stuck binary
# (crates/nub-sandbox/tests/proxy.rs, tests `correct_token_still_forwards` and
# `decider_seam_is_consulted_for_target_and_sni`); this run reproduces it in
# isolation and dumps native thread stacks + socket state so the block point is
# measured rather than inferred. Delete this file once the answer is recorded.
name: win-hang-probe

on:
  push:
    branches: [diag/conformance-and-win-hang]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Windows proxy-test hang probe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: ci-test-${{ runner.os }}
          save-if: false
      - name: Build the proxy test binary
        run: cargo test -p nub-sandbox --test proxy --no-run
      - name: Reproduce and dump
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $exe = Get-ChildItem target\debug\deps\proxy-*.exe |
                   Where-Object { $_.Name -notlike '*.pdb' } |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "test binary: $($exe.FullName)"

          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          Write-Host "cdb present: $(Test-Path $cdb)"

          function Invoke-Attempt($label, $extraArgs, $timeoutSec) {
            Write-Host "########## $label (args: $extraArgs) ##########"
            $out = Join-Path $env:RUNNER_TEMP "$label.log"
            $err = Join-Path $env:RUNNER_TEMP "$label.err.log"
            $argList = @('--nocapture') + $extraArgs
            $p = Start-Process -FilePath $exe.FullName -ArgumentList $argList `
                   -RedirectStandardOutput $out -RedirectStandardError $err `
                   -PassThru -NoNewWindow
            $deadline = (Get-Date).AddSeconds($timeoutSec)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
            if ($p.HasExited) {
              Write-Host "$label COMPLETED, exit=$($p.ExitCode)"
              Get-Content $out -Tail 40
              Get-Content $err -Tail 20
              return $false
            }
            Write-Host "$label HUNG after ${timeoutSec}s"
            Write-Host '--- stdout so far ---'; Get-Content $out -Tail 60
            Write-Host '--- stderr so far ---'; Get-Content $err -Tail 30
            $proc = Get-Process -Id $p.Id
            Write-Host "--- thread count: $($proc.Threads.Count) ---"
            Write-Host '--- sockets owned by the test process ---'
            (netstat -ano) | Select-String " $($p.Id)$"
            if (Test-Path $cdb) {
              Write-Host '--- native stacks (all threads) ---'
              & $cdb -p $p.Id -c '~*kv; !locks; q' 2>&1 | Select-Object -Last 400
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            return $true
          }

          $hangs = 0
          foreach ($i in 1..3) {
            if (Invoke-Attempt "parallel-$i" @() 180) { $hangs++ }
          }
          Write-Host "########## parallel hangs: $hangs / 3 ##########"

          $serialHung = Invoke-Attempt 'serial' @('--test-threads=1') 240
          Write-Host "########## serial hung: $serialHung ##########"

          # Just the two named tests, isolated from the rest of the binary.
          Invoke-Attempt 'pair-only' @('--test-threads=2','correct_token_still_forwards','decider_seam_is_consulted_for_target_and_sni') 120 | Out-Null

          Copy-Item (Join-Path $env:RUNNER_TEMP '*.log') $env:GITHUB_WORKSPACE -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: win-hang-probe-logs
          path: '*.log'
          if-no-files-found: warn
