# Cross-platform sandbox CONFORMANCE — the done-gate. Real OS enforcement proven on
# macOS (Seatbelt), real-kernel Linux (stock Bubblewrap), and Windows (AppContainer),
# each axis paired with a NEGATIVE CONTROL so a hollow/no-op enforcement cannot pass.
# Branch-scoped (NO PR required): a push to `sandbox-primitives` touching the engine,
# the CLI seam, or this file runs it. Supersedes the Windows-only
# sandbox-win-enforcement.yml (folded into the `windows` leg here).
#
# Two layers share ONE committed fixture matrix:
#   - the CLI-seam conformance matrix drives the real `nub run --sandbox <file> -- <probe>`
#     end-to-end (crates/nub-cli/tests/sandbox_conformance.rs);
#   - the per-backend enforcement tests assert library-internal facts the black-box
#     probe can't reach (Degradation honesty, canonicalization traps, seccomp syscalls).
#
# `workflow_dispatch` is inert until this file reaches the default branch (GitHub only
# registers dispatch from default); the `push` trigger is what fires it on the branch.
name: sandbox-conformance
on:
  workflow_dispatch:
  push:
    branches: [sandbox-primitives]
    paths:
      - "crates/nub-sandbox/**"
      - "crates/nub-cli/**"
      - "scripts/build-bwrap-resource.sh"
      - "scripts/bwrap-toolchain-linux-*.sha256"
      - ".github/workflows/sandbox-conformance.yml"
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: macOS Seatbelt enforcement (per-backend + proxy + env-read/move-block closures)
        run: cargo test -p nub-sandbox --test macos_enforcement --test macos_proxy --test macos_envread --test macos_moveblock
      - name: macOS CLI-seam conformance matrix
        run: cargo test -p nub-cli --test sandbox_conformance

  linux:
    # Ubuntu 24.04 mediates unprivileged user namespaces through AppArmor, but
    # the hosted image does not load Bubblewrap's opt-in profile. Keep the
    # required stock-package enforcement gate on an unmodified supported host;
    # Noble compatibility is exercised separately on a configured VM.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install and probe stock Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          uname -a
          dpkg-query -W -f='${Version}\n' bubblewrap
          sysctl kernel.unprivileged_userns_clone || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          if command -v aa-status >/dev/null 2>&1; then sudo aa-status || true; fi
          bwrap --die-with-parent --new-session --unshare-user --cap-drop ALL \
            --unshare-pid --unshare-ipc --ro-bind / / --dev /dev --proc /proc -- true
      - name: Build the pinned fallback twice
        run: |
          scripts/build-bwrap-resource.sh bwrap-resource
          echo "NUB_BWRAP_VERSION=0.11.2" >> "$GITHUB_ENV"
          echo "NUB_BWRAP_SHA256=$(awk '{print $1}' bwrap-resource/bwrap.sha256)" >> "$GITHUB_ENV"
      - name: Linux Bubblewrap enforcement and proxy conformance
        env:
          NUB_SANDBOX_REQUIRE_BWRAP: "1"
        run: |
          cargo test -p nub-sandbox --test linux_enforcement --test linux_proxy
          cargo test -p nub-sandbox --test linux_monitor_states
      - name: Linux CLI-seam conformance matrix and inert project config
        env:
          NUB_SANDBOX_REQUIRE_BWRAP: "1"
        run: cargo test -p nub-cli --test sandbox_conformance --test project_config_sandbox_inert
      # Hosted Ubuntu has stock Bubblewrap but intentionally does not install the
      # root-owned, AppArmor-profiled nesting helper. These tests print a skip in
      # that state; a prepared VM sets NUB_SANDBOX_REQUIRE_NESTING=1 to make the
      # same command a hard admission and three-level composition gate.
      - name: Linux gated nesting and nested composition coverage
        env:
          NUB_SANDBOX_REQUIRE_BWRAP: "1"
        run: cargo test -p nub-sandbox --test linux_nesting --test linux_nested_composition
      - name: Linux fallback-only and incompatible-system conformance
        env:
          NUB_SANDBOX_REQUIRE_BWRAP: "1"
        run: |
          set -euo pipefail
          mkdir -p target/debug/nub-resources fallback-path
          cp -a bwrap-resource/. target/debug/nub-resources/
          ln -s "$PWD/bwrap-resource/bwrap" fallback-path/bwrap
          sudo mv /usr/bin/bwrap /usr/bin/bwrap.system
          restore() { sudo rm -f /usr/bin/bwrap; sudo mv /usr/bin/bwrap.system /usr/bin/bwrap; }
          trap restore EXIT

          PATH="$PWD/fallback-path:$PATH" cargo test -p nub-cli --test sandbox_conformance

          printf '#!/bin/sh\nexit 97\n' | sudo tee /usr/bin/bwrap >/dev/null
          sudo chmod 0755 /usr/bin/bwrap
          PATH="$PWD/fallback-path:$PATH" cargo test -p nub-cli --test sandbox_conformance

  windows:
    runs-on: windows-latest
    env:
      # crt-static makes the self-reexec probe child self-contained (no vcruntime DLL
      # dependency), so it starts cleanly under the LowBox token — a host-init crash
      # would otherwise read as a false denial.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Environment baseline
        shell: powershell
        run: |
          $id=[System.Security.Principal.WindowsIdentity]::GetCurrent()
          $admin=(New-Object System.Security.Principal.WindowsPrincipal($id)).IsInRole([System.Security.Principal.WindowsBuiltinRole]::Administrator)
          Write-Host "User: $($id.Name)  IsElevated: $admin  OS: $([System.Environment]::OSVersion.VersionString)"
      - name: Windows AppContainer enforcement (+ ascendant-env / residuals closures)
        shell: bash
        run: cargo test -p nub-sandbox --test windows_enforcement --test windows_ascendant_env --test windows_residuals
      - name: Windows CLI-seam conformance matrix
        shell: bash
        run: cargo test -p nub-cli --test sandbox_conformance
