# Branch-scoped gate for the `sandbox-linux-only` feature branch (see
# .claude/skills/ci-adhoc-test) — NO PR needed, and prerelease feature work opens none.
# ci.yml fires on push:main and on labelled pull requests only, so without this file a
# push to the branch runs nothing at all.
#
# It runs the three root gates ci.yml will run once the branch merges — fmt, the
# workspace clippy, and the crate's tests — on the one platform the sandbox runs on.
# The runner is pinned rather than `ubuntu-latest` because the crate's tests exercise
# the kernel (Landlock ABI, seccomp user notification, Yama), and an unannounced image
# bump would move the result. Delete this file in the merge commit: from then on main's
# workspace-wide `cargo test` and clippy cover the crate.
name: sandbox-linux-only
on:
  push:
    branches: [sandbox-linux-only]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: sandbox-linux-only
      # fmt is per-workspace, and vendor/aube is a path dependency with its own.
      - run: cargo fmt --check
      - run: cd vendor/aube && cargo fmt --check
      # Same grant and placeholder as ci.yml's clippy job: --all-features turns on
      # `embed-runtime`, whose build.rs demands a staged addon it never runs.
      - name: Stage placeholder addon for the embed-runtime lint build
        run: |
          mkdir -p runtime/addons
          printf 'placeholder-addon' > runtime/addons/nub-native.node
      - run: cargo clippy --locked --all-targets --all-features --profile fast -- -D warnings
        env:
          NUB_ALLOW_INCOMPLETE_RUNTIME: "1"
      - run: rm runtime/addons/nub-native.node
      # Default profile and default thread count, exactly as ci.yml's `cargo test` will
      # run it after the merge. A test that only passes single-threaded is a defect.
      - run: cargo test --locked -p nub-sandbox --no-fail-fast
      # The `nub sandbox` FRONTEND lives in nub-cli, and its decisive case is Linux-only: the
      # arm proving a confined command actually runs is `#[cfg(target_os = "linux")]`, so a dev
      # Mac executes only the refusal arms and reports 3 green either way. Without this step the
      # frontend's real behaviour would never run anywhere. Scoped to the one test rather than
      # the whole crate, whose suite is long and unrelated to this branch.
      - run: cargo test --locked -p nub-cli --test sandbox_cmd --no-fail-fast
