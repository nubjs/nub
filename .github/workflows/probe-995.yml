name: probe-995

# Branch-scoped probe for nubjs/nub#995: run its macOS-only unit tests and break
# each half of the fix to confirm they go red. Never merged.

on:
  push:
    branches: [probe-995]

permissions: {}

jobs:
  probe:
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch]
      - run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - run: tests/probe-995/mutate.sh
