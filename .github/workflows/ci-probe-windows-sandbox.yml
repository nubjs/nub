name: CI Probe (Windows sandbox targeted)

# THROWAWAY branch-scoped probe, narrower sibling of ci-probe-sandbox-epic.yml. The
# full-matrix probe's Windows `Test` leg hung for 60+ minutes on `cargo test
# --no-fail-fast` (the whole nub-cli + nub-sandbox suite) and was cancelled — this
# job isolates JUST the Windows sandbox enforcement test binaries the ci-adhoc-test
# task asked for, to get a real answer without re-triggering the giant suite. No PR
# is opened; delete this file once the probe answer is captured.
on:
  push:
    branches: [probe/ci-adhoc-sandbox-epic]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-sandbox-targeted:
    name: Windows sandbox enforcement (targeted)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: ci-probe-windows-sandbox
          workspaces: crates/nub-sandbox
      - name: windows_enforcement + windows_clean_root
        run: cargo test -p nub-sandbox --test windows_enforcement --test windows_clean_root --no-fail-fast
        shell: bash
      # Opt-in probe: CREATES a local account/group + WFP filters + a Winlogon
      # registry value on THIS runner. Safe here — an ephemeral GH-hosted VM,
      # never run against a real dev machine.
      - name: windows_account_enforcement (opt-in probe)
        run: cargo test -p nub-sandbox --test windows_account_enforcement --features windows-sandbox-probe --no-fail-fast
        shell: bash
