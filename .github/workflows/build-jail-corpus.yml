name: build-jail-corpus

# BRANCH-SCOPED PROBE — no pull request required. The `push` trigger is what fires
# this; `workflow_dispatch` stays listed for the day the probe graduates to the
# default branch, but is inert until the file lands there.
#
# A GitHub-hosted runner is disposable by construction, which is the property this
# probe needs: arm A0 runs dependency lifecycle scripts UNCONFINED, which is not
# something to do on a development machine.
on:
  push:
    branches: [probe/build-jail-corpus, probe/build-jail-corpus-tight]
    paths:
      - 'tests/build-jail-corpus/**'
      - '.github/workflows/build-jail-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    # macos-14 is the point of the probe: the macOS backend canonicalizes the
    # child's PATH, which the Linux backend does not, so the store-side geometry
    # a lifecycle script sees genuinely differs between them.
    runs-on: macos-14
    # A jailed lifecycle script has been observed spawning unboundedly when a
    # resolution it depends on is denied, so the job carries its own ceiling
    # rather than relying on the runner surviving it.
    timeout-minutes: 150
    # ⭐ REPEATED PASSES, IN PARALLEL — a single pass is not a result.
    # Seven repeats of one shard produced survive counts of {17, 18}, and three
    # packages succeeded in exactly 1 of 7: roughly 4% of verdicts are unstable
    # across identical runs. So the matrix runs the whole corpus N times and
    # summarize-repeats.mjs folds the passes into a RANGE and a MODAL value.
    # Parallel jobs rather than a loop inside one job because a full pass is ~40
    # min of arm time and three sequential passes would not fit the job ceiling.
    # `fail-fast: false` so one pass dying does not discard the others — two
    # passes still bound the instability, one does not.
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: build-jail-corpus-${{ runner.os }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '26'

      # The build dominates the job, so BOTH arms run against one binary rather
      # than paying for it twice in two workflow runs.
      - name: Build the dev binary
        run: cargo build -p nub-cli --profile fast

      - name: Record provenance
        id: prov
        run: |
          BIN="$PWD/target/fast/nub"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "sha256=$(shasum -a 256 "$BIN" | awk '{print $1}')"
            echo "version=$("$BIN" --version 2>&1 | head -1)"
            echo "node=$(node --version)"
            echo "host=$(uname -srm)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A0 FIRST — it is the denominator. Without it a package that never reaches
      # its real path scores as "works under the jail", which is worthless.
      # One job, every shard: the measured cost is ~5 s/package across BOTH arms,
      # so 344 packages is ~30 min of arm time against a build that dominates a
      # single-shard run. A pilot measured this; the pre-measurement guess (build
      # dominates, so one shard per run) was wrong in both directions.
      #
      # `continue-on-error` is deliberately ABSENT. run-shard.sh exits non-zero
      # when its arm effect is not confirmed, and a shard that measured nothing
      # must turn the job red rather than contribute an empty slice to a total.
      - name: 'Run all shards, both arms'
        working-directory: tests/build-jail-corpus
        env:
          NUB_BIN: ${{ steps.prov.outputs.bin }}
          NUB_EXPECT_GIT_SHA: ${{ github.sha }}
          STUDY_PATH: /usr/bin:/bin:/usr/sbin:/sbin
          OUTROOT: ${{ runner.temp }}/build-jail-corpus-pass${{ matrix.pass }}
        run: |
          chmod +x run-shard.sh
          FAILED=""
          for m in shard-default*.tsv; do
            SHARD="${m%.tsv}"; SHARD="${SHARD#shard-}"
            for ARM in A0 PROD; do
              START=$(date +%s)
              if ./run-shard.sh "$SHARD" "$m" "$ARM"; then
                echo "$SHARD/$ARM ok $(( $(date +%s) - START ))s" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "$SHARD/$ARM INADMISSIBLE (rc=$?)" | tee -a "$GITHUB_STEP_SUMMARY"
                FAILED="$FAILED $SHARD/$ARM"
              fi
              # Each shard's tree is multiple GB; drop it once its snapshots and
              # verdicts are derived or the runner disk fills part-way through.
              rm -rf "$OUTROOT/$SHARD-$ARM"/{proj,home,cache,tmp} || true
            done
          done
          [ -z "$FAILED" ] || { echo "INADMISSIBLE ARMS:$FAILED" >&2; exit 1; }

      - name: Validity-gated verdict table
        working-directory: tests/build-jail-corpus
        env:
          OUTROOT: ${{ runner.temp }}/build-jail-corpus-pass${{ matrix.pass }}
          # Into the uploaded artifact, not beside the (deleted) run trees. The table
          # is the input summarize-repeats.mjs folds across passes, so a pass whose
          # table is not downloadable cannot contribute to the range or the mode.
          AGGREGATE_OUT: evidence/verdict-table.json
        run: |
          mkdir -p evidence
          {
            echo '```'
            node aggregate.mjs "$OUTROOT"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The heavy trees are dropped; only the derived JSON and the failure lines
      # are kept, so the artifact stays small enough to be worth downloading.
      - name: Collect evidence
        if: always()
        working-directory: tests/build-jail-corpus
        env:
          OUTROOT: ${{ runner.temp }}/build-jail-corpus-pass${{ matrix.pass }}
        run: |
          mkdir -p evidence
          for d in "$OUTROOT"/*/; do
            n=$(basename "$d")
            mkdir -p "evidence/$n"
            cp "$d"/report.json "$d"/verdicts.json "evidence/$n/" 2>/dev/null || true
            grep -iE 'EPERM|EACCES|EROFS|Cannot find module|not permitted|arm_effect|optout_warnings|node_gyp_identity' \
              "$d"/run.log > "evidence/$n/failures.txt" 2>/dev/null || true
            # The full log, capped. A grep-filtered extract can say a denominator
            # failed but never why, which is exactly the question a failed A0 poses.
            tail -c 2000000 "$d"/run.log > "evidence/$n/run.log" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: build-jail-corpus-macos-pass${{ matrix.pass }}
          path: tests/build-jail-corpus/evidence
          retention-days: 7
