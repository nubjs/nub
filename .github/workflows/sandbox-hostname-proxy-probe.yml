name: Hostname proxy confinement probe

on:
  push:
    branches: [sandbox-hostname-proxy-probe, sandbox-proxy-hardening]
    paths:
      - crates/nub-sandbox/**
      - tests/proxy-per-host/**
      - .github/workflows/sandbox-hostname-proxy-probe.yml
      - Cargo.lock
      - Cargo.toml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-hostname-proxy
      - name: Recording environment and unconfined controls
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            git rev-parse HEAD
            rustc -Vv
            uname -a
            curl --version | head -1
          } > reports/environment.txt
          for host in example.com www.google.com; do
            curl -4 -sS -o /dev/null --connect-timeout 8 --max-time 20 "https://$host/" \
              > "reports/unconfined-$host.log" 2>&1
          done
          # The literal/CIDR fixture arms use this same public IPv4 endpoint with certificate
          # name verification disabled. A failed control fails the job; it is not a skipped
          # grammar assertion.
          curl -4 -k -sS -o /dev/null --connect-timeout 8 --max-time 20 --noproxy '*' https://1.1.1.1/ \
            > reports/unconfined-1.1.1.1.log 2>&1
      - name: Exercising hostname proxy contract
        run: |
          set -o pipefail
          cargo build --manifest-path tests/proxy-per-host/Cargo.toml --profile fast \
            --config 'profile.fast.inherits="dev"' \
            --config 'profile.fast.debug="line-tables-only"' \
            --config 'profile.fast.codegen-units=256' \
            --config 'profile.fast.package."*".opt-level=2' \
            > reports/probe-build.log 2>&1
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 target/fast/proxy-per-host-probe > reports/probe-binary.sha256
          else
            sha256sum target/fast/proxy-per-host-probe${{ runner.os == 'Windows' && '.exe' || '' }} > reports/probe-binary.sha256
          fi
          target/fast/proxy-per-host-probe${{ runner.os == 'Windows' && '.exe' || '' }} \
            > reports/proxy-per-host.log 2>&1
          cat reports/proxy-per-host.log
      - name: Exercising parser and proxy shutdown
        if: ${{ !cancelled() && github.ref_name == 'sandbox-proxy-hardening' }}
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --lib --tests -- -D warnings > reports/clippy.log 2>&1
          cargo test -p nub-sandbox --profile fast --lib proxy:: -- --nocapture --test-threads=1 2>&1 | tee reports/proxy-library.log
      - name: Exercising the baked catalog environment without development overrides
        if: ${{ !cancelled() && github.ref_name == 'sandbox-proxy-hardening' }}
        run: |
          set -euo pipefail
          cargo test -p nub-sandbox --profile fast --test catalog_positive --no-run --message-format=json > reports/catalog-artifacts.jsonl
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          artifacts = [json.loads(line) for line in Path('reports/catalog-artifacts.jsonl').read_text().splitlines()]
          binaries = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'catalog_positive' and item.get('executable')]
          assert len(binaries) == 1, binaries
          Path('reports/catalog-binary.sha256').write_text(hashlib.sha256(Path(binaries[0]).read_bytes()).hexdigest() + '  ' + binaries[0] + '\n')
          PY
          cargo test -p nub-sandbox --profile fast --test catalog_positive -- --nocapture --test-threads=1 2>&1 | tee reports/catalog-environment.log
          cargo test -p nub-sandbox --profile fast --lib catalog_baseline_env -- --nocapture --test-threads=1 2>&1 | tee reports/catalog-baseline.log
      - name: Recording the prior TLS shutdown control
        if: ${{ !cancelled() && github.ref_name == 'sandbox-proxy-hardening' }}
        run: |
          git fetch --no-tags --depth=1 origin 8e17950847ba28df1d344651e92ac1df9a01feb7
          git checkout 8e17950847ba28df1d344651e92ac1df9a01feb7 -- crates/nub-sandbox/src/proxy/mitm.rs
          # Retain the current dial API while reverting only the TLS transport wrapper.
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nub-sandbox/src/proxy/mitm.rs')
          source = path.read_text()
          old = 'super::connect_upstream(&super::Host::Name(host.to_string()), port, allow_private)?'
          assert source.count(old) == 1, 'the targeted control call site changed'
          path.write_text(source.replace(old, 'super::connect_upstream(&super::Host::Name(host.to_string()), port, allow_private, &active.shutdown)?'))
          PY
          git diff HEAD -- crates/nub-sandbox/src/proxy/mitm.rs > reports/control-reversion.diff
          set +e
          cargo test -p nub-sandbox --profile fast --lib proxy::tests::dropping_proxy_reaps_a_stalled_terminated_request -- --nocapture --test-threads=1 > reports/control-shutdown.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/control-shutdown-exit.txt
          cat reports/control-shutdown.log
          grep -q 'running 1 test' reports/control-shutdown.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hostname-proxy-${{ matrix.os }}
          path: reports
          retention-days: 14
