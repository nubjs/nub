# Branch-scoped ad-hoc probe: does the Windows build jail hold with NO ELEVATION?
# No PR required (see .claude/skills/ci-adhoc-test/SKILL.md). CI is the only venue —
# AppContainer cannot be launched over SSH (OpenSSH lands in session 0 with no window
# station, so every launch returns 0xC0000142 STATUS_DLL_INIT_FAILED), which also rules out
# the standing nub-win VM. Delete once the de-elevated arm joins sandbox-conformance's
# windows leg on main.
#
# THE ANCESTOR-NECESSITY GROUP rides this workflow because it needs the same two principals.
# It asks whether the backend's ancestor repair is necessary AT ALL now that the realpath
# preload ships: the decisive cell is repair-OFF **with** the preload, next to repair-ON with
# the same preload, on one fixture in one run — the arm every previous matrix left out. Its
# gates (`anc-gate-*`) are what make the answer admissible: a stamped NODE_OPTIONS is not
# evidence that Node saw it, so the confined child reports the shims' own `globalThis`
# sentinels itself.
#
# THE ESM-RESOLUTION GROUP rides it for the same reason, and asks the twin question: does an ES
# MODULE resolve inside the jail at all. Node's ESM resolver destructures `realpathSync` at
# module-load time on 18.19-24.16, 25.x and 26.0, so the `--import` realpath shim never reaches it
# and every relative or bare `import` in a lifecycle script dies EPERM. Every measurement of the
# repair before this one was taken on macOS against a SIMULATED jail that patches fs at the JS
# layer, which cannot model the AppContainer's NATIVE realpath refusal — this workflow is the only
# venue where the real one exists. Its positive control is an UNREPAIRED jail: if an ESM entry
# runs there, the runner's Node is outside the affected band and every other cell in the group is
# inadmissible rather than green.
name: win-deelevated-jail-probe

on:
  push:
    branches:
      - sandbox/win-deelevated-jail
      - sandbox/win-ancestor-necessity
      # The ESM group's branch. UPDATE THIS if that group is rebased onto another one:
      # `workflow_dispatch` cannot start a workflow that is not on the default branch, so this
      # list is the ONLY thing that fires a run.
      - sandbox/esm-binding-seam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # A cancelled job loses its log entirely, and this probe's whole product IS the log, so
    # the job bound sits above the step bound rather than at it.
    timeout-minutes: 55
    env:
      # Matches sandbox-conformance's windows leg: crt-static makes the self-reexec probe
      # child self-contained, so it starts cleanly under the LowBox token.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Runner baseline
        shell: powershell
        run: |
          $id=[System.Security.Principal.WindowsIdentity]::GetCurrent()
          $admin=(New-Object System.Security.Principal.WindowsPrincipal($id)).IsInRole([System.Security.Principal.WindowsBuiltinRole]::Administrator)
          Write-Host "cores=$([System.Environment]::ProcessorCount) os=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "BASELINE runner user=$($id.Name) IsElevated=$admin"
          Write-Host "EnableLUA=$((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA -ErrorAction SilentlyContinue).EnableLUA)"

      # Separate from the run so a compile error reads as a compile error rather than as a
      # probe that measured nothing.
      - name: Build the probe
        shell: bash
        run: cargo test -p nub-sandbox --test windows_deelevated_jail --no-run

      - name: Paired elevated / de-elevated build-jail differential
        if: always()
        timeout-minutes: 40
        shell: bash
        run: |
          rc=0
          timeout -k 30 2100 cargo test -p nub-sandbox --test windows_deelevated_jail > probe.log 2>&1 || rc=$?
          echo "cargo test exit=$rc"
          cat probe.log

      # The guard this study keeps needing: a job that exits 0 having measured nothing is
      # worse than a red one. The harness gates on these itself; asserting them again here
      # means a future change that softens an in-binary check still cannot go quietly green.
      - name: Assert BOTH arms actually ran, and that arm B was really de-elevated
        if: always()
        shell: bash
        run: |
          fail=0
          [ -s probe.log ] || { echo "MISSING: the probe produced no output at all"; exit 1; }
          # `admin=` is the access-checked verdict, not the TokenIsElevated flag: the
          # fallback de-elevation route leaves that flag stale, so it cannot be the gate.
          grep -q 'ARM .*admin=1' probe.log || { echo "MISSING: no arm held administrative authority — the arms did not differ"; fail=1; }
          grep -q 'ARM .*admin=0' probe.log || { echo "MISSING: the DE-ELEVATED arm never reported — nothing was measured"; fail=1; }
          grep -q '^DEELEV route='  probe.log || { echo "MISSING: no de-elevation route was recorded"; fail=1; }
          # Every pre-existing property must PASS. This replaces the older
          # `WINDOWS BUILD JAIL HOLDS WITH NO ELEVATION` conclusion-line check, which asserted
          # ZERO failures across the whole binary — and the ancestor-necessity group below can
          # legitimately record a FAIL as its ANSWER, which would have conflated a finding with
          # a broken jail. Gating each pre-existing property directly is strictly stronger for
          # those properties and does not conflate.
          for p in profile-create-and-launch acl-grant-allow acl-grant-deny teardown job-reap egress-deny production-jail-launch production-jail-egress; do
            if grep -qF "prop:$p=PASS" probe.log; then echo "PASS $p"
            elif grep -qF "prop:$p=FAIL" probe.log; then echo "FAIL $p"; fail=1
            else echo "MISSING: property $p never reported"; fail=1
            fi
          done

          # ── the ancestor-necessity group ──────────────────────────────────────────────
          # ABSENCE is the error here; a FAIL is a FINDING. The group asks whether removing
          # the ancestor repair CHANGES anything, so gating its verdict cells on PASS would
          # turn "the repair is load-bearing after all" into a red build instead of an answer.
          # The GATES are different and DO bind: without them no arm is admissible evidence.
          # SPLIT THE LOG BY PRINCIPAL BEFORE SCORING ANYTHING. Both arms emit the SAME property
          # names, so a whole-file `grep prop:NAME=PASS` scores a property PASS whenever EITHER
          # arm passed it — which means this job cannot fail on an arm-specific failure, and can
          # go green with one arm entirely empty. That is not hypothetical: run 30598144544 did
          # exactly that, with the de-elevated arm producing no cells at all. 41 of the 52
          # properties this probe emits are reported by both arms and were all scored that way.
          awk '/^ARM .*admin=1/{f=1} /^ARM .*admin=0/{f=0} f' probe.log > armA.log
          awk '/^ARM .*admin=0/{f=1} f' probe.log > armB.log
          [ -s armA.log ] && [ -s armB.log ] || { echo "MISSING: could not split the arms"; fail=1; }
          gate_in() {  # gate_in <arm-log> <label> <property>
            if grep -qaF "prop:$3=PASS" "$1"; then echo "PASS [$2] $3"
            elif grep -qaF "prop:$3=FAIL" "$1"; then echo "FAIL [$2] $3 — INADMISSIBLE, not merely negative"; fail=1
            else echo "MISS [$2] $3 (never measured in this arm)"; fail=1
            fi
          }

          echo "---- ancestor-necessity: gates (these bind, and in BOTH principals) ----"
          for p in anc-gate-preload-installs-the-realpath-shim \
                   anc-gate-no-preload-leaves-the-shim-absent \
                   anc-control-absolute-require-fails-unpreloaded-unrepaired \
                   anc-control-single-spelling-roots-still-lose-a-cell; do
            gate_in armA.log elevated "$p"
            gate_in armB.log deelevated "$p"
          done
          echo "---- ancestor-necessity: the verdict (a FAIL here is the finding) ----"
          for p in anc-node-absolute-require-works-preloaded-with-repair-off \
                   anc-node-bare-through-junction-works-preloaded-with-repair-off \
                   anc-node-npm-cli-entry-works-preloaded-with-repair-off \
                   anc-repair-changes-no-node-cell-under-the-preload \
                   anc-nonnode-tools-identical-with-repair-off \
                   anc-production-stamp-reaches-node; do
            grep -q "prop:$p=" probe.log || { echo "MISS $p (never measured)"; fail=1; }
            grep -E "prop:$p=" probe.log || true
          done

          # ── the ESM-resolution group ──────────────────────────────────────────────────
          # Same split, and the controls carry more weight here than anywhere else in this
          # workflow. The POSITIVE control is what says the defect reproduces on this runner's
          # Node at all — a treatment measured against a defect that is not reproducing is not
          # evidence, so a FAIL there makes the group inadmissible rather than negative. The
          # REJECTED-CANDIDATE control is what proves the fixture can produce a WRONG version;
          # without it the shipping arm answering `bar@2.0.0` would be unfalsifiable.
          # THE ESM GATES BIND ON THE DE-ELEVATED ARM ALONE, and that is semantic rather than a
          # shortcut: ELEVATED, the traverse ACE makes `lstat 'C:\'` succeed, so the unrepaired
          # positive control cannot die there and is EXPECTED to fail. De-elevated is the
          # configuration this group exists to measure.
          echo "---- esm-resolution: gates (these bind, on the DE-ELEVATED arm) ----"
          for p in esm-gate-shim-installed-in-the-shipping-arm \
                   esm-gate-unrepaired-control-leaves-the-shim-absent \
                   esm-control-unrepaired-jail-leaves-the-esm-entry-dead \
                   esm-control-unrepaired-jail-leaves-the-cjs-require-dead \
                   esm-control-preserve-symlinks-binds-the-wrong-version; do
            gate_in armB.log deelevated "$p"
          done
          echo "---- esm-resolution: the verdict (a FAIL here is the finding) ----"
          for p in esm-shipping-esm-entry-completes-relative-and-bare-imports \
                   esm-shipping-cjs-require-binds-the-private-version \
                   esm-shipping-esm-import-binds-the-private-version \
                   esm-shipping-require-resolve-returns-the-store-cell-path \
                   esm-shipping-fs-realpathsync-native-survives-the-jail \
                   esm-shipping-fs-promises-realpath-survives-the-jail; do
            grep -q "prop:$p=" armB.log || { echo "MISS $p (never measured)"; fail=1; }
            grep -E "prop:$p=" armB.log || true
          done

          echo "── the facts ──"
          grep -E '^  fact:' probe.log || true
          echo "── recorded verdicts ──"
          grep -E '^(ARM |DEELEV |  prop:)' probe.log
          exit $fail

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-deelevated-jail-probe
          path: probe.log
          if-no-files-found: warn
