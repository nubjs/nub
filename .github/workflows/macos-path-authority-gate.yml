name: macOS path authority gate

on:
  push:
    branches: [macos-path-authority-gate]
    paths:
      - crates/nub-sandbox/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/macos-path-authority-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SOURCE_COMMIT: 33f8be1131010adbd3389277844b8b001cfbe09d
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: macos-path-authority-gate
      - name: Binding immutable source and runner
        run: |
          set -euo pipefail
          mkdir -p reports/executables
          test "$(git rev-parse "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          git diff --exit-code "$SOURCE_COMMIT" -- crates/nub-sandbox Cargo.toml Cargo.lock
          {
            printf 'source_commit=%s\nprobe_head=%s\n' "$SOURCE_COMMIT" "$(git rev-parse HEAD)"
            printf 'runner=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$(uname -s)" "$(uname -m)"
            uname -a
            rustc -Vv
            cargo -V
          } > reports/environment.txt
      - name: Running focused macOS aggregate
        run: |
          set -uo pipefail
          failures=0
          : > reports/results.tsv
          run_case() {
            name="$1"; expected="$2"; shift 2
            "$@" > "reports/$name.log" 2>&1
            rc=$?
            printf '%s\t%s\n' "$name" "$rc" | tee -a reports/results.tsv
            if [ "$rc" -ne 0 ]; then failures=1; fi
            count=$(awk '/^test result: ok\./ {sum += $4} END {print sum + 0}' "reports/$name.log")
            printf '%s\t%s\t%s\n' "$name" "$expected" "$count" >> reports/test-counts.tsv
            if [ "$count" -ne "$expected" ]; then failures=1; fi
          }
          : > reports/test-counts.tsv
          run_case production-readiness-macos 4 cargo test --locked -p nub-sandbox --test production_readiness_macos -- --nocapture --test-threads=1
          run_case macos-path-operations 2 cargo test --locked -p nub-sandbox --test macos_path_operations -- --nocapture --test-threads=1
          run_case macos-positive-grammar 4 cargo test --locked -p nub-sandbox --test macos_positive_grammar -- --nocapture --test-threads=1
          grep -q 'MACOS_FRESH_PATH_AUTHORITY_VERIFIED' reports/production-readiness-macos.log || failures=1
          find "$CARGO_TARGET_DIR/debug/deps" -type f -perm -111 \( \
            -name 'production_readiness_macos-*' -o \
            -name 'macos_path_operations-*' -o \
            -name 'macos_positive_grammar-*' \
          \) -exec cp {} reports/executables/ \;
          find reports/executables -type f -maxdepth 1 -print | sort > reports/executable-paths.txt
          test -s reports/executable-paths.txt || failures=1
          {
            shasum -a 256 reports/executables/*
            printf '\n--- test results ---\n'
            cat reports/test-counts.tsv
            printf '\n--- marker ---\n'
            grep -h 'MACOS_FRESH_PATH_AUTHORITY_VERIFIED' reports/*.log || true
          } > reports/binaries-and-runtime.txt
          exit "$failures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-path-authority-${{ matrix.os }}
          path: reports
          retention-days: 14
