name: Probe — Windows proxy deadlock

# THROWAWAY branch-scoped probe (ci-adhoc-test skill). Deleted before this branch
# merges. `push` is the trigger that matters — workflow_dispatch is inert until the
# file is on the default branch.
#
# Each job is a one-variable differential: the `baseline` leg restores ONLY the
# pre-fix file from the epic tip, so a green fixed leg beside a reproducing baseline
# leg is evidence rather than a bare "it works now".
on:
  push:
    branches: [fix/windows-proxy-deadlock]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  win-proxy:
    name: win proxy.rs (${{ matrix.variant }})
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # baseline is EXPECTED to hang; the job passes only when it does (exit 124).
        variant: [baseline, fixed]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: probe-win-proxy
          save-if: false
      - name: Restore the pre-fix splice
        if: matrix.variant == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          git checkout f35bf4311707 -- crates/nub-sandbox/src/proxy/mod.rs
          git --no-pager diff --stat
      # Separate so the run step's `timeout` measures the RUN, not the compile.
      - name: Build the test binary
        shell: bash
        run: cargo test -p nub-sandbox --test proxy --no-run
      - name: Run at the DEFAULT thread count
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # `set +e` is load-bearing: the runner injects `-e`, which would abort the
          # step on the timeout kill before the exit code could be classified.
          set +e
          iters=10
          [ "$VARIANT" = baseline ] && iters=1
          for i in $(seq 1 $iters); do
            echo "::group::iteration $i/$iters"
            timeout 300 cargo test -p nub-sandbox --test proxy
            code=$?
            echo "::endgroup::"
            echo "iteration $i exit=$code"
            if [ "$VARIANT" = baseline ]; then
              [ $code -eq 124 ] && { echo "REPRODUCED: proxy.rs made no progress in 300s"; exit 0; }
              echo "NOT REPRODUCED — the baseline finished with exit $code"; exit 1
            fi
            [ $code -eq 0 ] || { echo "FAILED at iteration $i (exit $code)"; exit 1; }
          done
          echo "$iters/$iters consecutive green at the default thread count"

  # The caveat from the diagnosis: with --no-fail-fast, everything ordered AFTER
  # proxy.rs never ran in the hung job, so a SECOND hang could be waiting downstream.
  # Run the whole Windows suite once under a hard cap and surface any target that
  # stops making progress.
  win-full:
    name: win full suite (hang scan)
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: probe-win-full
          save-if: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build nub-native addon
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/nub-native && cargo build)
          mkdir -p runtime/addons
          cp target/debug/nub_native.dll runtime/addons/nub-native.node
      - name: Build the test binaries
        shell: bash
        run: cargo test --no-run
      - name: Run the full suite under a hard cap
        shell: bash
        run: |
          set +e
          timeout 3000 cargo test --no-fail-fast 2>&1 | tee /tmp/full.log
          code=${PIPESTATUS[0]}
          echo "cargo test exit=$code"
          echo "=== targets that stalled (cargo's >60s notice) ==="
          grep -F "has been running for over" /tmp/full.log || echo "(none)"
          [ $code -eq 124 ] && { echo "HANG: the suite made no progress in 3000s"; exit 1; }
          echo "no hang — the suite ran to completion (test failures, if any, are above)"

  linux:
    name: linux (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      NUB_SANDBOX_REQUIRE_BWRAP: "1"
    strategy:
      fail-fast: false
      matrix:
        # Same differential for the fs-last-match-reopen harness fix: baseline
        # restores the pre-fix Tree::new and must FAIL.
        variant: [baseline, fixed]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: probe-linux
          save-if: false
      - name: Restore the pre-fix sources
        if: matrix.variant == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          git checkout f35bf4311707 -- crates/nub-sandbox/src/proxy/mod.rs \
                                       crates/nub-cli/tests/sandbox_conformance.rs
          git --no-pager diff --stat
      # ubuntu-latest mediates unprivileged userns via AppArmor, so the conformance
      # suite is only actually ENFORCED after nub's own digest-pinned bwrap is staged
      # and `sandbox setup` has run. NUB_SANDBOX_REQUIRE_BWRAP=1 above turns a
      # not-enforceable host into a hard failure instead of a hollow skip.
      - name: Build + pin the Bubblewrap resource, repair unprivileged userns
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-bwrap-resource.sh bwrap-resource
          bwrap_sha256=$(awk '{print $1}' bwrap-resource/bwrap.sha256)
          echo "NUB_BWRAP_VERSION=0.11.2" >> "$GITHUB_ENV"
          echo "NUB_BWRAP_SHA256=$bwrap_sha256" >> "$GITHUB_ENV"
          export NUB_BWRAP_VERSION=0.11.2 NUB_BWRAP_SHA256="$bwrap_sha256"
          mkdir -p target/debug/nub-resources
          cp -a bwrap-resource/. target/debug/nub-resources/
          chmod +x target/debug/nub-resources/bwrap
          cargo build -p nub-cli
          sudo -E target/debug/nub sandbox setup --all-users
      - name: proxy suite (Linux must stay green)
        shell: bash
        run: cargo test -p nub-sandbox --test proxy
      - name: fs_last_match_reopen conformance
        shell: bash
        run: |
          set +e
          cargo test -p nub-cli --test sandbox_conformance fs_last_match_reopen -- --exact fs_last_match_reopen --nocapture
          code=$?
          echo "exit=$code"
          if [ "${{ matrix.variant }}" = baseline ]; then
            [ $code -ne 0 ] && { echo "REPRODUCED: the fixture fails without the Tree::new fix"; exit 0; }
            echo "NOT REPRODUCED — the baseline passed"; exit 1
          fi
          exit $code
