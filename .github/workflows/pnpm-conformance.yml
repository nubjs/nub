name: pnpm conformance

# Run pnpm 12.4.1's OWN black-box CLI suite (the Rust `pnpm-cli` crate's
# `tests/suite`) against the nub binary. The harness swaps the `pnpm` binary the
# suite spawns for nub and classifies every failure against a generated
# allowlist; an un-allowlisted failure fails the run. Design and seam:
# tests/pnpm-conformance/README.md.
#
# Nightly and on demand only: it clones pnpm/pnpm, compiles its workspace, and
# its mocked registry proxies real packages from the npm registry.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      nextest_args:
        description: "extra cargo-nextest args (e.g. -E 'test(/^root::/)'); blank runs the full suite"
        required: false
        default: ""

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The pnpm version nub matches in a pnpm project. Bump together with
  # PNPM_TAG's default in tests/pnpm-conformance/run.sh, then regenerate the
  # allowlist from a full run.
  PNPM_TAG: v12.4.1
  NUB_NO_UPDATE: "1"

jobs:
  conformance:
    name: pnpm 12 CLI suite vs nub (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # nub and the pnpm workspace are two large debug builds on one runner.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "26"

      - name: Build nub
        run: cargo build -p nub-cli

      - name: Run pnpm's CLI suite against nub
        env:
          CONF_WORK_DIR: ${{ runner.temp }}/pnpm-conformance
          NEXTEST_ARGS: ${{ github.event.inputs.nextest_args }}
        run: |
          # Zero or more extra nextest arguments, split on whitespace (quotes
          # are not interpreted, so write a filter without spaces).
          read -r -a extra <<< "${NEXTEST_ARGS}"
          tests/pnpm-conformance/run.sh target/debug/nub "${extra[@]}"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pnpm-conformance-junit
          path: ${{ runner.temp }}/pnpm-conformance/junit.xml
          if-no-files-found: ignore
          retention-days: 7
