name: win576-probe

# Branch-scoped ad-hoc probe for nubjs/nub#576 (see .claude/skills/ci-adhoc-test).
# No PR required; `push` to this branch is the only trigger that fires while the
# file is off the default branch.
on:
  push:
    branches: [win576probe]
    paths:
      - 'tests/win576-probe/**'
      - '.github/workflows/win576-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs-semantics:
    name: B — Windows fs semantics probe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: build + run probe
        working-directory: tests/win576-probe
        run: |
          cargo run --release 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP\fs-semantics.log
      - name: drive layout
        if: always()
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
          Write-Host "TEMP=$env:TEMP  RUNNER_TEMP=$env:RUNNER_TEMP  LOCALAPPDATA=$env:LOCALAPPDATA  GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          fsutil fsinfo volumeinfo C:\ | Write-Host
          if (Test-Path D:\) { fsutil fsinfo volumeinfo D:\ | Write-Host } else { Write-Host "NO D: DRIVE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fs-semantics-log
          path: ${{ runner.temp }}/fs-semantics.log
          if-no-files-found: warn

  repro:
    name: A — repro (${{ matrix.spec }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: '0.6.0'
            tag: v060
          - spec: 'canary'
            tag: canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install nub from npm
        run: |
          npm i -g "@nubjs/nub@${{ matrix.spec }}"
          nub --version
          node --version
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
      - name: "pick roots (reporter was on the D drive)"
        id: roots
        run: |
          $d = if (Test-Path 'D:\') { 'D:\nub576' } else { 'C:\nub576-altdrive-missing' }
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\nub576' | Out-Null
          "droot=$d"  | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "D-root=$d  C-root=C:\nub576"
      - name: "cell 1 - D drive, GVS default"
        run: pwsh -File tests/win576-probe/repro.ps1 -Label "${{ matrix.tag }}-Ddrive-gvsdefault" -Root "${{ steps.roots.outputs.droot }}"
      - name: "cell 2 - C drive, GVS default"
        if: always()
        run: pwsh -File tests/win576-probe/repro.ps1 -Label "${{ matrix.tag }}-Cdrive-gvsdefault" -Root "C:\nub576"
      - name: "cell 3 - D drive, GVS OFF"
        if: always()
        run: pwsh -File tests/win576-probe/repro.ps1 -Label "${{ matrix.tag }}-Ddrive-gvsoff" -Root "${{ steps.roots.outputs.droot }}" -GvsOff
      - name: "round 2 - perturbation modes"
        if: always()
        run: |
          foreach ($m in @('denyRA','denyFull','danglingConnect','dropState','partialEntry','readonlyEntry')) {
            pwsh -File tests/win576-probe/repro2.ps1 -Mode $m -Root "${{ steps.roots.outputs.droot }}"
          }
