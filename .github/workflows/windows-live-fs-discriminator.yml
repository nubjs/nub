name: Windows live loader capability discriminator

on:
  push:
    branches: [windows-live-image-discriminator]
    paths:
      - tests/windows-live-fs-discriminator/**
      - .github/workflows/windows-live-fs-discriminator.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Compiling the standalone native probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports, out | Out-Null
          git rev-parse HEAD | Set-Content reports/source-head.txt
          Get-FileHash tests/windows-live-fs-discriminator/probe.cpp -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/source-hash.json
          Get-FileHash tests/windows-live-fs-discriminator/image_fixture_exe.cpp -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/image-exe-source-hash.json
          Get-FileHash tests/windows-live-fs-discriminator/image_fixture_dll.cpp -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/image-dll-source-hash.json
          Get-FileHash tests/windows-live-fs-discriminator/existing-readable.txt,tests/windows-live-fs-discriminator/image-nonmatch.txt -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/input-hashes.json
          Get-FileHash tests/windows-live-fs-discriminator/run-standard-user.ps1 -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/instrument-hash.json
          Get-FileHash crates/nub-sandbox/native/detours/detours.h,crates/nub-sandbox/native/detours/detours.cpp,crates/nub-sandbox/native/detours/modules.cpp,crates/nub-sandbox/native/detours/disasm.cpp,crates/nub-sandbox/native/detours/image.cpp,crates/nub-sandbox/native/detours/creatwth.cpp,crates/nub-sandbox/native/detours/disolx86.cpp,crates/nub-sandbox/native/detours/disolx64.cpp,crates/nub-sandbox/native/detours/disolia64.cpp,crates/nub-sandbox/native/detours/disolarm.cpp,crates/nub-sandbox/native/detours/disolarm64.cpp -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/detours-hashes.json
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          @"
          @echo off
          call "$vs\VC\Auxiliary\Build\vcvarsall.bat" amd64
          if errorlevel 1 exit /b 1
          cl /Bv > reports\toolchain.txt 2>&1
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc tests\windows-live-fs-discriminator\image_fixture_exe.cpp /Fe:out\image-fixture.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /MT /LD /EHsc tests\windows-live-fs-discriminator\image_fixture_dll.cpp /Fe:out\image-fixture.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc /Icrates\nub-sandbox\native\detours tests\windows-live-fs-discriminator\probe.cpp crates\nub-sandbox\native\detours\detours.cpp crates\nub-sandbox\native\detours\modules.cpp crates\nub-sandbox\native\detours\disasm.cpp crates\nub-sandbox\native\detours\image.cpp crates\nub-sandbox\native\detours\creatwth.cpp crates\nub-sandbox\native\detours\disolx86.cpp crates\nub-sandbox\native\detours\disolx64.cpp crates\nub-sandbox\native\detours\disolia64.cpp crates\nub-sandbox\native\detours\disolarm.cpp crates\nub-sandbox\native\detours\disolarm64.cpp /Fe:out\live-fs-probe.exe /link advapi32.lib userenv.lib ole32.lib
          "@ | Set-Content out\build.cmd
          cmd /c out\build.cmd *> reports\build.log
          if ($LASTEXITCODE -ne 0) { Get-Content reports\build.log; exit $LASTEXITCODE }
          Get-FileHash out\live-fs-probe.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content reports\executable-hash.json
          Get-FileHash out\image-fixture.exe,out\image-fixture.dll -Algorithm SHA256 | ConvertTo-Json | Set-Content reports\image-hashes.json
          New-Item -ItemType Directory -Force reports\binaries | Out-Null
          Copy-Item out\live-fs-probe.exe,out\image-fixture.exe,out\image-fixture.dll reports\binaries
          Get-FileHash reports\binaries\live-fs-probe.exe,reports\binaries\image-fixture.exe,reports\binaries\image-fixture.dll -Algorithm SHA256 | ConvertTo-Json | Set-Content reports\retained-binary-hashes.json
      - name: Running the ordinary-user AppContainer control
        shell: pwsh
        run: |
          & tests/windows-live-fs-discriminator/run-standard-user.ps1 -ProbeBinary out/live-fs-probe.exe -ImageExe out/image-fixture.exe -ImageDll out/image-fixture.dll -ExistingSource tests/windows-live-fs-discriminator/existing-readable.txt -NearestNonmatch tests/windows-live-fs-discriminator/image-nonmatch.txt -ReportDirectory reports
          exit $LASTEXITCODE
      - name: Uploading discriminator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-live-loader-discriminator
          path: reports
