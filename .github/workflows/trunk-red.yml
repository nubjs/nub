name: Trunk red

# Trunk regressions are only caught POST-merge here by design: the CI matrix drops
# macos-15 from `pull_request` (the macOS-5 concurrent-runner cap), so the leg that
# runs the integration suite on macOS runs on push:main and nightly only. That is a
# deliberate cost trade — but it means nothing is watching when trunk breaks. It once
# stayed red for ~16h across 8 merges (a macOS-only fork bomb, #517) because a failed
# main run notifies nobody.
#
# This workflow closes that loop: it files ONE tracking issue the first time a
# main-branch run fails and comments on it for each subsequent failure, so the red is
# visible and attributable to a commit. It auto-closes once every workflow it reported
# is green on main again.
#
# Scope: report only. It never reruns, reverts, or gates anything.
#
# Every workflow that runs against main is listed below, because a red nobody is told about
# stays red: Node flag drift failed every night from August to November unseen.
# scripts/trunk-red.test.mts fails when a workflow that runs on main is neither listed here
# nor named there as not a verdict, and when a name here matches no workflow.

on:  # zizmor: ignore[dangerous-triggers] trunk-only notifier; reads CI conclusion for main, never checks out or runs PR-controlled code
  workflow_run:
    workflows:
      - CI
      - Node matrix
      - Aube parity
      - Docker install smoke
      - Native-dep floor
      - Daily-driver smoke
      - WPT Worker
      - Action smoke
      - Compile native package islands
      - Docker image
      - Launcher heal
      - Lockfile round-trip
      - Nix flake
      - Node flag drift
      - npm corpus
      - pnpm conformance
      - Release
      - Verb dispatch (one-binary platform package)
      - Verify install scripts
      - lat check
      - winget manifest
      - zizmor
    branches: [main]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read  # each reported workflow's latest main verdict, before closing the issue

# Serialize so two failing workflows finishing together can't both create the
# tracking issue (the find-or-create below is read-then-write, not atomic). `queue: max`
# because a newer pending run otherwise replaces the older one, and a merge cancels every
# watched workflow at once: that burst of no-op events could drop a queued failure report.
concurrency:
  group: trunk-red
  cancel-in-progress: false
  queue: max

jobs:
  report:
    # `skipped` and `cancelled` are not signal: main's CI concurrency group is
    # cancel-in-progress, so a merge burst routinely cancels superseded runs. A
    # pull-request run is not trunk either, but `branches: [main]` matches a fork PR
    # opened from the fork's own main branch, so it is excluded by event.
    if: ${{ github.event.workflow_run.event != 'pull_request' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: File / update / resolve the trunk-red tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: "CI is failing on main"
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # The single open tracking issue, matched on exact title so this can
          # never collide with a human-filed issue that merely mentions CI.
          existing=$(gh issue list --repo "$REPO" --state open --label trunk-red \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          short="${SHA:0:9}"

          if [[ "$CONCLUSION" == "success" ]]; then
            [[ -n "$existing" ]] || exit 0

            # Eight workflows can file this issue, so one of them going green does not mean
            # trunk is green. Closing on any `CI` success cleared reds it never checked:
            # #590, #719, #769, #977 and #987 each closed while the workflow that filed it
            # was still red. Every report is "`<workflow>` failed on main at `<sha>`." with
            # the failed run's URL two lines down, so the issue records which workflows are
            # implicated and which run each one must recover from. Anything unreadable
            # leaves the issue open: a missed close costs one more green, a false close
            # hides a red trunk.
            if ! issue_text=$( { gh issue view "$existing" --repo "$REPO" --json body --jq .body &&
                gh api --paginate "repos/$REPO/issues/$existing/comments" --jq '.[].body'; } ); then
              echo "could not read #$existing; leaving it open"
              exit 0
            fi
            # "<workflow>\t<newest reported failed run id>", or id 0 when a report has no URL.
            # Ids stay strings: mawk's printf %d cannot hold an 11-digit run id.
            # shellcheck disable=SC2016  # an awk program: its $0 and backticks are literal
            reported=$(awk '
              /^`[^`]*` failed on main at / { split($0, p, "`"); wf = p[2]; seen[wf] = 1; next }
              wf != "" && match($0, /\/actions\/runs\/[0-9]+/) {
                id = substr($0, RSTART + 14, RLENGTH - 14)
                if (!(wf in max) || id + 0 > max[wf] + 0) max[wf] = id
                wf = ""
              }
              END { for (w in seen) printf "%s\t%s\n", w, ((w in max) ? max[w] : "0") }
            ' <<< "$issue_text" | sort)

            still_red=""
            while IFS=$'\t' read -r wf failed_id; do
              [[ -n "$wf" ]] || continue
              # The newest run that reached a verdict, which must be the failed run itself
              # (a successful re-run keeps its id) or a newer one. In-flight and cancelled
              # runs count neither way: a merge burst cancels most push runs, so reading only
              # the newest run would hold the issue open until main went quiet. Without the
              # id floor, re-running the failed run would hide it (in progress, or cancelled)
              # and let the green from before the failure clear it. Run ids increase with
              # creation. Pull-request runs are excluded because `--branch main` also matches
              # a fork's branch named main.
              verdict=$(gh run list --repo "$REPO" --workflow "$wf" --branch main \
                --status completed --limit 30 --json conclusion,event,databaseId \
                --jq '[.[] | select(.event != "pull_request" and .conclusion != "cancelled"
                                    and .conclusion != "skipped")][0]
                      | if . then "\(.conclusion) \(.databaseId)" else empty end' \
                || echo "")
              read -r conclusion run_id <<< "$verdict"
              if [[ "$conclusion" == "success" && "$failed_id" -gt 0 \
                    && "${run_id:-0}" -ge "$failed_id" ]]; then
                continue
              fi
              still_red="$still_red $wf"
            done <<< "$reported"

            if [[ -n "$reported" && -z "$still_red" ]]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment "Green again on \`$short\` — $RUN_URL"
            else
              echo "still red:${still_red:- (no reported workflow found)}; leaving #$existing open"
            fi
            exit 0
          fi

          body="\`$WORKFLOW\` failed on main at \`$short\`.

          $RUN_URL

          Trunk-only legs (the macOS integration suite) do not run on pull requests, so a
          regression can land green and only surface here. This issue tracks the red and
          closes automatically once every workflow reported above is green on main again."

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create trunk-red --repo "$REPO" --color B60205 \
              --description "CI is failing on the main branch" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" --label trunk-red --body "$body"
          fi
