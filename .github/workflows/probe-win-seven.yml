name: Probe — the seven red Windows targets

# THROWAWAY branch-scoped probe (ci-adhoc-test skill). DELETE before this branch
# is done. `push` is the trigger that matters — workflow_dispatch is inert until
# the file reaches the default branch.
#
# `seven` runs each red target as its OWN step (continue-on-error + a hard
# timeout-minutes) so one hang or one failure cannot mask the other six — the
# exact masking that hid this list for so long. `main-control` answers the
# pre-existing question for the ONE target that exists at origin/main.
on:
  push:
    branches: [fix/windows-seven]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  seven:
    name: seven (branch tip)
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: probe-win-seven
          save-if: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm ci
        shell: bash
      - name: Build nub-native addon
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/nub-native && cargo build)
          mkdir -p runtime/addons
          cp target/debug/nub_native.dll runtime/addons/nub-native.node
      - name: Build the test binaries
        shell: bash
        run: |
          cargo test -p nub-cli --test project_config_snapshot_cwd --test sandbox_conformance --test sandbox_redaction --test upgrade_windows --no-run
          cargo test -p nub-sandbox --lib --test compiler --test matcher --no-run

      - name: project_config_snapshot_cwd
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: cargo test -p nub-cli --test project_config_snapshot_cwd -- --nocapture

      - name: sandbox_redaction
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: cargo test -p nub-cli --test sandbox_redaction -- --nocapture

      - name: upgrade_windows
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: cargo test -p nub-cli --test upgrade_windows -- --nocapture

      - name: sandbox_conformance
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: cargo test -p nub-cli --test sandbox_conformance -- --nocapture

      - name: nub-sandbox --lib
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: cargo test -p nub-sandbox --lib

      - name: compiler
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: cargo test -p nub-sandbox --test compiler

      - name: matcher
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: cargo test -p nub-sandbox --test matcher

  # upgrade_windows is the only one of the seven whose FILE exists at origin/main.
  # The other six are epic-introduced, so "does it fail at main" is unanswerable
  # for them by construction.
  main-control:
    name: upgrade_windows @ origin/main
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: probe-win-seven-main
          save-if: true
      - name: upgrade_windows at main
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: cargo test -p nub-cli --test upgrade_windows -- --nocapture
