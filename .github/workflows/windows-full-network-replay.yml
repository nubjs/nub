name: Windows full-network artifact replay

on:
  push:
    branches: [windows-seven-artifact-replay]
    paths:
      - '.github/workflows/windows-full-network-replay.yml'
      - 'tests/sandbox-native-adapter/run-full-network-standard-user.ps1'
      - 'tests/sandbox-native-adapter/test-full-network-runner.ps1'

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 64
          persist-credentials: false
      - name: Checking source binding and retaining built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRun = '34742445221'
          $buildHead = 'd7a10f6c92da79543d7d7b023faac0350b829019'
          if ($buildRun -notmatch '^[1-9][0-9]*$') { throw 'A completed numeric build_run input is required' }
          if ($buildHead -notmatch '^[0-9a-f]{40}$') { throw 'A full lowercase build_head input is required' }
          $run = (& gh run view $buildRun --repo nubjs/nub --json status,conclusion,headSha) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.headSha -ne $buildHead) { throw 'Expected the completed successful exact-head diagnostic' }
          & git cat-file -e "$buildHead^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Exact build revision is unavailable in the checked-out history' }
          $allowed = @('.github/workflows/windows-full-network-replay.yml', 'tests/sandbox-native-adapter/run-full-network-standard-user.ps1', 'tests/sandbox-native-adapter/test-full-network-runner.ps1')
          $changed = @(git diff --name-only $buildHead HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Build revision unavailable' }
          foreach ($path in $changed) { if ($path -notin $allowed) { throw "Unbuilt source change: $path" } }
          & gh run download $buildRun --repo nubjs/nub --name 'windows-full-network-gate-${{ matrix.runner }}' --dir retained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-Content retained/source-runtimeenv.json -Raw | ConvertFrom-Json
          if ($source.source -ne $buildHead -or $source.runner -ne '${{ matrix.runner }}') { throw 'Retained source or platform mismatch' }
          if (@($source.sourceStatus).Count -ne 0) { throw 'Retained source was not clean' }
          New-Item -ItemType Directory -Force reports, reports/binaries | Out-Null
          $requiredArtifacts = @('native-full-network.exe', 'nub_sandbox_lib.exe', 'windows_tmp_policy.exe', 'production_readiness_windows.exe', 'windows_native_full_network.exe', 'windows_relay_fixture.exe', 'file-broker-fixture.dll')
          $records = @((Get-Content retained/binary-sha256.json -Raw | ConvertFrom-Json))
          if ($records.Count -ne $requiredArtifacts.Count) { throw "Expected exactly $($requiredArtifacts.Count) retained artifact hashes, got $($records.Count)" }
          $recordNames = @($records | ForEach-Object { [IO.Path]::GetFileName($_.Path) })
          if (@(Compare-Object $requiredArtifacts $recordNames).Count -ne 0) { throw "Unexpected retained artifact set: $($recordNames -join ', ')" }
          foreach ($artifact in $requiredArtifacts) {
            $sourcePath = Join-Path retained/binaries $artifact
            if (!(Test-Path -LiteralPath $sourcePath -PathType Leaf)) { throw "Required retained artifact is missing: $artifact" }
            Copy-Item -LiteralPath $sourcePath -Destination (Join-Path reports/binaries $artifact)
          }
          Copy-Item retained/binary-sha256.json reports/binary-sha256.json
          foreach ($record in $records) {
            $path = Join-Path 'reports/binaries' ([IO.Path]::GetFileName($record.Path))
            if ((Get-FileHash -Algorithm SHA256 $path).Hash -ne $record.Hash) { throw "Retained binary hash mismatch: $path" }
          }
          if (@(Get-ChildItem reports/binaries/*.exe).Count -ne 6 -or @(Get-ChildItem reports/binaries/*.dll).Count -ne 1) { throw 'Expected six retained executables and one file-broker DLL' }
          @{ replaySource=(git rev-parse HEAD); binarySource=$buildHead; buildRun=[int64]$buildRun; runner='${{ matrix.runner }}'; sourceDelta=$changed; requiredArtifacts=$requiredArtifacts; mode='full'; runtime=[Environment]::OSVersion.VersionString } | ConvertTo-Json -Depth 4 | Set-Content reports/replay-binding.json
      - name: Checking runner argument construction
        shell: powershell
        run: ./tests/sandbox-native-adapter/test-full-network-runner.ps1
      - name: Running native network controls as an ordinary user
        shell: pwsh
        run: |
          & ./tests/sandbox-native-adapter/run-full-network-standard-user.ps1 -FixtureBinary (Join-Path $PWD 'reports/binaries/native-full-network.exe') -LibraryBinary (Join-Path $PWD 'reports/binaries/nub_sandbox_lib.exe') -TmpBinary (Join-Path $PWD 'reports/binaries/windows_tmp_policy.exe') -NetworkBinary (Join-Path $PWD 'reports/binaries/windows_native_full_network.exe') -RelayBinary (Join-Path $PWD 'reports/binaries/windows_relay_fixture.exe') -FileBrokerFixtureBinary (Join-Path $PWD 'reports/binaries/file-broker-fixture.dll') -BinaryManifest (Join-Path $PWD 'reports/binary-sha256.json') -Mode full -ReportDirectory reports/full-network-standard-user
          exit $LASTEXITCODE
      - name: Running lifecycle controls as an ordinary user
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (!(Test-Path reports/binaries/production_readiness_windows.exe)) { throw 'Missing lifecycle artifact' }
          & ./tests/sandbox-native-adapter/run-standard-user.ps1 -TestBinary (Join-Path $PWD 'reports/binaries/production_readiness_windows.exe') -ReportDirectory reports/lifecycle-standard-user
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-full-network-replay-${{ matrix.runner }}
          path: reports/
