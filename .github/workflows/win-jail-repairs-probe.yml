# Branch-scoped ad-hoc probe: do the two Windows jail repairs work end to end, and does
# confinement survive them? No pull request required (.claude/skills/ci-adhoc-test/SKILL.md).
# CI is the only venue — AppContainer cannot be launched over SSH (session 0 has no window
# station, so every launch returns 0xC0000142), which also rules out the standing nub-win VM.
#
# WHAT IS MEASURED. Repair 1 makes every ancestor of a granted path reachable, so an absolute
# `require()` no longer dies on `EPERM: lstat 'C:\'` — by writing a non-inherited traverse ACE
# where the user can, and requesting the capability SIDs already on those DACLs where it
# cannot. Repair 2 stamps a NODE_OPTIONS preload that rewrites piped stdio into scratch files,
# so a confined `child_process` spawn returns instead of spinning in libuv's retry loop.
#
# THE CONTROLS. `NUB_SANDBOX_WIN_NO_ANCESTOR_REPAIR` disables repair 1 for one arm of the same
# run, on the same fixture, so the repaired arm has something to differ from; the unshimmed
# piped spawn is the matching control for repair 2 and is the only 15-second arm. A repair that
# opened the jail would be a regression, so the canary and the ancestor-sibling refusals are
# asserted as PASS below alongside the liveness controls.
#
# The icacls dump is a FACT, not a gate: it names the capability SIDs on `C:\` and `C:\Users`
# that the backend harvests, which is what makes the ancestors reachable without elevation.
#
# THE COST GROUP. Repair 1's ace is written per lifecycle SPAWN, and the propagating writer it
# used to go through wedged a 20-minute step and stalled three runs of this probe. It now writes
# through `SetKernelObjectSecurity`. `ace-cost-named-writer-scales-with-tree` is that group's
# control — a run where the propagating writer did NOT slow down on the populated tree measured
# nothing, so it is gated as a PASS alongside the kernel cells rather than reported as a fact.
#
# THE SHELL GROUP. `aube-scripts` runs a lifecycle script through a SHELL, so whether the jail is
# usable is a question about `cmd.exe` before it is a question about `node`. Two earlier rounds
# measured the shells on a bare AppContainer with zero capabilities, no ancestor ACE and no
# stamped NODE_OPTIONS, and both conclusions were retracted. This group runs the real `apply`
# launch with all three repairs in force — gated on `shell-gate-stdio-shim-live`, which asserts
# the preload arrived from INSIDE the confined child — and judges every cell against an
# UNCONFINED twin of the same script in the same run rather than against an exit code. The
# per-cell props are MEASUREMENTS: a FAIL is the finding, so only absence is an error.
#
# THE DE-ELEVATED ARM — THE SHIPPING CONFIGURATION, and the reason this round exists. Every
# Windows cell before it ran as `runneradmin`, which holds WRITE_DAC on `C:\` and `C:\Users`, so
# the repaired arm ACE'd ancestors an ordinary user's token cannot and was a CEILING rather than
# an answer. `deelev_shell_arm` re-executes this binary under a token with no administrative
# authority (Administrators deny-only, every privilege dropped, medium integrity) in the SAME
# session, runs the WHOLE shell battery there, and re-emits its transcript with `deelev-` inserted
# into every property name. Its gate is an ACCESS CHECK, not `TokenIsElevated` — that flag is
# COPIED by CreateRestrictedToken and reads `true` on a token holding no authority at all, so
# `fact:deelev-token-admin-authority` is the line to read and `probe-elevated` is not.
#
# `deelev-shell-gate-repair-on-croot-permitted` is EXPECTED to fail there and is therefore a
# MEASUREMENT, not a gate: `C:\` is not DACL-writable without admin. The de-elevated arm's
# liveness proof is `…-profile-ancestor-permitted` instead — the fixture root is inside the
# user's own profile, carries a protected DACL, and is refused without the repair.
name: win-jail-repairs-probe

on:
  push:
    # Path-filtered so a change to a SIBLING probe does not spend ~25 minutes of Windows runner
    # on this one. Shared capacity: every push here costs the full matrix.
    branches:
      [
        sandbox/win-jail-caps,
        sandbox/win-ace-kernel,
        sandbox/win-shell-jail,
        sandbox/win-deelev-shell,
      ]
    paths:
      - 'crates/nub-sandbox/**'
      - '.github/workflows/win-jail-repairs-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Matches the sibling probes: crt-static makes the self-reexec probe child
      # self-contained, so it starts cleanly under the LowBox token.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Interpreter baseline
        if: always()
        shell: bash
        run: |
          which node
          node -p "process.execPath"
          node -p "process.versions.node"

      - name: Ancestor DACLs
        if: always()
        shell: bash
        run: |
          icacls 'C:\' || true
          icacls 'C:\Users' || true

      # Separate from the run so a compile error reads as a compile error rather than as a
      # probe that measured nothing.
      - name: Build the probe
        if: always()
        shell: bash
        run: cargo test -p nub-sandbox --test windows_jail_repairs --no-run

      # Which shells the image actually has is a FACT the probe reports; this names them here too
      # so a MISSING interpreter is distinguishable from one the probe failed to launch.
      - name: Interpreter inventory
        if: always()
        shell: bash
        run: |
          ls -l "$SYSTEMROOT/System32/cmd.exe" || true
          ls -l "$SYSTEMROOT/System32/WindowsPowerShell/v1.0/powershell.exe" || true
          command -v pwsh && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || true
          ls -l vendor/busybox-w32/busybox64.exe || true

      # 45/35 rather than 30/20: the de-elevated arm re-runs the WHOLE shell battery, and
      # Windows PowerShell 5.1 alone costs ~21 s per confined invocation. The inner `timeout`
      # is what preserves the log — a job-level kill discards it entirely.
      - name: Probe — jail repairs, both directions
        if: always()
        timeout-minutes: 45
        shell: bash
        env:
          # The vendored busybox, supplied without the release-packaging step — the same seam
          # `resolve_bundled_busybox` documents for the Rust suite.
          PROBE_BUSYBOX_EXE: ${{ github.workspace }}\vendor\busybox-w32\busybox64.exe
        run: |
          rc=0
          timeout -k 30 2100 cargo test -p nub-sandbox --test windows_jail_repairs > probe.log 2>&1 || rc=$?
          echo "probe exit=$rc"
          cat probe.log

      # The verdict is read off the log, never off a step's exit status: a property whose
      # `prop:` line is ABSENT fails here too, so a probe that never reached an arm cannot be
      # mistaken for one that passed.
      - name: Verdict
        if: always()
        shell: bash
        run: |
          fail=0
          need() {
            if grep -qF "$1" probe.log 2>/dev/null; then
              echo "OK   $1"
            else
              echo "MISS $1"
              fail=1
            fi
          }
          need_pass() {
            if grep -qF "prop:$1=PASS" probe.log 2>/dev/null; then
              echo "PASS $1"
            elif grep -qF "prop:$1=FAIL" probe.log 2>/dev/null; then
              echo "FAIL $1"
              fail=1
            else
              echo "MISS $1 (never measured)"
              fail=1
            fi
          }
          [ -s probe.log ] || { echo "MISS the probe produced no output at all"; fail=1; }
          need "PROBE windows jail repairs under AppContainer"
          need "  fact:node-exe="
          need "  fact:fixture-root="

          echo "---- controls (a green run is meaningless without these) ----"
          for p in repair-off-lstat-c-root-refused \
                   repair-off-node-absolute-require-fails \
                   repair-on-ungranted-read-refused \
                   work-write-permitted-repair-off \
                   work-write-permitted-repair-on \
                   work-write-permitted-shimmed \
                   work-write-permitted-unshimmed; do
            need_pass "$p"
          done

          # MEASUREMENTS, NOT REQUIREMENTS. A FAIL here is the finding — these ask how much
          # breaks in the shipping configuration, so gating on PASS would turn the answer into a
          # red build. Only ABSENCE is an error: a shape that was never measured tells us nothing.
          echo "---- blast radius: which shapes survive with the repair OFF ----"
          grep -E 'fact:lowbox-sechangenotify=' probe.log || { echo "MISS the token privilege fact"; fail=1; }
          for arm in plain; do
          for p in shape-$arm-eval-only-completes-unrepaired \
                   shape-$arm-eval-builtin-only-completes-unrepaired \
                   shape-$arm-eval-then-absolute-require-completes-unrepaired \
                   shape-$arm-eval-then-relative-require-completes-unrepaired \
                   shape-$arm-eval-then-bare-require-through-junction-completes-unrepaired \
                   shape-$arm-entry-file-completes-unrepaired; do
            grep -q "prop:$p=" probe.log || { echo "MISS $p (never measured)"; fail=1; }
            grep -E "prop:$p=" probe.log || true
          done
          done

          echo "---- what the ancestor ace costs (the SetKernelObjectSecurity claim) ----"
          # The named-writer cell is the control: if the propagating writer did NOT slow down on
          # the populated tree, the walk never reproduced here and the kernel numbers are noise.
          for p in ace-cost-named-writer-scales-with-tree \
                   ace-cost-kernel-writer-flat-in-tree-size \
                   ace-cost-kernel-beats-named-on-populated-tree \
                   ace-cost-real-temp-under-a-second \
                   ace-lands-with-exact-traverse-mask \
                   ace-carries-no-inheritance-flags \
                   ace-absent-on-child-directory \
                   ace-revoke-removes-it \
                   ace-preserves-dacl-control-bits; do
            need_pass "$p"
          done
          need "  fact:ace-cost-us "

          echo "---- the already-AppContainer-readable skip ----"
          for p in aap-skip-declines-a-protected-fixture-root \
                   aap-skip-sees-the-seeded-grant \
                   aap-skip-child-still-reads-the-tool \
                   aap-skip-leaves-the-preexisting-ace-alone; do
            need_pass "$p"
          done
          # Whether the machine's own %ProgramFiles% publishes read to AppContainers is a FACT,
          # not a gate: the skip is an optimisation and a machine without it simply pays.
          grep -E 'fact:aap-readable-' probe.log || { echo "MISS the AAP-readability facts"; fail=1; }

          echo "---- ancestor reachability ----"
          for p in repair-on-lstat-c-root-permitted \
                   repair-on-lstat-chain-permitted \
                   repair-on-node-absolute-require-resolves \
                   repair-on-lifecycle-script-body-completed; do
            need_pass "$p"
          done

          echo "---- confinement survives the repair ----"
          for p in repair-on-ancestor-sibling-read-refused \
                   repair-on-ancestor-sibling-listing-refused; do
            need_pass "$p"
          done

          echo "---- stdio shim ----"
          for p in shim-execfile-async-returns \
                   shim-execfilesync-returns \
                   shim-spawnsync-returns \
                   shim-spawn-stream-returns \
                   shim-fork-fails-fast \
                   unshimmed-piped-hangs; do
            need_pass "$p"
          done

          echo "---- shells: the gates (no cell below counts as evidence without these) ----"
          for p in shell-gate-stdio-shim-live \
                   shell-gate-repair-off-croot-refused \
                   shell-gate-repair-on-croot-permitted \
                   shell-gate-repair-off-profile-ancestor-refused \
                   shell-gate-repair-on-profile-ancestor-permitted \
                   shell-gate-off-ungranted-read-refused \
                   shell-gate-on-ungranted-read-refused; do
            need_pass "$p"
          done
          # The elevation caveat, on the record: `C:\` and `C:\Users` are not DACL-writable by a
          # standard user, so a repaired cell here is a CEILING unless these say otherwise.
          need "  fact:probe-elevated="
          need "  fact:probe-admin-authority="
          grep -E 'fact:shell-ace-writable\[' probe.log || { echo "MISS the per-ancestor ACE-writability facts"; fail=1; }
          need "  fact:shell-capability-fallbacks="
          grep -E 'fact:shell-present-' probe.log || { echo "MISS the interpreter inventory"; fail=1; }

          echo "---- shells: what each interpreter DOES (measurements — a FAIL is the finding) ----"
          for sh in cmd powershell pwsh busybox; do
            grep -qF "fact:shell-present-$sh=true" probe.log || { echo "SKIP $sh (absent on this image)"; continue; }
            need_pass "shell-$sh-unconfined-completes"
            for p in shell-$sh-off-matches-unconfined \
                     shell-$sh-on-matches-unconfined \
                     shell-$sh-on-ungranted-cd-refused; do
              grep -q "prop:$p=" probe.log || { echo "MISS $p (never measured)"; fail=1; }
              grep -E "prop:$p=" probe.log || true
            done
            grep -E "diag:shell-$sh-(off|on)-diff=" probe.log || true
          done

          echo "---- shells: is Windows PowerShell 5.1 broken by the jail, or by a missing grant? ----"
          if grep -qF "fact:shell-present-powershell=true" probe.log; then
            need "  fact:shell-psmodules-grant="
            grep -q "prop:shell-powershell-psmodules-matches-unconfined=" probe.log \
              || { echo "MISS shell-powershell-psmodules-matches-unconfined (never measured)"; fail=1; }
            grep -E "prop:shell-powershell-psmodules-matches-unconfined=" probe.log || true
            grep -E "diag:shell-powershell-psmodules-diff=" probe.log || true
          fi

          echo "---- shells: cmd.exe AS the confined program (the production process shape) ----"
          grep -q "prop:shell-direct-cmd-is-the-confined-program=" probe.log \
            || { echo "MISS shell-direct-cmd-is-the-confined-program (never measured — a watchdog exit means it HUNG)"; fail=1; }
          grep -E "prop:shell-direct-cmd-is-the-confined-program=" probe.log || true
          grep -E "fact:shell-direct-" probe.log || true

          echo "---- shells: every cell, all three arms ----"
          grep -E '^  fact:shell-(cmd|powershell|pwsh|busybox)-' probe.log || true

          echo "════ THE SHIPPING ARM: the same battery under a NON-ADMIN token ════"
          # These two are the only GATES on the whole de-elevated group. Everything else it
          # produced is a measurement whose FAIL is the answer — but a cell from an arm that
          # never ran, or from one that still wielded administrative authority, is not evidence.
          need_pass "deelev-arm-ran"
          need_pass "deelev-arm-holds-no-admin-authority"
          need "  fact:parent-admin-authority="
          need "  fact:deelev-route="
          need "  fact:deelev-arm-exit="
          echo "---- the principal that was measured (read admin-authority, NOT the flag) ----"
          for k in deelev-token-user deelev-token-admin-authority deelev-token-is-elevated-flag \
                   deelev-token-integrity deelev-token-privileges; do
            grep -E "fact:$k=" probe.log || { echo "MISS fact:$k"; fail=1; }
          done

          echo "---- shipping arm: confinement + shim must still hold (gates) ----"
          for p in deelev-shell-gate-stdio-shim-live \
                   deelev-shell-gate-off-ungranted-read-refused \
                   deelev-shell-gate-on-ungranted-read-refused \
                   deelev-shell-gate-repair-off-profile-ancestor-refused \
                   deelev-shell-gate-repair-on-profile-ancestor-permitted; do
            need_pass "$p"
          done

          echo "---- shipping arm: what the repair CAN and CANNOT reach (measurements) ----"
          # `croot-permitted` failing here is the finding, not a broken probe: a standard user
          # cannot write that DACL. `shell-ace-writable[...]` says so per ancestor, and
          # `capability-fallbacks` says whether the capability half was accepted or dropped.
          for p in deelev-shell-gate-repair-off-croot-refused \
                   deelev-shell-gate-repair-on-croot-permitted; do
            grep -q "prop:$p=" probe.log || { echo "MISS $p (never measured)"; fail=1; }
            grep -E "prop:$p=" probe.log || true
          done
          grep -E 'fact:deelev-shell-ace-writable\[' probe.log || { echo "MISS the de-elevated ACE-writability facts"; fail=1; }
          need "  fact:deelev-shell-capability-fallbacks="
          need "  fact:deelev-probe-admin-authority="

          echo "---- shipping arm: does each shell DO ITS JOB? (a FAIL is the finding) ----"
          for sh in cmd powershell pwsh busybox; do
            grep -qF "fact:deelev-shell-present-$sh=true" probe.log || { echo "SKIP $sh (absent on this image)"; continue; }
            need_pass "deelev-shell-$sh-unconfined-completes"
            for p in deelev-shell-$sh-off-matches-unconfined \
                     deelev-shell-$sh-on-matches-unconfined \
                     deelev-shell-$sh-on-ungranted-cd-refused; do
              grep -q "prop:$p=" probe.log || { echo "MISS $p (never measured)"; fail=1; }
              grep -E "prop:$p=" probe.log || true
            done
            grep -E "diag:deelev-shell-$sh-(off|on)-diff=" probe.log || true
          done

          echo "---- shipping arm: every cell, all three arms ----"
          grep -E '^  fact:deelev-shell-(cmd|powershell|pwsh|busybox)-' probe.log || true

          echo "---- the facts ----"
          grep -E '^  (fact|diag):' probe.log || true
          echo "---- properties ----"
          grep -E '^  prop:' probe.log || true
          exit $fail

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-jail-repairs-probe
          path: probe.log
          if-no-files-found: warn
