name: Windows long-path spawn probe

# Branch-scoped: no pull request is needed, and this never runs on main.
on:
  push:
    branches: [probe-win-longpath-spawn]
  workflow_dispatch:

permissions: {}

jobs:
  spawn:
    name: Can bash execute an exe past MAX_PATH?
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probe every spawn form against one over-long path
        shell: bash
        run: |
          set -u
          SEG="windows-long-output-segment-0123456789abcdefghijklmnopqrstuvwxyz"
          LONG_DIR="$RUNNER_TEMP/$SEG/$SEG/$SEG/$SEG"
          mkdir -p "$LONG_DIR"
          LONG_EXE="$(cd "$LONG_DIR" && pwd)/probe.exe"
          [ "${#LONG_EXE}" -gt 260 ] \
            || { echo "::error::probe path is only ${#LONG_EXE} chars — the reproduction is wrong"; exit 1; }
          # node.exe is a real, signed, argument-parsing executable already on the
          # runner, so a successful spawn is unambiguous.
          cp "$(command -v node)" "$LONG_EXE"
          echo "probe path is ${#LONG_EXE} chars"

          declare -A STATUS

          run_candidate() {
            name="$1"; shift
            if out="$("$@" --version 2>&1)"; then
              STATUS[$name]="PASS ($out)"
            else
              STATUS[$name]="FAIL (rc=$? ${out%%$'\n'*})"
            fi
          }

          # THE CONTROL: exactly what the release gate does today.
          run_candidate direct "$LONG_EXE"

          # The prefix everyone reaches for first. Bash needs the backslash form.
          WIN_PATH="$(cygpath -w "$LONG_EXE")"
          run_candidate verbatim "\\\\?\\$WIN_PATH"

          # 8.3 short name, if the volume still generates one.
          SHORT="$(cygpath -d "$LONG_EXE" 2>/dev/null || true)"
          if [ -n "$SHORT" ] && [ "$SHORT" != "$WIN_PATH" ]; then
            run_candidate shortname "$(cygpath -u "$SHORT")"
          else
            STATUS[shortname]="SKIP (no 8.3 name on this volume)"
          fi

          # A mapped drive letter that shortens the path.
          if subst X: "$(cygpath -w "$LONG_DIR")" >/dev/null 2>&1; then
            run_candidate subst "$(cygpath -u 'X:\probe.exe')"
            subst X: /d >/dev/null 2>&1 || true
          else
            STATUS[subst]="SKIP (subst unavailable)"
          fi

          # The shape nub compile's self-probe now uses.
          SHORT_COPY="$RUNNER_TEMP/probe-short.exe"
          cp "$LONG_EXE" "$SHORT_COPY"
          run_candidate copy "$SHORT_COPY"

          echo "=== RESULTS ==="
          for k in direct verbatim shortname subst copy; do
            printf '%-10s %s\n' "$k" "${STATUS[$k]:-MISSING}"
          done

          # The control passing would mean the premise is wrong and every other
          # row is meaningless, so say that rather than reading the winners.
          case "${STATUS[direct]}" in
            PASS*)
              echo "::warning::the control PASSED — bash CAN spawn past MAX_PATH, so the gate needs no change and the fix's comment is too broad"
              exit 0
              ;;
          esac
          echo "the control failed as predicted; a working candidate is the shape the gate should adopt"
          for k in verbatim shortname subst copy; do
            case "${STATUS[$k]}" in PASS*) exit 0 ;; esac
          done
          echo "::error::no candidate could spawn the over-long image — the gate cannot assert execution at that path at all"
          exit 1

  rust-spawn:
    name: Does a Rust binary fail where bash succeeds?
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Spawn an over-long image from std::process::Command
        shell: bash
        run: |
          set -eu
          SEG="windows-long-output-segment-0123456789abcdefghijklmnopqrstuvwxyz"
          LONG_DIR="$RUNNER_TEMP/$SEG/$SEG/$SEG/$SEG"
          mkdir -p "$LONG_DIR"
          LONG_EXE="$(cd "$LONG_DIR" && pwd)/probe.exe"
          cp "$(command -v node)" "$LONG_EXE"
          SHORT_EXE="$RUNNER_TEMP/probe-short.exe"
          cp "$LONG_EXE" "$SHORT_EXE"
          rustc -O -o "$RUNNER_TEMP/spawn_probe.exe" tests/win-longpath-spawn/spawn_probe.rs
          echo "=== RUST SPAWNER RESULTS ==="
          "$RUNNER_TEMP/spawn_probe.exe" "$(cygpath -w "$LONG_EXE")" "$(cygpath -w "$SHORT_EXE")"
          echo "=== registry LongPathsEnabled ==="
          powershell -NoProfile -Command "(Get-ItemProperty 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled" || echo "(unset)"

  exact-shape:
    name: Reproduce the exact failing path shape
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Spawn a 289-char .exe.tmp inside a dot-prefixed staging dir
        shell: bash
        run: |
          set -eu
          SEG="windows-long-output-segment-0123456789abcdefghijklmnopqrstuvwxyz"
          BASE="$RUNNER_TEMP/nub-release-compile-win32-x64/$SEG/$SEG/$SEG/.nub-compile-artifact-2060-0"
          mkdir -p "$BASE"
          TARGET="$(cd "$BASE" && pwd)/replace-existing.exe.tmp"
          cp "$(command -v node)" "$TARGET"
          SHORT="$RUNNER_TEMP/short-copy.exe"
          cp "$TARGET" "$SHORT"
          WIN="$(cygpath -w "$TARGET")"
          echo "reproduced path is ${#WIN} chars (the real failure was 289)"
          rustc -O -o "$RUNNER_TEMP/spawn_probe.exe" tests/win-longpath-spawn/spawn_probe.rs
          echo "=== EXACT SHAPE RESULTS ==="
          # A PASS here means the path shape is innocent and the real failure is
          # about the compiled ARTIFACT, not about where it sits — which would
          # mean the short-copy retry cannot help and the fix is aimed wrong.
          "$RUNNER_TEMP/spawn_probe.exe" "$WIN" "$(cygpath -w "$SHORT")"

  real-compile:
    name: Reproduce with a real nub compile
    runs-on: windows-latest
    timeout-minutes: 25
    # Reads the win32-x64 package built by release run 32297900642 — the exact
    # binary whose self-probe failed. This is a throwaway probe workflow, not
    # the publishing one.
    permissions:
      actions: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the gate's own win32-x64 package
        uses: actions/download-artifact@v4
        with:
          name: nub-win32-x64
          path: nub-pkg
          run-id: 32297900642
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay the gate's long-path replace-existing sequence
        shell: bash
        run: |
          set -u
          chmod +x nub-pkg/bin/* 2>/dev/null || true
          BIN="$PWD/nub-pkg/bin/nub.exe"
          test -f "$BIN" || { echo "::error::no nub.exe in the downloaded package"; find nub-pkg -type f | head -40; exit 1; }
          echo "nub: $BIN  version: $("$BIN" --version 2>&1 | head -1)"
          SEG="windows-long-output-segment-0123456789abcdefghijklmnopqrstuvwxyz"
          WORK="$RUNNER_TEMP/nub-release-compile-win32-x64"
          SRC="$WORK/source"; mkdir -p "$SRC"
          LONG_DIR="$WORK/$SEG/$SEG/$SEG/$SEG"; mkdir -p "$LONG_DIR"
          LONG_OUT="$(cd "$LONG_DIR" && pwd)/replace-existing.exe"
          echo "LONG_OUT is ${#LONG_OUT} chars"
          ENTRY="$SRC/windows-long-replace.js"
          NODE_VERSION="$(node --version)"; NODE_VERSION="${NODE_VERSION#v}"

          printf '%s\n' 'console.log("windows-long-first")' > "$ENTRY"
          echo "--- compile 1 (fresh) ---"
          XDG_CACHE_HOME="$WORK/cache" "$BIN" compile --target "$NODE_VERSION" --out "$LONG_OUT" "$ENTRY"
          echo "compile 1 rc=$?"

          printf '%s\n' 'console.log("windows-long-second")' > "$ENTRY"
          echo "--- compile 2 (replace-existing: the one that failed in the gate) ---"
          XDG_CACHE_HOME="$WORK/cache" "$BIN" compile --target "$NODE_VERSION" --out "$LONG_OUT" "$ENTRY"
          echo "compile 2 rc=$?"

          echo "--- run the artifact ---"
          test -f "$LONG_OUT" && "$LONG_OUT" && echo "artifact rc=$?" || echo "artifact missing or failed rc=$?"

  artifact-vs-path:
    name: Is it the artifact, the path, or a vanishing file?
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      actions: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: nub-win32-x64
          path: nub-pkg
          run-id: 32297900642
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile short, then spawn the SAME artifact from the long staging shape
        shell: bash
        run: |
          set -u
          BIN="$PWD/nub-pkg/bin/nub.exe"
          SEG="windows-long-output-segment-0123456789abcdefghijklmnopqrstuvwxyz"
          WORK="$RUNNER_TEMP/nub-release-compile-win32-x64"
          SRC="$WORK/source"; mkdir -p "$SRC"
          ENTRY="$SRC/e.js"; printf '%s\n' 'console.log("ok")' > "$ENTRY"
          NODE_VERSION="$(node --version)"; NODE_VERSION="${NODE_VERSION#v}"

          # A SHORT --out must succeed. If it does not, the long path is a red
          # herring and compile is broken outright on this runner.
          SHORT_OUT="$WORK/short.exe"
          echo "--- compile to a SHORT --out ---"
          XDG_CACHE_HOME="$WORK/cache" "$BIN" compile --target "$NODE_VERSION" --out "$SHORT_OUT" "$ENTRY"
          echo "short compile rc=$?"
          echo "artifact size: $(wc -c < "$SHORT_OUT" 2>/dev/null || echo missing)"

          # Now put THAT artifact at the exact staging shape that failed and try
          # to start it the way verify_artifact does.
          STAGE="$WORK/$SEG/$SEG/$SEG/.nub-compile-artifact-9999-0"
          mkdir -p "$STAGE"
          TMP="$(cd "$STAGE" && pwd)/replace-existing.exe.tmp"
          cp "$SHORT_OUT" "$TMP"
          echo "staged copy is ${#TMP} chars; exists=$([ -f "$TMP" ] && echo yes || echo NO)"
          echo "--- spawn the real artifact from the long staging path ---"
          __NUB_COMPILED_LAUNCHER_MODE=probe "$TMP" && echo "spawn rc=$?" || echo "spawn FAILED rc=$?"
          echo "still exists after spawn attempt: $([ -f "$TMP" ] && echo yes || echo NO)"

          # And the same bytes at a short path, as the control.
          SHORT_TMP="$WORK/short-probe.exe"
          cp "$SHORT_OUT" "$SHORT_TMP"
          echo "--- spawn the same bytes from a SHORT path ---"
          __NUB_COMPILED_LAUNCHER_MODE=probe "$SHORT_TMP" && echo "spawn rc=$?" || echo "spawn FAILED rc=$?"
