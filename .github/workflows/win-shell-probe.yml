# Ad-hoc, branch-scoped probe (no PR required — see .claude/skills/ci-adhoc-test).
#
# THE QUESTIONS, in priority order:
#  1. Does busybox-w32's ash — a native-Win32 POSIX shell with no MSYS runtime —
#     keep its Linux POSIX conformance on real Windows?
#  2. Can each candidate resolve and execute a `node_modules/.bin/*.cmd` shim?
#     That is the entire reason nub wants a cross-platform script shell.
#
# Candidates: busybox-w32 ash · Git-for-Windows bash (MSYS2, preinstalled) ·
# brush (Rust bash-compatible shell) · cmd.exe (today's npm/nub default).
#
# The compat bar is POSIX sh, NOT bash: npm runs script bodies with `sh -c`, and
# on Debian/Ubuntu that is dash. cases.mjs tags every case accordingly, and
# posixprobe.sh is a sibling prong's 34-case POSIX conformance script reused
# VERBATIM so these Windows numbers are directly comparable to its Linux run.
name: win-shell-probe

on:
  push:
    branches: [win-shell-probe]
    paths:
      - "tests/win-shell-probe/**"
      - ".github/workflows/win-shell-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything that needs no compilation.
  preinstalled:
    name: busybox-w32 / Git Bash / cmd.exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Environment inventory
        shell: pwsh
        run: |
          Write-Host "== node =="        ; node --version
          Write-Host "== PATHEXT =="     ; $env:PATHEXT
          Write-Host "== cmd ver =="     ; cmd /d /s /c ver
          Write-Host "== git bash =="
          $gb = "C:\Program Files\Git\bin\bash.exe"
          if (Test-Path $gb) { & $gb --version } else { Write-Host "ABSENT: $gb" }
          Write-Host "== where bash =="  ; where.exe bash 2>&1 | Out-Host

      - name: Fetch busybox-w32 (single native .exe, no MSYS runtime)
        id: busybox
        shell: pwsh
        continue-on-error: true
        run: |
          $dest = "$env:RUNNER_TEMP\busybox"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $exe = "$dest\busybox64.exe"
          $ok = $false
          foreach ($u in @("https://frippery.org/files/busybox/busybox64.exe",
                           "https://frippery.org/files/busybox/busybox64u.exe")) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $exe -UseBasicParsing -TimeoutSec 90
              $ok = $true; Write-Host "BUSYBOX_SOURCE|$u"; break
            } catch { Write-Host "download failed: $u -> $_" }
          }
          if (-not $ok) {
            Write-Host "BUSYBOX UNAVAILABLE — busybox rows will be reported as not tested."
            "path=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $len = (Get-Item $exe).Length
          Write-Host "BUSYBOX_SIZE_BYTES|$len"
          # DLL dependency check: a native-Win32 binary with no MSYS runtime is
          # the whole premise. dumpbin ships with the runner's MSVC install.
          $dumpbin = Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents $exe | Out-Host } else { Write-Host "dumpbin not found; skipping DLL dependency dump" }
          Write-Host "== busybox version =="; & $exe | Select-Object -First 3 | Out-Host
          Write-Host "== applet list =="; & $exe --list | Out-String -Width 200 | Out-Host
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Build fixture
        shell: pwsh
        run: node tests/win-shell-probe/make-fixture.mjs "$env:RUNNER_TEMP\fixture"

      - name: "MATRIX: busybox-w32 ash  [#1 candidate]"
        if: steps.busybox.outputs.path != ''
        shell: pwsh
        run: |
          node tests/win-shell-probe/run-matrix.mjs --shell busybox-ash `
            --bin "${{ steps.busybox.outputs.path }}" --argv-prefix ash `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      - name: "MATRIX: busybox-w32 ash -X  (argument-mangling opt-out)"
        if: steps.busybox.outputs.path != ''
        shell: pwsh
        run: |
          node tests/win-shell-probe/run-matrix.mjs --shell busybox-ash-X `
            --bin "${{ steps.busybox.outputs.path }}" --argv-prefix ash,-X `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      - name: "MATRIX: busybox-w32 sh  (confirm sh == ash applet)"
        if: steps.busybox.outputs.path != ''
        shell: pwsh
        run: |
          node tests/win-shell-probe/run-matrix.mjs --shell busybox-sh `
            --bin "${{ steps.busybox.outputs.path }}" --argv-prefix sh `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      - name: "BUSYBOX EXTRA: applet shadowing + BB_OVERRIDE_APPLETS"
        if: steps.busybox.outputs.path != ''
        shell: pwsh
        run: |
          $bb = "${{ steps.busybox.outputs.path }}"
          $bin = "$env:RUNNER_TEMP\fixture\node_modules\.bin"
          $env:PATH = "$bin;$env:PATH"
          Write-Host "--- plain: does busybox's own `which` applet shadow the .bin shim?"
          & $bb ash -c "which --flag value" ; Write-Host "exit=$LASTEXITCODE"
          Write-Host "--- with BB_OVERRIDE_APPLETS=which"
          $env:BB_OVERRIDE_APPLETS = "which"
          & $bb ash -c "which --flag value" ; Write-Host "exit=$LASTEXITCODE"
          Remove-Item Env:BB_OVERRIDE_APPLETS
          Write-Host "--- /dev/null as a REDIRECTION TARGET (README says supported)"
          & $bb ash -c "echo noisy > /dev/null && echo redirect-ok" ; Write-Host "exit=$LASTEXITCODE"
          Write-Host "--- /dev/null as an ARGUMENT to another program (README says NOT supported)"
          & $bb ash -c "node -e `"const fs=require('fs');try{fs.appendFileSync(process.argv[1],'x');console.log('OPENED-OK')}catch(e){console.log('OPEN-FAIL '+e.code)}`" /dev/null" ; Write-Host "exit=$LASTEXITCODE"

      - name: "MATRIX: cmd.exe (baseline — today's npm/nub Windows default)"
        shell: pwsh
        run: |
          node tests/win-shell-probe/run-matrix.mjs --shell cmd `
            --bin "$env:ComSpec" `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      - name: "MATRIX: Git Bash (MSYS2 — the battle-tested control)"
        shell: pwsh
        run: |
          node tests/win-shell-probe/run-matrix.mjs --shell gitbash `
            --bin "C:\Program Files\Git\bin\bash.exe" `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      - name: "MATRIX: Git Bash with MSYS_NO_PATHCONV=1 (path-translation opt-out)"
        shell: pwsh
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          node tests/win-shell-probe/run-matrix.mjs --shell gitbash-nopathconv `
            --bin "C:\Program Files\Git\bin\bash.exe" `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      # The sibling prong's 34-case POSIX conformance script, reused VERBATIM so
      # these Windows numbers are directly comparable to its Linux baseline.
      - name: "POSIXPROBE (34 cases, verbatim): busybox ash / busybox sh / Git Bash"
        shell: pwsh
        continue-on-error: true
        run: |
          $bb = "${{ steps.busybox.outputs.path }}"
          if ($bb) {
            $env:LBL = "busybox-ash (windows)"; & $bb ash tests/win-shell-probe/posixprobe.sh 2>&1 | Out-Host
            $env:LBL = "busybox-sh (windows)";  & $bb sh  tests/win-shell-probe/posixprobe.sh 2>&1 | Out-Host
            $env:LBL = "busybox-ash -X (windows)"; & $bb ash -X tests/win-shell-probe/posixprobe.sh 2>&1 | Out-Host
          }
          $env:LBL = "gitbash (windows)"
          & "C:\Program Files\Git\bin\bash.exe" tests/win-shell-probe/posixprobe.sh 2>&1 | Out-Host
          Write-Host "### shell: cmd.exe — NOT APPLICABLE: cmd cannot execute a POSIX shell script at all (0/34 by construction)."

  # brush publishes NO Windows release binary and has NO Windows CI leg upstream,
  # so it must be built here. The build time is itself a finding.
  brush:
    name: brush (built from crates.io)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version; cargo --version

      # brush's workspace denies all warnings, so a newer rustc than the authors
      # tested would fail the build on a lint rather than a real error. Cap lints
      # so this measures whether the CODE works on Windows.
      - name: Build + install brush-shell 0.4.0 (timed)
        id: brushbuild
        continue-on-error: true
        timeout-minutes: 35
        shell: pwsh
        env:
          RUSTFLAGS: "--cap-lints allow"
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: never
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cargo install brush-shell --locked --version 0.4.0 --root "$env:RUNNER_TEMP\brushroot"
          $code = $LASTEXITCODE
          $sw.Stop()
          "seconds=$([int]$sw.Elapsed.TotalSeconds)" >> $env:GITHUB_OUTPUT
          $exe = "$env:RUNNER_TEMP\brushroot\bin\brush.exe"
          if (Test-Path $exe) { "path=$exe" >> $env:GITHUB_OUTPUT } else { "path=" >> $env:GITHUB_OUTPUT }
          exit $code

      - name: Report build outcome
        shell: pwsh
        run: |
          Write-Host "BRUSH_BUILD|seconds=${{ steps.brushbuild.outputs.seconds }}|outcome=${{ steps.brushbuild.outcome }}|binary=${{ steps.brushbuild.outputs.path }}"
          if ("${{ steps.brushbuild.outputs.path }}") {
            $len = (Get-Item "${{ steps.brushbuild.outputs.path }}").Length
            Write-Host "BRUSH_SIZE_BYTES|$len"
          }

      - name: Build fixture
        if: steps.brushbuild.outputs.path != ''
        shell: pwsh
        run: node tests/win-shell-probe/make-fixture.mjs "$env:RUNNER_TEMP\fixture"

      - name: "MATRIX: brush"
        if: steps.brushbuild.outputs.path != ''
        shell: pwsh
        run: |
          & "${{ steps.brushbuild.outputs.path }}" --version
          node tests/win-shell-probe/run-matrix.mjs --shell brush `
            --bin "${{ steps.brushbuild.outputs.path }}" `
            --fixture "$env:RUNNER_TEMP\fixture" --work "$env:RUNNER_TEMP\work"

      - name: "POSIXPROBE (34 cases, verbatim): brush"
        if: steps.brushbuild.outputs.path != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $env:LBL = "brush (windows)"
          & "${{ steps.brushbuild.outputs.path }}" tests/win-shell-probe/posixprobe.sh 2>&1 | Out-Host
