# Throwaway survey probe: enumerate every macOS filesystem-observation mechanism available
# on a hosted macos-15 runner (SIP reported disabled) and score each against a known
# ground-truth workload. Branch-scoped, no PR — see the `ci-adhoc-test` skill.
name: macos-observe-survey

on:
  push:
    branches: [probe/macos-observe-survey]
    paths:
      - 'tests/macos-observe-survey/**'
      - '.github/workflows/macos-observe-survey.yml'
  workflow_dispatch:

permissions: {}

jobs:
  survey:
    # Matrix purely as a scheduling hedge: hosted macOS pools queue unevenly, and the survey
    # questions are arch-independent except where the report says otherwise. First leg to run
    # answers them; the arm64/x86_64 split is itself worth recording for `fbt`.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Survey
        run: bash tests/macos-observe-survey/probe.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observe-survey-${{ matrix.runner }}
          path: ${{ runner.temp }}/observe-survey/*.txt
          if-no-files-found: warn
