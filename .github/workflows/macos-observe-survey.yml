# Throwaway survey probe: which macOS mechanism should a build-jail observer be built on.
# Branch-scoped, no PR — see the `ci-adhoc-test` skill.
#
# USES NO ACTIONS ON PURPOSE. The first attempt died in "Set up job" with
# `Failed to resolve action download info. Error: Service Unavailable`. A `git clone` needs
# nothing but the runner's own token, and the deliverable is the step log.
#
# AND IT CARRIES ITS OWN WATCHDOG. Two earlier runs sailed straight past
# `timeout-minutes` without being killed, burning ~30 minutes of macOS runner each and
# producing no retrievable log. The probe therefore runs detached into a FILE, is killed by
# this step at a deadline it controls, and the file is printed either way — so a hang costs
# the tail of the output instead of all of it.
name: macos-observe-survey

on:
  push:
    branches: [probe/macos-observe-survey]
    paths:
      - 'tests/macos-observe-survey/**'
      - '.github/workflows/macos-observe-survey.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Clone the probe branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          echo "GITHUB_WORKSPACE=$PWD/repo" >> "$GITHUB_ENV"
      - name: Survey (watchdogged)
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/tests/macos-observe-survey/probe.sh" > probe.out 2>&1 &
          PROBE=$!
          for i in $(seq 1 120); do            # 120 x 5s = 10 minute ceiling
            kill -0 "$PROBE" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$PROBE" 2>/dev/null; then
            echo "WATCHDOG: probe still alive at the 10-minute deadline; killing it." >> probe.out
            sudo pkill -9 -f 'dtrace -s' 2>/dev/null
            sudo pkill -9 es_probe 2>/dev/null
            kill -9 "$PROBE" 2>/dev/null
          fi
          echo "=================== PROBE OUTPUT ==================="
          cat probe.out
