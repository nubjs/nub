name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full cross-OS matrix at 06:00 UTC (offset from the lockfile-roundtrip
    # nightly at 07:00 and pnpm-conformance at 08:00). PR pushes run a Linux-gated
    # matrix (plus one Windows representative) to avoid saturating the macOS-5
    # concurrent-runner cap during busy PR waves; the full os × node cross-product
    # runs here and on push:main, so cross-platform regressions are still caught —
    # just on trunk/nightly rather than per-PR. See the `test`/`pnp` jobs for the
    # exact PR-vs-trunk split (driven by the `matrix-plan` job below).
    - cron: "0 6 * * *"

# No-scope default token; each job opts into the read scopes its steps use.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Emit the os × node matrices for the `test` and `pnp` jobs, varying by event:
  #   pull_request → Linux legs (full Node-version tier matrix) + ONE windows-latest
  #                  representative (the only place cfg(windows) PM-shim / PnP-path
  #                  code compiles + runs). macOS is dropped from PRs entirely — it
  #                  is the macOS-5-concurrent bottleneck.
  #   push:main / schedule (nightly) / any other event → the FULL matrix: ubuntu +
  #                  windows-latest + macos-14 on the current Node line, plus the
  #                  Linux-only tier representatives. This is where cross-OS (incl.
  #                  macOS) coverage is proven.
  # One job emitting JSON consumed via fromJSON keeps the split in a single place
  # instead of duplicating workflow files or hand-maintaining parallel matrices.
  matrix-plan:
    name: Plan matrices
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists PR changed files via the GitHub API.
      pull-requests: read
    outputs:
      test: ${{ steps.plan.outputs.test }}
      pnp: ${{ steps.plan.outputs.pnp }}
      # Path-awareness: skip the expensive Rust suite for changes that provably
      # cannot affect Rust behavior (docs-only / site-only). FAIL SAFE TOWARD
      # RUNNING — any ambiguity (push:main, schedule, a paths-filter error, an
      # unmatched non-doc change) sets run_rust=true so a Rust change is NEVER
      # skipped. The merge gate stays honest via the always-running `ci-gate`
      # aggregator below, so a skipped Rust matrix still resolves the gate green
      # (a SKIPPED branch-protection-required check would otherwise hang the PR
      # on "Expected — waiting for status" forever — see the aggregator).
      run_rust: ${{ steps.paths.outputs.run_rust }}
      run_site: ${{ steps.paths.outputs.run_site }}
      run_types: ${{ steps.paths.outputs.run_types }}
      run_scripts: ${{ steps.paths.outputs.run_scripts }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      # diffs against the PR base; on push it diffs against the before-SHA. Only
      # docs/site-only changes flip a group OFF — everything else (including the
      # vendored aube tree under vendor/aube/**, so any aube edit triggers the
      # full suite) is Rust-relevant. .github/workflows/** is Rust-relevant so a
      # CI change still exercises the matrix it edits.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # On push events with no diff base, dorny treats everything as changed
          # (its documented fallback), which is the fail-safe direction we want.
          filters: |
            rust:
              - 'crates/**'
              - 'vendor/aube/**'
              - 'vendor/libsui/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain*'
              - 'tests/**'
              - 'runtime/**'
              - '.github/workflows/**'
            site:
              - 'site/**'
            types:
              - 'npm/nub-types/**'
            # Gates the docs-links job's three NON-site steps — `soak`, `tools:check`
            # and `test:scripts` — so it must cover all three gates' inputs, not just
            # scripts/. No group REACHED that job before: `rust-toolchain*` is in `rust`,
            # but docs-links is not gated on run_rust, and the rest were in no group at
            # all. Since that job is their only runner, a PR touching them skipped its own
            # gate entirely and drift surfaced as trunk red on push:main.
            scripts:
              - 'scripts/**'
              - 'package.json'
              # soak's pinned surfaces (see the header of scripts/soak/soak.mts)
              - '.cargo/config.toml'
              - '.npmrc'
              - 'tools/**'
              - '.github/renovate.json'
              # external-tools.mts's pins
              - 'external-tools.json'
              - 'rust-toolchain*'
              # runtime-deps.test.mjs reads these four and asserts they agree on the
              # vendored runtime set. They live in other groups (or none), so without
              # them here the one PR shape the test exists to catch — adding a package
              # to a producer and not to the gate — would never run it.
              - 'crates/nub-core/build.rs'
              - '.github/workflows/release.yml'
              - 'flake.nix'
              - 'npm/build-local.sh'
      - id: paths
        shell: bash
        env:
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_SITE: ${{ steps.filter.outputs.site }}
          FILTER_TYPES: ${{ steps.filter.outputs.types }}
          FILTER_SCRIPTS: ${{ steps.filter.outputs.scripts }}
        run: |
          set -euo pipefail
          # FAIL SAFE: only a pull_request whose paths-filter ran cleanly may
          # turn run_rust OFF. push:main, schedule, workflow_dispatch, or any
          # event where the filter outcome is unavailable run the full suite.
          run_rust=true
          run_site=true
          run_types=true
          run_scripts=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            run_rust="$FILTER_RUST"
            run_site="$FILTER_SITE"
            run_types="$FILTER_TYPES"
            run_scripts="$FILTER_SCRIPTS"
          fi
          # Guard against an empty/garbled filter output → default to running.
          [[ "$run_rust" == "true" || "$run_rust" == "false" ]] || run_rust=true
          [[ "$run_site" == "true" || "$run_site" == "false" ]] || run_site=true
          [[ "$run_types" == "true" || "$run_types" == "false" ]] || run_types=true
          [[ "$run_scripts" == "true" || "$run_scripts" == "false" ]] || run_scripts=true
          {
            echo "run_rust=$run_rust"
            echo "run_site=$run_site"
            echo "run_types=$run_types"
            echo "run_scripts=$run_scripts"
          } >> "$GITHUB_OUTPUT"
          echo "run_rust=$run_rust run_site=$run_site run_types=$run_types run_scripts=$run_scripts (event=${{ github.event_name }})"
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          # The Linux Node-version tier legs are common to PR and trunk (compat
          # divergences are runtime-version-specific, not OS-specific). The
          # current-line cross-OS legs differ: PR keeps ubuntu + ONE windows;
          # trunk/nightly adds macos-14.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test_os='[{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"}]'
            pnp_os='[{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"}]'
          else
            test_os='[{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"},{"os":"macos-14","node":"24"}]'
            pnp_os='[{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"},{"os":"macos-14","node":"24"}]'
          fi
          # Linux-only Node-version tier representatives (same on PR and trunk).
          test_tiers='[{"os":"ubuntu-latest","node":"22.15"},{"os":"ubuntu-latest","node":"22.13"},{"os":"ubuntu-latest","node":"20.11"},{"os":"ubuntu-latest","node":"18.19"}]'
          pnp_tiers='[{"os":"ubuntu-latest","node":"22.15"},{"os":"ubuntu-latest","node":"18.19"}]'
          test=$(jq -cn --argjson a "$test_os" --argjson b "$test_tiers" '{include: ($a + $b)}')
          pnp=$(jq -cn --argjson a "$pnp_os" --argjson b "$pnp_tiers" '{include: ($a + $b)}')
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "pnp=$pnp" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      # Every workspace member now builds on oxc 0.140 (unified so a --features
      # compile build links ONE oxc stack — the oxc-lockstep gate), and oxc 0.140
      # requires rustc 1.95 — so nub-phantom no longer holds a 1.93 floor and the
      # whole check runs on a single 1.95 toolchain.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # 1.95.0 # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          toolchain: 1.95.0
      # shared-key (stable across runs, NOT per-ref) so PRs restore the warm cache
      # main saves; save-if gates writes to main only, so PRs/tags are read-only and
      # don't churn the 10GB/repo budget (the default per-(job,ref) key let every PR
      # write its own cache). Per job-family because compiled artifacts differ by
      # build profile (check=--all-targets fast, plus the nub-phantom leg on the
      # default profile, vs test profile vs pnp debug build).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path crates/nub-phantom/Cargo.toml --all-targets
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # 1.95.0 # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          toolchain: 1.95.0
      # --profile fast, matching the dev loop and `make verify`. The analysis
      # gates emit no artifact a later step references by path, so they can share
      # ONE profile with local iteration instead of maintaining a second full
      # dependency build under `dev`. `fast` inherits `dev` — same opt-level,
      # debug-assertions and overflow checks — and differs only in debuginfo
      # (line-tables-only), which no lint reads. The test jobs deliberately stay
      # on `dev`: they reuse the debug addon/binary artifacts by path.
      # nub-phantom (above) stays too — its workspace defines no `fast` profile.
      - run: cargo check --all-targets --profile fast
      - run: cd crates/nub-native && cargo check --locked --all-targets --all-features --profile fast
      # Real Windows compile + test coverage is the windows-latest leg of the
      # `test` job. The previous fast `x86_64-pc-windows-gnu` cross-check needed
      # mingw-w64 + ring's C build, which was fragile on the runner; the native
      # Windows leg is the source of truth, so the cross-check is dropped.

  clippy:
    name: Clippy
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The root `--all-features` clippy below turns on `embed-runtime`, whose build.rs
    # demands a fully staged runtime/ (addon + vendored node_modules) so no packager can
    # ship a binary that cannot resolve its transpile helpers. This job and the two below
    # never RUN the binary they produce, so they opt out rather than vendor npm packages
    # for a lint. Same grant in the Makefile's `verify` target and scripts/remote-build.ts,
    # which mirror this gate. (The `check` job needs no grant: its only `--all-features`
    # run is in crates/nub-native, a separate workspace with no `embed-runtime` feature.)
    env:
      NUB_ALLOW_INCOMPLETE_RUNTIME: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            crates/nub-native
      # --all-features enables `embed-runtime`, whose build.rs bakes the integrity
      # digest of runtime/addons/nub-native.node (gitignored — built locally / staged
      # in release.yml) and fails loud if it's absent. Stage a placeholder so the lint
      # build's four-entrypoint set is complete; clippy never runs the binary.
      - name: Stage placeholder addon for the embed-runtime lint build
        run: |
          mkdir -p runtime/addons
          printf 'placeholder-addon' > runtime/addons/nub-native.node
      # --profile fast so this shares one artifact universe with the dev loop and
      # `make verify` (see the check job above for the rationale).
      - run: cargo clippy --all-targets --all-features --profile fast -- -D warnings
      # nub-native is its OWN workspace (split so the CLI uses panic=abort while
      # the cdylib stays panic=unwind), `exclude`d from the root workspace — so the
      # root clippy above does NOT cover it. Lint it from inside the crate so its
      # own dbg_macro/todo/unimplemented lints (Cargo.toml [workspace.lints]) are
      # still enforced. (No --all-targets: the cdylib sets test=false/doctest=false.)
      - run: cd crates/nub-native && cargo clippy --all-features --profile fast -- -D warnings
      # nub-launcher (the `nub compile` runtime half) is ALSO its own workspace
      # (excluded from the root one for a size-tuned release profile), so the root
      # clippy doesn't cover it either. Lint + build + TEST it from inside the crate
      # so it can't bit-rot against nub-core changes and so its own unit tests (the
      # cache-directory probe chain) actually run somewhere. Stays off `--profile
      # fast` for the same reason nub-phantom does: its workspace defines no such
      # profile, only `[profile.release]`.
      - run: cd crates/nub-launcher && cargo clippy --locked --all-targets -- -D warnings && cargo build --locked && cargo test --locked
      # Static brand-boundary gate: no AUBE_*-branded env-var READS in nub crate
      # source (the embedded engine's brand is never nub's config surface). Cheap
      # grep, no build — runs alongside clippy on the same run_rust gate.
      - name: Brand lint (no AUBE_* env reads)
        run: tests/brand-lint/check-env-reads.sh
      # The write-side twin of the gate above: no on-disk path nub creates may
      # carry the engine's brand. Scans the vendored engine too — that is where
      # the hardcoded names lived, and where they leaked into users' caches,
      # stores, and node_modules.
      - name: Brand lint (no aube-branded path literals)
        run: tests/brand-lint/check-path-literals.sh

  # The single-binary `embed-runtime` feature is OFF in every default build, so the
  # feature-off `test` job never RUNS the runtime_cache extraction/race/GC/INTEGRITY
  # tests, and build.rs's tar+zstd blob arm + per-entrypoint hash baking go
  # unexercised on PRs (they would first break at a release tag). Build + test the
  # feature-on path here so an embed/extract/verify regression fails a PR.
  #
  # CRITICAL: the R2 verify-on-load suite (zero-false-positive on a clean extraction,
  # tamper→self-heal, canary/enforce decision, R1 0700/owner/symlink validation,
  # build.rs hash determinism) runs against the REAL embedded blob — and a verify
  # FALSE-POSITIVE would BRICK nub on that platform. So it runs on every hosted OS
  # (Windows path semantics + macOS + linux all differ) and is ci-gate-required. The
  # verify logic is pure-Rust (fs::read + blake3 + libc::geteuid / symlink_metadata),
  # identical on musl — and the musl RUNTIME is exercised by the `Docker smoke (musl,
  # node:22-alpine)` leg + release.yml's musl binary build. (A standalone `cargo test
  # --target x86_64-unknown-linux-musl` leg was once blocked by a musl-compile error in
  # spawn.rs's PTY ioctl — `libc::TIOCSCTTY as c_ulong`, where libc types the ioctl
  # request as c_int on musl vs c_ulong on glibc; fixed to `as _` so inference picks the
  # per-target type. It was test-only, so the released musl binary was never affected.)
  # The addon is gitignored (built locally
  # / staged in release.yml), so a placeholder is staged so build.rs's four-entrypoint
  # hash set is complete; it is never dlopen'd here (the tests verify hash CONSISTENCY —
  # baked == extracted — not native loading).
  embed-runtime:
    name: embed-runtime verify (${{ matrix.os }})
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Exercises the embed/extract PLUMBING (blob round-trip, integrity hashes), not the
    # transpile path the vendored packages serve. See the `clippy` job.
    env:
      NUB_ALLOW_INCOMPLETE_RUNTIME: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-embed-runtime-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stage placeholder addon for the embed build
        shell: bash
        run: |
          mkdir -p runtime/addons
          printf 'placeholder-addon' > runtime/addons/nub-native.node
      - run: cargo test -p nub-core --features embed-runtime
      # The feature-on binary build (build.rs blob arm + the find_preload wire-in) is
      # OS-agnostic; one leg is enough.
      - name: Build the feature-on binary
        if: runner.os == 'Linux'
        run: cargo build -p nub-cli --features embed-runtime

  # The single-binary first-run mechanism is novel ON WINDOWS specifically: the binary
  # extracts the embedded nub-native.node (a DLL) to a cache dir and dlopen's it on the
  # first run — the "process writes a DLL then loads it" shape Windows Defender real-time
  # scanning can flag. The `embed-runtime` matrix above runs the R2 verify LOGIC against
  # the real blob on every OS, but only with a placeholder addon; this job is the one
  # place the REAL release DLL is extracted, R2-verified, AND dlopen'd. It builds the
  # real single binary (--features embed-runtime, real nub-native addon in the blob),
  # runs a TS fixture end-to-end on a Defender-enabled runner, and asserts the full
  # first-run round-trip — extract -> VERIFY -> dlopen -> transpile -> execute — plus
  # warm-cache reuse, R2 zero-false-positive (no integrity warning on a clean run), R2
  # self-heal (tamper the extracted DLL → re-extract → restore → still execute), and
  # surfaces any Defender detection so a silent quarantine can't pass as green.
  #
  # Scope: this proves the Defender real-time-scan + extract/verify/dlopen/self-heal
  # mechanism with a real DLL. It does NOT reproduce SmartScreen Mark-of-the-Web
  # reputation (that needs a browser-downloaded, internet-zoned nub.exe — a separate
  # download-UX concern). This is a required release-surface gate for Rust changes:
  # besides Defender visibility, it now proves compiled-runtime repair while a real
  # DLL is loaded and the release compile topology on native Windows.
  windows-embed-roundtrip:
    name: Windows embedded runtime and compile
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      # Throwaway job: read-only cache (save-if: false) so it never churns the budget.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-win-embed-roundtrip
          save-if: false
          workspaces: |
            .
            crates/nub-native
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
      # Compile's private prelude imports these pure-JS helpers from the embedded
      # runtime, never from the checkout. Install and stage the locked copies
      # before building nub.exe so the release blob contains a self-sufficient
      # runtime for the offline --smol gate below.
      # A released nub materializes node_modules from nub.lock; the nub under
      # test is built in the next step and cannot install its own inputs.
      - uses: ./setup
        with:
          cache: 'true'
      - name: Install and stage runtime dependencies for embedded compile
        shell: bash
        run: |
          set -euo pipefail
          nub install --frozen-lockfile --node-linker hoisted
          rm -rf runtime/node_modules
          mkdir -p \
            runtime/node_modules/@js-temporal \
            runtime/node_modules/@oxc-project \
            runtime/node_modules/@petamoriken
          cp -R node_modules/@js-temporal/polyfill runtime/node_modules/@js-temporal/
          cp -R node_modules/@oxc-project/runtime runtime/node_modules/@oxc-project/
          cp -R node_modules/@petamoriken/float16 runtime/node_modules/@petamoriken/
          cp -R node_modules/jsbi node_modules/urlpattern-polyfill runtime/node_modules/
      # Stage the REAL release addon into runtime/ so the embedded blob carries a
      # loadable DLL — without it the extracted runtime can't transpile. nub-native is
      # its own workspace (cdylib, panic=unwind); its .cargo/config routes output into
      # the shared root target/. Windows cdylib output is nub_native.dll.
      - name: Build + stage release nub-native addon
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/nub-native && cargo build --release)
          mkdir -p runtime/addons
          cp target/release/nub_native.dll runtime/addons/nub-native.node
      # Build the real single binary: --features embed-runtime makes build.rs tar+zstd-19
      # the staged runtime/ into the binary; the binary extracts it on first run. The
      # feature (not the profile) is what triggers the include_bytes! blob arm + the
      # find_preload extraction path, so this exercises the same code a release build does.
      - name: Build release nub.exe (--features embed-runtime,compile)
        run: cargo build -p nub-cli --release --features embed-runtime,compile
      # `nub compile` injects this real release launcher into the artifact. Build
      # it in its own workspace, as release.yml does; it is intentionally not a
      # root-workspace package.
      - name: Build release nub-launcher template
        shell: bash
        run: (cd crates/nub-launcher && cargo build --locked --release)
      # The WHOLE point of a Windows runner is the on-access AV heuristic (process
      # writes a DLL then dlopen's it). GitHub-hosted runners ship with real-time
      # protection OFF, so try to turn it ON before the round-trip so the scan is
      # actually firing. This needs admin (runners are admin-capable) but tamper-
      # protection or the image policy may refuse — that's an informative outcome,
      # not a failure, so this step never fails the job; it just records whether RTP
      # actually came on. The round-trip step below re-reads + prints the live status.
      - name: Try to enable Defender real-time protection
        shell: pwsh
        run: |
          Write-Host "=== Defender status BEFORE enable attempt ==="
          Get-MpComputerStatus |
            Select-Object RealTimeProtectionEnabled, IsTamperProtected, AMRunningMode |
            Format-List | Out-String | Write-Host
          try {
            Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop
            Write-Host "Set-MpPreference -DisableRealtimeMonitoring \$false succeeded"
          } catch {
            Write-Host "Set-MpPreference failed (expected if tamper-protected / policy-locked): $_"
          }
          Write-Host "=== Defender status AFTER enable attempt ==="
          $st = Get-MpComputerStatus
          $st | Select-Object RealTimeProtectionEnabled, IsTamperProtected, AMRunningMode |
            Format-List | Out-String | Write-Host
          if ($st.RealTimeProtectionEnabled) {
            Write-Host "RTP_OUTCOME: real-time protection is ON — round-trip will run under active scanning"
          } else {
            Write-Host "RTP_OUTCOME: real-time protection is OFF (tamper-protected:$($st.IsTamperProtected)) — CI cannot exercise active-RTP; residual risk needs a post-publish stock-Defender machine"
          }
      - name: Round-trip — extract, dlopen, execute, warm cache, Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Cold, isolated cache so the FIRST run is forced to extract (proves the
          # DLL write + dlopen). cache_dir() honors XDG_CACHE_HOME on every platform,
          # so the extracted dir is <XDG_CACHE_HOME>\nub\runtime-<key>.
          $cache = Join-Path $env:RUNNER_TEMP "nub-embed-cache"
          if (Test-Path $cache) { Remove-Item -Recurse -Force $cache }
          $env:XDG_CACHE_HOME = $cache
          $nubRoot = Join-Path $cache "nub"

          $nub = Join-Path (Get-Location) "target\release\nub.exe"
          if (-not (Test-Path $nub)) { throw "nub.exe not found at $nub" }

          # Isolated work dir (no package.json/.nvmrc) so nub uses the PATH Node and
          # no project pin interferes. The fixture carries two constructs because they
          # fail on different halves of the blob.
          #
          # `enum` is NON-ERASABLE: Node has stripped type ANNOTATIONS natively since
          # 23.6, so a types-only fixture executes on plain Node and proves nothing
          # about nub — measured, this job printed its success marker even in a run
          # where extraction had failed outright. Node rejects `enum`, so only a real
          # extract -> dlopen -> transpile can execute this file.
          #
          # `enum` alone is still blind to the vendored node_modules, because oxc
          # inlines it and it pulls no helper. The legacy DECORATOR is what covers
          # them: its transpiled output requires `@oxc-project/runtime/helpers/
          # decorateMetadata`, and an extracted tree has no parent node_modules to
          # resolve that through — only its own (`vendored_node_path`,
          # crates/nub-core/src/node/spawn.rs). Measured against a locally built
          # embed-runtime binary staged with an EMPTY runtime/node_modules: the
          # enum-only fixture exits 0 and prints the success marker, this one exits 1
          # with MODULE_NOT_FOUND. That gap is the shape a packager's smoke test
          # misses.
          #
          # This stays a CommonJS entry (no package.json) because the step above pins
          # Node 24. Down-levelling a legacy decorator is version-independent, but
          # RESOLVING its helper from a CJS entry is not — that shape is unsupported
          # below require(esm) (Node <20.19 / 22.0-22.11), which is why the repo's own
          # `legacy_decorators_require_experimental_flag` skips it
          # (crates/nub-cli/tests/integration.rs). The pin is what keeps this clear of
          # that floor. release.yml's gate pins no Node, so it uses an ESM entry instead.
          $work = Join-Path $env:RUNNER_TEMP "fixture"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          '{"compilerOptions":{"experimentalDecorators":true,"emitDecoratorMetadata":true}}' | Set-Content -Encoding utf8 (Join-Path $work "tsconfig.json")
          $fixture = Join-Path $work "embed.ts"
          @'
          enum Answer { Value = 42 }
          function tag(_t: any, _k: string, d: PropertyDescriptor) { return d; }
          class Probe { @tag greet(): string { return "embed-roundtrip-ok"; } }
          console.log(`${new Probe().greet()}-${Answer.Value}`);
          '@ | Set-Content -Encoding utf8 $fixture

          # --- First run: must extract runtime + dlopen addon + transpile + execute ---
          Push-Location $work
          $out1 = & $nub $fixture 2>&1 | Out-String
          $code1 = $LASTEXITCODE
          Pop-Location
          Write-Host "first-run exit=$code1"
          Write-Host "first-run output: $out1"
          if ($code1 -ne 0) { throw "first run exited $code1 — extract/dlopen/execute failed" }
          if ($out1 -notmatch "embed-roundtrip-ok-42") { throw "first run wrong output: $out1" }

          # --- Cache assertions: exactly one runtime-* dir, addon + preload present ---
          $rt = @(Get-ChildItem -Path $nubRoot -Directory -Filter "runtime-*")
          if ($rt.Count -ne 1) { throw "expected exactly one runtime-* dir, got $($rt.Count)" }
          $dir = $rt[0].FullName
          Write-Host "extracted cache dir: $dir"
          if (-not (Test-Path (Join-Path $dir "preload.mjs"))) { throw "preload.mjs missing in $dir" }
          if (-not (Test-Path (Join-Path $dir "addons\nub-native.node"))) { throw "addon missing in $dir" }
          $tmpLeft = @(Get-ChildItem -Path $nubRoot -Directory -Filter ".runtime-*")
          if ($tmpLeft.Count -ne 0) { throw "leftover .tmp extract dir(s): $($tmpLeft.FullName -join ', ')" }
          $mtime1 = (Get-Item $dir).LastWriteTimeUtc

          # --- Second run: warm cache must be reused, no re-extract ---
          Push-Location $work
          $out2 = & $nub $fixture 2>&1 | Out-String
          $code2 = $LASTEXITCODE
          Pop-Location
          Write-Host "second-run exit=$code2"
          Write-Host "second-run output: $out2"
          if ($code2 -ne 0) { throw "second run exited $code2" }
          if ($out2 -notmatch "embed-roundtrip-ok-42") { throw "second run wrong output: $out2" }
          $rt2 = @(Get-ChildItem -Path $nubRoot -Directory -Filter "runtime-*")
          if ($rt2.Count -ne 1) { throw "warm run changed runtime-* dir count to $($rt2.Count)" }
          $mtime2 = (Get-Item $dir).LastWriteTimeUtc
          if ($mtime1 -ne $mtime2) { throw "warm run re-extracted (dir mtime $mtime1 -> $mtime2)" }
          Write-Host "warm-cache reuse confirmed (dir mtime unchanged: $mtime1)"

          # --- R2 zero-false-positive: a CLEAN extraction must emit NO integrity
          # warning. A false-positive here would brick nub under enforce, so fail the
          # job if either run printed the canary/self-heal markers. ---
          foreach ($o in @($out1, $out2)) {
            if ($o -match "runtime integrity check failed" -or $o -match "did not match the embedded runtime") {
              throw "verify-on-load FALSE-POSITIVE on a clean extraction (would brick under enforce):`n$o"
            }
          }
          Write-Host "R2 zero-false-positive confirmed (no integrity warning on clean runs)"

          # --- R2 self-heal: tamper the extracted addon (a planted/corrupt DLL), run
          # again, and require the binary to detect it, re-extract the trusted blob,
          # restore the bytes, and STILL execute (canary mode never bricks). ---
          $addon = Join-Path $dir "addons\nub-native.node"
          $origHash = (Get-FileHash $addon -Algorithm SHA256).Hash
          [System.IO.File]::WriteAllBytes($addon, [byte[]](0x4d,0x5a,0x90,0x00))  # corrupt
          Push-Location $work
          $out3 = & $nub $fixture 2>&1 | Out-String
          $code3 = $LASTEXITCODE
          Pop-Location
          Write-Host "tamper-run exit=$code3"
          Write-Host "tamper-run output: $out3"
          if ($code3 -ne 0) { throw "self-heal run exited $code3 — a tampered cache must self-heal, not brick" }
          if ($out3 -notmatch "embed-roundtrip-ok-42") { throw "self-heal run wrong output: $out3" }
          if ($out3 -notmatch "did not match the embedded runtime") { throw "expected a self-heal notice on a tampered cache; got: $out3" }
          $healedHash = (Get-FileHash $addon -Algorithm SHA256).Hash
          if ($origHash -ne $healedHash) { throw "self-heal did not restore the addon bytes ($origHash -> $healedHash)" }
          Write-Host "R2 self-heal confirmed: tampered addon detected, re-extracted, restored, still executed"

          # --- Defender: surface any detection so a silent quarantine can't pass green ---
          Write-Host "=== Get-MpComputerStatus ==="
          try {
            Get-MpComputerStatus |
              Select-Object AMRunningMode, RealTimeProtectionEnabled, AntivirusEnabled |
              Format-List | Out-String | Write-Host
          } catch { Write-Host "Get-MpComputerStatus unavailable: $_" }

          Write-Host "=== Get-MpThreatDetection ==="
          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
          Write-Host "Defender threat-detection record count: $($threats.Count)"
          if ($threats.Count -gt 0) {
            $threats | Format-List | Out-String | Write-Host
            # Fail only on a detection referencing a nub artifact / our cache path — the
            # runner may carry pre-existing unrelated records.
            $related = $threats | Where-Object {
              $res = ($_.Resources -join ';')
              ($res -match 'nub') -or ($res -match [regex]::Escape($cache))
            }
            if ($related) { throw "Defender flagged a nub artifact:`n$($related | Format-List | Out-String)" }
            Write-Host "detections present but none reference a nub artifact — not a block"
          } else {
            Write-Host "no Defender threat detections"
          }

          Write-Host "ROUND-TRIP OK: extract -> verify -> dlopen -> transpile -> execute -> warm-cache reuse -> R2 zero-false-positive + self-heal; Defender did not block"

      # Compile hashes the ENTIRE extracted runtime (including transitive support
      # files), unlike normal launches' entrypoint-only fast path. This permanent
      # release-binary gate corrupts one of those transitive files while a holder
      # Node process has the staged real DLL loaded, requires the fail-closed
      # in-use diagnostic without touching the canonical tree, then proves exact
      # self-heal once the holder exits. It also rejects unsafe Windows cache roots.
      - name: Gate — release compiled-runtime cache repair and Windows cache safety
        shell: pwsh
        run: |
          & tests/windows/compile-cache-release.ps1 `
            -Nub (Join-Path $PWD 'target\release\nub.exe') `
            -Launcher (Join-Path $PWD 'crates\nub-launcher\target\release\nub-launcher.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The round-trip above covers nub's OWN addon, staged into runtime/addons.
      # It never exercises the path a DEPENDENCY takes: a package that resolves
      # its addon by building a path at run time is ejected from the bundle and
      # materialised under node_modules/ beside it, which turns filesystem paths
      # into payload names — and separator handling is where this repo keeps
      # finding Windows faults. better-sqlite3 ships prebuilds for eight
      # platforms, so this tests selection rather than luck.
      - name: Gate — a third-party native package compiles and runs on Windows
        shell: pwsh
        run: |
          & tests/windows/compile-native-package.ps1 `
            -Nub (Join-Path $PWD 'target\release\nub.exe') `
            -Launcher (Join-Path $PWD 'crates\nub-launcher\target\release\nub-launcher.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The gate above ejects a package because it loads an ADDON. This ejects one
      # because it reads a DATA file — a font — from a path built off __dirname,
      # which on Windows is a backslash path while payload names are not. Same
      # machinery, different failure surface, and the class that ships data should
      # not inherit its Windows confidence from the addon class.
      - name: Gate — a package that ships data compiles and runs on Windows
        shell: pwsh
        run: |
          & tests/windows/compile-data-package.ps1 `
            -Nub (Join-Path $PWD 'target\release\nub.exe') `
            -Launcher (Join-Path $PWD 'crates\nub-launcher\target\release\nub-launcher.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The corpus fixture covering this contract runs locally only, so without
      # this step Windows has no gate on it — and Windows is where it is most
      # likely to break, having no argv ARRAY: a process receives one command
      # line string, so an argument containing a space survives only if the
      # launcher quotes it on the way to Node.
      - name: Gate — argv, exit code and stream split survive the launcher on Windows
        shell: pwsh
        run: |
          & tests/windows/compile-process-contract.ps1 `
            -Nub (Join-Path $PWD 'target\release\nub.exe') `
            -Launcher (Join-Path $PWD 'crates\nub-launcher\target\release\nub-launcher.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep the exact process-topology integration test on the same release
      # embed-runtime + compile binary used by the black-box cache gate. The
      # template override makes it hermetic: no release asset fetch is involved.
      - name: Release embedded compile artifact process topology
        shell: pwsh
        env:
          __NUB_LAUNCHER_TEMPLATE: ${{ github.workspace }}\crates\nub-launcher\target\release\nub-launcher.exe
        run: |
          cargo test -p nub-cli --release --features embed-runtime,compile --test integration compile_artifact_process_bootstrap_topology -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # TEMPORARY (PR #175 data point) — the macOS sibling of windows-embed-roundtrip:
  # the one place the REAL release dylib is extracted, R2-verified, and dlopen'd on
  # macOS (the embed-runtime matrix hashes only a placeholder addon). Same assertions:
  # extract -> verify -> dlopen -> execute -> warm reuse -> R2 zero-false-positive +
  # self-heal. Non-blocking (NOT in ci-gate); the verify LOGIC is ci-gate-required via
  # the embed-runtime macos leg. Delete alongside windows-embed-roundtrip post-decision.
  macos-embed-roundtrip:
    name: macOS embed round-trip (TEMPORARY, PR #175)
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    permissions:
      contents: read
    # Its fixture is `enum`-only, which needs no vendored helper, so this leg covers the
    # extract/dlopen round-trip rather than the transpile path. Its Windows twin DOES
    # stage node_modules (for the offline `--smol` compile gate) and so keeps the gate on.
    env:
      NUB_ALLOW_INCOMPLETE_RUNTIME: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-mac-embed-roundtrip
          save-if: false
          workspaces: |
            .
            crates/nub-native
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
      - name: Build + stage release nub-native addon
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/nub-native && cargo build --release)
          mkdir -p runtime/addons
          cp target/release/libnub_native.dylib runtime/addons/nub-native.node
      - name: Build release nub (--features embed-runtime)
        run: cargo build -p nub-cli --release --features embed-runtime
      - name: Round-trip — extract, verify, dlopen, execute, warm cache, R2 self-heal
        shell: bash
        run: |
          set -uo pipefail
          cache="$RUNNER_TEMP/nub-embed-cache"
          rm -rf "$cache"
          export XDG_CACHE_HOME="$cache"
          nubroot="$cache/nub"
          nub="$PWD/target/release/nub"
          test -x "$nub" || { echo "nub not found at $nub"; exit 1; }

          work="$RUNNER_TEMP/fixture"
          rm -rf "$work"; mkdir -p "$work"
          fixture="$work/embed.ts"
          # `enum` is NON-ERASABLE — see the Windows twin of this step. Node strips
          # type ANNOTATIONS natively since 23.6, so a types-only fixture proves
          # nothing about nub; Node rejects `enum`, so this file executes only if
          # the extract -> dlopen -> transpile round-trip really happened.
          cat > "$fixture" <<'EOF'
          enum Answer { Value = 42 }
          const greeting: string = "embed-roundtrip-ok";
          console.log(`${greeting}-${Answer.Value}`);
          EOF

          # --- First run: extract -> verify -> dlopen -> transpile -> execute ---
          out1="$(cd "$work" && "$nub" "$fixture" 2>&1)"; code1=$?
          echo "first-run exit=$code1"; echo "first-run output: $out1"
          [ "$code1" -eq 0 ] || { echo "first run failed"; exit 1; }
          echo "$out1" | grep -q "embed-roundtrip-ok-42" || { echo "wrong output"; exit 1; }

          count="$(find "$nubroot" -maxdepth 1 -type d -name 'runtime-*' | wc -l | tr -d ' ')"
          [ "$count" = "1" ] || { echo "expected one runtime-* dir, got $count"; exit 1; }
          dir="$(find "$nubroot" -maxdepth 1 -type d -name 'runtime-*' | head -1)"
          echo "extracted: $dir"
          { test -f "$dir/preload.mjs" && test -f "$dir/addons/nub-native.node"; } || { echo "entrypoints missing"; exit 1; }
          [ -z "$(find "$nubroot" -maxdepth 1 -type d -name '.runtime-*')" ] || { echo "leftover .tmp"; exit 1; }
          mtime1="$(stat -f %m "$dir")"

          # --- Second run: warm reuse, no re-extract ---
          out2="$(cd "$work" && "$nub" "$fixture" 2>&1)"; code2=$?
          [ "$code2" -eq 0 ] || { echo "second run failed: $out2"; exit 1; }
          echo "$out2" | grep -q "embed-roundtrip-ok-42" || { echo "warm wrong output"; exit 1; }
          [ "$mtime1" = "$(stat -f %m "$dir")" ] || { echo "warm run re-extracted"; exit 1; }
          echo "warm-cache reuse confirmed"

          # --- R2 zero-false-positive: no integrity warning on clean runs ---
          if printf '%s\n%s\n' "$out1" "$out2" | grep -Eq "runtime integrity check failed|did not match the embedded runtime"; then
            echo "verify-on-load FALSE-POSITIVE on a clean extraction"; exit 1
          fi
          echo "R2 zero-false-positive confirmed"

          # --- R2 self-heal: tamper the extracted dylib -> detect -> re-extract -> restore ---
          addon="$dir/addons/nub-native.node"
          orig="$(shasum -a 256 "$addon" | cut -d' ' -f1)"
          printf 'corrupt' > "$addon"
          out3="$(cd "$work" && "$nub" "$fixture" 2>&1)"; code3=$?
          echo "tamper-run exit=$code3"; echo "tamper-run output: $out3"
          [ "$code3" -eq 0 ] || { echo "self-heal run bricked"; exit 1; }
          echo "$out3" | grep -q "embed-roundtrip-ok-42" || { echo "self-heal wrong output"; exit 1; }
          echo "$out3" | grep -q "did not match the embedded runtime" || { echo "no self-heal notice"; exit 1; }
          healed="$(shasum -a 256 "$addon" | cut -d' ' -f1)"
          [ "$orig" = "$healed" ] || { echo "self-heal did not restore the dylib ($orig -> $healed)"; exit 1; }
          echo "R2 self-heal confirmed: tampered dylib detected, re-extracted, restored, still executed"
          echo "ROUND-TRIP OK (macOS): extract -> verify -> dlopen -> execute -> warm reuse -> R2"

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Without this the job inherits GitHub's 6-hour default, so a wedged leg
    # burns runner capacity for hours before anyone sees red. A windows leg on
    # `9a8b879b` (#712) sat 56 minutes and died to "the hosted runner lost
    # communication" — its log never even uploaded. The slowest leg that has
    # actually PASSED is 36 minutes (windows), so 60 leaves room for a slow
    # runner while still cutting a hang off well inside the hour.
    timeout-minutes: 60
    # Until the SOCKET_SECURITY_KEY repo secret lands this is empty and sfw
    # runs its keyless free tier — the firewall is active either way and
    # upgrades itself to enterprise when the secret appears.
    env:
      SOCKET_SECURITY_KEY: ${{ secrets.SOCKET_SECURITY_KEY }}
      # cargo test spawns nub test binaries that talk to LOCAL registry
      # mocks; routing `cargo` through the sfw shim would wrap that traffic
      # in the firewall proxy and mangle it (upstream ECONNRESET, 405s on
      # registry writes). The sentinel makes the cargo shim exec the real
      # cargo directly — pnpm/npm installs stay firewalled.
      SFW_SHIM_ACTIVE_CARGO: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-plan.outputs.test) }}
      # The matrix is computed by the matrix-plan job. On pull_request: ubuntu
      # (full Node-version tier matrix) + ONE windows-latest representative;
      # macOS is dropped from PRs (the macOS-5 concurrency bottleneck). On
      # push:main / nightly schedule: the FULL matrix adds macos-14.
      #
      # macos-14 is Apple Silicon (arm64) — the primary dev platform and the
      # darwin-arm64 release target (A24). It runs on trunk/nightly only.
      # darwin-x64 is built in release.yml but not yet exercised here; add
      # macos-13 (Intel) if x64 coverage is wanted later.
      #
      # The windows-latest leg is the ONLY place the PM-shim's cfg(windows)
      # code executes (Docker on the dev box is Linux-only): `cargo test`
      # picks up nub-cli's tests/pm_shim_windows.rs, which covers
      # install_shims_into's `.exe` entry naming, argv0 dispatch through a
      # pnpm.exe/npm.exe link, the `.exe`/`.cmd` PATH probing of the
      # fall-through scan, the pinned-PM cached run under the project Node,
      # the strict refusal, and exit-code fidelity through the spawn+wait
      # exec replacement. (The portable pm::shim unit tests — decision
      # matrix, profile-block edits, lockfile/redirect logic — already ran
      # here; the #[cfg(unix)] ones — inode/hardlink, exec-bit, symlink
      # tests and all of tests/pm_shim.rs — still don't.) Not covered
      # anywhere yet: replacing a RUNNING shim .exe (image lock), and a
      # `nub pm shim`/`unshim` round trip (dirs_next ignores env HOME on
      # Windows, so an end-to-end run would write the runner's real
      # profile — kept out deliberately). That genuinely-Windows-only code is
      # why one Windows leg is KEPT on PR rather than moved to trunk-only.
      #
      # This leg also compiles + runs the cfg(windows) arm of the
      # `nub upgrade` npm channel: the npm_upgrade_invocation_is_os_correct
      # unit test pins the Windows argv (`cmd /C npm install -g …`), which is
      # what fixes npm-channel upgrade on a plain Windows box (no `sh` there).
      # A real end-to-end `npm install -g` is left CI-dark on purpose — it
      # mutates global state and needs a published release.
      #
      # Node matrix spans the support range so the integration suite (which
      # nub runs against whatever `node` is first on PATH) exercises every
      # tier + capability boundary. 24 = current line; 22.15 = fast-path floor
      # (sync registerHooks); 22.13 = compat-tier top (async module.register,
      # has require(esm)+detect-module+webstorage); 20.11 = compat mid (NO
      # require(esm) — exercises the dynamic-import oxc-parser path — and NO
      # detect-module/webstorage, so it catches the version-gated flag
      # injection); 18.19 = the hard floor (no require(esm), no native `using`,
      # async tier). Compat divergences are runtime-version-specific, not
      # OS-specific, so the floor/compat legs run on Linux only (PR and trunk
      # alike) — a full os×node cross-product would multiply cost for no extra
      # signal.
    steps:
      # No node-suite submodule here: the fast unit + integration suite reads
      # only tests/fixtures, never tests/node-suite. The heavyweight Node-suite
      # compat corpus is #[ignore]'d (a CI-scale gate, not a unit test) — so
      # this job stays fast across the full os×node matrix, including the 22.15
      # floor where the using/ErrorEvent fallback paths are exercised by the
      # integration tests. vendor/aube (the cargo path dep) is plain in-tree
      # files — checked out by the normal checkout, no submodule init needed.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      # Keyed by OS only (not the node version) so the 4 ubuntu node-tier legs
      # share ONE cache instead of writing four. save-if:main → read-only on PRs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-test-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            crates/nub-native
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
        with:
          version: 10
      # No `cache: npm` — setup-node's npm cache keys on a lockfile npm can read,
      # and the root now carries only nub.lock. Warm deps instead come from the
      # `./setup` step further down, which is passed `cache: 'true'`; the action
      # defaults that input to "false" and gates its cache steps on it, so
      # dropping the input here without adding it there is a cold install.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: ${{ matrix.node }}
      # Side-install the off-matrix tier representatives for the version_tiers
      # integration test: compat 22.13, unsupported 18.18, detect-module in-band
      # 20.11 (flag still required there), and 26.5 (carries the node:ffi/vfs/
      # stream-iter enabler modules). actions/setup-node only manages one
      # PATH-active Node per job; these go into private dirs and are exposed to
      # the test via TEST_NODE_BIN_<MAJOR>_<MINOR>_<PATCH> — the env-var prefix
      # deliberately avoids `NUB_*` (brand-boundary rule applies even to test-only
      # knobs). Linux-only because the tarball URL paths differ per OS and the
      # version_tiers contract is runtime-specific, not OS-specific.
      - name: Install side Node binaries for version_tiers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          install_node() {
            local ver="$1"
            local dest="$RUNNER_TEMP/node-v${ver}-linux-x64"
            if [ ! -x "$dest/bin/node" ]; then
              curl -fsSL "https://nodejs.org/dist/v${ver}/node-v${ver}-linux-x64.tar.xz" \
                | tar -xJ -C "$RUNNER_TEMP"
            fi
            echo "$dest/bin"
          }
          dir_22_13=$(install_node 22.13.0)
          dir_18_18=$(install_node 18.18.0)
          dir_20_11=$(install_node 20.11.0)
          dir_26_5=$(install_node 26.5.0)
          "$dir_22_13/node" --version
          "$dir_18_18/node" --version
          "$dir_20_11/node" --version
          "$dir_26_5/node" --version
          {
            echo "TEST_NODE_BIN_22_13_0=$dir_22_13"
            echo "TEST_NODE_BIN_18_18_0=$dir_18_18"
            echo "TEST_NODE_BIN_20_11_0=$dir_20_11"
            echo "TEST_NODE_BIN_26_5_0=$dir_26_5"
          } >> "$GITHUB_ENV"
      - name: pinned package managers + socket firewall
        shell: bash
        env:
          MATRIX_NODE: ${{ matrix.node }}
        run: |
          # The soak scripts are erasable-TS .mts and need a type-stripping
          # Node; the compat legs run them with the side-installed 26.5
          # instead of the PATH Node (18/20 can't execute .mts).
          NODE_BIN="${TEST_NODE_BIN_26_5_0:+$TEST_NODE_BIN_26_5_0/node}"
          NODE_BIN="${NODE_BIN:-node}"
          # Pinned pnpm/npm only on the current-line leg: the compat legs
          # exist to test OLD Nodes, which the pinned PMs don't support.
          # Their native pnpm/npm still route through the sfw shims below.
          if [ "$MATRIX_NODE" = "24" ]; then
            "$NODE_BIN" scripts/soak/external-tools.mts --install pnpm --install npm
          fi
          "$NODE_BIN" scripts/soak/external-tools.mts --install sfw --shims
          "$NODE_BIN" scripts/soak/external-tools.mts --print-bin >> "$GITHUB_PATH"
      - name: assert pinned pms resolve through the shims
        run: |
          pnpm --version
          npm --version
      # Root deps come from nub.lock — the repo root is nub-identity, so nub is
      # the only manager that reads it (the pnpm domain still lives in tools/).
      # A released nub installs them: this leg builds no nub of its own before
      # the tests need the tree. `hoisted` keeps node_modules real directories.
      #
      # THIS INSTALL NO LONGER PASSES THROUGH THE SOCKET FIREWALL SHIM. sfw is
      # wired by shimming `npm`/`pnpm` by NAME on PATH, and `nub` carries no such
      # shim, so the interception that covered the old `npm ci` does not cover
      # this step. What still holds on EVERY leg: nub.lock pins each tarball by
      # integrity hash and `--frozen-lockfile` refuses to re-resolve. Lifecycle
      # confinement does NOT hold everywhere — the build jail is Linux (landlock
      # + seccomp) and macOS only (aube-scripts/src/lib.rs has no Windows arm),
      # so on the windows-latest cell the mitigation is the pinned lockfile
      # alone. The shims stay for the pnpm/npm surfaces the tests drive.
      - uses: ./setup
        with:
          cache: 'true'
      - run: nub install --frozen-lockfile --node-linker hoisted
      # An installer that exits 0 on a half-built tree (package dirs present,
      # package.json missing) surfaces six minutes later as unresolvable helper
      # imports in five unrelated transpile tests. Assert the install actually
      # produced something resolvable, so infra failure fails HERE.
      - name: assert root deps actually installed
        run: node -e "require.resolve('@oxc-project/runtime/helpers/usingCtx')"
      # The data-format loader tests need the nub-native addon (the npm yaml/toml/
      # json5 parser fallback isn't a dev dep). Built in DEBUG, not release: the
      # tests only need the addon to LOAD (the loaders are exercised at runtime,
      # no release-only behavior is asserted), and `cargo test` below compiles
      # everything in debug — a release addon build recompiles the whole oxc
      # toolchain a second time per matrix cell for no test signal. The debug
      # artifacts are reused by `cargo test`.
      - name: Build nub-native addon (for data-format loader tests)
        shell: bash
        run: |
          # nub-native is its own workspace (split so the CLI uses panic=abort while
          # the cdylib keeps panic=unwind); build it from inside the crate. Its local
          # .cargo/config.toml routes output into the shared root target/.
          (cd crates/nub-native && cargo build)
          mkdir -p runtime/addons
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/debug/nub_native.dll runtime/addons/nub-native.node
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/debug/libnub_native.dylib runtime/addons/nub-native.node
          else
            cp target/debug/libnub_native.so runtime/addons/nub-native.node
          fi
      # nub's Windows script shell is a bundled busybox-w32 sidecar that
      # release.yml stages next to nub.exe — absent from cargo's target dir, so the
      # many `nub run` integration tests would have no shell here. Point the
      # internal resolver override (crates/nub-cli/src/cli.rs resolve_bundled_busybox)
      # at the vendored binary (windows-latest is x64) so those tests exercise the
      # real busybox script path. Unix uses the system /bin/sh and ignores this var.
      - name: Point nub run at the vendored busybox (Windows script shell)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "__NUB_BUSYBOX_EXE=$GITHUB_WORKSPACE/vendor/busybox-w32/busybox64.exe" >> "$GITHUB_ENV"
      - run: cargo test
      # `compile` is not a default feature, so the bare `cargo test` above never
      # builds `src/compile/**` — including the bundler's emitted-chunk validity
      # gate, whose whole job is to stop `nub compile` reporting success on output
      # that cannot load. Its unit assertions are OS-independent, so keep the
      # Rolldown-heavy unit invocation to one leg.
      - name: Compile-pipeline unit tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        # QUOTED, and it has to stay quoted: a plain YAML scalar ending in `:`
        # parses as a mapping key, so the unquoted form made this whole workflow
        # unparseable. GitHub then produced runs named `.github/workflows/ci.yml`
        # with ZERO jobs — which read as "CI ran and failed" in `gh run list`
        # while nothing had actually executed.
        run: "cargo test -p nub-cli --features compile --bin nub compile::"
      # The compiled process topology is OS-sensitive: in particular, Node SEA's
      # cluster argv shape differs on Windows. Build the actual launcher and run
      # the topology test on every current-Node OS leg.
      #
      # Linux additionally runs the WHOLE integration target rather than a list of
      # named tests. Naming them left ~220 compile tests carried by two: a silent
      # `require(esm)`-from-CJS defect (a deferred require resolved to `undefined`)
      # sat in that gap, and the one test that would have caught it was masked
      # anyway, because `set -e` aborts this step at the first failure and topology
      # runs first. One Linux leg is the cost; running the whole target is the point.
      - name: Compile artifact process topology
        if: matrix.node == '24'
        shell: bash
        run: |
          set -euo pipefail
          # `cd`, not `--manifest-path`: cargo discovers `.cargo/config.toml` by walking up
          # from the WORKING DIRECTORY, so the manifest form silently skipped the launcher's
          # own config and built it with the dynamic MSVC CRT while every shipped path
          # (release.yml, compile-native.yml, the Windows embed job) builds it static. This
          # step would then have tested a launcher linked unlike the one users get.
          (cd crates/nub-launcher && cargo build --locked)
          launcher="$GITHUB_WORKSPACE/crates/nub-launcher/target/debug/nub-launcher"
          if [[ "$RUNNER_OS" == "Windows" ]]; then launcher="$launcher.exe"; fi
          test -f "$launcher"
          export __NUB_LAUNCHER_TEMPLATE="$launcher"
          cargo test -p nub-cli --features compile --test integration compile_artifact_process_bootstrap_topology -- --exact
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo test -p nub-cli --features compile --test integration
          fi
      # nub-launcher's cache-directory probe chain is the most platform-specific
      # code in the repo — owner and DACL checks, exec bits, junction rejection —
      # and until now it ran on ubuntu only, from the clippy job. That is precisely
      # where the inherit-only-ACE defect lived: it made every Windows cache base
      # unusable, and no CI leg could see it. The launcher is already built above,
      # so covering the OS legs it actually targets costs one `cargo test`.
      - name: nub-launcher cache chain (per-OS)
        if: matrix.node == '24' && runner.os != 'Linux'
        shell: bash
        run: cd crates/nub-launcher && cargo test --locked
      # The default compile shape builds from the runtime extracted out of the
      # feature-on nub binary, so it cannot resolve these package imports from the
      # checkout's root node_modules. Copy the same locked pure-JS set release.yml
      # stages, rather than duplicating its per-platform release assembly here.
      - name: Stage runtime dependencies for embedded compile
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime/node_modules
          mkdir -p \
            runtime/node_modules/@js-temporal \
            runtime/node_modules/@oxc-project \
            runtime/node_modules/@petamoriken
          cp -R node_modules/@js-temporal/polyfill runtime/node_modules/@js-temporal/
          cp -R node_modules/@oxc-project/runtime runtime/node_modules/@oxc-project/
          cp -R node_modules/@petamoriken/float16 runtime/node_modules/@petamoriken/
          cp -R node_modules/jsbi node_modules/urlpattern-polyfill runtime/node_modules/
      # Unlike the preceding --smol integration test, this uses the feature-on
      # compiler binary and the default artifact shape. The real addon was staged
      # above for the test job; embed-runtime tars it with this runtime tree. That
      # makes compile_runtime_dir extract and integrity-verify the embedded tree
      # before Rolldown reads the prelude, then runs the resulting Node-embedded app.
      - name: Build and run default embedded compile artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p nub-cli --features compile,embed-runtime
          launcher="$GITHUB_WORKSPACE/crates/nub-launcher/target/debug/nub-launcher"
          test -x "$launcher"
          work="$RUNNER_TEMP/nub-compile-embedded"
          rm -rf "$work"
          mkdir -p "$work"
          printf '%s\n' 'console.log("embedded-compile-ok")' > "$work/app.mjs"
          node_version="$(node --version)"
          node_version="${node_version#v}"
          XDG_CACHE_HOME="$work/nub-cache" \
            __NUB_COMPILE_CACHE_DIR="$work/compile-cache" \
            __NUB_LAUNCHER_TEMPLATE="$launcher" \
            target/debug/nub compile --target "$node_version" --out "$work/app" "$work/app.mjs"
          actual="$(cd "$work" && __NUB_COMPILE_CACHE_DIR="$work/compile-cache" "$work/app")"
          [ "$actual" = 'embedded-compile-ok' ] \
            || { echo "::error::default compiled artifact printed '$actual'"; exit 1; }
      # Brand-boundary sweep for the embedded PM engine: a real `nub install`
      # in a sandboxed fixture (HOME/XDG_* inside a temp dir) must never leak
      # the engine's upstream identity — no ERR_AUBE_/WARN_AUBE_/aube.jdx.dev
      # in output, AUBE_* env vars dead, no aube-named on-disk paths beyond the
      # documented shrinking allowlist in the script, and
      # npm_config_user_agent's first token == nub/<ver>. One leg is enough:
      # the assertions are OS- and Node-version-independent.
      - name: Brand sweep (embedded PM engine)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          cargo build -p nub-cli
          tests/brand-sweep/run.sh target/debug/nub

      # globalThis brand-boundary sweep for the RUNTIME: `nub <file>` must never put
      # a nub-named key on the user's globalThis, in the main realm OR a worker realm,
      # by enumerable OR own-property predicate. Regression guard for the floor-tier
      # `globalThis.__nubFloorCreateRequire` leak (enumerable, in both realms, on Node
      # < 22.3 where process.getBuiltinModule is absent — now threaded through module
      # scope). The test checks whatever `node` is on PATH (so the 18.19 leg here
      # exercises the FLOOR path, where the leak lived) and also sweeps any floor Node
      # under ~/.nvm. Run on the 18.19 floor leg AND the 24 fast leg to cover both
      # tiers; the contract is OS-independent so one OS suffices.
      - name: Brand sweep (globalThis runtime surface)
        if: matrix.os == 'ubuntu-latest' && (matrix.node == '18.19' || matrix.node == '24')
        run: |
          cargo build -p nub-cli
          tests/brand-global/run.sh target/debug/nub

  pnp:
    name: Yarn PnP (${{ matrix.os }}, node ${{ matrix.node }})
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-plan.outputs.pnp) }}
      # Matrix computed by the matrix-plan job. Cross-OS coverage on the current
      # Node line matters here because PnP's zipfs fs patch, path handling, and
      # `findPnpApi` differ by OS (Windows backslashes especially), which the host
      # (macOS) + Docker (Linux) legs can't fully cover. On pull_request: ubuntu +
      # ONE windows-latest representative (the Windows-path divergence is the real
      # cross-OS risk); macos-14 runs on push:main / nightly schedule only.
      # Plus two Linux tier representatives on PR and trunk alike: 22.15 = fast-tier
      # floor (sync registerHooks), 18.19 = compat-tier floor (async loader worker).
      # Tiers are runtime-version specific, not OS-specific, so they run on Linux
      # only.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
      # Keyed by OS only so the node-tier legs share one cache; save-if:main →
      # PRs restore main's warm cache read-only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-pnp-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            crates/nub-native
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: ${{ matrix.node }}
      # nub itself + the nub-native addon (the TS-under-PnP scenario transpiles, so
      # the addon must be present, same as the `test` job's data-format gate).
      - name: Build nub + native addon
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p nub-cli
          # nub-native is its own workspace (split so the CLI uses panic=abort while
          # the cdylib keeps panic=unwind); build it from inside the crate. Its local
          # .cargo/config.toml routes output into the shared root target/.
          (cd crates/nub-native && cargo build)
          mkdir -p runtime/addons
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/debug/nub_native.dll runtime/addons/nub-native.node
            # The PnP matrix's `run`/`ws-run` scenarios execute package scripts, so
            # the built nub needs its Windows script shell. Stage busybox next to
            # nub.exe exactly as the win32 package does, exercising the REAL
            # current_exe() sidecar resolution (no test-only env override here).
            cp vendor/busybox-w32/busybox64.exe target/debug/busybox.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/debug/libnub_native.dylib runtime/addons/nub-native.node
          else
            cp target/debug/libnub_native.so runtime/addons/nub-native.node
          fi
      # Builds a real Yarn 4 PnP fixture (corepack ships with Node) and runs every
      # PnP scenario against the in-runner Node. The matrix script is bash; Windows
      # runners provide Git Bash via `shell: bash`.
      - name: Run Yarn PnP matrix
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          NUB=target/debug/nub
          [[ "$RUNNER_OS" == "Windows" ]] && NUB=target/debug/nub.exe
          tests/pnp/run-pnp-matrix.sh "$NUB" "$(dirname "$(command -v node)")"

  # The heavyweight Node-suite compat corpus job was removed from CI (2026-06-03):
  # it regressed during the repo move and reproducibly kills the runner at parallel
  # fan-out, and isn't needed as a CI gate for now. nub still runs on byte-for-byte
  # stock Node, so compatibility is structurally preserved — this only drops the
  # automated corpus signal. Re-add it (root-caused/fixed) via node_compat.rs when
  # the runner-kill is understood.

  fmt:
    name: Format
    needs: matrix-plan
    if: needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable # zizmor: ignore[impostor-commit,ref-version-mismatch] dtolnay force-pushes its version tags, so pinned SHAs go unreachable; commit verified genuine upstream
        with:
          components: rustfmt
      - run: cargo fmt --check
      # nub-native is its own workspace (excluded from the root one), so the root
      # `cargo fmt --check` above skips it — check it from inside the crate.
      - run: cd crates/nub-native && cargo fmt --check

  types-fixtures:
    name: "@nubjs/types typecheck fixtures"
    needs: matrix-plan
    # The @nubjs/types declarations live under npm/nub-types/**; skip the tsc
    # fixtures when only docs/site/Rust changed. run_rust includes .github/** so
    # a CI edit still re-runs them.
    if: needs.matrix-plan.outputs.run_types == 'true' || needs.matrix-plan.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Catches @nubjs/types declaration regressions: each fixture runs `tsc --noEmit`
    # and asserts the expected pass/fail. The package's index.d.ts is exercised
    # directly (installed as file:.. → symlinked), so a broken decl, a lost data-import
    # wildcard, an accidental module conversion (export {}), or a re-introduced lib.dom
    # `Worker` collision (TS2403/TS2430) fails here. Pure Node + tsc — no Rust toolchain,
    # no submodules, no native addon. Pinned tsc + @types/node in npm/nub-types/test.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
      - name: Install fixture deps (pinned tsc + @types/node + file:.. @nubjs/types)
        run: npm install --no-audit --no-fund
        working-directory: npm/nub-types/test
      - name: Run @nubjs/types typecheck fixtures
        run: node run.mjs
        working-directory: npm/nub-types/test

  docs-links:
    name: Docs links & anchors
    needs: matrix-plan
    # Path-gated on run_site OR run_scripts: site/** changes need the docs-link
    # and anchor check, while scripts/ and the pinned-tool surfaces need the
    # soak / tools:check / test:scripts gates below. Skipped only when a PR
    # touches NEITHER group — the ci-gate aggregator treats a skip as success.
    # A `rust-toolchain*` edit deliberately lands in both `rust` and `scripts`,
    # so it runs here too: `tools:check` is what pins that file.
    if: needs.matrix-plan.outputs.run_site == 'true' || needs.matrix-plan.outputs.run_scripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml
      - name: soak + external-tool pin gates
        run: |
          pnpm run soak
          pnpm run tools:check
          pnpm run test:scripts
      # The checker slugifies headings with github-slugger (a transitive site
      # dep) to match the rendered anchors exactly; install the site workspace
      # so it resolves. --frozen-lockfile keeps it deterministic.
      - name: Install site deps (for github-slugger)
        run: pnpm install --frozen-lockfile
        working-directory: site
      # node 24 strips the script's erasable TS types natively — no build step.
      - name: Validate internal docs links & anchors
        run: node scripts/check-docs-links.ts

  site-build:
    name: Site build
    needs: matrix-plan
    # Path-gated on run_site, like docs-links: only runs when site/** changed,
    # so a Rust-only PR never pays for it. A skip is success to the ci-gate
    # aggregator.
    #
    # Runs the exact `next build` Vercel runs, on Vercel's Node major, so this
    # gate cannot drift from the deployment it protects. Before this existed
    # NOTHING in CI compiled or type checked the site — Vercel was the first and
    # only thing that did, and it reports failures by email after the push. A
    # type error in src/app/api/search/route.ts rode that gap into ~34
    # consecutive broken preview deployments over three days (2026-07-28..31).
    #
    # This is the backstop, not the primary defence: it only fires for PRs into
    # main, and the branches that broke are pushed directly and never PR'd.
    # The .githooks/pre-push hook is what covers those.
    if: needs.matrix-plan.outputs.run_site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          # Matches the Vercel project's configured Node major (24.x).
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: next build
        run: pnpm run build
        working-directory: site

  # Single aggregator gate — the ONE check branch protection should require.
  #
  # Why this exists: the Rust jobs above are path-gated (`if:
  # needs.matrix-plan.outputs.run_rust == 'true'`). A SKIPPED job reports a
  # "skipped" conclusion, NOT success — and a skipped branch-protection-REQUIRED
  # check never reports a passing status, so the PR would hang on "Expected —
  # waiting for status" forever. This job runs on EVERY event (`if: always()`)
  # and collapses all the conditional jobs into one deterministic verdict:
  #   - every dependency is `success` or `skipped` → PASS
  #   - any dependency is `failure` → FAIL (`cancelled` is supersession, not a verdict)
  # oxc is pre-1.0, so `^` never unifies two minors: a consumer left behind
  # compiles a SECOND full oxc stack into the same binary. The consumers span
  # three Cargo workspaces plus the npm @oxc-project/runtime emit helpers, which
  # no single cargo resolve can reconcile. Deliberately NOT path-gated — the drift
  # this catches can arrive through package.json alone, which the Rust paths
  # filter does not cover — and it is pure Node with no toolchain, so running it
  # on every event costs seconds.
  oxc-lockstep:
    name: oxc lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-oxc-lockstep.mjs

  # `make version-check` also runs in release.yml's verify job, but that fires on
  # `v*` tags and on pushes to main — i.e. always AFTER the offending merge. #735
  # edited site/public/schema/latest.json without refreshing its pinned snapshot,
  # merged green, and surfaced only on main, where it blocked every release until
  # #751. This job is what makes that fail on its own pull request instead. Same
  # shape as oxc-lockstep above: one Make target that shells a single node -e, no
  # toolchain and no path filter, because the drift it catches spans package.json,
  # Cargo.toml, runtime/version.mjs and the published schema snapshots at once.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - run: make version-check

  # The build-slot layer of the machine-global rustc governor (scripts/rustc-qos.sh)
  # is a lock-free protocol over a directory tree whose failure mode is a host-wide
  # stall, and nothing else in CI runs scripts/*.sh. The harness drives the real
  # script with a fake cargo/rustc pair — POSIX sh plus a C compiler, ~3 min — and
  # the version check refuses a governor change that forgot to bump the stamp
  # build-status relies on to spot a stale installed copy.
  build-slots:
    name: Build-slot governor (${{ matrix.os }})
    needs: matrix-plan
    # Path-gated on BOTH groups: the governor itself is scripts/**, which lives
    # in the `scripts` filter, while the harness is tests/**, which lives in
    # `rust` — neither group alone covers this job. Same shape as docs-links.
    if: needs.matrix-plan.outputs.run_rust == 'true' || needs.matrix-plan.outputs.run_scripts == 'true'
    # Both platforms: the governor is only ever INSTALLED on the maintainer's
    # darwin host (bash-3.2 /bin/sh, BSD ps/awk), while ubuntu's dash + procps
    # is the other dialect the same POSIX script must keep speaking.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version stamp bumped with the governor
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/rustc-qos-version-check.sh "$BASE" HEAD
      - run: tests/build-slots/run.sh

  # Make THIS job (`CI gate`) the sole required status check in branch protection.
  # A docs-only PR → Rust matrix skipped → this gate green → mergeable. A Rust PR
  # → matrix runs → this gate reflects it. The merge gate is never weakened: a
  # real failure still fails here.
  target-gc:
    name: Target-dir collector
    needs: matrix-plan
    # Path-gated on BOTH groups, like the other scripts gates: the collector is
    # scripts/**, its harness tests/**. Ubuntu and macOS because the script must
    # keep speaking both the BSD and GNU stat/date/find dialects.
    if: needs.matrix-plan.outputs.run_rust == 'true' || needs.matrix-plan.outputs.run_scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - run: tests/target-gc/run.sh

  ci-gate:
    name: CI gate
    if: always()
    needs: [matrix-plan, check, clippy, embed-runtime, windows-embed-roundtrip, test, pnp, fmt, types-fixtures, docs-links, site-build, oxc-lockstep, version-consistency, target-gc, build-slots]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Dependency results:"
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # A job that did not end in success, skipped or cancelled fails the gate.
          #
          # `skipped` is expected for path-gated jobs on docs/site-only changes.
          #
          # `cancelled` is NOT a verdict, and treating it as one painted commits red
          # for no reason. `concurrency: cancel-in-progress` kills the matrix legs
          # whenever a newer push lands on the same ref — routine on a branch more
          # than one person pushes to — but THIS job still runs (`if: always()`),
          # saw `cancelled`, and failed. Since this is the sole required check, that
          # is a false red on the exact status branch protection reads. It does not
          # mask a real failure: a leg that genuinely fails reports `failure`, never
          # `cancelled`, and the run that superseded it carries the real verdict.
          # `trunk-red.yml` already takes this position for the same reason.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped" and .value.result != "cancelled"))
            | .[].key')
          if [[ -n "$bad" ]]; then
            echo "::error::CI gate failed — these jobs did not pass:"
            while IFS= read -r job; do
              echo "  - $job"
            done <<< "$bad"
            exit 1
          fi
          echo "CI gate passed."
