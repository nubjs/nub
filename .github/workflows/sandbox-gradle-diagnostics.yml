name: Sandbox Gradle diagnostics

on:
  push:
    branches: [sandbox-gradle-diagnosis]
    paths:
      - crates/nub-sandbox/tests/native_tool_functionality.rs
      - .github/workflows/sandbox-gradle-diagnostics.yml

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Provisioning pinned Gradle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports, .sandbox-gradle | Out-Null
          git rev-parse HEAD | Out-File reports/environment.txt
          java -version 2>&1 | Out-File -Append reports/environment.txt
          $url = 'https://services.gradle.org/distributions/gradle-8.14-bin.zip'
          Invoke-WebRequest $url -OutFile .sandbox-gradle/gradle.zip
          $expected = (Invoke-RestMethod "$url.sha256").Trim()
          $actual = (Get-FileHash .sandbox-gradle/gradle.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw 'Gradle archive checksum mismatch' }
          Expand-Archive .sandbox-gradle/gradle.zip .sandbox-gradle/dist
          $root = "$env:GITHUB_WORKSPACE\.sandbox-gradle\dist\gradle-8.14"
          @(@{name='gradle'; program="$root\bin\gradle.bat"; prefix=@(); version='8.14'; toolRoot=$root; runtimeRoots=@($env:JAVA_HOME); toolEnv=@{JAVA_HOME=$env:JAVA_HOME}; shell=$true}) | ConvertTo-Json -Depth 5 -AsArray | Out-File -Encoding utf8 reports/gradle-matrix.json
          "NUB_SANDBOX_NATIVE_TOOL_MATRIX_FILE=$env:GITHUB_WORKSPACE\reports\gradle-matrix.json" >> $env:GITHUB_ENV
      - name: Checking diagnostic target
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --test native_tool_functionality -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Checking plain Gradle control
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test native_tool_functionality gradle_unconfined -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/plain.log
      - name: Checking native adapter networking
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test native_tool_functionality windows_gradle_with_native_network -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/native-network.log
      - name: Preserving diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-${{ matrix.os }}
          path: reports
