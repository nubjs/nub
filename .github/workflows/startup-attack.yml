name: Warm-start attack measurement
on:
  push:
    branches: [startup-attack]
    paths:
      - 'tests/startup-attack/**'
      - '.github/workflows/startup-attack.yml'
      - 'runtime/compile-*.mjs'
      - 'runtime/compile-*.cjs'
      - 'crates/nub-launcher/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: Swatinem/rust-cache@v2
      # The polyfill packages the compile prelude bundles for a target that lacks
      # them natively live in runtime/node_modules, which a checkout does not
      # carry; staged exactly as ci.yml's embedded-compile job stages them. A Node
      # 26 target strips every region and needs none of this; the older-target
      # arm of the measurement does.
      - uses: ./setup
        with:
          cache: 'true'
      - name: Stage the runtime's polyfill packages
        shell: bash
        run: |
          set -euo pipefail
          nub install --frozen-lockfile --node-linker hoisted
          rm -rf runtime/node_modules
          mkdir -p runtime/node_modules/@js-temporal runtime/node_modules/@oxc-project runtime/node_modules/@petamoriken
          cp -R node_modules/@js-temporal/polyfill runtime/node_modules/@js-temporal/
          cp -R node_modules/@oxc-project/runtime runtime/node_modules/@oxc-project/
          cp -R node_modules/@petamoriken/float16 runtime/node_modules/@petamoriken/
          cp -R node_modules/jsbi node_modules/urlpattern-polyfill runtime/node_modules/
      - name: Install hyperfine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine
          else brew install hyperfine; fi
      # The "before" for single-file emission: the branch as it stood with the
      # standalone preamble landed and every CommonJS module still in its own
      # chunk. Built FIRST into the shared target dir so only the nub crates
      # rebuild for the tip; the binary is copied out before the tip overwrites it.
      # Three "befores", one per change, each the branch as it stood just before
      # that change landed: pre-single-file (several chunks per artifact), eager
      # polyfills (single file, polyfills installed at start), and lazy cache
      # (lazy polyfills, chunk not yet shaped for a complete compile cache).
      - name: Build the before-change nubs
        run: |
          build_at() { # build_at <sha> <out>
            git fetch --depth=1 origin "$1"
            git worktree add "/tmp/src-$2" "$1"
            ln -s "$GITHUB_WORKSPACE/runtime/node_modules" "/tmp/src-$2/runtime/node_modules"
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --manifest-path "/tmp/src-$2/Cargo.toml" -p nub-cli --profile fast --features compile
            cp "$GITHUB_WORKSPACE/target/fast/nub" "/tmp/$2"
          }
          build_at "$BEFORE_SHA" nub-before
          build_at "$EAGER_POLYFILLS_SHA" nub-eager-polyfills
          build_at "$LAZY_CACHE_SHA" nub-lazy-cache
        env:
          BEFORE_SHA: 483478915beb08b01ab835d6fb4fe781715fa4f9
          EAGER_POLYFILLS_SHA: 81972ec1595ec89fbddf6b0057b37aee1fd31fed
          LAZY_CACHE_SHA: 251eccd87c7d86f96cb977a0afe4737de600aa87
      - name: Build nub with the compile feature
        run: cargo build -p nub-cli --profile fast --features compile
      # nub-launcher is its OWN cargo workspace, so the line above never builds it.
      - name: Build the launcher template
        run: cd crates/nub-launcher && cargo build --release
      # The macOS "before": the same launcher linked without -dead_strip_dylibs.
      # An environment RUSTFLAGS replaces the config file's target rustflags.
      - name: Build the launcher template without -dead_strip_dylibs (macOS)
        if: runner.os == 'macOS'
        run: cd crates/nub-launcher && RUSTFLAGS="" CARGO_TARGET_DIR=target-before cargo build --release
      - name: Measure
        env:
          NUB_BIN: ${{ github.workspace }}/target/fast/nub
          NUB_BIN_BEFORE: /tmp/nub-before
          NUB_BIN_EAGER_POLYFILLS: /tmp/nub-eager-polyfills
          NUB_BIN_LAZY_CACHE: /tmp/nub-lazy-cache
          __NUB_LAUNCHER_TEMPLATE: ${{ github.workspace }}/crates/nub-launcher/target/release/nub-launcher
          LAUNCHER_BEFORE: ${{ runner.os == 'macOS' && format('{0}/crates/nub-launcher/target-before/release/nub-launcher', github.workspace) || '' }}
          REPO: ${{ github.workspace }}
        run: bash tests/startup-attack/measure.sh
